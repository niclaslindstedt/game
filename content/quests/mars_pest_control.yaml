level: mars
giver: mars_botanist
order: 2
name: PEST CONTROL
lore: >
  The scout rovers drive through the botanist's beds because nobody put the
  beds on their map. It is routing rather than malice, which is why thinning
  them works: forty, and the survivors plot a way round. That they learn is
  the part she says nobody believes.
offer:
  - - "THE SCOUTS DRIVE THROUGH MY BEDS. NOT MALICE — NOBODY PUT THE BEDS ON THEIR MAP. FORTY AND THE REST ROUTE ROUND."
  - hero:
      - "FORTY. THEY'LL LEARN."
incomplete:
  - "THEY'RE STILL COMING THROUGH. LOOK AT THIS ROW."
complete:
  - - "THEY'RE GOING ROUND. THEY LEARNED — THAT'S THE PART NOBODY BELIEVES. TAKE THIS, THE COLONY WROTE IT OFF."
  - hero:
      - "THEY WRITE EVERYTHING OFF."
objectives:
