name: THE GALE
lore: >
  The unravelers pull things apart, and the keeper has decided that is what
  took the other two. Forty of them brings nobody back and he knows it before
  he asks. He would like it done anyway, and he is honest at the handover
  about not feeling any better for it.
offer:
  - - "THE UNRAVELERS PULL THINGS APART, AND THAT'S WHAT TOOK THE OTHER TWO. FORTY. IT WON'T BRING ANYBODY BACK."
  - hero:
      - "IT DOESN'T HAVE TO."
incomplete:
  - "STILL TOO MANY. THEY COME APART EASY ENOUGH."
complete:
  - - "THAT'S ENOUGH OF THAT. I DON'T FEEL BETTER. I DIDN'T EXPECT TO. TAKE SOMETHING OFF THE ROCK."
  - hero:
      - "THE LIGHT'S BRIGHTER. THAT'S SOMETHING."
