lore: >
  A man at a desk needs a typewriter ribbon. That is the entire errand, and it
  is worth doing for the same reason it is worth writing down: the last honest
  paperwork this company will ever file is being done by hand, at night, by
  somebody nobody is paying, and he is one consumable short of finishing it.
