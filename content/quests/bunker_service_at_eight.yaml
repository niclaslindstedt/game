level: the_bunker
giver: bunker_anatole
order: 2
name: SERVICE AT EIGHT
lore: >
  Something cold walks the service corridor and the staff will not pass it,
  which leaves five courses to be plated out of a kitchen nobody will walk
  out of. Clearing the corridor puts service back at eight. Nobody comes to
  that either, and the chef cooks it regardless.
requires:
  - bunker_pantry
# THE THING IN THE CORRIDOR IS A HELLBORN, so the errand is only offered on the
# rungs it exists on. PERMAFROST SAINT comes out of THE BUNKER's rampage-opened
# hellgates, and the carve tags every one of them `minDifficulty: nightmare`
# (mapgen/generate.ts) — below that ANATOLE was asking for a kill no run could
# make, and the tracker sat on a named mob that was never going to be on the
# field. Nothing else in the game spawns one.
minDifficulty: nightmare
offer:
  - - "SOMETHING COLD WALKS MY SERVICE CORRIDOR AND THE STAFF WILL NOT PASS IT. I CANNOT PLATE FIVE COURSES LIKE THAT."
  - hero:
      - "I'LL CLEAR YOUR CORRIDOR."
incomplete:
  - "IT IS STILL IN MY CORRIDOR. STILL COLD."
complete:
  - - "THE CORRIDOR IS CLEAR. SERVICE IS AT EIGHT. NOBODY COMES. TAKE THIS BEFORE I CHANGE MY MIND."
  - hero:
      - "SOMEBODY SHOULD EAT IT."
objectives:
  - kind: killNamed
    enemy: permafrost_saint
reward:
  xpShare: 1.44
  coins: 240
  loot:
    count: 1
    tierBonus: 2
