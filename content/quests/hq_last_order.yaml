order: 2
name: THE LAST ORDER
lore: >
  The order above the floor-safety one supersedes it, and the unit has
  requested its withdrawal for eleven years without being answered once. The
  man who signed it is still on the floor, still signing. Withdrawing it is
  not paperwork, and the unit is precise about what it is asking for.
requires:
  - hq_countersign
offer:
  - - THE ORDER ABOVE MINE WAS SIGNED BY THE NIGHT MANAGER. IT SUPERSEDES SAFETY.
  - - I HAVE REQUESTED ITS WITHDRAWAL FOR ELEVEN YEARS. HE DOES NOT ANSWER ME.
incomplete:
  - THE ORDER STANDS. HE IS STILL SIGNING.
complete:
  - - THE ORDER IS WITHDRAWN. I AM RELEASED FROM THE LINE.
  - - I HAVE NO FURTHER TASK. THIS IS WHAT I WAS SAVING.
objectives:
  - kind: killNamed
    enemy: night_manager
