level: the_rift
giver: rift_nameless
name: THE MAN WHO TEARS THE PAGES
campaign: true
order: 2
requires:
  - sev_torn_page
lore: >
  A book of everyone a machine wrote off had to be BOUND by somebody, and
  binding is a trade — so the trade was taken, along with the man who had it.
  The thing that does the tearing still walks the tribute road for the scaled
  gods, and it is carrying the needle. This is the errand the whole chain has
  been walking toward: not a delivery, not a search. The man who did it.
offer:
  - - I REMEMBER THE HANDS. I REMEMBER BEING HELD OPEN.
  - - HE WATCHES THE TRIBUTE ROAD NOW. THEY PAY HIM TO.
    - HE STILL HAS MY NEEDLE.
  - - I'M NOT ASKING YOU TO AVENGE ME. I'M ASKING FOR THE TOOL BACK.
    - IT'S THE ONLY THING THAT OPENS WHAT HE MADE.
incomplete:
  - HE'S ON THE ROAD SOMEWHERE. YOU'LL KNOW HIM. EVERYONE DOES.
complete:
  - - YOU BROUGHT IT BACK.
  - - THEN LISTEN, BECAUSE THIS IS THE PART NOBODY GETS TOLD.
  - - IT ISN'T A LIST. IT'S A BOOK, IT'S BOUND, AND THE BINDING WAS
      SHIPPED OUT AS SURPLUS STOCK.
  - - THEY SENT THE MOST DANGEROUS OBJECT IN TWO UNIVERSES TO A THEME PARK.
    - AS A PROP.
  - - THERE'S A CHURCH IN IT. THERE'S A MAN HOLDING IT.
    - HE'S BEEN READING NOTHING OUT OF IT FOR ELEVEN YEARS.
