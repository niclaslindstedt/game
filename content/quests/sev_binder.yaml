level: the_rift
giver: rift_nameless
name: THE MAN WHO TEARS THE PAGES
campaign: true
order: 2
requires:
  - sev_torn_page
lore: >
  A book of everyone a machine wrote off had to be BOUND by somebody, and
  binding is a trade — so the trade was taken, along with the man who had it.
  The thing that does the tearing still walks the tribute road for the scaled
  gods, and it is carrying the needle. This is the errand the whole chain has
  been walking toward: not a delivery, not a search. The man who did it.
offer:
  - - "HE WATCHES THE TRIBUTE ROAD NOW, AND HE STILL HAS MY NEEDLE. I'M NOT ASKING FOR REVENGE. I WANT THE TOOL."
  - hero:
      - "I'LL GET YOUR NEEDLE."
incomplete:
  - "HE'S ON THE ROAD SOMEWHERE. YOU'LL KNOW HIM. EVERYONE DOES."
complete:
  - - "IT ISN'T A LIST, IT'S A BOOK — AND THEY SHIPPED THE BINDING TO A THEME PARK AS A PROP. A MAN HOLDS IT."
  - hero:
      - "THEN THAT'S WHERE I'M GOING ANYWAY."
