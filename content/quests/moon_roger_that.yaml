level: moon
giver: moon_radio
order: 1
name: ROGER THAT
lore: >
  Relay power is down to one cell and the channel goes when the cell does.
  The things out on the grid carry cells; three of them buys one more call
  to a station that stopped answering fifty years ago. Nothing answers this
  time either, and the operator counts an open channel as a result on its
  own.
offer:
  - - RELAY POWER IS DOWN TO ONE CELL AND THE CHANNEL GOES WITH IT.
  - - THE THINGS OUT THERE CARRY CELLS. THREE, AND I CAN CALL ONE MORE TIME.
incomplete:
  - STILL ON ONE CELL. THREE WAS THE NUMBER.
complete:
  - - POWER'S UP. STATION, RELAY, DO YOU COPY, OVER.
  - - ... NO. BUT THE CHANNEL'S OPEN. THAT'S NOT NOTHING.
