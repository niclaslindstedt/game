level: the_bunker
giver: bunker_anatole
order: 1
name: THE PANTRY
lore: >
  The chef has counted the pantry down to the week and has told nobody the
  number. The security men carry ration tins on their belts; five of them
  makes the number five weeks better, which is five more weeks of a
  five-course service that nobody comes to.
offer:
  - - "I HAVE COUNTED THE PANTRY DOWN TO THE WEEK. THE SECURITY MEN CARRY TINS — FIVE, AND THE NUMBER GETS BETTER."
  - hero:
      - "FIVE TINS. I'M ON IT."
incomplete:
  - "FIVE TINS. THEY ALL CARRY THEM. CHECK THE BELTS."
complete:
  - - "FIVE WEEKS. THAT IS FIVE WEEKS OF SERVICE AT EIGHT. TAKE SOMETHING FROM THE CELLAR."
  - hero:
      - "COOK WHILE YOU CAN."
