level: goodco_hq
giver: hq_clerk
name: THE COUNTERSIGNATURE
campaign: true
order: 3
requires:
  - sev_last_box
lore: >
  No record closes without a countersignature, and the party that signed is a
  records terminal on treads that has stood by that instruction for eleven
  years. It will stamp the form for anybody who can satisfy it they are
  entitled to ask — and it will come off its treads at anybody who tells it the
  rule does not matter, which is a second and equally valid way to get one.
offer:
  - - LAST THING. IT NEEDS A COUNTERSIGNATURE.
  - - THE ARCHIVE UNIT SIGNS. IT'S THE ONLY THING LEFT THAT CAN.
  - - IT'LL ASK YOU THINGS. ANSWER THEM.
    - OR DON'T — THE STAMP'S INSIDE IT EITHER WAY.
incomplete:
  - IT'S DOWN THE EAST AISLE. IT DOESN'T MOVE MUCH.
complete:
  - - COUNTERSIGNED. THAT'S — THAT'S THE BOX CLOSED. FOUR YEARS.
  - - I THOUGHT I'D FEEL BETTER.
    - THE ASSET'S NAMED ON ALL OF THEM AND NOBODY EVER ASKED WHO KEEPS THE LIST.
  - - SOMEBODY KEEPS THE LIST. FIND OUT WHERE IT'S BOUND.
objectives:
