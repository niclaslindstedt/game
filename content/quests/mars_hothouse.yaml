level: mars
giver: mars_botanist
order: 3
name: THE HOTHOUSE
lore: >
  Something big has nested in the old hothouse frame and has been eating the
  heat out of it. Nothing will grow while it is in there, and the botanist
  is unambiguous about not going in herself. What is found in the nest
  afterwards was never hers, and is nobody's now.
requires:
  - mars_greenhouse
  - mars_pest_control
offer:
  - - SOMETHING BIG IS NESTING IN THE OLD HOTHOUSE FRAME. IT'S BEEN EATING THE HEAT.
  - - I CAN'T GROW ANYTHING WHILE IT'S IN THERE, AND I AM NOT GOING IN.
incomplete:
  - IT'S STILL IN THERE. I CAN SEE THE GLASS FOGGING.
complete:
  - - THE FRAME'S COLD AGAIN. I CAN START THE WINTER TRAY.
  - - THIS WAS IN THE NEST. IT ISN'T MINE. IT ISN'T ANYBODY'S NOW.
objectives:
  - kind: killNamed
    enemy: phobos_shepherd
reward:
  xpShare: 0.75
  coins: 180
  loot:
    count: 1
    tierBonus: 2
