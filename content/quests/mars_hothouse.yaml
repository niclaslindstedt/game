level: mars
giver: mars_botanist
order: 3
name: THE HOTHOUSE
lore: >
  Something big has nested in the old hothouse frame and has been eating the
  heat out of it. Nothing will grow while it is in there, and the botanist
  is unambiguous about not going in herself. What is found in the nest
  afterwards was never hers, and is nobody's now.
requires:
  - mars_greenhouse
  - mars_pest_control
# THE THING IN THE FRAME IS THE JESUS CROP. PHOBOS SHEPHERD is a hellborn on
# MARS twice over: the hellgates it comes out of are `minDifficulty: nightmare`
# from the carve, and its own member line in `content/maps/mars.yaml` adds
# `minDifficulty: jesus`. So the hothouse is only ever nested in on the last
# rung, and the errand is offered there and nowhere else.
minDifficulty: jesus
offer:
  - - "SOMETHING BIG IS NESTING IN THE OLD HOTHOUSE FRAME AND EATING THE HEAT. I AM NOT GOING IN THERE."
  - hero:
      - "THEN I WILL."
incomplete:
  - "IT'S STILL IN THERE. I CAN SEE THE GLASS FOGGING."
complete:
  - - "THE FRAME'S COLD AGAIN. THIS WAS IN THE NEST — IT ISN'T MINE, AND IT ISN'T ANYBODY'S NOW."
  - hero:
      - "IT IS NOW."
objectives:
  - kind: killNamed
    enemy: phobos_shepherd
reward:
  xpShare: 1.27
  coins: 180
  loot:
    count: 1
    tierBonus: 2
