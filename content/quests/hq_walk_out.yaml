level: goodco_hq
giver: hq_intern
order: 3
name: WALK HER OUT
lore: >
  A limping lab tech came out of the sample bay with a crate she will not
  put down or explain, and she will not go for the door on her own. Walking
  beside her is the whole job. Nobody asks what is in the crate, and it goes
  into the night log afterwards as recovered equipment, which it is not.
requires:
  - hq_night_log
  - hq_line_stop
offer:
  - - "ODETTE'S IN THE SAMPLE BAY WITH A CRATE AND A BAD LEG. WALK HER TO THE NORTH DOOR AND I'LL STOP ASKING WHAT'S IN IT."
  - hero:
      - "I'LL GET HER TO THE DOOR."
incomplete:
  - "SHE'S STILL IN THERE. GO WITH HER, NOT AHEAD."
complete:
  - - "SHE MADE IT. WITH THE CRATE, OF COURSE. I LOGGED IT AS RECOVERED EQUIPMENT. IT ISN'T."
  - hero:
      - "I DIDN'T SEE ANYTHING EITHER."
objectives:
  - kind: escort
    escort: odette
    to: { x: 1370, y: 420 }
escorts:
  - id: odette
    name: ODETTE FRAY
    sprite: qe_techie
    at: { x: 560, y: 880 }
    hp: 260
    setOff: "DON'T LET THEM NEAR THE CRATE."
    arrived: "THAT'S THE DOOR. THANK YOU."
reward:
  xpShare: 1.02
  coins: 120
  loot:
    count: 2
    tierBonus: 1
