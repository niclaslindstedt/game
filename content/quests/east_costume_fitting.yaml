level: boot_hill
giver: east_dolly
order: 2
name: A FITTING
lore: >
  Something out on the flats is wearing a coat the wardrobe mistress cut
  herself, and it did not ask her first. She wants the coat back and is
  candid about not much caring what happens to the rest of it. The stitching
  holds, which she notes before she notes anything else.
requires:
  - east_wardrobe
# THE THING WEARING HER COAT IS A HELLBORN — THE LONG NOON walks out of BOOT
# HILL's rampage-opened hellgates, which the carve tags `minDifficulty:
# nightmare` (mapgen/generate.ts). On the three rungs below, the flats are
# empty of it and DOLLY was asking for a kill no run could make.
minDifficulty: nightmare
offer:
  - - THERE'S ONE OUT ON THE FLATS WEARING A COAT I CUT MYSELF. IT DIDN'T ASK.
  - - I WANT THE COAT BACK AND I DON'T MUCH CARE ABOUT THE REST OF IT.
incomplete:
  - IT'S STILL WEARING MY WORK. OUT ON THE FLATS.
complete:
  - - MY STITCHING. STILL GOOD AFTER ALL THAT.
  - - I'VE ONE PIECE I NEVER PUT ON ANYONE. TAKE IT.
objectives:
  - kind: killNamed
    enemy: the_long_noon
reward:
  xpShare: 0.8
  coins: 210
  loot:
    count: 1
    tierBonus: 2
