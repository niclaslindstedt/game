level: moon
giver: moon_radio
order: 3
name: THE HANDOVER
lore: >
  Another man on the same shift never signed off either, and he is still out
  on the grid walking it and counting. He is not taking the handover from
  anybody who offers it. Ending his watch is what the errand is; the
  operator asks for it in the language of the job rather than the language
  of what it is.
requires:
  - moon_roger_that
  - moon_static
offer:
  - - "THERE WAS A MAN ON THIS SHIFT WHO NEVER SIGNED OFF EITHER. SOMEBODY HAS TO END HIS WATCH."
  - hero:
      - "I'LL END IT."
incomplete:
  - "HE'S STILL WALKING IT. I CAN HEAR HIM COUNTING."
complete:
  - - "THE WATCH IS ENDED. BOTH OF OURS, NEARLY. TAKE THIS — IT WAS ISSUED FOR THE FAR-SIDE SHIFT."
  - hero:
      - "SIGN OFF WHEN YOU'RE READY."
objectives:
  - kind: killNamed
    enemy: the_thirteenth_man
reward:
  xpShare: 0.7
  coins: 160
  loot:
    count: 1
    tierBonus: 2
