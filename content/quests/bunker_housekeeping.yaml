level: the_bunker
giver: bunker_concierge
order: 2
name: HOUSEKEEPING
lore: >
  The housekeeping units have stopped cleaning and begun patrolling, on a
  route the concierge did not authorise and does not recognise as a cleaning
  route. Forty of them off it, recorded in the nightly report as scheduled
  maintenance. The floors are, admittedly, no cleaner afterwards.
offer:
  - - "THE UNITS HAVE STOPPED CLEANING AND BEGUN PATROLLING. FORTY, AND I WILL RECORD IT AS MAINTENANCE."
  - hero:
      - "MAINTENANCE IT IS."
incomplete:
  - "THEY ARE STILL PATROLLING. IT IS NOT A CLEANING ROUTE."
complete:
  - - "MAINTENANCE COMPLETE. THE FLOORS ARE, ADMITTEDLY, NO CLEANER. TAKE SOMETHING FROM LOST PROPERTY."
  - hero:
      - "FOUR YEARS UNCLAIMED. I'LL RISK IT."
objectives:
  - kind: kill
    enemy: vacuum_bot
    count: 40
reward:
  xpShare: 0.94
  coins: 180
  loot:
    count: 1
    tierBonus: 1
