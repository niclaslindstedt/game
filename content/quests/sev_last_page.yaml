level: boot_hill
giver: east_preacher
name: THE LAST PAGE
campaign: true
order: 1
requires:
  - sev_binder
minDifficulty: jesus
lore: >
  The book the machine files people in, held eleven years by a park hand who
  cannot read a word of it, opened at last with the needle that bound it. Every
  name the CORE wrote off is in here, priced; the hero's is in here twice. It
  will not take a new entry off a man it cannot price, and it prices a man by
  everything he could become — so the last page is earned, never fetched.
offer:
  - - "IT'S NAMES, FRIEND. NOTHING BUT NAMES AND A NUMBER ON EACH. IT PRICES A MAN BY EVERYTHING HE COULD BE."
  - hero:
      - "THEN I'D BETTER BE ALL OF IT."
incomplete:
  - "IT'S STILL SHORT OF YOU, FRIEND. COME BACK WHEN THERE'S NO MORE OF YOU TO COME."
complete:
  - - "THERE — IT'S CROSSING THE OLD ONE OUT. BOTH OF THEM. THAT'S A CLEAN SHEET. TAKE IT WITH YOU."
  - hero:
      - "A MACHINE WROTE ME DOWN. I'M TAKING IT BACK."
