  - - THAT'S A CLEAN SHEET, THAT
    - IS. A WHOLE MAN, UNWRITTEN.
  - - TAKE IT WITH YOU.
    - A THING LIKE THIS SHOULDN'T
    - BE LEFT IN A CHURCH THAT
    - ISN'T ONE.
