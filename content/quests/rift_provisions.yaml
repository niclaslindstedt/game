name: PROVISIONS
lore: >
  There are no ports in the rift, no chandlers and no markets, and a cook
  notices that before anybody else does. The star jellies have been at the
  biscuit. Five rounds back sets the mess for a crew he maintains are merely
  late rather than gone.
offer:
  - - "THE JELLIES HAVE BEEN AT MY BISCUIT. FIVE ROUNDS BACK AND THE CREW EAT WHEN THEY COME UP."
  - hero:
      - "FIVE ROUNDS. THEY'LL EAT."
incomplete:
  - "FIVE ROUNDS. THE CREW ARE FIVE, SO IT'S FIVE."
complete:
  - - "FIVE. THE MESS IS SET. THEY'RE ONLY LATE. SIT OR DON'T, BUT TAKE SOMETHING WITH YOU."
  - hero:
      - "I'M LATE MYSELF."
