level: boot_hill
giver: east_clem
order: 2
name: HOUSE RULES
lore: >
  The brawlers are scripted to fight at nine, and it has not been nine in
  eleven years. Forty of them is how long it takes a room to go quiet
  enough to clean, in a saloon whose barkeep has polished the same glasses
  every night rather than admit the shift is over.
offer:
  - - "THE BRAWLERS FIGHT AT NINE, AND IT HASN'T BEEN NINE IN ELEVEN YEARS. FORTY AND THE ROOM GOES QUIET."
  - hero:
      - "FORTY. THEN YOU GET YOUR BAR BACK."
incomplete:
  - "STILL BRAWLING. STILL NOT NINE."
complete:
  - - "QUIET BAR. I'D FORGOTTEN THE SOUND OF MY OWN GLASSES. THERE'S A CASE UNDER THE BOARDS — TAKE ONE."
  - hero:
      - "ENJOY THE QUIET."
objectives:
  - kind: kill
    enemy: saloon_brawler
    count: 40
reward:
  xpShare: 0.85
  coins: 150
  loot:
    count: 1
    tierBonus: 1
