level: garage
giver: ruth
name: THE SCALE
campaign: true
order: 3
requires:
  - ruth_dent
lore: >
  In the rift Ada pried a scale off a lizard god with her bare hands. Her
  mother asks for one like it, off the same scaled breed, not as proof and not
  for comfort: she wants to hold what her daughter is up against, and find out
  it is the gods who should worry. What she gives back is the family's own
  furniture, a piece deeper into her mother's house each difficulty.
offer:
  - - WHERE SHE'S GONE NOW, THE THINGS THAT KEEP HER ARE SCALED. GODS, YOU SAID.
  - - MY GIRL WILL BE PRYING AT THEM. SHE PRIES. SHE ALWAYS HAS.
  - - BRING ME A SCALE OFF ONE. I WANT TO HOLD WHAT SHE'S UP AGAINST.
incomplete:
  - A SCALE. OFF SOMETHING THAT CALLS ITSELF A GOD. I'LL WAIT.
complete:
  - - IT'S HARD AS A HULL. AND SHE PRIES THESE OFF BAREHANDED.
  - - I WAS NEVER SCARED FOR HER. NOW I'M NEARLY SORRY FOR THEM.
  # {CACHE} — the RUNG's own line about what she brought and where it came from
  # (`DifficultyDef.cache.line`, engine/game/cache.ts). Ruth hands the chest over
  # on every difficulty and it is a grander thing each time, so the provenance
  # ramps with it: a flea-market box, her mother's, a crossing, a dowry, a king.
  # The errand is one file and the ladder is five; the rung owns the sentence.
  - - "{CACHE}"
  - - I'LL KEEP GOING THROUGH HER HOUSE. THERE'S BIGGER BACK THERE.
  - - GO AND MEET HER HALFWAY.
objectives:
  - kind: collect
    item: pried_scale
    count: 1
items:
  - id: pried_scale
    name: A LIZARD GOD'S SCALE
    icon: icon_pried_scale
    # THREE CARRIERS, BECAUSE THE FIRST ONE IS NOT ON THE FIELD BELOW JESUS.
    # THE SCALED ANCESTOR is the scale off the god himself, and he is a
    # rampage-only hellborn: the rift's hellgates are `minDifficulty:
    # nightmare` and his own entry in `content/maps/the_rift.yaml` adds
    # `minDifficulty: jesus`, so on EASY/MEDIUM/HARD/NIGHTMARE he cannot
    # appear at all — and an errand tops the HORDE up, never a one-off
    # (`quests/restock.ts`), so nothing rescues it. Ruth runs this errand on
    # every rung (five per-rung caches hang off it, and it pays the game's
    # only chest), so the piece needs a carrier every rung reaches. The gods'
    # own tribute road supplies two, and neither needs a word of new fiction:
    #   RASPUTIN is PAID by the scaled gods to watch that road, and a scale is
    #   what they pay in. A pinned elite on the thoroughfare, so the errand can
    #   finish mid-void rather than only at the far door.
    #   BRO OMEGA sold them the rift and the tribute walked through his door.
    #   It is `role: boss` standing with THE FOUNDER, and `killBoss` clears
    #   only once no boss is left alive — so a cleared rift has killed it, on
    #   every rung and every seed. That is the floor under the errand:
    #   Rasputin is spareable and THE FOUNDER flees rather than dying, so this
    #   is the one carrier no run can route around.
    dropFrom: [scaled_ancestor, grigori_rasputin, bro_omega]
    # CERTAIN, because every carrier is a ONE-OFF rather than a horde breed —
    # the 1-in-8 ceiling binds only what a map's knots are made of. Meeting one
    # at all is the errand; a farm rate on a mob the hero sees once in a
    # campaign is not a hunt, it is a lottery on a beat the story needs.
    dropChance: 1
reward:
  xpShare: 1
  coins: 800
  # THE CACHE — the antique chest against the bay's north wall (engine/game/
  # cache.ts). The last thing Ruth has to give, paid for the last errand she
  # has to give it for, and the only one in the game: from here on the hero has
  # somewhere to KEEP a piece instead of carrying it.
  cache: true
  loot:
    count: 2
    tierBonus: 2
