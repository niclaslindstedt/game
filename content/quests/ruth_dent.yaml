level: garage
giver: ruth
name: THE DENT
campaign: true
order: 2
requires:
  - ruth_receipt
lore: >
  Ruth has never met a companion unit and does not need to: wherever they are
  keeping her daughter, somebody will have sent a machine with a face to keep
  her company, and Ada will have bitten it. She raised her. The colony's own
  paperwork will later file the same fact as 'REFUSES COMPANY. BIT UNIT 34' -
  the mother predicted it from a kitchen on Earth.
offer:
  - - "THEY'LL HAVE PUT A MACHINE WITH A FACE ON HER. SHE'LL HAVE BITTEN IT. CAN YOU BRING ME THE PLATE?"
  - hero:
      - "I'LL FIND THE ONE WITH THE TEETH MARKS."
incomplete:
  - "A MACHINE WITH A FACE AND A DENT IN IT. IT'S OUT THERE SOMEWHERE."
complete:
  - - "TEETH. RIGHT THROUGH THE SHELL. OH, THAT'S MY GIRL."
  - hero:
      - "SHE'S STILL FIGHTING. I'M TRYING TO KEEP UP WITH HER."
objectives:
  - kind: collect
    item: bitten_plate
    count: 1
items:
  - id: bitten_plate
    name: A BITTEN SHELL PLATE
    icon: icon_bitten_plate
    dropFrom: [fembot, misprinted_fembot]
reward:
  xpShare: 1.19
  coins: 350
  loot:
    count: 1
    tierBonus: 2
