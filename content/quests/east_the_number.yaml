  - east_house_rules
offer:
  - - "RUBY DANCES THE EIGHT O'CLOCK TO AN EMPTY ROOM AND HER KNEE'S SEIZING. WALK HER OUT PAST THE WATER TOWER."
  - hero:
      - "I'LL WALK HER OUT."
incomplete:
  - "SHE'S STILL ON THE BOARDS. SHE WON'T STOP ON HER OWN."
complete:
  - - "SHE CAME BACK WALKING, AND SHE'LL DANCE IT AGAIN TONIGHT. THE GOOD BOTTLE'S YOURS."
  - hero:
      - "NOBODY ELSE IS ORDERING."
