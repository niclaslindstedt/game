name: THE EIGHT O'CLOCK NUMBER
lore: >
  A dancer hand performs the eight o'clock every night to an empty room, and
  her knee is seizing. Walking her out past the water tower works it off,
  because she will not stop on her own. She comes back walking, and does the
  number again that night, which she would have done either way.
