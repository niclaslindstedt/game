level: mars
giver: mars_curie
order: 1
name: RECOVERY REQUEST
lore: >
  A survey rover bogged to the hubs eight months ago has filed the same
  recovery request four thousand one hundred and ten times, on a frequency
  the colony stopped monitoring. The mining units route past its lane and do
  not stop. Twenty of them clears the lane, and the request closes by other
  means.
offer:
  - - "RECOVERY REQUEST FOUR THOUSAND ONE HUNDRED AND TEN. THE MINING UNITS ROUTE PAST. TWENTY WOULD FREE THE LANE."
  - hero:
      - "TWENTY. THEN YOU'RE OUT."
incomplete:
  - "THE LANE IS STILL IN USE. REQUEST REMAINS OPEN."
complete:
  - - "LANE CLEAR. REQUEST FOUR-ONE-ONE-ZERO: CLOSED BY OTHER MEANS. MY CARGO BAY IS OPEN."
  - hero:
      - "EIGHT MONTHS. SOMEBODY SHOULD HAVE COME."
objectives:
  - kind: kill
    enemy: mining_rover
    count: 20
reward:
  xpShare: 0.4
  coins: 100
  loot:
    count: 1
