order: 1
name: COUNTERSIGNATURE
lore: >
  A decommissioned unit holds a floor-safety order it is not permitted to
  act on, and twenty current-model units are operating outside tolerance. It
  may not decommission them; the hero is not it. The errand is a
  countersignature performed with a weapon, after which the file may close.
offer:
  - - "MY LAST ORDER IS FLOOR SAFETY. TWENTY UNITS ARE OUTSIDE TOLERANCE. I MAY NOT DECOMMISSION THEM. YOU ARE NOT ME."
  - hero:
      - "NO. I'M NOT."
incomplete:
  - "TOLERANCE STILL EXCEEDED. TWENTY WAS THE FIGURE."
complete:
  - - "ORDER SATISFIED. FLOOR SAFE. I WAS ISSUED A TOOLKIT IN 2019. IT IS YOURS."
  - hero:
      - "YOU KEPT DOING THE JOB. THAT COUNTS."
objectives:
