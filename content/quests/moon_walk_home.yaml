name: THE LITTLE ONE
lore: >
  Something small and very faint out by the pockmarks follows anybody who
  slows down, and it will not follow the man who found it. Walking it up to
  the flag is the whole of what is asked. It goes up the ridge on its own
  afterwards, without looking back.
requires:
  - moon_two_tanks
offer:
  - - "THERE'S A SMALL ONE OUT BY THE POCKMARKS THAT FOLLOWS ANYBODY WHO SLOWS DOWN. TAKE IT UP TO THE FLAG."
  - hero:
      - "I'LL SLOW DOWN."
incomplete:
  - "IT'S STILL OUT THERE. GO SLOW. IT ONLY FOLLOWS SLOW."
complete:
  - - "IT WENT UP THE RIDGE ON ITS OWN AFTER THAT. DIDN'T LOOK BACK. TAKE WHAT I FOUND, IT'S ALL I HAVE."
  - hero:
      - "IT KNEW THE WAY. IT WANTED COMPANY."
