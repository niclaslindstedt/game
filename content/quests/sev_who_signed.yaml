level: moon
giver: moon_auditor
name: THE MAN WHO SIGNED
campaign: true
order: 2
requires:
  - sev_short_column
lore: >
  One man saw the crates go up and had to walk the grid they were dug out of.
  He is still walking it, and he does not haunt a place — which is what makes
  him hard to find and what makes finding him worth something. Nobody has been
  on his grid in fifty years. Standing in front of him is the whole errand; he
  has been waiting to tell somebody.
offer:
  - - "THERE WAS A SURVEYOR WHO WALKED THE GRID FOR THEM, AND HE'S STILL WALKING IT. NOT ANYWHERE — ALL OF IT."
  - hero:
      - "THEN I'LL WALK IT TOO."
incomplete:
  - "HE'S OUT THERE SOMEWHERE. HE DOESN'T STAND STILL."
complete:
  - - "SO IT WAS SIGNED BY A DEPARTMENT THAT ISN'T ONE. IT'S A LEDGER, AND IT WENT TO MARS WITH EVERYTHING ELSE."
  - hero:
      - "THEN MARS IS ON THE WAY."
objectives:
  - kind: flag
    flag: sev_surveyor_talked
    name: GET THE SURVEYOR TO SAY WHO SIGNED
reward:
  xpShare: 0.26
  coins: 260
  loot:
    count: 1
