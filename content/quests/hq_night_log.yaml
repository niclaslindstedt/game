level: goodco_hq
giver: hq_intern
order: 1
name: THE NIGHT LOG
lore: >
  The night line has been running since six and nobody has filed a sheet:
  every worker on the floor is carrying their own, and none of them are in a
  state to hand one over. Four, off whoever still has one in a pocket, is a
  shift on paper. It is bookkeeping performed on a floor that stopped being
  a workplace hours ago, which is the only reason it still looks like one.
offer:
  - - "THE LINE'S RUN SINCE SIX AND NOBODY'S FILING. GET ME FOUR SHEETS OFF ANYONE. I'M NOT FUSSY ANYMORE."
  - hero:
      - "FOUR SHEETS. RIGHT."
incomplete:
  - "STILL SHORT. CHECK THEIR POCKETS, THEY ALL HAVE ONE."
complete:
  - - "FOUR. THAT'S A REAL SHIFT ON PAPER. TAKE SOMETHING — THE SUPPLY CAGE ISN'T LOCKED EITHER."
  - hero:
      - "NOTHING ELSE IN HERE IS."
objectives:
  - kind: collect
    item: night_sheet
    count: 4
items:
  - id: night_sheet
    name: NIGHT SHEET
    icon: icon_quest_timesheet
    dropFrom: [intern, scientist, engineer]
reward:
  xpShare: 0.59
  coins: 60
  loot:
    count: 1
