name: NOTHING BUT STATIC
lore: >
  Something is sitting on the operator's band, and it is not weather — the
  wraiths do it deliberately. Forty of them off the dust buys back a clean
  carrier, the first since seventy-one, on a frequency with nobody listening
  at the far end of it.
offer:
  - - "SOMETHING'S SITTING ON MY BAND AND IT ISN'T WEATHER. FORTY OF THE WRAITHS AND I GET MY CARRIER BACK."
  - hero:
      - "FORTY. CONSIDER IT CLEAR."
incomplete:
  - "STILL JAMMED. STILL FORTY, MORE OR LESS."
complete:
  - - "CARRIER'S CLEAN. FIRST CLEAN CARRIER SINCE SEVENTY-ONE. THE SUIT LOCKER'S OPEN — TAKE WHAT FITS."
  - hero:
      - "FIFTY YEARS OF STATIC. YOU EARNED IT."
