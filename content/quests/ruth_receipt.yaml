level: garage
giver: ruth
name: THE RECEIPT
campaign: true
order: 1
lore: >
  The first thing Ruth asks for, and the one that names the shape of all
  three: not a report, not a photograph — something Ada held. The
  chips-and-soda run that started it all was interrupted mid-purchase, and a
  company that logs everything logged that too: the slip is still on the HQ
  floor, on somebody's clipboard with the night's paperwork. She wants her
  daughter's last ordinary minute out of GOODCO's hands.
offer:
  - - "BRING ME SOMETHING OF HERS THAT ISN'T A REPORT. SHE BOUGHT CHIPS AND A SODA THAT NIGHT, AND THE MACHINES PRINT A SLIP."
  - hero:
      - "THEIR NIGHT STAFF CARRY THE PAPERWORK. I'LL GET IT."
incomplete:
  - "SOMEBODY ON THAT FLOOR IS CARRYING IT. THEY CARRY EVERYTHING."
complete:
  - - "CHIPS AND HER SODA, 11:52 PM. 'PAYMENT INTERRUPTED.' I'M KEEPING THIS."
  - hero:
      - "IT'S HERS. NOT THEIRS."
objectives:
