level: garage
giver: ruth
name: THE RECEIPT
campaign: true
order: 1
lore: >
  The first thing Ruth asks for, and the one that names the shape of all
  three: not a report, not a photograph — something Ada held. She was not in
  that house that night, so she cannot name the thing and does not try; she
  asks the hero what her daughter went out for, and the errand's item is HIS
  answer. The slip is on the HQ floor with the night's paperwork, and what the
  minute actually was she finds out reading it.
offer:
  - - "I MISS HER SO MUCH. CAN YOU BRING ME SOMETHING SHE HELD THAT NIGHT? WHAT DID SHE GO OUT FOR?"
  - hero:
      - "CHIPS AND A SODA. THE MACHINES PRINT A SLIP FOR THAT. SOMEBODY IN THERE WILL HAVE IT ON THEM."
incomplete:
  - "IT'S IN SOMEBODY'S POCKET OUT THERE. YOU SAID SO YOURSELF."
complete:
  - - "CHIPS AND HER SODA. 11:52 PM. 'PAYMENT INTERRUPTED.' I'M KEEPING THIS. IT GIVES ME HOPE, THIS DOES."
  - hero:
      - "IT'S HERS. KEEP IT."
objectives:
