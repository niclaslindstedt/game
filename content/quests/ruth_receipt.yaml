level: garage
giver: ruth
name: THE RECEIPT
campaign: true
order: 1
lore: >
  The first thing Ruth asks for, and the one that names the shape of all
  three: not a report, not a photograph — something Ada held. The
  chips-and-soda run that started it all was interrupted mid-purchase, and a
  company that logs everything logged that too: the slip is still on the HQ
  floor, on somebody's clipboard with the night's paperwork. She wants her
  daughter's last ordinary minute out of GOODCO's hands.
offer:
  - - WHEN YOU'RE OUT THERE - BRING ME SOMETHING OF HERS. NOT A REPORT. SOMETHING SHE HELD.
  - - THE NIGHT SHE WENT, SHE BOUGHT CHIPS AND A SODA AT THEIR MACHINES.
    - THE MACHINES PRINT A SLIP. GOODCO KEEPS EVERYTHING.
  - - THEIR NIGHT PEOPLE CARRY THE FLOOR'S PAPERWORK ON THEM. EVERY SHEET OF IT.
  - - BRING ME THE RECEIPT. IT'S THE LAST ORDINARY THING SHE DID. IT'S HERS, NOT THEIRS.
incomplete:
  - SOMEBODY ON THAT FLOOR IS CARRYING IT. THEY CARRY EVERYTHING.
complete:
  - - CHIPS AND HER SODA, 11:52 PM. 'PAYMENT INTERRUPTED.'
  - - SHE STOOD THERE BEING ORDINARY, AND THEY TOOK HER MID-COIN.
  - - I'M KEEPING THIS. IT'S THE LAST NORMAL MINUTE ANYONE HAS OF HER.
