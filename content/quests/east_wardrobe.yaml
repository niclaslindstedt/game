order: 1
name: THE WARDROBE
lore: >
  The longhorns are through the drying lines again, and eight seasons of the
  park's wardrobe is hanging out there. Twenty of them — the wardrobe
  mistress has costed the damage by the season and considers that fair — and
  the lines are hers again.
offer:
  - - "THE LONGHORNS ARE THROUGH MY DRYING LINES AGAIN — EIGHT SEASONS OF WORK. TWENTY OF THEM. I'VE COSTED IT."
  - hero:
      - "TWENTY. THAT'S FAIR."
incomplete:
  - "THEY'RE STILL IN MY LINES. LOOK AT THE STATE OF IT."
complete:
  - - "TWENTY. MY LINES ARE MINE. I MADE THIS FOR A HAND WHO NEVER GOT A SCENE — IT'LL FIT YOU."
  - hero:
      - "THEN I'LL WEAR IT FOR HIM."
objectives:
  - kind: kill
    enemy: longhorn
    count: 20
