level: the_rift
giver: rift_nameless
name: A PAGE OF SOMEBODY
campaign: true
order: 1
requires:
  - sev_bound_signature
lore: >
  Everyone else in here brought themselves along. This one arrived without the
  part that says who arrived, and the part is still in here somewhere, because
  nothing that falls into the rift ever quite leaves it. It is a walk to a
  corner of a place with no corners, for a piece of paper with a man on it.
offer:
  - - "IT WASN'T LOST, IT WAS TORN OUT — AND IT'S STILL IN HERE. GO OUT PAST WHERE THE LIGHT STOPS AGREEING."
  - hero:
      - "PAST THE LIGHT. RIGHT."
incomplete:
  - "PAST THE LIGHT. I'D SAY WHICH WAY IF I COULD."
complete:
  - - "ELIAS. ELIAS WREN. I WAS A BINDER — THAT'S WHY THEY CAME FOR ME. SOMEBODY WANTED THE BOOK MADE."
  - hero:
      - "SOMEBODY ALWAYS DOES."
