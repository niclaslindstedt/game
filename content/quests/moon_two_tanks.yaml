level: moon
giver: moon_kovacs
order: 1
name: TWO TANKS
lore: >
  The garrison units are carrying air bottles taken off a wreck that was not
  theirs. Four back is what a salvage hand will not walk the far grid
  without — he carries two because once he did not — and he is going out
  there looking for people rather than for salvage.
offer:
  - - "THE GARRISON UNITS ARE CARRYING OUR BOTTLES, OFF OUR OWN WRECK. FOUR AND I CAN WALK THE FAR GRID."
  - hero:
      - "FOUR BOTTLES. GO AND WALK IT."
incomplete:
  - "FOUR BOTTLES. I'M NOT GOING OUT ON THREE."
complete:
  - - "FOUR. THAT'S THE FAR GRID. THAT'S SOMEBODY'S CHANCE. HERE — I'VE CARRIED IT SINCE THE WRECK."
  - hero:
      - "GO AND FIND THEM."
objectives:
  - kind: collect
    item: air_bottle
    count: 4
items:
  - id: air_bottle
    name: SPARE AIR BOTTLE
    icon: icon_quest_bottle
    dropFrom: [successor]
    # The ceiling rather than the default (see QUESTS.dropChance): the
    # SUCCESSOR is the moon's deep-window breed and the only thing carrying a
    # bottle, so a piece off one is the scarcest farm an errand asks for.
    dropChance: 0.125
    at: [{ x: 1020, y: 780 }, { x: 1420, y: 470 }]
reward:
  xpShare: 0.68
  coins: 90
  loot:
    count: 1
    tierBonus: 1
