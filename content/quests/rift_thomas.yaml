order: 3
name: THE BOY IN THE SAILOR SUIT
lore: >
  A boy in a sailor suit waits down the way with his hands behind his back,
  and he will not move for the keeper. The seam is where the light carries
  furthest, which is the whole reason for walking him up to it: he was told
  his mother would see it from there.
requires:
  - rift_two_short
  - rift_the_gale
offer:
  - - "THERE'S A BOY DOWN THE WAY IN A SAILOR SUIT. TAKE HIM UP TO THE SEAM — THE LIGHT CARRIES FURTHER THERE."
  - hero:
      - "I'LL WALK HIM UP."
incomplete:
  - "HE'S STILL WAITING. WALK WITH HIM. HE KEEPS UP."
complete:
  - - "HE STOOD UNDER THE SEAM AND SAID HIS MOTHER WOULD SEE THE LIGHT FROM THERE. MAYBE SHE WILL."
  - hero:
      - "SOMEBODY'S ALWAYS LOOKING."
