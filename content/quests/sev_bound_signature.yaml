level: mars
giver: mars_ledger
name: WHAT THE TITHE IS WORTH
campaign: true
order: 1
requires:
  - sev_who_signed
lore: >
  The colony's book will not close without a countersignature from the party
  every transfer went to, and that party signs in a way no colony machine can
  produce. One can be bought — but not by a man who has never seen the seal it
  copies, and the only seal on Mars is worn by an assessor that does not take
  it off. It comes off one way. The errand says so; the hero still has to.
offer:
  - - "THE TRADER HAS A BOUND SIGNATURE BUT WON'T SELL BLIND. THE ASSESSOR WEARS THE ONLY SEAL, AND IT DOESN'T COME OFF."
  - hero:
      - "THEN IT COMES OFF THE OTHER WAY."
incomplete:
  - "THE SEAL. THEN THE TRADER. THEN THE SIGNATURE."
complete:
  - - "COUNTERSIGNATURE ACCEPTED. EVERY COLUMN READS ZERO. THE TRANSFERS WENT TO A RECORD OF PERSONS."
  - hero:
      - "PEOPLE FILED AS AMOUNTS. I'VE SEEN THE FORM."
objectives:
  - kind: sell
    item: assessor_seal
  - kind: collect
    item: bound_signature
    count: 1
items:
  - id: assessor_seal
    name: ASSESSOR'S SEAL
    icon: icon_assessor_seal
    dropFrom:
      - tithe_assessor
    dropChance: 1
  - id: bound_signature
    name: BOUND SIGNATURE
    icon: icon_bound_signature
merchant:
  buys:
    item: assessor_seal
    coins: 900
    sets:
      - sev_seal_sold
  sells:
    - item: bound_signature
      price: 1400
      requires:
        - sev_seal_sold
      pitch: NOW THAT I KNOW YOU'VE SEEN ONE — I HAVE THE OTHER HALF.
reward:
  xpShare: 0.35
  coins: 300
  loot:
    count: 1
    tierBonus: 1
