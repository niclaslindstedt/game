# THE COMPANION ROSTER — who a spared unique BECOMES when it joins the party.
#
# An elite marked `spareable:` in `content/enemies/<biome>/<id>.yaml` names one
# of these by id; sparing it plays the `joinWords` below and the figure falls in
# beside the hero for the rest of the run. One entry per recruitable figure: its
# look, the signature weapon it fought the hero with, an optional party-wide
# aura or frost nova, the signature power it grows into, and the banter it floats
# over its own kills.
#
# The catalog KEY is the id (the loader stamps it in, so nothing repeats itself),
# and every spoken line here lives in docs/manuscript.md like all spoken words.
#
# Compiled to `engine/generated/companions.ts` by `scripts/generate-companions.mjs`
# (part of `make levels` / `make assets`). A MOD ships this same file at its own
# root and its companions arrive through `registerDefs` — see mod/FORMAT.md.

companions:
  # The physics. Spared, he brings the coil he defended his corner with —
  # and treats every kill as a public demonstration.
  nikola_tesla:
    name: NIKOLA TESLA
    sprite: nikola_tesla
    hp: 160
    speed: 78
    radius: 12
    weapon: tesla_coil
    # The coil's wireless current learns to LEAP: every few levels his bolts
    # arc to one more foe, so a leveled Tesla chains the whole pack.
    power:
      name: CHAIN LIGHTNING
      blurb: HIS BOLTS ARC TO ANOTHER FOE EACH RANK
      everyLevels: 3
      chainPerRank: 1
    joinWords:
      - - YOU HAD ME AND YOU LET ME GO. NOBODY HAS DONE THAT. I'LL COME WITH YOU.
    killQuotes:
      - SCIENCE!
      - THE CURRENT DOES THE WORK.
      - I TOLD THEM THIS WOULD WORK.
      - IT'S ONLY ELECTRICITY.
      - MY PIGEONS WOULD NOT LIKE THIS.

  # The pilot. Navigates a place with no north by pure dead reckoning and
  # calls every takedown an airfield matter.
  amelia_earhart:
    name: AMELIA EARHART
    sprite: amelia_earhart
    hp: 150
    speed: 87
    radius: 12
    weapon: blunderbuss
    # She packs the muzzle fuller every few levels: more pellets down the
    # barrel, a wider wall of shot with each rank.
    power:
      name: FULL BROADSIDE
      blurb: HER BLUNDERBUSS GAINS A PELLET EACH RANK
      everyLevels: 3
      pelletsPerRank: 1
    joinWords:
      - - YOU HAD ME GROUNDED AND YOU LET ME UP. I PAY WHAT I OWE. I'LL FLY YOUR WING.
    killQuotes:
      - THAT'S ONE DOWN.
      - I'VE HAD WORSE LANDINGS.
      - KEEP UP.
      - I NEVER DID FILE A FLIGHT PLAN.

  # The unkillable mystic. Finds the whole business of dying hilarious,
  # professionally speaking. His long stint frozen between universes rubbed
  # off: he pulses a FROST NOVA that grips the horde in the cold that could
  # never keep HIM down — a chilling ring that slows and chips everything
  # near him, turning a plain axeman into the party's crowd-control anchor.
  grigori_rasputin:
    name: GRIGORI RASPUTIN
    sprite: grigori_rasputin
    hp: 190
    speed: 72
    radius: 12
    weapon: executioners_axe
    nova:
      everyMs: 2600
      radius: 96
      damage: 46
      chillMs: 1600
      chillFactor: 0.45
    # The cold that could never keep HIM down spreads further every few
    # levels: a wider ring, a deeper bite.
    power:
      name: DEEPENING FROST
      blurb: HIS FROST NOVA WIDENS AND BITES HARDER EACH RANK
      everyLevels: 3
      novaRadiusPerRank: 10
      novaDamagePerRank: 8
    joinWords:
      - - YOU PUT ME ON MY KNEES AND THEN YOU LET ME UP. NOBODY HAS EVER DONE BOTH. I'M YOURS.
    killQuotes:
      - NOW YOU TRY IT.
      - IT'S EASIER THAN THEY SAY.
      - STAY DOWN. I NEVER COULD.
      - THAT ONE WENT QUICKLY.

  # The little man with the pot of gold. His luck rubs off: +50% MAGIC FIND
  # for the whole party while he's on his feet.
  lucky:
    name: LUCKY
    sprite: lucky
    hp: 140
    speed: 84
    radius: 9
    weapon: sorcerers_staff
    aura:
      magicFind: 0.5
    # The luck runs deeper the longer he's around: his magic-find aura swells
    # with every rank, so the party's finds keep getting shinier.
    power:
      name: RUNAWAY LUCK
      blurb: HIS MAGIC-FIND AURA SWELLS EACH RANK
      everyLevels: 3
      magicFindPerRank: 0.15
    joinWords:
      - - YE BEAT ME FAIR AND LET ME KEEP ME HEAD. SO I'M YOURS - ME AND ME LUCK. C'MON.
    killQuotes:
      - OOPS. BAD LUCK.
      - NOT YOUR DAY, FRIEND.
      - AH, THAT'S A SHAME.
      - THAT'S ME GOLD NOW.
      - I DIDN'T EVEN DO ANYTHING.
