# INTO THE RIFT — between Mars and the rift. The colony's east end after MOSQUE
# fled: the tear he left hanging in the air, the hero's parked ship staying
# behind, and the shortest decision he makes in the whole story.
id: rift_entry
stage:
  width: 224
  height: 126
  backdrop: marsDusk
  palette: { wall: "#2c161c", floor: "#8f5033", trim: "#5e3320", floorY: 86 }
  props:
    - { sprite: stars_a, at: { x: 44, y: 24 } }
    - { sprite: stars_b, at: { x: 150, y: 30 } }
    # The ship stays on Mars — where he's going, thrust won't help.
    - { sprite: starship, at: { x: 30, y: 100 } }
    # MOSQUE's exit, still open. Still humming.
    - { sprite: rift, at: { x: 168, y: 100 } }
actors:
  - { id: hero, name: ME, sprite: hero_suit, at: { x: 52, y: 96 } }
beats:
  - { kind: fade, to: 1, ms: 0 }
  - { kind: fade, to: 0, ms: 900 }
  - kind: caption
    text:
      - HE TORE A HOLE IN THE UNIVERSE RATHER THAN LOSE.
  - { kind: move, actor: hero, to: { x: 138, y: 97 }, speed: 40 }
  - kind: say
    actor: hero
    text:
      - NO CHARTS FOR WHAT'S IN THERE. NO GROUND. NO AIR? NO IDEA.
  - kind: say
    actor: hero
    text:
      - SHE WENT THROUGH. SO I GO THROUGH.
  - { kind: move, actor: hero, to: { x: 164, y: 98 }, speed: 30 }
  - { kind: exit, actor: hero }
  - { kind: wait, ms: 700 }
  - { kind: fade, to: 1, ms: 1100 }
