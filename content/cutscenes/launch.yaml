# THE LAUNCH — between GOODCO HQ and the moon, part one. The garage at night:
# the ship he spent ten years building finally has its engine part, and the hero
# leaves home the same way Ada did — out the door, no plan to be long.
#
# The ship is an ACTOR rather than a prop (actors can move and pose): parked cold
# through the goodbye, posed to its firing frames for the liftoff.
id: launch
stage:
  width: 224
  height: 126
  backdrop: garageNight
  # THE LAWN IS STILL A LAWN. It is scorched where the ship has been standing
  # and green everywhere else — the far end of the lot, past the house, never
  # had a rocket lit on it. The burnt patch is not painted here: it is derived
  # from where the ship is parked, exactly as the soot on the house is
  # (`render/rocket-exhaust.ts`), so the two can never disagree about how far
  # the damage reaches.
  palette: { wall: "#0e1020", floor: "#20281c", trim: "#0a0c14", floorY: 76 }
  # IT IS POURING. Leaving is not a happy occasion — the night he lights the
  # rocket is a storm night, and the rain keeps falling on the lot while the
  # ship climbs out of frame. The minigame that takes over above this scene
  # flies the SAME storm (`rocket-screen/storm.ts`), which is the whole point
  # of authoring the weather here: the cut lands in the sky the scene promised.
  weather: storm
  props:
    # THE SKY IS NOT DRESSED HERE. `backdrop: garageNight` is one of the
    # renderer's SKY backdrops, so the night over this lot is the same night the
    # drive is played against — the wash, the moon, the starfield, the cloud
    # bands and the open country along the skyline, all of it from
    # `pwa/src/game/render/night-sky.ts`. The hero lifts off the road the car
    # later drives; it should be the same evening, and a moon prop with four
    # star tiles pinned behind it agreed with nothing.
    #
    # NOTHING UP THERE TWINKLES, and while the camera is on the ground the only
    # thing moving is the clouds' own slow drift across. The CLIMB is what the
    # sky is really for: the land goes first and fastest, and every layer above
    # it comes down the frame by its own depth — the near deck a scene asks for,
    # then the bank, the puffs, the wisp, and the stars at almost nothing. That
    # ladder is the shot.
    #
    # Home, garage door up — and the ship parked HARD BESIDE IT, a dozen px off
    # the roll-up door, exactly as far as a man rolls a thing he built in there
    # and no further. That closeness is the joke the blast pays off: the side of
    # the house facing the pad goes black while the engine burns
    # (`render/rocket-exhaust.ts` — soot is a function of distance, so the
    # garage is the only thing near enough to get any).
    #
    # …AND THE JOKE HAS A SECOND HALF, which is that it STICKS — and a THIRD,
    # which is that it keeps going. The house he lights it beside is whole
    # exactly once, and every burn after that lands on what the last one left:
    #
    #   whole            → the first lift-off, for the moon
    #   burnt            → the landing that brings him home (`earth_return`)
    #   burnt twice over → HERE, the second lift-off, for Mars
    #   gutted           → whatever the third fire left, on any replay after it
    #
    # `until:` / `needs:` are the run's own memory, and the ladder is read off
    # the levels behind him rather than off a counter: `cleared:moon` means the
    # homecoming has already happened, so this launch opens on a two-fire house;
    # `cleared:mars` means the third fire is behind him too. The blast then
    # blackens what is already black and the roof catches again on a roof that
    # has caught before. Nothing gets better — it just never stops getting
    # worse, and nobody in the game ever mentions it.
    - {
        sprite: garage_house,
        at: { x: 46, y: 86 },
        label: house,
        until: "cleared:moon",
      }
    - {
        sprite: garage_house_burnt2,
        at: { x: 46, y: 86 },
        label: house_burnt,
        needs: "cleared:moon",
        until: "cleared:mars",
      }
    - {
        sprite: garage_house_burnt3,
        at: { x: 46, y: 86 },
        label: house_gutted,
        needs: "cleared:mars",
      }
    # THE TWO TREES ON THE LAWN BESIDE THE PAD, and they are here because the
    # HOUSE alone could not carry the joke. A blackened frontage reads as a
    # building somebody has neglected; a tree that was in leaf the first time
    # and is a bare skeleton the third time reads as something that was ALIVE
    # and is not, which is the same fact about the same lot said in a way
    # nobody can mistake for weathering.
    #
    # They climb the HOUSE'S OWN LADDER off the same `cleared:` tags, and the
    # walkable hub stands the same three sprites on the same patch of ground
    # (`content/maps/garage.yaml` → the `pad` district's `stages`) — the player
    # walks that lawn between every errand, so the scene and the map have to
    # agree about what is standing on it:
    #
    #   in leaf   he has not lit it here yet
    #   charred   the moon is behind him
    #   ashen     so is Mars, and there was nothing left on them by then
    #
    # THE LIVE SOOT IS ON TOP OF ALL THREE and is not the same thing: it is what
    # THIS burn is doing while the camera watches (`render/rocket-exhaust.ts`,
    # by distance from the pad). The art is what the LAST ones left.
    - {
        sprite: garage_tree,
        at: { x: 132, y: 88 },
        label: tree_near,
        until: "cleared:moon",
      }
    - {
        sprite: garage_tree_charred,
        at: { x: 132, y: 88 },
        label: tree_near_charred,
        needs: "cleared:moon",
        until: "cleared:mars",
      }
    - {
        sprite: garage_tree_ashen,
        at: { x: 132, y: 88 },
        label: tree_near_ashen,
        needs: "cleared:mars",
      }
    - {
        sprite: garage_tree,
        at: { x: 178, y: 84 },
        label: tree_far,
        until: "cleared:moon",
      }
    - {
        sprite: garage_tree_charred,
        at: { x: 178, y: 84 },
        label: tree_far_charred,
        needs: "cleared:moon",
        until: "cleared:mars",
      }
    - {
        sprite: garage_tree_ashen,
        at: { x: 178, y: 84 },
        label: tree_far_ashen,
        needs: "cleared:mars",
      }
    # ── THE LOT'S OWN GROUND (`content/maps/garage.yaml`) ──────────────────
    # The hub is walkable and the player has already stood on all of this, so
    # the establishing shot owes it the same three surfaces: the swept PAVED
    # DRIVE outside the roll-up door, and past it THE ROAD, two lanes of dark
    # tarmac with a painted centre line, running off both edges of the frame.
    # `ground: true` paints them WITH the floor rather than into the standing
    # queue — a slab is anchored at its NEAR edge, so sorted normally it would
    # come out in front of the hero walking over it.
    #
    # …AND THE WHOLE LOT SITS HIGH IN THE FRAME, which is not a composition
    # choice: the dialogue box floats over the bottom fifth of the stage for most
    # of the scene, so anything below about y 103 is under it. The road used to
    # lie in exactly that band and was never once seen. Everything is pulled up
    # so the street clears the box, and the road gets its second row of tiles —
    # TWO LANES, as the description always claimed — with the near one running on
    # down behind the box where nothing needs to be read.
    #
    # The drive runs from the door's threshold (the house's base, y 86) down to
    # the kerb at y 92; the road's eight tiles lay two 12-row lanes end to end
    # (56 px each, centred at 28/84/140/196 = the full 224).
    - { sprite: garage_drive, at: { x: 57, y: 92 }, ground: true }
    # ── AND HIS OWN CAR, AT THE FOOT OF IT ────────────────────────────────
    # `wagon: true` is not a sprite: the hatchback is ASSEMBLED from its panels
    # in whatever condition the night has left it (`CutsceneProp.wagon`), so
    # what stands here is the car the player has just driven back from GOODCO —
    # the bent panels the road put in it, the wheel it lost, and whoever it went
    # through still on the paint. A scene that showed a clean one would be the
    # game contradicting the last minute of play in its own establishing shot.
    #
    # PARKED NOSE-OUT, which is what `flip:` is for. The art has one profile and
    # nothing rotates it, so a wagon backed onto its own drive and pointed at
    # the road is the same assembly mirrored — and it is pointed at the road
    # because that is how a man who is not coming back parks.
    #
    # AT THE KERB, ON THE STREET — not up the drive. The drive is the ship's
    # ground: it is what the pad blast washes over and what the hero walks up,
    # and a car parked on it is a car standing in the way of the shot. This is
    # the far lane, outside his own gate, nosed at the road he came in off.
    - { wagon: true, at: { x: 57, y: 102 }, flip: true }
    - { sprite: road_lane, at: { x: 28, y: 104 }, ground: true }
    - { sprite: road_lane, at: { x: 84, y: 104 }, ground: true }
    - { sprite: road_lane, at: { x: 140, y: 104 }, ground: true }
    - { sprite: road_lane, at: { x: 196, y: 104 }, ground: true }
    - { sprite: road_lane, at: { x: 28, y: 116 }, ground: true }
    - { sprite: road_lane, at: { x: 84, y: 116 }, ground: true }
    - { sprite: road_lane, at: { x: 140, y: 116 }, ground: true }
    - { sprite: road_lane, at: { x: 196, y: 116 }, ground: true }
actors:
  # HE OPENS AT HIS OWN CAR — a step up the kerb from where he left it, and
  # walks from there up the drive to the pad. The scene used to
  # start him over by the front door, which was a man leaving a house; starting
  # him at the wagon makes it a man who has just got out of one, which is what
  # the last minute of play actually was. He is also still WEARING it: the blood
  # travels with him out of the level (`hero-soak.ts`) and the stage lays it over
  # whichever art the actor is drawn as, so a man who left GOODCO red is red on
  # his own lawn.
  - { id: hero, name: "{HERO}", sprite: hero_tee, at: { x: 32, y: 97 } }
  # The garage ship — the Mars level's parked `starship`, ten years younger.
  # Poses to `ship_fire` when the engine lights.
  - { id: ship, sprite: ship, at: { x: 108, y: 88 } }
beats:
  - { kind: fade, to: 1, ms: 0 }
  - { kind: fade, to: 0, ms: 900 }
  - kind: caption
    text:
      - TEN YEARS OF WEEKENDS IN THE GARAGE. SHE ONLY EVER NEEDED ONE MORE PART.
  - { kind: move, actor: hero, to: { x: 80, y: 93 }, speed: 40 }
  - kind: say
    actor: hero
    text:
      - ENGINE. FUEL. DUCT TAPE. AND THE PART THEY SAID I COULDN'T HAVE.
  - { kind: move, actor: hero, to: { x: 98, y: 90 }, speed: 40 }
  - { kind: wait, ms: 350 }
  - { kind: exit, actor: hero }
  - { kind: wait, ms: 700 }
  # Ignition: flame on, the hull rattling on the pad… and the one moment of this
  # scene the player would notice the silence of. The `sound` beat sits directly
  # over the pose that lights the engine, so the crack and the picture are the
  # same frame.
  - { kind: sound, sound: rocket_ignition }
  - { kind: pose, actor: ship, sprite: ship_fire }
  - { kind: shake, actor: ship, amp: 1 }
  - { kind: wait, ms: 1200 }
  # …liftoff: the roar opens out over the ignition's own tail (it is authored to
  # layer, not to replace) and the ship climbs into the sky…
  - { kind: sound, sound: rocket_liftoff }
  - { kind: move, actor: ship, to: { x: 108, y: 40 }, speed: 42 }
  # …and the camera follows it up: house, lawn, drive and road fall away at full
  # depth, taking the skyline's own country with them, and the frame is left
  # hanging in the same night with the rocket burning and trembling.
  - { kind: pan, by: { x: 0, y: 180 }, ms: 3200 }
  # AND THE CLIMB DOES NOT STOP FOR THE NARRATION. The caption below holds until
  # the player taps it, and a pan ends when its `ms` are spent — so the shot
  # used to arrive at a ship parked in mid-air with a still sky around it, for
  # as long as anybody took to read one line. The drift keeps the camera rising
  # underneath every beat after it: the cloud deck slides down past the nose at
  # a third of it, the bank at a fifth, the wisp at a twentieth and the stars at
  # almost nothing, which is a ship climbing rather than a picture sliding. It
  # is slower than the ascent on purpose — the shot is settling, not still.
  - { kind: drift, by: { x: 0, y: 22 } }
  - kind: caption
    text:
      - FIRST FLIGHT. NO TEST RUNS. ADA WOULD CALL IT ROMANTIC.
  - { kind: fade, to: 1, ms: 1100 }
