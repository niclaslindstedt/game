# THE LAUNCH — between GOODCO HQ and the moon, part one. The garage at night:
# the ship he spent ten years building finally has its engine part, and the hero
# leaves home the same way Ada did — out the door, no plan to be long.
#
# The ship is an ACTOR rather than a prop (actors can move and pose): parked cold
# through the goodbye, posed to its firing frames for the liftoff.
id: launch
stage:
  width: 224
  height: 126
  backdrop: garageNight
  # THE LAWN IS STILL A LAWN. It is scorched where the ship has been standing
  # and green everywhere else — the far end of the lot, past the house, never
  # had a rocket lit on it. The burnt patch is not painted here: it is derived
  # from where the ship is parked, exactly as the soot on the house is
  # (`render/rocket-exhaust.ts`), so the two can never disagree about how far
  # the damage reaches.
  palette: { wall: "#0e1020", floor: "#20281c", trim: "#0a0c14", floorY: 88 }
  props:
    # THE SKY IS NOT DRESSED HERE. `backdrop: garageNight` is one of the
    # renderer's SKY backdrops, so the night over this lot is the same night the
    # drive is played against — the wash, the moon, the starfield, the three
    # cloud bands and the open country along the skyline, all of it from
    # `pwa/src/game/render/night-sky.ts`. The hero lifts off the road the car
    # later drives; it should be the same evening, and a moon prop with four
    # star tiles pinned behind it agreed with nothing.
    #
    # It hangs STILL — no twinkle, nothing tracking the camera — and only the
    # clouds drift, slowly. The ascent pan takes the LAND away (the fields and
    # the glow ride the ground line down with the lawn) and leaves the sky
    # exactly where it was.
    #
    # Home, garage door up — and the ship parked HARD BESIDE IT, a dozen px off
    # the roll-up door, exactly as far as a man rolls a thing he built in there
    # and no further. That closeness is the joke the blast pays off: the side of
    # the house facing the pad goes black while the engine burns
    # (`render/rocket-exhaust.ts` — soot is a function of distance, so the
    # garage is the only thing near enough to get any).
    #
    # …AND THE JOKE HAS A SECOND HALF, which is that it STICKS — and a THIRD,
    # which is that it keeps going. The house he lights it beside is whole
    # exactly once, and every burn after that lands on what the last one left:
    #
    #   whole            → the first lift-off, for the moon
    #   burnt            → the landing that brings him home (`earth_return`)
    #   burnt twice over → HERE, the second lift-off, for Mars
    #   gutted           → whatever the third fire left, on any replay after it
    #
    # `until:` / `needs:` are the run's own memory, and the ladder is read off
    # the levels behind him rather than off a counter: `cleared:moon` means the
    # homecoming has already happened, so this launch opens on a two-fire house;
    # `cleared:mars` means the third fire is behind him too. The blast then
    # blackens what is already black and the roof catches again on a roof that
    # has caught before. Nothing gets better — it just never stops getting
    # worse, and nobody in the game ever mentions it.
    - {
        sprite: garage_house,
        at: { x: 46, y: 98 },
        label: house,
        until: "cleared:moon",
      }
    - {
        sprite: garage_house_burnt2,
        at: { x: 46, y: 98 },
        label: house_burnt,
        needs: "cleared:moon",
        until: "cleared:mars",
      }
    - {
        sprite: garage_house_burnt3,
        at: { x: 46, y: 98 },
        label: house_gutted,
        needs: "cleared:mars",
      }
    # THE TWO TREES ON THE LAWN BESIDE THE PAD, and they are here because the
    # HOUSE alone could not carry the joke. A blackened frontage reads as a
    # building somebody has neglected; a tree that was in leaf the first time
    # and is a bare skeleton the third time reads as something that was ALIVE
    # and is not, which is the same fact about the same lot said in a way
    # nobody can mistake for weathering.
    #
    # They climb the HOUSE'S OWN LADDER off the same `cleared:` tags, and the
    # walkable hub stands the same three sprites on the same patch of ground
    # (`content/maps/garage.yaml` → the `pad` district's `stages`) — the player
    # walks that lawn between every errand, so the scene and the map have to
    # agree about what is standing on it:
    #
    #   in leaf   he has not lit it here yet
    #   charred   the moon is behind him
    #   ashen     so is Mars, and there was nothing left on them by then
    #
    # THE LIVE SOOT IS ON TOP OF ALL THREE and is not the same thing: it is what
    # THIS burn is doing while the camera watches (`render/rocket-exhaust.ts`,
    # by distance from the pad). The art is what the LAST ones left.
    - {
        sprite: garage_tree,
        at: { x: 132, y: 100 },
        label: tree_near,
        until: "cleared:moon",
      }
    - {
        sprite: garage_tree_charred,
        at: { x: 132, y: 100 },
        label: tree_near_charred,
        needs: "cleared:moon",
        until: "cleared:mars",
      }
    - {
        sprite: garage_tree_ashen,
        at: { x: 132, y: 100 },
        label: tree_near_ashen,
        needs: "cleared:mars",
      }
    - {
        sprite: garage_tree,
        at: { x: 178, y: 96 },
        label: tree_far,
        until: "cleared:moon",
      }
    - {
        sprite: garage_tree_charred,
        at: { x: 178, y: 96 },
        label: tree_far_charred,
        needs: "cleared:moon",
        until: "cleared:mars",
      }
    - {
        sprite: garage_tree_ashen,
        at: { x: 178, y: 96 },
        label: tree_far_ashen,
        needs: "cleared:mars",
      }
    # ── THE LOT'S OWN GROUND (`content/maps/garage.yaml`) ──────────────────
    # The hub is walkable and the player has already stood on all of this, so
    # the establishing shot owes it the same three surfaces: the swept PAVED
    # DRIVE outside the roll-up door, and past it THE ROAD, two lanes of dark
    # tarmac with a painted centre line, running off both edges of the frame.
    # `ground: true` paints them WITH the floor rather than into the standing
    # queue — a slab is anchored at its NEAR edge, so sorted normally it would
    # come out in front of the hero walking over it.
    #
    # The drive runs from the door's threshold (the house's base, y 98) down
    # to the road's kerb at y 114, flaring as it goes, and the road's four
    # tiles lay the bottom 12 rows of the stage end to end (56 px each,
    # centred at 28/84/140/196 = the full 224).
    - { sprite: garage_drive, at: { x: 57, y: 114 }, ground: true }
    - { sprite: road_lane, at: { x: 28, y: 126 }, ground: true }
    - { sprite: road_lane, at: { x: 84, y: 126 }, ground: true }
    - { sprite: road_lane, at: { x: 140, y: 126 }, ground: true }
    - { sprite: road_lane, at: { x: 196, y: 126 }, ground: true }
actors:
  - { id: hero, name: "{HERO}", sprite: hero_tee, at: { x: 32, y: 102 } }
  # The garage ship — the Mars level's parked `starship`, ten years younger.
  # Poses to `ship_fire` when the engine lights.
  - { id: ship, sprite: ship, at: { x: 94, y: 100 } }
beats:
  - { kind: fade, to: 1, ms: 0 }
  - { kind: fade, to: 0, ms: 900 }
  - kind: caption
    text:
      - TEN YEARS OF WEEKENDS IN THE GARAGE. SHE ONLY EVER NEEDED ONE MORE PART.
  - { kind: move, actor: hero, to: { x: 70, y: 102 }, speed: 40 }
  - kind: say
    actor: hero
    text:
      - ENGINE. FUEL. DUCT TAPE. AND THE PART THEY SAID I COULDN'T HAVE.
  - { kind: move, actor: hero, to: { x: 84, y: 102 }, speed: 40 }
  - { kind: wait, ms: 350 }
  - { kind: exit, actor: hero }
  - { kind: wait, ms: 700 }
  # Ignition: flame on, the hull rattling on the pad…
  - { kind: pose, actor: ship, sprite: ship_fire }
  - { kind: shake, actor: ship, amp: 1 }
  - { kind: wait, ms: 1200 }
  # …liftoff: the ship climbs into the sky…
  - { kind: move, actor: ship, to: { x: 94, y: 46 }, speed: 42 }
  # …and the camera follows it up: house, lawn, drive and road fall away at full
  # depth, taking the skyline's own country with them, and the frame is left
  # hanging in the same still night with the rocket burning and trembling.
  - { kind: pan, by: { x: 0, y: 180 }, ms: 3200 }
  - kind: caption
    text:
      - FIRST FLIGHT. NO TEST RUNS. ADA WOULD CALL IT ROMANTIC.
  - { kind: fade, to: 1, ms: 1100 }
