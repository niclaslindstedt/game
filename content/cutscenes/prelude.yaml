# THE PRELUDE — the night everything started, and the campaign's opening scene.
#
# Built once per DIFFICULTY: `variants:` at the foot re-emits this scene as
# `prelude_<difficulty>` with the weapon on the back wall, the one he carries
# out in his hand, and the caption over it all swapped for the rung's actual
# `startingWeapon`, so the scene always shows the exact piece the run starts
# with. MEDIUM is the base scene the other rungs vary from; `cutsceneVariant`
# resolves the variant at run creation.
# A variant patches a LABELLED part of the scene — the `label:` keys below are
# authoring handles, not engine fields, and never reach the game.
id: prelude
stage:
  width: 224
  height: 126
  backdrop: livingRoom
  palette: { wall: "#262838", floor: "#4a3a2c", trim: "#1a1c28", floorY: 78 }
  # Side view: `at` is bottom-anchored (y is where a thing meets the floor) and
  # the renderer paints back to front by y.
  props:
    # The window hangs at a REAL height: its head under the front door's (the
    # door is 30 tall off a floor mark of 80, so its frame tops out at y 50)
    # and its sill at about a standing man's HEAD — a hero walking the wall at
    # y 88 tops out at 72, which is the bottom of this pane. Parked up at y 52
    # it read as a skylight: the one opening in the room nobody could have seen
    # the street through. It clears the floor lamp (x 163…173) at this width.
    - { sprite: window, at: { x: 146, y: 72 } }
    # The starting weapon, mounted on the back wall until he leaps for it — the
    # one thing the hero owns worth taking, and what he fights with until the
    # run yields better (DifficultyDef.startingWeapon). Its `label:` is also the
    # id the `prop` beat takes it off the wall by. It hangs ABOVE THE COUCH
    # (centred on the couch's own x, clear of the seated pair's heads at y≈73):
    # the thing he will carry out of this room is over the two of them for the
    # whole scene, rather than parked in the corner by the door.
    - { label: arm, sprite: wall_medieval_sword, at: { x: 104, y: 54 } }
    # THE FRONT DOOR, SHUT AND OPEN — one thing in two states, stacked on the
    # same mark and swapped by the `prop` beats below (the open one starts off
    # the stage). What shows through the opening is the lot the game already
    # owns: the lit step, the lawn, and past it the road with its centre line —
    # the same three surfaces the launch scene establishes and the garage hub
    # lets the player walk on.
    - { label: shut_door, sprite: door, at: { x: 202, y: 80 } }
    - {
        label: open_door,
        sprite: door_open,
        at: { x: 202, y: 80 },
        hidden: true,
      }
    # The set they are watching, off to the left; the couch faces it, close
    # enough that the pair reads as actually watching it rather than marooned
    # across the room. The coffee table sits where a coffee table sits: square
    # in FRONT of the couch, on the couch's own x and a step nearer the camera
    # — its top edge (y 98) picks up exactly where the seated pair's feet
    # leave off (97), so it fronts them without covering anybody.
    - { sprite: tv, at: { x: 44, y: 94 } }
    - { sprite: couch, at: { x: 104, y: 96 } }
    - { sprite: table, at: { x: 104, y: 108 } }
    - { sprite: lamp, at: { x: 168, y: 90 } }
# Both of them on the sofa for movie night, watching the TV off to the left —
# the hero never gets up, which is the whole joke. Their `at.y` sits a hair below
# the couch's floor anchor so they paint just in front of the backrest; the
# seated sprites carry a tall transparent footer (content/sprites/prelude/) that
# lifts the figure onto the cushions while the anchor stays at floor level.
actors:
  - {
      id: hero,
      name: ME,
      sprite: hero_couch,
      at: { x: 96, y: 97 },
      faceLeft: true,
    }
  # Seated beside him in her red jacket; a `pose` beat stands her up (swapping
  # to the walking `ada` sprite) when she heads for the store.
  - {
      id: ada,
      name: ADA,
      sprite: ada_couch,
      at: { x: 112, y: 97 },
      faceLeft: true,
    }
beats:
  - { kind: fade, to: 1, ms: 0 } # open on black…
  - { kind: fade, to: 0, ms: 900 } # …and reveal the living room
  - kind: caption
    text:
      - FRIDAY NIGHT. MOVIE NIGHT.
  - kind: say
    actor: ada
    text:
      - WE'RE OUT OF CHIPS. AND SODA.
  - kind: say
    actor: hero
    text:
      - MOVIE'S STARTING.
  - kind: say
    actor: ada
    text:
      - FIVE MINUTES. KEEP MY SPOT WARM.
  # Up off the couch (swap to the standing/walking sprite), out the door.
  - { kind: pose, actor: ada, sprite: ada }
  - { kind: move, actor: ada, to: { x: 150, y: 112 }, speed: 42 }
  - { kind: move, actor: ada, to: { x: 201, y: 88 }, speed: 42 }
  # She opens it, and the room is briefly not the only place in the world: the
  # step, the lawn and the road are all right there, five minutes away.
  - { kind: sound, sound: front_door_opened }
  - { kind: prop, prop: shut_door, hidden: true }
  - { kind: prop, prop: open_door, hidden: false }
  - { kind: wait, ms: 350 }
  - { kind: exit, actor: ada }
  - { kind: wait, ms: 400 }
  # …and it shuts behind her. The last sound of her in the house.
  - { kind: prop, prop: open_door, hidden: true }
  - { kind: prop, prop: shut_door, hidden: false }
  - { kind: sound, sound: front_door_closed }
  - { kind: wait, ms: 900 }
  - kind: caption
    text:
      # EXPLICIT BREAK: the second clause is the detail the whole first level
      # turns on (he did not fix a zipper), and it only lands if it is held.
      - SHE TOOK HER JACKET.
      - THE ONE I FIXED THE ZIPPER ON.
  - { kind: fade, to: 0.85, ms: 700 }
  - kind: caption
    text:
      - TWO HOURS LATER.
  - { kind: fade, to: 0, ms: 700 }
  - kind: say
    actor: hero
    text:
      - "..."
  - kind: say
    actor: hero
    text:
      - ADA?
  - { kind: wait, ms: 600 }
  - kind: caption
    text:
      - SHE NEVER CAME BACK.
  - { kind: wait, ms: 500 }
  # AND HE GETS UP. The man who never gets up — the joke the whole first half
  # is built on — stands, and the scene stops being a joke. He swaps to the
  # standing walk family (`hero`, the same plain-clothes body the run itself
  # draws) and goes ROUND THE COUCH to get under the mount: out past its right
  # arm (x 86…122 at y 96), then back in at y 86 — BEHIND it, between the sofa
  # and the wall, which is the only floor the weapon actually hangs over. The
  # backrest cuts him off at the knees there, and it should: the painter sorts
  # on `y`, so standing at 86 puts him behind a couch anchored at 96, and the
  # leap lifts him clear of it without ever re-sorting him (a `lift` is height,
  # not depth). It is also the shorter jump — from back there the mount is two
  # of his own heights up rather than three.
  - { kind: pose, actor: hero, sprite: hero }
  - { kind: move, actor: hero, to: { x: 136, y: 100 }, speed: 44 }
  - { kind: move, actor: hero, to: { x: 104, y: 86 }, speed: 40 }
  - { kind: wait, ms: 320 } # the crouch before the leap
  # He takes the one thing off the wall worth taking. Whatever the difficulty
  # hung there is what he brings to save her. The leap is TWO beats — up, then
  # down — and the grab settles between them, at the apex, in a single frame:
  # the piece leaves the wall (`prop`) and lands in his hand (`hold`) on the
  # same tick, which is what makes it read as one motion rather than a swap.
  # `hold.at` is the paper doll's own grip anchor (HELD_DX/HELD_DY in
  # pwa/src/game/paper-doll.ts) on the 16×16 body, so he carries it out of the
  # room at exactly the angle he carries it through the run.
  - { kind: jump, actor: hero, lift: 30, ms: 380 }
  - { kind: prop, prop: arm, hidden: true }
  - label: grip
    kind: hold
    actor: hero
    sprite: icon_medieval_sword
    at: { x: 9, y: 2 }
  - { kind: jump, actor: hero, lift: 0, ms: 300 }
  # And back out round the couch's arm BEFORE the caption: from behind the
  # backrest only his head and the sword's tip clear it, and the line that
  # closes the scene wants the whole man and the whole weapon in frame.
  - { kind: wait, ms: 300 }
  - { kind: move, actor: hero, to: { x: 146, y: 108 }, speed: 46 }
  - { kind: wait, ms: 300 }
  # He names the thing and stops. The hero is short and sharp everywhere he
  # speaks, and this is the line the whole run starts on: the weapon, then a
  # verdict on it that gets thinner the harder the rung is (see `variants:`).
  - label: take
    kind: caption
    text:
      - THE OLD SWORD. IT'LL DO.
  # Out the door Ada walked out of, two hours behind her, armed. The same door,
  # the same road behind it — and it shuts on an empty living room this time.
  - { kind: move, actor: hero, to: { x: 201, y: 88 }, speed: 46 }
  - { kind: sound, sound: front_door_opened }
  - { kind: prop, prop: shut_door, hidden: true }
  - { kind: prop, prop: open_door, hidden: false }
  - { kind: wait, ms: 400 }
  - { kind: exit, actor: hero }
  - { kind: wait, ms: 400 }
  - { kind: prop, prop: open_door, hidden: true }
  - { kind: prop, prop: shut_door, hidden: false }
  - { kind: sound, sound: front_door_closed }
  - { kind: wait, ms: 500 }
  - { kind: fade, to: 1, ms: 1300 }
# One entry per non-base difficulty; each patches the labelled parts above.
variants:
  easy:
    arm: { sprite: wall_sawed_off_shotgun }
    grip: { sprite: icon_sawed_off_shotgun }
    take:
      text:
        - GRANDPA'S SAWED-OFF. THAT'LL DO IT.
  hard:
    arm: { sprite: wall_combat_knife }
    grip: { sprite: icon_combat_knife }
    take:
      text:
        - THE COMBAT KNIFE. IT'LL HAVE TO DO.
  nightmare:
    arm: { sprite: wall_brass_knuckles }
    grip: { sprite: icon_knuckles }
    take:
      text:
        - THE KNUCKLES. THEY'LL HAVE TO DO.
  jesus:
    arm: { sprite: wall_stick }
    grip: { sprite: icon_stick }
    take:
      text:
        - A STICK. GOD HELP US BOTH.
