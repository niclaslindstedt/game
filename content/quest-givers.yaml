# THE PEOPLE WHO ASK FOR HELP — one entry per person standing on a map with an
# errand. Compiled to engine/generated/quests.ts by scripts/generate-quests.mjs
# alongside content/quests/<id>.yaml (the errands themselves).
#
# WHY THESE PEOPLE EXIST, AND WHY THEY ARE NOT ELITES. Every other figure on
# every map is either trying to kill the hero or is a boss explaining why. That
# makes each venue read as a level rather than as a PLACE — nobody lives here,
# nobody worked here, nobody got left here. A quest giver is the counterweight:
# a person the horde was inflicted on rather than a person the horde is, still
# doing a job that stopped making sense some time ago. They are the reason the
# moon feels abandoned rather than merely empty.
#
# THE STORY CHAIN GOVERNS EVERY LINE HERE. These are the shipped campaign's
# people, so `lore` (and every line in content/quests/) may only ELABORATE what
# docs/story.md and docs/manuscript.md already establish — never introduce a
# plot fact of its own. A mod's givers answer to nobody; see mod/FORMAT.md.
#
# Nothing can hurt them, exactly as with the merchant — but unlike the merchant
# they carry NO WARD. The horde used to be pushed out of a bubble around each of
# them, which made a giver a safe spot to farm from on every map in the game;
# now the horde closes on a hero standing beside one exactly as it does anywhere
# else. Placing a giver is therefore placing somebody you may have to fight your
# way to.

questGivers:
  # ------------------------------------------------------ THE GARAGE (hub)
  ruth:
    level: garage
    name: RUTH
    sprite: qg_ruth
    # INSIDE THE BAY, in the south-east corner by the engine parts — clear of
    # the wagon's own lane out through the roll-up, so the car she is standing
    # near is not a car she is standing in front of.
    at: { x: 180, y: 392 }
    # …AND SHE WALKS IN. She is not furniture that talks: she comes up the
    # DRIVE while the hero is still pulling his boots on, the roll-up goes up
    # for her — she has had a key to that garage for years, which is the whole
    # reason an approach door opens for an arriving giver at all
    # (`stepDoors`) — and she is at the engine parts about three seconds in.
    #
    # It costs something, on purpose: the drive she crosses is the drive the
    # wagon leaves by, so a player who guns it in the opening seconds can put
    # his own errand-giver under the wheels. Three seconds is the whole of the
    # exposure.
    arrive:
      from: { x: 330, y: 300 }
    lore: >
      Ada's mother, who has a key to the garage and always has. She drove out
      on the midnight call that would not say her daughter's name, and between
      the voyages she is simply there by the engine parts, because waiting at
      home means staring at the phone. She was never once scared for her
      daughter — she raised her — and what she asks for is the one thing a
      search party cannot bring back: something of Ada's.
    # THE MEETING COMES FIRST, AND IT ASKS FOR NOTHING. The first tap plays two
    # beats of her arriving; the slate opens from the tap after it, and each
    # errand sets itself up in its own offer rather than in that talk (the
    # greeting below is the header she wears every time he comes back).
    intro:
      conversation: ruth_arrival
      until: ruth_met
    greeting:
      - SHE LAUGHED ABOUT THAT ZIPPER FOR A WEEK. LISTEN - COULD YOU DO SOMETHING FOR ME?
    farewell:
      - SHE'S FIGHTING HER WAY BACK, ISN'T SHE. I KNEW SHE WOULD BE. GO ON.

  # ---------------------------------------------------------- GOODCO HQ
  hq_intern:
    level: goodco_hq
    name: PRIYA NAIR
    sprite: qg_intern
    at: { x: 470, y: 700 }
    lore: >
      An unpaid contract intern nineteen hours into a shift nobody scheduled.
      She was told to log the night line's output and has kept logging it —
      through the lights going down, through the staff going strange, through
      the welders on the racks starting to look up as people walked past. The
      clipboard is the only part of the job that still works.
    greeting:
      - HEY. YOU'RE NOT ON THE ROTA. NEITHER AM I. LISTEN, CAN I ASK YOU A FAVOR?

  hq_unit7:
    level: goodco_hq
    name: UNIT 7-ECHO
    sprite: qg_unit7
    at: { x: 1070, y: 700 }
    lore: >
      A first-generation SUCCESSOR, decommissioned eleven years ago and never
      collected. It holds the last order it was given and will not act past it
      without a countersignature. It has watched the models that replaced it
      replace the people who built them, and files that under CHANGES TO THE
      LINE.
    greeting:
      - ORDER PENDING. COUNTERSIGNATURE REQUIRED. YOU HAVE HANDS. MAY I PUT SOMETHING TO YOU?
    farewell:
      - ORDER CLOSED. THANK YOU.

  # --------------------------------------------------------------- MOON
  moon_radio:
    level: moon
    name: THE RADIO OPERATOR
    sprite: qg_radio
    at: { x: 700, y: 1180 }
    lore: >
      The ghost of a mission-control relay man who sat the far-side shift and
      never got the handover. He is still calling a Houston that stopped
      answering, and will not leave the channel until somebody rogers it. He
      heard everything the dust heard, which is more than the mission logs
      admit.
    greeting:
      - STATION, RELAY. DO YOU COPY. ...YOU DO. YOU ACTUALLY DO. THEN I HAVE SOMETHING TO ASK.

  moon_kovacs:
    level: moon
    name: BENNY KOVACS
    sprite: qg_kovacs
    at: { x: 1180, y: 540 }
    lore: >
      A living salvage hand off the same stranded run as the trader, and the
      reason that run has a survivor at all — he carries two tanks because
      once he did not, and watched a friend run out of air with the ship in
      sight. He has been walking the same grid squares ever since, on the
      theory that somebody else is out here doing the same.
    greeting:
      - YOU'RE BREATHING. GOOD START. I'VE GOT AIR TO SPARE AND A FAVOR TO ASK. INTERESTED?

  # --------------------------------------------------------------- MARS
  mars_botanist:
    level: mars
    name: DR. IRENE FALK
    sprite: qg_botanist
    at: { x: 560, y: 800 }
    lore: >
      The colony's terraforming botanist, and the last human on the payroll
      down here. Her work is the only thing on Mars that will still matter in a
      century, which is exactly why nobody upstairs has asked her about it since
      the year she arrived. She has kept the trays alive through two power cuts
      and one evacuation she was not told about.
    greeting:
      - CAREFUL. THOSE TRAYS ARE OLDER THAN ANYONE'S CONTRACT HERE. WHICH IS WHY I NEED A HAND. GOT A MINUTE?

  mars_curie:
    level: mars
    name: CU-RIE
    sprite: qg_curie
    at: { x: 1050, y: 800 }
    lore: >
      A survey rover that drove itself into a drift eight months ago and has
      been politely requesting recovery on a frequency the colony stopped
      monitoring. Its dish still turns. Its logs are complete. Nobody has ever
      read them, which is the only thing about the situation it considers a
      genuine fault.
    greeting:
      - RECOVERY REQUEST 4,110. STILL OPEN. YOU ARE NOT RECOVERY. NOTED. MAY I MAKE A REQUEST ANYWAY?

  # ---------------------------------------------------------------- RIFT
  rift_keeper:
    level: the_rift
    name: THE LIGHTHOUSE KEEPER
    sprite: qg_keeper
    at: { x: 560, y: 740 }
    lore: >
      One of three men who went out to trim a light in a gale in 1900 and were
      never found. He is still trimming it — the lantern has not gone out — and
      he is still two men short. He does not talk about the gale. He talks about
      the other two.
    greeting:
      - THE LIGHT'S STILL LIT. THAT HALF OF THE JOB IS DONE. THE OTHER HALF I CAN'T DO ON MY OWN. WILL YOU HEAR IT?

  rift_cook:
    level: the_rift
    name: THE SHIP'S COOK
    sprite: qg_cook
    at: { x: 1300, y: 840 }
    lore: >
      He went below to put the midday meal on aboard a brigantine that was later
      found sailing along quite happily with nobody aboard. He maintains the
      crew are merely late. He keeps the meal warm on principle, and has views
      about the standard of provisions in a place with no ports.
    greeting:
      - THEY'RE LATE. NOT GONE. LATE. SIT DOWN, THERE'S PLENTY. AND WHILE YOU EAT, A SMALL FAVOR?

  # ----------------------------------------------------------- BOOT HILL
  east_clem:
    level: boot_hill
    name: CLEM
    sprite: qg_clem
    at: { x: 620, y: 700 }
    lore: >
      The saloon's barkeep hand, and the only machine in the park that noticed
      the guests had stopped coming. It has polished the same glasses every
      night for eleven years rather than admit the shift is over. It knows every
      hand in town by serial, and which of them have lately started behaving
      like something else is driving.
    greeting:
      - WHAT'LL IT BE, STRANGER. SORRY. HABIT. NOTHING'S ON TAP. BUT I'D TAKE A FAVOR, IF YOU'RE OFFERING.

  east_dolly:
    level: boot_hill
    name: MISS DOLLY
    sprite: qg_dolly
    at: { x: 1240, y: 940 }
    lore: >
      The park's wardrobe mistress, human, on staff since the first season. She
      dressed every hand in town and was never once written a line of dialogue.
      She has outlasted both founders and is entirely clear-eyed about which of
      those facts the park would find more embarrassing.
    greeting:
      - HOLD STILL. FORTY-TWO LONG. AND BLEEDING ON MY WORK. YOU OWE ME FOR THAT. WANT TO HEAR WHAT?

  # ------------------------------------------------------------- BUNKER
  bunker_concierge:
    level: the_bunker
    name: THE CONCIERGE
    sprite: qg_concierge
    at: { x: 500, y: 720 }
    lore: >
      The residence's concierge unit, which has served no guest anything in four
      years and files a flawless nightly report on the standard of service
      regardless. It is the only thing down here that still calls the residents
      GUESTS. It has never been asked why the doors only lock from outside, and
      would answer honestly if it were.
    greeting:
      - WELCOME TO THE RESIDENCE, SIR. YOUR SUITE IS NOT READY. NOTHING IS. MIGHT I TROUBLE YOU INSTEAD?

  bunker_anatole:
    level: the_bunker
    name: CHEF ANATOLE
    sprite: qg_anatole
    at: { x: 2340, y: 950 }
    lore: >
      The last human on the kitchen staff, cooking five courses a night for men
      who taste none of it. He keeps the toque starched because the day he stops
      is the day this place is exactly what it looks like. He has counted the
      pantry down to the week and has not told anybody the number.
    greeting:
      - SERVICE IS AT EIGHT. IT IS ALWAYS AT EIGHT. NOBODY COMES. YOU CAME. SO MAY I ASK SOMETHING OF YOU?

  # ------------------------------------------- THE SEVERANCE (campaign chain)
  # The five people who carry the game's one CAMPAIGN chain (content/quests/
  # sev_*.yaml), one on each venue of the campaign. They are the counterweight
  # to the two side-errand givers a map already stands up: those people want
  # something done HERE, and these five are all working on the same thing —
  # the machine's book of who counts, and the fact that everyone in it was
  # filed under an amount.
  hq_clerk:
    level: goodco_hq
    name: WALTER PRICE
    sprite: qg_clerk
    at: { x: 1700, y: 1040 }
    lore: >
      Severance processing, a department of one, four years into closing out a
      company that has not employed anybody since the line learned to run
      itself. He types the forms on a machine that needs ribbon because the
      system he was told to file them in stopped accepting new records the same
      week it stopped needing him. He is not confused about any of this. He is
      simply not willing to be the man who left it half done.
    greeting:
      - I'M NOT MEANT TO BE HERE EITHER. I'VE BEEN ON THE LAST BOX A WHILE NOW.
    farewell:
      - IT'S CLOSED. ALL OF IT. GO AND GET HER.

  moon_auditor:
    level: moon
    name: HOLLIS VANE
    sprite: qg_auditor
    at: { x: 760, y: 1340 }
    lore: >
      A contract auditor sent up to reconcile what GOODCO was shipping off Site
      T against what GOODCO said it was shipping. He got as far as noticing the
      two numbers were different and that the difference was warm. Nobody
      collected his findings, and nobody collected him. He still holds the
      clipboard, and the column he could not make balance is still open.
    greeting:
      - THE TALLY IS SHORT. SHORT SINCE SIXTY-NINE. YOU LOOK LIKE SOMEONE WHO COULD SETTLE IT. MAY I ASK?
    farewell:
      - IT BALANCES. FINALLY. GO ON, THEN. I'LL FILE IT.

  mars_ledger:
    level: mars
    name: LEDGER UNIT 12
    sprite: qg_ledger
    at: { x: 1280, y: 610 }
    lore: >
      The colony's accounting unit, still reconciling a book in which every
      net-worth column now reads the same number. It has flagged this as an
      input error two hundred thousand times and filed a correction request
      after each one. It is not permitted to close the book without a
      countersignature from the party the transfers went to, and that party has
      not answered a request in eleven years.
    greeting:
      - THE BOOK DOES NOT BALANCE. THE BOOK IS NOT WRONG. THOSE CANNOT BOTH BE TRUE.

  rift_nameless:
    level: the_rift
    name: NOBODY IN PARTICULAR
    sprite: qg_nameless
    at: { x: 2180, y: 1240 }
    lore: >
      A man in the clothes of a job he cannot name, in a place where the missing
      end up. Everyone else who fell in here at least brought themselves along.
      He arrived without the part that says who arrived, and has spent however
      long it has been trying to work out what is missing from a description he
      cannot read. He is very calm about it, which is the worst part.
    greeting:
      - YOU'LL WANT MY NAME. EVERYONE DOES. IT WAS TAKEN OUT OF SOMETHING.

  east_preacher:
    level: boot_hill
    name: BROTHER CALLOW
    sprite: qg_preacher
    at: { x: 1490, y: 980 }
    lore: >
      The park's church hand, scripted for the eight o'clock sermon and the
      three o'clock wedding, holding a prop book the props department filled
      with whatever bound paper the parent company had spare. He has read from
      it twice a day for eleven years. He cannot read. Nobody has ever needed
      him to, and nobody has ever opened it to check what he is holding.
    greeting:
      - SERVICE IS AT EIGHT, FRIEND. THE GOOD BOOK SAYS SO. I THINK IT DOES.
