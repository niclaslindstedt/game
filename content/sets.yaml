# SET items — the D2 GREEN tier, and the source of truth for every kit in the
# game. Compiled to src/generated/sets.ts by `make levels`
# (scripts/generate-sets.mjs); the engine reads it through src/game/defs/sets.ts.
#
# A SET is a boss's hand-authored ARMOR kit — pieces authored in
# `content/items/set/` with `rarity: set` — themed to ONE weapon class so the
# kit reads as a coherent build (a melee bruiser's plate, a ranged gunslinger's
# leathers, a mage's regalia). Wearing several pieces of the same set at once
# grants SET BONUSES on top of each piece's own: small attribute lifts at the
# low thresholds, then a thematic CAPSTONE at the full set (a granted spell, a
# proc, or sure-strike), so a boss is worth farming until the kit is complete.
# Sets sit BELOW uniques on the ladder and, like a named unique, are AUTHORED
# and never rolled: a set piece drops only from its boss
# (`EnemyDef.uniquesByDifficulty`).
#
# The catalog rolls out melee-first across the campaign: PAYLOAD-1 (GOODCO) and
# ARMSTRONG (Moon) drop MELEE sets, THE FOUNDER on Mars and in the Rift drop
# RANGED sets, and BRO OMEGA drops the MAGIC set.
#
# THE MEMBERSHIP HERE IS THE SOURCE OF TRUTH, and each member item carries a
# matching `setId` back-reference — the compile step fails when the two
# disagree, when a piece belongs to two kits, when one kit holds two head
# pieces, or when a threshold asks for more pieces than the set has.

sets:
  # PAYLOAD-1 (GOODCO) — the memecoin prototype boss. A MELEE crit/agility kit:
  # the scavenger who never stops moving and never misses a bite.
  scavengers_hide:
    name: THE GOOD BOY
    weaponClass: melee
    members:
      - whiskerweave_hood
      - vermin_pelt
      - burrow_greaves
      - gnawed_sabatons
    bonuses:
      - pieces: 2
        bonuses:
          - { kind: stat, stat: dexterity, value: 5 }
      - pieces: 3
        bonuses:
          - { kind: crit, value: 0.06 }
      - pieces: 4
        bonuses:
          - { kind: stat, stat: dexterity, value: 4 }
          # The rat always finds the soft spot — its bite never whiffs.
          - { kind: sureStrike }

  # ARMSTRONG (Moon) — the Apollo ghost on his fifty-year vigil. A MELEE
  # endurance kit: the sentinel who outlasts everything and answers every blow.
  sentinels_vigil:
    name: THE SENTINEL'S VIGIL
    weaponClass: melee
    members:
      - the_long_vigil
      - palegrave
      - sentinels_greaves
      - marewalkers
    bonuses:
      - pieces: 2
        bonuses:
          - { kind: stat, stat: stamina, value: 5 }
      - pieces: 3
        bonuses:
          - { kind: maxHp, value: 90 }
      - pieces: 4
        # The vigil strikes back: a shockwave answers whoever wakes him.
        bonuses:
          - { kind: proc, trigger: struck, spell: nova, chance: 0.15, rank: 2 }

  # THE FOUNDER (Mars) — the baron who sold Ada. A RANGED glass-cannon kit: all
  # output, no padding — the brand that tests well and burns hot.
  mosque_brand:
    name: THE FOUNDER BRAND
    weaponClass: ranged
    members:
      - the_signal_crown
      - gilded_carapace
      - lawless_stride
      - ovation_striders
    bonuses:
      - pieces: 2
        bonuses:
          - { kind: stat, stat: dexterity, value: 5 }
      - pieces: 3
        bonuses:
          - { kind: crit, value: 0.08 }
      - pieces: 4
        # Every shot lands with a burst of brand-approved fire.
        bonuses:
          - { kind: proc, trigger: hit, spell: nova, chance: 0.12, rank: 2 }

  # THE FOUNDER (Rift) — the same man, in exile. A RANGED mobility kit: packed
  # light, always already through the next door, a parting shot on the way out.
  exiles_flight:
    name: THE EXILE'S FLIGHT
    weaponClass: ranged
    members:
      - the_redacted
      - aegis_of_exile
      - exiles_stride
      - escapists_tread
    bonuses:
      - pieces: 2
        bonuses:
          - { kind: stat, stat: dexterity, value: 6 }
      - pieces: 3
        bonuses:
          - { kind: stat, stat: luck, value: 6 }
      - pieces: 4
        # A bolt fired over the shoulder as he bolts through the rift.
        bonuses:
          - { kind: proc, trigger: hit, spell: bolt, chance: 0.15, rank: 2 }

  # BRO OMEGA (Rift) — the model that mapped the rift. A MAGIC INT/crit kit: it
  # holds the whole battlefield at once and calls the lightning down on it.
  walled_garden_set:
    name: THE WALLED GARDEN
    weaponClass: magic
    members:
      - the_panopticon
      - truthseeker
      - walled_garden
      - boundstride
    bonuses:
      - pieces: 2
        bonuses:
          - { kind: stat, stat: intelligence, value: 6 }
      - pieces: 3
        bonuses:
          - { kind: crit, value: 0.06 }
      - pieces: 4
        # Inside the garden, the storm never stops.
        bonuses:
          - { kind: spell, spell: storm, rank: 1 }
