# THE CAMPAIGN LADDER — the single source of truth for how tough each map is on
# each difficulty. One cell per [difficulty × map]:
#
#   hero  the INTENDED hero character level while playing this map (the leveling
#         curve's expected level here — see `scripts/leveling-curve.mjs --targets`).
#         The map-layout tool colours CON against it; it is the design anchor a
#         map's mobs are meant to sit near (±~4).
#   mob   the map's mob-level band [start, end] for this rung — `start` is the
#         level of the FIRST mobs a fresh arrival meets, `end` the level near the
#         boss. Every regular spawn without its own ramp rolls the whole band;
#         the named RAMPS below place a spawn point / set-piece at a RELATIVE
#         position within it (see `ramps`).
#
# `loadLevels()` stamps `mobLevels` (the four [easy, medium, hard, nightmare]
# bands) and `intendedLevel` (the four hero anchors) onto each LevelDef from this
# file, so the engine and the tooling read ONE ladder instead of numbers copied
# into every level. JESUS is deliberately omitted: it stays player-relative (a
# JESUS hero has out-levelled every authored number).
#
# Ladder shape (finish levels per map, easy→hard climbing across the campaign):
#   easy 1 → ~30 · medium 1 → ~33 · hard 1 → ~37 · nightmare 40 → ~55.
#
# ─── RAMPS (the difficulty ramps, named once, here) ──────────────────────────
# A level YAML no longer hard-codes per-difficulty mob levels or hp. Instead a
# spawn point / pinned set-piece names a RAMP, and the loader expands it into the
# four [easy, medium, hard, nightmare] values from THIS map's `mob` band. Because
# every difficulty carries its own `[start, end]`, one relative ramp yields the
# right absolute level on every difficulty AND every map — so the whole ladder's
# difficulty is trimmed from ONE file, and the level files read as intent
# ("a `savage` wave", "the `apex` boss") instead of number soup.
#
# A ramp's mob level is RELATIVE to the map+difficulty's own band:
#   fromStart: n   →  a wave that sits n levels above the band START.
#   fromEnd:   n   →  a boss-room set-piece n levels off the band END.
#   fromStart: [e, m, h, n]  →  explicit per-difficulty offsets (rare; the one
#                               opener that deliberately bites harder mid-tier).
# A SPAWN POINT rolls the two-wide band [base+off, base+off+1]; a PINNED
# elite/boss sits at the single level base+off. Every offset clamps to >= 1.
#
# The names are NEUTRAL and ORDERED — they describe a mob's menace WITHIN the
# map's ramp, never the difficulty tier: a `meek` wave on NIGHTMARE is still
# level 42+, because "meek" only means "at this map's starting level".
ramps:
  # wave tiers — anchored to the band START, climbing the ramp
  meek: { fromStart: 0 }
  bold: { fromStart: 1 }
  fierce: { fromStart: 2 }
  savage: { fromStart: 3 }
  brutal: { fromStart: 4 }
  merciless: { fromStart: 5 }
  monstrous: { fromStart: 6 }
  # boss-room ranks — anchored to the band END
  endgame: { fromEnd: 0 }
  apex: { fromEnd: 2 }
  # HELLGATE crop (config HELLGATES) — the rampage-only horrors, above even the
  # boss's rung so they reach the loot tier gates the rest of the map never
  # does. That is the point: the gates are the farm a rampage buys.
  hellborn: { fromEnd: 3 }
  # the SPACEZ HQ onboarding opener: gentle on easy/nightmare, a deliberate bite
  # on medium/hard so standing still is never free once past the tutorial rung.
  vanguard: { fromStart: [0, 2, 4, 0] }

# ─── HP CURVES ───────────────────────────────────────────────────────────────
# A pinned elite/boss carries a single BASE hp (its easy value) in the level
# YAML; the loader scales it across the four difficulties by the named curve its
# map uses (see `pinnedHp`). `standard` is the campaign-wide curve; `gentle`
# keeps the SPACEZ HQ onboarding boss from spiking on the high rungs.
hpCurves:
  standard: [1, 1.5, 2.3, 6]
  gentle: [1, 1.4, 2, 3.5]
pinnedHp:
  default: standard
  spacez_hq: gentle

# ─── STAMINA DRAIN ───────────────────────────────────────────────────────────
# How fast a RUN spends the sprint pool on each rung, as a multiple of the
# engine's base rate (`STAMINA.drainPerSec`) — the one place the ladder's
# "how hard is it to keep moving here" is authored. JESUS is listed here (unlike
# the per-map cells above) because this is a pure difficulty knob, not a
# level-relative band.
#
# Judge a value by the SUSTAINABLE RUN DUTY CYCLE, never by "how long is one
# sprint": the pool only regains at a walk or a stand, so the share of time a
# hero can run without ever bottoming out is
#
#     runSecs / (runSecs + refillSecs + emptyRegenLockMs)
#
# with `runSecs = maxStamina / drain` and `refillSecs = maxStamina / regen` at
# his STAMINA stat. A real map measures the hero RUNNING 70–90% of the time
# (the balance sim's `run%`), so a rung whose duty cycle sits under that number
# is one where he runs dry — deliberately, on the high rungs.
#
# The ladder is built around ONE design target: **a build that spends about a
# fifth of its stat points on STAMINA gets a decent ride; one that spends none
# runs dry.** That gap is narrow early (20% of a level-5 hero's four points is a
# single point) and wide late, which is exactly the right shape — the low rungs
# are decided by the base rate, and the high rungs, where heroes are level 40+
# and builds have genuinely diverged, are where the multiplier bites:
#
#   rung        20% in STAMINA        no STAMINA at all
#   easy        74% → 97%             71%          — forgiving, but never free
#   medium      65% → 96%             62%          — the tuning baseline
#   hard        54% → 93%             50%          — investment plainly pays
#   nightmare   41% → 89%             38%          — invest or live winded
#   jesus       29% → 83%             26%          — the pool is a build decision
#
# (the invested column runs hero level 5 → 58; a rung's own hero band decides
# which end of it a player actually feels — nightmare opens at 42, JESUS past
# 55, so both are read from the right-hand end.)
#
# Measured against this ladder, a campaign's MEAN POOL FILL sits near 70% for
# the shipped builds — the pool is visibly working the whole way down rather
# than riding full, which is what makes STAMINA a stat worth points.
staminaDrain:
  easy: 0.8
  medium: 1
  hard: 1.35
  nightmare: 1.8
  jesus: 2.4

# ─── STAMINA REFILL ──────────────────────────────────────────────────────────
# The other half of the duty cycle: SECONDS a full standstill breather takes to
# refill the base pool on this rung — so the high rungs make catching your
# breath cost more of the fight, not just spend faster. Authored in seconds
# because that is the thing a player feels ("I have to stand for how long?");
# the engine turns it into a rate (`base pool ÷ these seconds`), and the STAMINA
# stat quickens it from there exactly as it always did (`regenPerPoint`) — a
# deep pool refills no slower than a shallow one, so investment shortens the
# breather as well as lengthening the sprint:
#
#   rung        breather at STAMINA 0 → 6 → 20     one full sprint, same three
#   easy        5.0s → 4.3s → 3.8s                 16s →  29s →  73s
#   medium      5.6s → 4.8s → 4.3s                 13s →  23s →  59s
#   hard        6.6s → 5.7s → 5.0s                  9s →  17s →  43s
#   nightmare   8.0s → 6.9s → 6.1s                  7s →  13s →  33s
#   jesus      10.0s → 8.6s → 7.6s                  5s →  10s →  24s
#
# MEDIUM's 5.6s is the historical baseline (the engine's old flat 18 points/s
# against the 100-point base pool), so the tuning the game was built at is
# unchanged on the rung it was tuned on.
staminaRefill:
  easy: 5
  medium: 5.6
  hard: 6.6
  nightmare: 8
  jesus: 10

# ─── STAMINA LOCKOUT ─────────────────────────────────────────────────────────
# SECONDS of UNINTERRUPTED STANDSTILL a hero owes after running the pool dry
# before regen resumes at all — the price of the mistake, and the harshest of
# the three ladders because it is dead time with the horde still coming. Any
# movement (even a walk) re-arms the whole window, so this is a genuine stop,
# not a slow jog. Together with the breather above it decides what ONE dry-out
# actually costs:
#
#   rung        lockout    one dry-out (lockout + full refill), STAMINA 0 → 20
#   easy         1.5s       6.5s → 5.3s
#   medium       2.0s       7.6s → 6.3s     (the historical 2 s window)
#   hard         2.6s       9.2s → 7.6s
#   nightmare    3.4s      11.4s → 9.5s
#   jesus        4.5s      14.5s → 12.1s
#
# Read it beside the mercy ladder: `staminaDrinkChanceMax` rains an energy
# drink on a bone-dry hero at 15% on easy and nothing at all on JESUS, so the
# rung that punishes a dry pool hardest is also the one that never bails him
# out of it.
staminaEmptyLock:
  easy: 1.5
  medium: 2
  hard: 2.6
  nightmare: 3.4
  jesus: 4.5

