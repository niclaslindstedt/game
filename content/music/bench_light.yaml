# Arrangement (92 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) b(8) a(8) hush(8) b(8) close(4)
#   = 48 bars ≈ 125 s per loop.
id: bench_light
name: BENCH LIGHT
description: >-
  A workshop at one in the morning with somebody competent in it — the
  hub, and the only score in the game with nothing hunting you. A
  syncopated bass hook carries it rather than a melody sitting on top, the
  mode is A DORIAN so the bright natural sixth is the note everything
  leans on, and every section ends one chord short of home and hands
  straight back to the vamp: it circles for two minutes, happily, and
  never resolves. There is no kit — the only percussion is a wrench set
  down and a tin knocked over, four bars apart and never on a downbeat.
  Original melodies; nothing sampled.
