# Arrangement (88 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   open(4) a(8) b(8) a(8) eye(8) b(8) close(4)
#   = 48 bars ≈ 131 s per loop.
id: rift_drift
name: NO NORTH
description: >-
  Weightless and homeless on purpose. There is no major or minor chord
  anywhere in this score — only augmented triads, which divide the octave
  into three equal parts so that no note in them is the root, and
  suspended chords, which are chords that have not decided. Two lines fall
  by semitones at different rates, one an octave every eight bars and one
  every four, so their restarts never line up and something is always
  partway down. And everything that strikes, strikes at 3+3+3+3+4 — four
  short steps and one that is one too long — so the bar never comes out
  even; only the drifting sine is free of the count, which is what makes
  it sound untethered rather than slow. Original melodies; nothing
  sampled.
