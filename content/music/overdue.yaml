# OVERDUE — compiled from a .song by scripts/song-import.mjs.
#
# Arrangement (162 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) a2(8) b(8) a(8) break(8) build(8) b(8) a2(8) turn(8)
#   = 76 bars ≈ 113 s per loop.
id: overdue
name: OVERDUE
description: >-
  The road's theme, and it is a panic rather than a chase. A D-minor drive
  with a Phrygian i–♭II lurch (Dm → E♭) that never settles, a galloping
  triangle bass under a chugging saw engine an octave above it, and a
  two-tone sawtooth SIREN wailing a minor second over the top — the same
  interval an emergency vehicle uses, and here it is a chord tone in both
  chords, so the distress signal is also the harmony. A dry clock ticks
  every quarter from the first bar to the last. The breakdown strips it to
  that clock, a re-struck pedal and the siren alone; the build climbs a
  bare chromatic bass D–E♭–E–F–F♯–G–G♯–A under a snare roll and hands back
  to the anthem. Shapes borrowed from the action scores of the era, every
  melody original.
bpm: 162
stepsPerBeat: 4
