# OVERDUE — the score for THE ROAD, both ends of it.
#
# Arrangement (162 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) a2(8) b(8) a(8) break(8) build(8) b(8) a2(8) turn(8)
#   = 76 bars ≈ 113 s per loop.
#
# THE CLOCK NEVER STOPS. The `tick` voice — a dry bandpassed click on every
# quarter — runs through every single pattern including the breakdown, where it
# is the loudest thing left. That is the whole idea of this score: the hero is
# late, he was late before he got in the car, and the one sound the arrangement
# never takes away is the one counting the time he does not have.
id: overdue
name: OVERDUE
description: >-
  The road's theme, and it is a panic rather than a chase. A D-minor drive
  with a Phrygian i–bII lurch (Dm → Eb) that never settles, a galloping
  triangle bass under a chugging saw engine, and a two-tone sawtooth SIREN
  wailing a minor second over the top — the same interval an emergency
  vehicle uses, and here it is a chord tone in both chords, so the distress
  signal is also the harmony. A dry clock ticks every quarter from the first
  bar to the last. The breakdown strips it to that clock, a held pedal and
  the siren alone; the build climbs a bare chromatic bass D–Eb–E–F–F#–G–G#–A
  under a snare roll and hands back to the anthem. Shapes borrowed from the
  action scores of the era, every melody original.
bpm: 162
stepsPerBeat: 4
instruments:
  # THE SIREN — the distress signal, and the score's signature. Sawtooth,
  # detuned, with a wide slow vibrato so a held note wavers like a wail rather
  # than sitting there like a pad.
  siren:
    wave: sawtooth
    volume: 0.021
    gate: 0.95
    detuneCents: 9
    vibrato:
      rateHz: 5.5
      depthCents: 22
      delayMs: 60
    echo: 0.26
  # The anxious lead: detuned square, quick shallow vibrato — a voice that
  # keeps starting the same phrase again because it cannot finish it.
  lead:
    wave: square
    volume: 0.028
    gate: 0.8
    detuneCents: 6
    vibrato:
      rateHz: 6.5
      depthCents: 12
      delayMs: 100
    echo: 0.2
  # The answer voice: doubles the lead an octave down through the anthem.
  harm:
    wave: square
    volume: 0.014
    gate: 0.8
    pan: 0.35
    echo: 0.16
  # Off-beat chord stabs, and the breakdown's broken-chord arpeggio.
  stab:
    wave: square
    volume: 0.013
    gate: 0.25
    pan: -0.32
  # THE ENGINE — a syncopated saw chug under everything, filtered down so it
  # is felt at the bottom of the mix rather than heard at the top of it.
  pulse:
    wave: sawtooth
    volume: 0.017
    gate: 0.5
    pan: 0.22
    filter:
      type: lowpass
      frequency: 1200
  # The gallop: triangle octaves in a dotted push, so the bass is running
  # rather than pumping.
  bass:
    wave: triangle
    volume: 0.056
    gate: 0.85
  # THE CLOCK — one dry bandpassed click a quarter, in every pattern there is.
  tick:
    wave: noise
    volume: 0.009
    gate: 0.12
    pan: -0.45
    filter:
      type: bandpass
      frequency: 3200
  # The kit: a pitch-diving triangle kick, band-limited snare, tight hat.
  kick:
    wave: triangle
    volume: 0.064
    gate: 1
    slide: 0.25
  snare:
    wave: noise
    volume: 0.036
    gate: 0.75
    filter:
      type: highpass
      frequency: 1500
  hat:
    wave: noise
    volume: 0.01
    gate: 0.25
    pan: 0.25
    filter:
      type: highpass
      frequency: 6800
