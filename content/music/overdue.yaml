# OVERDUE — compiled from a .song by scripts/song-import.mjs.
#
# Arrangement (162 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) climb(4) b(8) climb(4) turn(8)
#   = 36 bars ≈ 53 s per loop.
id: overdue
name: OVERDUE
description: >-
  The road's theme, and it is a panic rather than a chase — written short,
  to the length of a leg, so the whole arc lands before the car does. A
  D-minor drive with a Phrygian i–♭II lurch (Dm → E♭) that never settles,
  a galloping triangle bass under a chugging saw engine an octave above
  it, and a two-tone sawtooth SIREN wailing a minor second over the top —
  the same interval an emergency vehicle uses, and here it is a chord tone
  in both chords, so the distress signal is also the harmony. A dry clock
  ticks every quarter from the first bar to the last, and the first bar is
  the clock on its own: there is no breakdown in a fifty-second piece, so
  the intro is where it goes thin. Twice the arrangement changes gear on a
  four-bar chromatic climb in bare fifths, D up to A, the siren tightening
  across it — once into the chorus, once into the turn. Shapes borrowed
  from the action scores of the era, every melody original.
bpm: 162
stepsPerBeat: 4
