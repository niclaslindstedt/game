# PERPETUITY — compiled from a .song by scripts/song-import.mjs.
#
# Arrangement (112 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) b(8) a(8) cell(8) build(8) b(8) turn(8)
#   = 60 bars ≈ 129 s per loop.
id: perpetuity
name: PERPETUITY
description: >-
  A passacaglia in a vault. The lament tetrachord — C–B–B♭–A♭, down and
  down and back to the top — runs unbroken under every bar of the track,
  never transposed and never absent, because a passacaglia is a form that
  cannot leave and the ground bass is the room. Over it sits genuinely
  warm hotel muzak: a vibraphone, major sevenths, a plush swell, residents
  bragging in a cell at full confidence. Neither half acknowledges the
  other. And on the downbeat of every bar, quiet under the A section and
  alone in the breakdown, a lock. Original melodies; nothing sampled.
