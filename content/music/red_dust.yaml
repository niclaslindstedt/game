# THE TITHE — compiled from a .song by scripts/song-import.mjs.
#
# Arrangement (136 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) b(8) a(8) tithe_break(8) build(8) b(8) turn(8)
#   = 60 bars ≈ 106 s per loop.
id: red_dust
name: THE TITHE
description: >-
  Mars sells itself: a bright B♭-major brochure with a hook, glass
  sparkling two octaves above the pitch, a clicker on the off-beats and
  not one wink in the whole arrangement. Underneath it a drum lands every
  six sixteenths against a bar of sixteen — the landlords' tithe, walking
  across the presentation's 4/4 and agreeing with it once every three bars
  — and every section ends on a bare chromatic fall where the cadence
  should be. The break is that fall on its own: eight bars, one semitone
  each, the advert switched off and something cold-blooded counting down.
  Original melodies; nothing sampled.
