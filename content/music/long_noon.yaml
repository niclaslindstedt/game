# Arrangement (138 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) b(8) a(8) standoff(8) build(8) b(8) turn(8)
#   = 60 bars ≈ 104 s per loop.
id: long_noon
name: THE LONG NOON
description: >-
  A knockoff spaghetti western, played by robots. The genre's own gestures
  — a Dorian sixth over a minor chord, bare fifths, a tremolo guitar, a
  lonely trumpet answering itself across an empty street — laid over a
  bass that marches in a straight line and a kit that never rushes. The
  saloon piano is a detuned square hammering the off-beats and the tremolo
  is a sixteenth-note ostinato that never stops, because nothing here is
  played by anything that gets tired. Original melodies; nothing sampled.
