# AN HOUR BEHIND — compiled from a .song by scripts/song-import.mjs.
#
# Arrangement (176 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) slip(4) b(8) slip(4) turn(8)
#   = 36 bars ≈ 49 s per loop.
id: hour_behind
name: AN HOUR BEHIND
description: >-
  The road home, and it is not the relief version of OVERDUE — written to
  the same short length, so the fall reaches the bottom before the car
  stops. He has the part on the passenger seat and she left the planet an
  hour before he got through the door, so the deadline has not passed — it
  has become a distance. Every phrase is a call with the reply cut out:
  two bars of tune, two bars of nothing but engine and tarmac where the
  answer used to be, and the hole closes as the piece runs — two bars,
  then one, then none. The clock that runs through the whole of the
  outbound score is gone, replaced by a sonar ping that slides flat as it
  sounds, twice in four bars, off the grid, alone in the opening bar. The
  harmony falls Dm–C–B♭–A and never once lands, and twice a loop a
  four-bar hinge accelerates that fall to four chords a bar rather than
  climbing out of it — the same hinge the outbound score uses to climb.
  Original melodies; nothing sampled.
