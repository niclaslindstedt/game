id: title
name: MOONLIGHT VIGIL
description: >-
  A slow A-minor vigil in the 16-bit console tradition, and a sparse one:
  no pad holds the middle, so a breathy sine flute carries the lament an
  octave above a room with nothing in it but rippling pulse arpeggios and
  a plain triangle bass. A detuned square lead takes the relative-major
  chorus, and glassy echo bells keep watch through the breakdown. The
  harmonic language leans on the progressions classic game scores are
  built from — i–VI–iv–V verses, a I–V–vi–IV chorus lift — but the
  melodies are original; nothing is sampled or transcribed.
