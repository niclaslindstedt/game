# NIGHT SHIFT — compiled from a .song by scripts/song-import.mjs.
#
# Arrangement (128 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) b(8) a(8) break(8) build(8) b(8) turn(8)
#   = 60 bars ≈ 113 s per loop.
id: hq_lockdown
name: NIGHT SHIFT
description: >-
  GOODCO's own lobby loop, still playing at one in the morning while the
  night shift is killed in the doorways. Major-seventh corporate warmth on
  cold pulses over a hard kit — and every four bars the floor SINKS: bars
  5–7 are bars 1–3 a semitone down, the same tune played by a building
  that is a step lower than it was, with the dominant hauling it back up
  in time to do it again. The B section is the advert and does not sink,
  because the pitch works fine; it is the workplace under it that does
  not. Through all of it a photocopier clacks every three sixteenths
  against a bar of sixteen, landing somewhere new every bar, alone in the
  breakdown. Original melodies; nothing sampled.
