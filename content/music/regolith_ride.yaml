# Arrangement (144 bpm, 4/4, one bar = 16 sixteenth-note steps):
#   intro(4) a(8) b(8) a(8) void(8) build(8) b(8) a(8) turn(8)
#   = 68 bars ≈ 113 s per loop.
id: regolith_ride
name: QUIET SEA
description: >-
  The moon, and the graveyard nobody declared. A pure sine holds one G
  through the entire track while the harmony moves underneath it — fifth,
  major seventh, ninth, root, and once, in the void section, a tritone —
  so a note that never changes means something different in every bar. The
  ground moves one chord every two bars while the bass gallops and the kit
  runs sixteenths under it: sprinting in a sixth of a gravity, getting
  nowhere. The B section is a plain, dignified hymn for a man who never
  went home, and it ends a whole tone under the drone and grinds there.
  Original melodies; nothing sampled.
