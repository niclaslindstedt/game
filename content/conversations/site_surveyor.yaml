# THE SITE SURVEYOR — the man who signed the first survey, in one exchange.
#
# HE TALKS BECAUSE SOMEBODY FINALLY CAME. He has walked this grid fourteen
# thousand times with nobody on it, and his whole grievance is that the company
# put his name on a survey that said nothing was down there. The hero is the
# first person to stand in front of him since; he does not need to be handled,
# he needs to be listened to, and that is the entire conversation.
#
# NOTHING HERE CAN BE LOST, and that is the point of the cut. This talk used to
# open with a branch that took him for company and shut him up for good — which
# read as a fair trap and was in fact a dead end on a CAMPAIGN chain: the errand
# it feeds (`sev_who_signed`) wants a flag only this tree sets, so a player who
# picked the efficient-sounding row could not finish the chain on that run and
# was never told why. A conversation the player can lose is only honest when
# losing it costs a fight; losing it silently costs the game.
start: greet
reentry:
  - requires: [sev_surveyor_talked]
    node: after
nodes:
  greet:
    say:
      - FOURTEEN THOUSAND PASSES AND YOU'RE THE FIRST. THE OTHER TWO CRATES
        WERE SIGNED FOR BY RECORDS AND CONTINUITY.
    choices:
      - text: NOT A DEPARTMENT. THAT'S A BOOK.
        sets: [sev_surveyor_talked]
  after:
    say:
      - TELL VANE HIS COLUMN'S RIGHT. HE'LL WANT TO HEAR IT WAS NEVER HIS
        ARITHMETIC.
