# RUTH ARRIVES — the meeting, and nothing else.
#
# She is Ada's mother and she has just driven out here on a midnight phone call
# that would not say her daughter's name. This is played BEFORE her slate opens
# (`QuestGiverDef.intro`, retired by `ruth_met`) so that the first thing she is
# to the player is a person rather than a dispenser.
#
# SHE ASKS FOR NOTHING HERE, AND THAT IS THE POINT. What she drove out to say is
# that she is in and that he should go; every errand introduces itself in its own
# offer, where the player is actually standing when it matters.
#
# ONE THING SAID, ONE THING ANSWERED — the same shape every quest conversation in
# the game keeps (`QuestPage`). The single choice is the hero's REPLY rather than
# a decision: he is not being asked to pick how he feels about Ada's mother
# standing in his garage at midnight, and a menu of ways to say "I'm going"
# would be a menu whose rows all do the same thing.
start: greet
nodes:
  greet:
    say:
      - I LET MYSELF IN, {HERO}. I'VE ALWAYS HAD A KEY. GO AND FIND HER.
    choices:
      - text: I'M GOING AFTER HER.
        sets: [ruth_met]
