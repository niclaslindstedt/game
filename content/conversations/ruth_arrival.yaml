# RUTH ARRIVES — the meeting, and nothing else.
#
# She is Ada's mother and she has just driven out here on a midnight phone call
# that would not say her daughter's name. This is played BEFORE her slate opens
# (`QuestGiverDef.intro`, retired by `ruth_met`) so that the first thing she is
# to the player is a person rather than a dispenser.
#
# SHE ASKS FOR NOTHING HERE, AND THAT IS THE POINT. An earlier draft spent nine
# nodes setting up the errands she would hand over later, and the meeting read
# as a menu with a preamble. Two beats — she is in, and he should go — is the
# whole of what she drove out to say; every errand introduces itself in its own
# offer, where the player is actually standing when it matters.
start: greet
nodes:
  greet:
    say:
      - I LET MYSELF IN, {HERO}. I'VE ALWAYS HAD A KEY. YOU NEVER ASKED FOR IT BACK.
      - GO AND FIND HER. I'LL BE HERE.
    choices:
      - text: I'M GOING AFTER HER.
        sets: [ruth_met]
