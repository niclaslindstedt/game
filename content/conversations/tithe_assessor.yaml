# THE TITHE ASSESSOR — the conversation you have to LOSE on purpose, in one
# exchange.
#
# IT WEARS THE SEAL AND IT WILL NOT TAKE IT OFF, so there was never a branch
# that talked it out of one: what there is instead is an auditor that cannot
# leave an error in its own arithmetic. Tell it the count has been short since
# the moon and it has to settle the count, which is a fight. The hero has to
# decide to start one with something that has been perfectly polite to him, and
# that is the only reason the beat lands at all.
#
# THAT DECISION IS THE TAP, NOT A MENU ROW. The talk waits for a deliberate tap
# on a bystander (`talkPrompt`) and the errand that sends the hero here says in
# as many words that the seal only comes off one way — so opening this
# conversation IS the choice, and everything after it is the hero saying the one
# thing he came to say. A tree that offered him three ways to phrase it, and one
# way to back out, was three rows the player had to read to find the row the
# quest had already told them to pick.
start: greet
nodes:
  greet:
    say:
      - GOOD DAY. I AM ASSESSING. THE TITHE IS PAID QUARTERLY AND HAS NEVER
        BEEN SHORT. I AM PROUD OF THAT.
    choices:
      - text: IT'S BEEN SHORT SINCE THE MOON. TWO WARM CRATES.
        provoke: true
