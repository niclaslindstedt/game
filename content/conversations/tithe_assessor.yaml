# THE TITHE ASSESSOR — the conversation you have to LOSE on purpose.
#
# It wears the seal and it will not take it off, so there is no branch that
# talks it out of one; what there is instead is an auditor that cannot leave an
# error in its own arithmetic. Tell it the count is short and it has to settle
# the count, which is a fight. The hero has to decide to start one with
# something that has been polite to him throughout, which is the only reason
# the beat lands at all.
start: greet
reentry:
  - requires: [sev_assessor_knows]
    node: knows
nodes:
  greet:
    say:
      - GOOD DAY. I AM ASSESSING.
      - YOU ARE NOT LISTED AS
      - COLONY PROPERTY, SO YOU ARE
      - NOT MY CONCERN.
      - PLEASE CONTINUE PAST ME.
    choices:
      - text: WHAT ARE YOU COUNTING?
        goto: counting
      - text: WHAT'S THE SEAL FOR?
        goto: seal
      - text: NOTHING. CARRY ON.
  counting:
    say:
      - THE TITHE. WHAT THIS COLONY
      - OWES ITS LANDLORDS.
      - IT IS PAID QUARTERLY AND IT
      - HAS NEVER BEEN SHORT.
      - I AM RATHER PROUD OF THAT.
    choices:
      - text: PAID IN WHAT?
        goto: warm
      - text: WHAT'S THE SEAL FOR?
        goto: seal
  warm:
    say:
      - IN WHATEVER IS NAMED ON THE
      - SCHEDULE.
      - THE SCHEDULE NAMES WARM
      - THINGS NOW. IT DID NOT USED
      - TO. I DO NOT SET THE SCHEDULE.
      - I ONLY MAKE THE COUNT COME OUT.
    choices:
      - text: SOMEONE I WANT IS ON THAT LIST.
        sets: [sev_assessor_knows]
        goto: knows
      - text: WHAT'S THE SEAL FOR?
        goto: seal
  seal:
    say:
      - IT IS WHOSE COUNT IT IS.
      - WITHOUT IT THE COUNT IS
      - MERELY A NUMBER SOMEBODY
      - WROTE DOWN.
      - IT DOES NOT COME OFF.
      - I HAVE BEEN ASKED.
    choices:
      - text: I'LL BUY IT.
        goto: refuse
      - text: YOUR LAST COUNT WAS SHORT.
        goto: short
      - text: FAIR ENOUGH.
  refuse:
    say:
      - IT IS NOT MINE TO SELL.
      - NOTHING HERE IS MINE.
      - THAT IS RATHER THE WHOLE
      - ARRANGEMENT.
    choices:
      - text: YOUR LAST COUNT WAS SHORT.
        goto: short
      - text: I SEE.
  short:
    say:
      - "..."
      - THAT IS NOT POSSIBLE.
      - STATE THE QUARTER.
    choices:
      - text: ALL OF THEM. SINCE THE MOON.
        provoke: true
      - text: THE ONE WITH TWO WARM CRATES.
        provoke: true
      - text: I'M MISTAKEN. FORGET IT.
        goto: greet
  knows:
    say:
      - THE SCHEDULE IS NOT A LIST
      - OF PEOPLE. IT IS A LIST OF
      - AMOUNTS.
      - IF SOMEONE YOU KNOW IS ON IT,
      - THEY ARE ON IT AS AN AMOUNT.
      - I AM SORRY. THAT IS THE
      - CORRECT WORD AND I HAVE
      - NEVER HAD TO USE IT BEFORE.
    choices:
      - text: YOUR LAST COUNT WAS SHORT.
        goto: short
      - text: "..."
