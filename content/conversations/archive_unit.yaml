# THE ARCHIVE UNIT — the countersignature, in one exchange.
#
# ONE THING SAID AND ONE THING ANSWERED, like every other conversation in the
# game. It states what the form is missing; the hero says the only true thing
# there is to say about it; it stamps. There is no quiz, no wrong answer and no
# way to leave without the form — a records terminal that interrogates the
# player is a records terminal the player can lose to, and losing to a filing
# cabinet is not a beat, it is a wall.
#
# THE REVEAL IS STILL THE WHOLE POINT and it survives the cut intact, because it
# was never in the number of questions: the form wants the ASSET that superseded
# a man, and the asset cannot be named, because it is not a name. The hero is
# the one who says so. That is the line the chain is built on and it is now the
# first thing out of his mouth rather than the third thing he guessed right.
start: greet
reentry:
  - requires: [sev_archive_stamped]
    node: done
nodes:
  greet:
    say:
      - RECORDS TERMINAL. NO RECORD CLOSES WITHOUT A COUNTERSIGNATURE, AND
        4,411 WANTS THE ASSET THAT SUPERSEDED IT.
    choices:
      - text: IT ISN'T A NAME. IT'S A LINE ITEM.
        sets: [sev_archive_stamped]
        gives: { quest: sev_countersign, item: countersigned_form }
  done:
    say:
      - RECORD 4,411 IS CLOSED. THERE ARE FOUR THOUSAND FOUR HUNDRED AND
        TEN MORE. I WILL BE HERE.
