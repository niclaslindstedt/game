#
# THE ATTITUDE INDICATOR — the middle of the console, and the instrument the
# whole minigame is played off: which way the ship is falling over, and how far
# gone it is.
#
# TWO BARS FROM A CENTRE, not a dial. A lean is a SIGNED reading and a dial's
# arc is not: this draws the ship's glyph between two bars that fill OUTWARD
# toward the side the ship is tipping (`rocket.leanPortFrac` /
# `rocket.leanStarFrac`, each 0..1 of the FLIP — full is the explosion), so
# the correction the thumb owes is literally the direction the light is
# spreading. The colour ladder is a judgement and lives in Lua: calm through
# the safe band, amber past the engine's warning line, red when the next
# second decides it.
#
# The caption under it is the alarm's own voice — BALANCE, until the warning
# line is crossed, and then the one word this cockpit shouts.
region: rocket_dash
order: 1
kind: panel
class: rocket-lean
children:
  - id: lean_row
    kind: panel
    class: rocket-lean-row
    children:
      # The PORT bar fills right-to-left (`.rocket-lean-port` mirrors it), so
      # both bars grow away from the ship in the middle.
      - id: lean_port
        kind: bar
        class: rocket-lean-bar rocket-lean-port
        bind: rocket.leanPortFrac
        fill:
          class: rocket-lean-fill
      - id: lean_ship
        kind: icon
        class: rocket-lean-ship
        sprite: ship_0
      - id: lean_star
        kind: bar
        class: rocket-lean-bar
        bind: rocket.leanStarFrac
        fill:
          class: rocket-lean-fill
  - id: lean_caption
    kind: text
    class: rocket-lean-caption
    text:
      script: rocket.lean_label
    scale: 1
    color:
      script: rocket.lean_color
