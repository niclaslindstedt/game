#
# THE ALTITUDE DIAL — mission control's right hand, the velocity dial's twin.
#
# THE FACE CHANGES MEANING AT ORBIT, and says so in its own unit: miles of
# climb on the way up (100 is the orbit, and the top of the sweep), then
# the drop's own countdown — height left over the regolith — on the way down,
# where the arc runs the other errand: full at release, empty on the ground.
# One dial, two trips, and the unit under the figure (`rocket.alt_unit`) is
# what keeps the player from misreading the hand-over.
region: rocket_dash
order: 2
kind: panel
class: drive-dial
children:
  - id: alt_arc
    kind: gauge
    class: drive-dial-ring
    bind: rocket.altFrac
    sweep: 250
    start: 235
    thickness: 3.5
    color:
      script: rocket.alt_color
    track: "#1b2431"

  - id: alt_face
    kind: panel
    class: drive-dial-face
    children:
      - id: alt_number
        kind: text
        bind: rocket.altitude
        scale: 3
        color:
          script: rocket.alt_color
      - id: alt_unit
        kind: text
        text:
          script: rocket.alt_unit
        scale: 1
        color: "#7d8899"

  # THE FOOT NAMES THE SKY, not the half. Which half is being flown is already
  # on the face — the unit under the figure changes at the hand-over, and the
  # mission strip's marker says it again across the top. What no instrument
  # said is the thing this dial is actually FOR: which neighbourhood of the
  # climb the ship is in, and therefore what is about to be in the way
  # (`SKY_LAYERS`). On the drop there is no sky to name and it reads THE DROP.
  - id: alt_zone
    kind: text
    class: drive-dial-foot
    bind: rocket.zone
    scale: 1
    color: "#7d8899"
