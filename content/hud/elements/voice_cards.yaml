#
# WHO IS TALKING — a card per speaker in voice chat: their own dressed
# paper-doll bust, their roster name, a live waveform so one person whispering
# and another shouting are visibly different, and a line saying which. A press
# mutes them, locally and unsent.
#
# LAST ON THE LEFT RAIL, under the party frames whose portraits it echoes and
# under the trade asks. That order is deliberate: voice cards come and go
# constantly while an ask is rare and needs answering, so an arriving card must
# not push something urgent off the edge.
#
# Empty on every run without voice — a build with no `voice` capability, a
# machine with no microphone, a player who turned it off, and every single-player
# game — so it costs those runs nothing to leave in place, exactly as the party
# frames cost a solo run nothing.
#
# ---------------------------------------------------------------------------
# ITS PARTS ARE DRAWN ONCE PER SPEAKER, which is the thing worth understanding
# here and the reason a unit frame is authorable at all.
#
# The widget draws the LIST — who is on it, their composited bust, the waveform's
# pixels — because none of that is expressible as boxes. Everything a card SAYS
# is below, resolved once per card with that speaker's own values in scope:
# `speaker.peak`, `speaker.muted`, `speaker.name` and the rest (`mod/catalog.json`
# → `hudRowBindings`). So a mod can re-word the status line, re-grade what counts
# as shouting, shrink the waveform or drop it, without the app knowing.
#
# The press carries no seat: `muteSpeaker` takes the seat of the row it was drawn
# in, so one authored press serves every card on the rail.
#
# The cards are sized for a DESKTOP window rather than the phone reference the
# rest of the HUD obeys, which is safe only because voice is gated on a
# capability only the desktop shell is stamped with. See
# `pwa/src/game/hud/widgets/VoiceCards.tsx`.
region: left
order: 4
kind: widget
widget: voiceCards
# THE CARD'S OWN CLASSES, resolved for each speaker — so the border, the glow
# and the dimming follow the same ladder the words and the waveform do, and a
# mod that re-grades "shouting" moves all four together.
class: voice-card
classes:
  shouting:
    script: voice.is_shouting
  muted: speaker.muted
  unheard: speaker.unheard
press:
  action: muteSpeaker
children:
  # THE NAME, which is what identifies a speaker — a card whose bust could not be
  # composited yet (a seat this client holds no body for) still has this.
  - id: name
    kind: text
    bind: speaker.name
    scale: 2
    color:
      script: voice.name_color

  # THE WAVEFORM: a mirrored loudness strip, oldest at the left, painted by the
  # widget from the room's own history ring. A canvas rather than a row of divs
  # because it redraws thirty times a second per speaker.
  - id: wave
    kind: canvas
    class: voice-card-wave
    width: 96
    height: 16
    color:
      script: voice.wave_color

  # WHAT THIS CARD IS DOING, in a word — muted, unheard, whispering, shouting, or
  # nothing at all for ordinary speech. The judgement is Lua because it is one:
  # four states with a precedence between them and two thresholds behind it.
  - id: status
    kind: text
    scale: 2
    text:
      script: voice.status_text
    color:
      script: voice.status_color

  # THE PLAYER'S OWN CARD, last and plainer: confirmation that the key is doing
  # something, which is the one thing a push-to-talk player cannot otherwise
  # know. No portrait — they know who they are — and no mute, because that is
  # what letting go of the key is.
  - id: self_name
    kind: text
    text: "YOU"
    scale: 2
    color: "#7cff9b"

  # THE MICROPHONE IS BROKEN, which is the one thing here that has to be said out
  # loud: a player whose voice is dead has to be told, and the run is where they
  # will be when it breaks.
  - id: fault_title
    kind: text
    text: "VOICE OFF"
    scale: 2
    color: "#ff9b9b"
  - id: fault_reason
    kind: text
    bind: voice.fault
    scale: 2
    color: "#9aa3ad"
