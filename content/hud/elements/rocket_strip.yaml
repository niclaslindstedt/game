#
# THE MISSION TIMELINE — the launch feed's event strip, across the top of the
# picture: the trip as five stations and a marker crawling through them.
#
# FIVE, AND NOT THE SIX THIS SCREEN CAN REACH. THE DROP used to stand between
# ORBIT and TOUCHDOWN, and it is not a station on this flight at all: the
# descent is its own sitting at the cabinet with a cutscene between the two, so
# the strip was advertising a leg that could not be flown from here and holding
# a whole fifth of the bar open for it. The marker jumped that gap in one cut,
# which is exactly how it looked. What is left is the climb's own four legs and
# the moon at the end of them.
#
# THE MARKER IS STAGED (`rocket.progress`, rocket-screen/dials.ts): each leg of
# the trip is mapped onto its own quarter of the bar, so the five evenly spaced
# labels below it are TRUE — the marker crosses a station's label exactly as
# the ship crosses the station. Each label lights as it is reached (a
# judgement, so it is Lua), and the strip's right-hand end carries the one
# tally mission control keeps that no instrument shows: the trash met
# hull-first on the way up.
region: rocket_strip
order: 0
kind: panel
class: rocket-strip-box
children:
  - id: strip_bar
    kind: bar
    class: rocket-strip-bar
    bind: rocket.progress
    fill:
      class: rocket-strip-fill
  - id: strip_labels
    kind: panel
    class: rocket-strip-labels
    children:
      - id: evt_liftoff
        kind: text
        text: LIFTOFF
        scale: 1
        color:
          script: rocket.evt_liftoff_color
      - id: evt_shell
        kind: text
        text: JUNK SHELL
        scale: 1
        color:
          script: rocket.evt_shell_color
      - id: evt_clear
        kind: text
        text: ALL CLEAR
        scale: 1
        color:
          script: rocket.evt_clear_color
      - id: evt_orbit
        kind: text
        text: ORBIT
        scale: 1
        color:
          script: rocket.evt_orbit_color
      - id: evt_down
        kind: text
        text: TOUCHDOWN
        scale: 1
        color:
          script: rocket.evt_down_color
  - id: strip_trash
    kind: text
    class: rocket-strip-trash
    text:
      script: rocket.trash_label
    scale: 1
    color: "#7d8899"
