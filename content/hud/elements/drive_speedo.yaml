#
# THE SPEEDOMETER — the big dial in the middle of the dashboard, with the
# TACHOMETER drawn inside it.
#
# TWO ARCS ON ONE FACE, and that pairing is the whole reading. The outer sweep
# is road speed against the wagon's top end and it climbs steadily; the inner
# one is the crank, and it climbs, SNAPS BACK on every upshift, and climbs
# again. Seeing the two together is what tells a player what the box just did
# without a word of tutorial — and it is the same rpm the engine note is built
# from (`pwa/src/game/sfx/drive.ts`), so the needle and the noise cannot
# disagree.
#
# THE TACHOMETER'S FACE RUNS TO THE REDLINE AND THE NEEDLE NEVER GETS THERE, and
# that is the point rather than an oversight. The box changes up at sixty-three
# hundred of a seven thousand redline (`src/game/drive/drivetrain.ts`) and fifth
# runs out of road speed at about six thousand one, so the crank works in the top
# third of the dial when the car is being driven properly and still never
# touches the paint. The red at the end is PAINT (`zone:`), printed on the
# instrument the way it is on a real one: it is there with the engine off, and it
# says where the trouble would be rather than where it is. A tachometer whose
# scale ended at the shift point, with the needle slamming into it eight times a
# minute, is what this dial used to be and what nothing on any road does.
#
# WHERE THE ARC GOES AMBER is a judgement rather than a read, so it lives in
# `hud/scripts/drive.lua` and a mod can move it — the warning worth having is
# the approach to the UPSHIFT (`drive.shiftFrac`), which is the one thing about
# to happen.
region: drive_dash
order: 0
kind: panel
class: drive-dial
children:
  # THE OUTER ARC: how fast. A 250° sweep opening at the lower left, which is
  # the arc a real needle travels — a full ring reads as a progress wheel, and
  # the gap at the bottom is what makes this one read as a dial.
  - id: speed_arc
    kind: gauge
    class: drive-dial-ring
    bind: drive.speedFrac
    sweep: 250
    start: 235
    thickness: 3.5
    color:
      script: drive.speed_color
    track: "#1b2431"

  # THE INNER ARC: the revs against the redline, on the same sweep so the two
  # can be read against each other at a glance. The last sixteenth of the face is
  # painted red — from 6580 rpm of a 7000 dial, which is above both the shift
  # point (6300) and the revs fifth tops out at (about 6100), so the needle gets
  # near the paint at every upshift and into it at none.
  - id: rev_arc
    kind: gauge
    class: drive-dial-ring drive-dial-ring-inner
    bind: drive.rpmFrac
    sweep: 250
    start: 235
    thickness: 3
    color:
      script: drive.rpm_color
    track: "#161d28"
    zone:
      from: 0.94
      color: "#4a1d24"

  # …and the face inside them: the number and its unit.
  - id: speed_face
    kind: panel
    class: drive-dial-face
    children:
      - id: speed_number
        kind: text
        bind: drive.mph
        scale: 3
        color:
          script: drive.speed_color
      - id: speed_unit
        kind: text
        text: MPH
        scale: 1
        color: "#7d8899"

  # THE REV COUNTER'S FIGURE, DOWN IN THE GAP. A 250° sweep leaves 110° of open
  # air at the bottom of the dial, and that is exactly where a rev figure goes:
  # inside the face it crowded the speed and struck both arcs on the way past,
  # and there is nothing else this piece of the dial is for.
  - id: rev_number
    kind: text
    class: drive-dial-foot
    text:
      script: drive.rpm_label
    scale: 1
    color:
      script: drive.rpm_color
