#
# THE DAMAGEOMETER — what the trip has cost the wagon, at the dashboard's right
# hand and built as a dial rather than a line of text, so it reads against the
# speedometer beside it: two arcs, one of them filling up as the other one is
# enjoyed.
#
# THE SAME DIAL AS THE SPEEDOMETER, to the pixel — same size, same 250° sweep
# from the same lower-left opening, same big figure in the middle and same word
# down in the gap. Two dials that were nearly alike read as a mistake; two that
# are exactly alike read as a dashboard, and the player learns one shape and
# uses it twice.
#
# What differs is the direction of the sentiment: a full sweep on the left is
# the best the wagon has, and a full sweep here is a wrecked car. Where it stops
# being a scratch and starts being trouble is a judgement rather than a read, so
# it is Lua (`hud/scripts/drive.lua`) and a mod can move it: a harder road might
# redden at half, a gentler one only at the very end.
region: drive_dash
order: 2
kind: panel
class: drive-dial
children:
  # THE EMPTY RING FIRST, on its own node. It would ordinarily be the `track:` of
  # the arc that sits on it — but the fresh slice below GLOWS, and a filter
  # applies to a whole element, so the hit's halo was coming off the dark ring
  # as well and lighting the entire dial. So the ring is drawn once here, and
  # the two live arcs above it carry no track at all.
  - id: damage_ring
    kind: gauge
    class: drive-dial-ring
    bind: drive.wear
    sweep: 250
    start: 235
    thickness: 3.5
    color: "#00000000"
    track: "#1b2431"

  # THE HIT YOU JUST TOOK, drawn FIRST and therefore underneath: the arc swept
  # all the way to the live figure, in a colour that means "this is new". It is
  # the XP strip's kill heat wearing the other hat — damage on this road creeps
  # up a point at a time while the player is watching the crowd, and a
  # percentage one point higher than it was is a percentage nobody notices.
  - id: damage_fresh
    kind: gauge
    class: drive-dial-ring drive-dial-ring-fresh
    bind: drive.wear
    sweep: 250
    start: 235
    thickness: 3.5
    color:
      script: drive.fresh_color
    track: "#00000000"

  # …and the settled damage OVER it, stopping short of the fresh slice for as
  # long as the slice is lit and then gliding up to cover it. Its own track is
  # transparent — a second opaque ring here would paint the highlight out before
  # anybody saw it.
  - id: damage_arc
    kind: gauge
    class: drive-dial-ring drive-dial-ring-settle
    bind: drive.wearSettled
    sweep: 250
    start: 235
    thickness: 3.5
    color:
      script: drive.damage_color
    track: "#00000000"
  - id: damage_face
    kind: panel
    class: drive-dial-face
    children:
      # THE FIGURE IS THE LIVE DAMAGE, and it does NOT wait for the arc.
      #
      # It read `drive.wearSettled` first, on the theory that a number snapping
      # while its own ring glided would read as two readouts disagreeing. In the
      # hand it reads as something worse: the figure is the part of this dial a
      # player actually checks, and holding it for the second the fresh slice is
      # lit meant a collision he had just felt through the wheel showed up on the
      # dashboard a beat and a half after he had stopped looking. What the two
      # rings are for is showing WHAT THE LAST SECOND COST — the fresh arc is
      # already the whole answer to "which part of this is new" — so the number
      # is free to be the plain, immediate truth about the car, which is the one
      # question it is ever asked.
      - id: damage_number
        kind: text
        bind: drive.wear
        format: percent
        scale: 3
        color:
          script: drive.damage_color

  # …and the word down in the gap, where the speedometer keeps its revs. It is
  # the one that CHANGES: a wagon past the point where the next real hit ends
  # the trip stops saying what it is measuring and starts saying what is about
  # to happen.
  - id: damage_caption
    kind: text
    class: drive-dial-foot
    text:
      script: drive.damage_label
    scale: 1
    color:
      script: drive.damage_color
