#
# THE HUD'S FRAME — the boxes every element sits in.
#
# Compiled by `make levels` (scripts/generate-hud.mjs) into the gitignored
# `pwa/src/generated/hud.ts`, which `pwa/src/game/hud/` renders. A MOD ships
# this same file in its own `hud/` folder and the regions merge by id, later
# wins — so a mod can restyle the portrait plate, hang a new rail off the left
# column, or move the minimap without restating the rest of the HUD.
#
# ---------------------------------------------------------------------------
# A REGION
#
#   parent:   the region this one nests inside. A region with none is a TOP
#             LEVEL box, drawn as a sibling of the others in `order` — which is
#             how the docks sit outside `.game-hud` instead of inside it.
#   order:    where it sits among its siblings. Regions and ELEMENTS share one
#             ordering inside a parent, so an element can be authored between
#             two regions.
#   class:    the CSS class its box wears. The stylesheet is the app's
#             (pwa/src/styles.css); content chooses which of its classes to
#             wear, and a mod that needs a look the stylesheet has no class for
#             uses `style:` (a short, bounded set of properties — see the
#             schema) rather than shipping CSS.
#   wrap:     `div` (the default) draws a box; `none` draws nothing at all and
#             renders its children in place. `none` is for a GROUP that exists
#             only to be ordered — the docks, each of which already draws its
#             own full-screen furniture.
#   frame:    a sprite drawn as the box's 9-slice border (the sci-fi plate
#             behind the portrait). Replaced like any other sprite — including
#             by a PNG a mod drew somewhere else.
#   visible:  a flag binding, `!flag`, a list of them, or a { script: } — the
#             box and everything in it are on screen only while it holds.
#
# THE ONE RULE THAT BITES: `.game-hud` and everything under it is gated on
# `hud.fieldLive` — "my hero is on the field and I have nothing open". That is
# not decoration. A HUD drawn over the bag screen would eat the presses meant
# for it, and a HUD drawn over a cutscene is the interruption the scene exists
# to avoid.

regions:
  # The playing HUD proper: the top chrome, drawn only while the field is live.
  hud:
    order: 0
    class: game-hud
    visible: hud.fieldLive

  # The top row: the left status column and the right minimap column.
  top:
    parent: hud
    order: 1
    class: hud-top

  # THE LEFT RAIL — the one screen edge with no absolute competitor, and well
  # clear of the steering thumb's bottom thirds. The framed status unit, then
  # the companion portraits, the party frames and the trade asks under it.
  left:
    parent: top
    order: 0
    class: hud-left

  status:
    parent: left
    order: 0
    class: hud-status

  # The portrait and the vitals share ONE framed plate so the two read as a
  # single unit — the bust at left, the colour bars nested at its right.
  portrait:
    parent: status
    order: 0
    class: hud-portrait-unit
    frame: hud_frame

  # The vitals stack: red HP over a shorter white stamina sliver. Same width,
  # butted together; the colour IS the label.
  vitals:
    parent: portrait
    order: 1
    class: vital-stack

  # Below the portrait unit, floating free: the round slots — the held weapon,
  # the bag pouch, the quest log, the points pip.
  gear:
    parent: status
    order: 1
    class: hud-gear-row

  # THE MINIMAP HUB, top right: the fog-of-war map with the run's edge widgets
  # hung off it, and the AUTO PILOT panel tucked under it.
  clock:
    parent: top
    order: 1
    class: hud-clock-stack

  # The bottom furniture. `wrap: none` because each of these draws its own
  # full-screen layer already — a box around them would be a second one.
  docks:
    order: 1
    wrap: none

  # THE SCOREBOARD, held up over the middle of the field — QuakeWorld's TAB
  # board. Its own top-level region rather than a corner of `hud`, for two
  # reasons: it is centred on the whole screen instead of hanging off a rail,
  # and it is gated on the player HOLDING it up rather than on the field being
  # live, so it stays readable through a level-up, a bag or a pause.
  #
  # Tap-transparent (`.hud-scores`): a board that appears under a held key must
  # never eat the steering thumb underneath it.
  scores:
    order: 2
    class: hud-scores
    visible: ui.scoreboard

  # ---------------------------------------------------------------------------
  # THE ROAD — the drive minigame's dashboard, its own surface.
  #
  # A separate screen mounts it (`DriveScreen`), so it is a top-level region
  # with `surface: drive` rather than a corner of the fight's HUD. Everything
  # else about it is the same: the dials are elements, the plate behind each one
  # is the same 9-sliced HUD frame sprite the vitals wear, and a mod re-skins
  # the dashboard exactly as it re-skins the fight.
  drive:
    surface: drive
    order: 0
    wrap: none

  # THE DASHBOARD, along the BOTTOM of the windscreen (`.drive-dash`) — which is
  # where a dashboard is. The dials sat across the top for as long as they were
  # two words on a plate, and a plate can live anywhere; a speedometer cannot,
  # because a driver reads it by dropping his eyes rather than by looking up.
  #
  # Tap-transparent (the whole picture is the steering pad, and a dial must
  # never eat the thumb), and centred rather than pushed into the corners: the
  # steering thumb lands where it lands, and the far bottom corners are the two
  # places it is most likely to be.
  # AND IT IS NOT THERE FOR THE OPENING. The leg starts on an empty road out of
  # town with the pedal capped and nothing being scored, and three instruments
  # reporting that nothing is happening spend the one thing that stretch has.
  # The whole region is gated on `drive.dashLive` — so it MOUNTS a short way
  # before the town (`DRIVE.opening.dashAtPx`) and slides in from the left off
  # its own mount, which is why the animation lives on `.drive-dash` and there
  # is no second flag here saying "sliding".
  drive_dash:
    parent: drive
    order: 0
    class: drive-dash
    visible: drive.dashLive

  # THE CLOCK, top right — the CABINET's corner rather than the car's.
  #
  # Its own region beside the dashboard rather than a dial on it, because it is
  # not an instrument the wagon has: a stopwatch is the machine keeping score
  # over the top of the picture, which is where an arcade game has always put
  # one and is the opposite end of the screen from where a driver looks. It is
  # gated on the leg having reached the town at all (`drive.clockStarted`, on
  # the element itself), so the opening plays with nothing over it.
  #
  # Tap-transparent like everything else on this surface: the whole picture is
  # the steering pad, and a readout must never eat the thumb.
  drive_clock:
    parent: drive
    order: 1
    class: drive-clock-slot

  # ---------------------------------------------------------------------------
  # THE FLIGHT — the rocket minigame's mission control, its own surface.
  #
  # THE LOOK IS A LAUNCH WEBCAST'S, in this game's own skin: twin dials along
  # the bottom (speed and altitude) with the hull bar and the attitude
  # indicator between them, a T+ clock in the cabinet's corner, and a mission
  # timeline strip across the top with the trip's six events on it. A separate
  # screen mounts it (`RocketScreen`); a mod re-skins mission control exactly
  # as it re-skins the wagon's dashboard.
  rocket:
    surface: rocket
    order: 0
    wrap: none

  # THE CONSOLE, along the bottom — the dashboard position, and the dashboard
  # rules: tap-transparent (the whole picture is the flying thumb), centred,
  # gated on the hand-over (`rocket.dashLive`) and sliding in off its own
  # mount, which is why it wears the road's own `.drive-dash` animation class.
  rocket_dash:
    parent: rocket
    order: 0
    class: drive-dash rocket-dash
    visible: rocket.dashLive

  # THE MISSION TIMELINE, across the TOP — the launch feed's event strip:
  # LIFTOFF → JUNK SHELL → ALL CLEAR → ORBIT → THE DROP → TOUCHDOWN, with the
  # marker riding `rocket.progress` (staged so the evenly spaced labels read
  # true). The top because the bottom is the console's, and because it is the
  # machine narrating the trip rather than an instrument the ship has.
  rocket_strip:
    parent: rocket
    order: 1
    class: rocket-strip
    visible: rocket.dashLive

  # THE CLOCK, top right — the cabinet's corner, the road's rules: gated on the
  # clock having started, tap answered (it is the touch player's PAUSE).
  rocket_clock:
    parent: rocket
    order: 2
    class: drive-clock-slot

  # THE ATTITUDE INDICATOR'S OWN SHELF, top centre under the timeline — NOT on
  # the console, because it is the instrument the whole minigame is played off
  # and the console's corner is the last place the eye is: up here it sits on
  # the ship's own column, where the lean it reports is happening. Moving it
  # out is also what lets the console fit a portrait phone at all.
  rocket_attitude:
    parent: rocket
    order: 3
    class: rocket-attitude-slot
    visible: rocket.dashLive
