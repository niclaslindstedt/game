description: |-
  THE GARAGE - the hero's home base, and the game's HUB (docs/multiplayer.md
  has the co-op architecture it anchors). A STATIC venue: the blueprint pins its carve seed, so the place
  lays out identically every visit - a home should not rearrange its walls
  between errands. SMALL and fully KNOWN: the whole lot is one screen and a
  half, there is no fog of war (`revealed` - a man knows his own garage),
  and nothing here is loot - no chests, no crates, just the workbench, the
  car, and the ROLL-UP GARAGE DOOR that opens for anybody who walks or
  drives up to it. Nothing hostile lives here (objective `hub` never clears,
  every area carries `horde: 0`), THE DEALER works the road down the far edge
  of the lot - up and down that stretch all evening in a black hood, buying
  loot, selling kit and mending gear off the books, and standing exactly
  where the car comes out - and the campaign flows
  through its three doors: the CAR to GOODCO HQ - board it, drive out through
  the roll-up, across the drive, and onto the ROAD down the lot's far edge,
  which is where the trip commits and where the picture fades out on a car
  still driving - the ROCKET on the lawn to the moon and Mars, and the RIFT
  SEAM - sealed until THE
  FOUNDER's RIFT CREATOR is brought home - back into the rift and out to
  Boot Hill. A new game opens here (the living-room prelude plays on first
  entry), every earthside victory returns here, and a joiner in a hosted
  session has somewhere to land that is not the middle of somebody else's
  boss fight.
secret: true
id: garage
index: 1
name: THE GARAGE
prelude: prelude
music: bench_light
# NO `intro:` - THE ONE VENUE IN THE GAME WITH NO OPENING MONOLOGUE, and the
# reason the field is optional at all. He does not arrive here: he says what he
# is going to do in the last line of the prelude ("I'LL TAKE THE CAR AND GET
# HER."), walks out of his own living room, and the next thing he is standing in
# is his own garage. A briefing on the doorstep of his own bench would be a
# stranger's voice - the place is established by BEING it, and what he wants
# from it is said by the arrival beat below (`placeThoughts`), which names the
# person rather than the property. Driving HOME still speaks: the road's own
# verdict rides in as `arrivalThought` and is the whole monologue here.
gravity: 800
# His own garage: no fog of war, the whole floor lit from the first frame.
revealed: true
biome: goodco
# THE ONE VENUE THAT KNOWS WHAT TIME IT IS. Home stands under a sky, so its
# light follows the player's own clock (`engine/game/daylight.ts`): come back at
# nine in the evening and the lot is dark, the flood over the roll-up door is
# on, and the bay is a lit box at the end of a black drive. Every other venue
# in the game is airless, sealed, or underground and stays exactly as bright as
# it always was.
#
# THE FIRST VISIT IS ALWAYS NIGHT, whatever the clock says, because the script
# says so: movie night, two hours later, and she never came back. The app pins
# it (the prelude is playing, so this is that night) and hands the run its
# `daylight` like any other session parameter.
sky: earth
tiles:
  # THE LOT IS A LAWN, and the bay's poured cement is a DISTRICT laid on top of
  # it (`content/maps/garage.yaml` → the `bay` area's own `ground`).
  #
  # It is the other way round from how it reads, and which way round it goes is
  # load-bearing: a mission's ground is what every tile NO district claims falls
  # through to, and a carved district's floor is emitted per chamber and grown
  # out to the 16 px tile grid — so any seam a chamber leaves open shows THIS
  # ground. The bay's cement here would put a slab of garage floor out on the
  # grass at every one of them; the lawn here makes them lawn, which is what is
  # around them.
  ground:
    common: grass_0
    rare: grass_1
    rareEvery: 9
heroSuited: false
foes: TROUBLE
objective:
  type: hub
# THE PLACE-PINNED BEATS (see `LevelDef.placeThoughts`). The hub has no horde,
# so it has nothing to pin a thought to but the ground itself: the errand on
# arrival, and — if he strolls out under the roll-up on his own feet instead of
# taking the car — the same errand said less kindly. Each is read once ever
# (`thoughtsSeen`), and the second holds until the first has been read.
placeThoughts:
  - thought: garage_take_the_car
    where: arrival
  - thought: garage_on_foot
    where: pastDoor
    after: garage_take_the_car
merchant:
  # THE NEIGHBORHOOD DEALER — the hub's trader, and the only one in the game
  # who is not a merchant at all. He works the ROAD down the lot's far edge:
  # up and down that stretch of tarmac all evening, hood up, hands in his
  # pocket, selling to whoever walks out of the garage. `beat: true` is what
  # puts him there (the map flags the road districts, see content/maps), and
  # it is why he is revealed from the first tick like a parked trader and
  # walks anyway — a counter that moves.
  #
  # HE IS ALSO THE ONE THING ON THE LOT A CAR CAN KILL. The drive-out to
  # GOODCO runs down the same tarmac he paces, at speed, with the wheel out
  # of the player's hands: catch him and the stall shuts for the visit. It
  # costs nothing but the visit — a trader is minted per run, so the next
  # time the hero comes home somebody else is working the pitch, which is
  # both the honest thing about that trade and the joke.
  #
  # No `greeting` and no `returnGreeting`: he is not a scene, he is a man on
  # a pavement. What he says, he says over the counter (`line`).
  sprite: merchant_dealer
  name: THE DEALER
  beat: true
  line: NO NAMES, AND I DON'T DO RECEIPTS. WHAT ARE YOU AFTER?
travelDoors:
  # THE CAR — the earthbound leg. Always open; the campaign's first door.
  - id: car
    name: THE CAR
    to: [goodco_hq]
  # THE ROCKET — the ship on the back lawn. Flies only where Ada's trail has
  # already led (the picker greys a locked road rather than hiding it) — and
  # while NO road is open, it opens no picker at all: the ship is still one
  # part short, the hero knows it, and `unready:` is what he says instead. The
  # moon and Mars stay unnamed until the part is home from GOODCO's vault.
  - id: rocket
    name: THE ROCKET
    to: [moon, mars]
    unready: garage_ship_unfinished
  # THE RIFT SEAM — the ONE rift portal in the game that asks where to, which
  # is the whole point of the tool it runs on. Sealed until the RIFT CREATOR is
  # in the hero's pocket (`requires`: a keepsake banked on the character), and
  # then it reaches exactly the roads the hero has ALREADY WALKED through a
  # portal out in the world (`reached` — see Character.riftRoads), which is what
  # the keepsake's own lore says it does: it tears a seam to anywhere it has
  # already been. So the seam grows a row when THE FOUNDER's tear on Mars is
  # followed into the rift, when the far door is taken out to Boot Hill, and
  # when the blast gate a dead man's hand talks open is stepped through.
  # D2's going-back rule, in the fiction's words.
  - id: rift_seam
    name: THE RIFT SEAM
    to: [the_rift, boot_hill, the_bunker]
    requires: rift_creator
    reached: true
