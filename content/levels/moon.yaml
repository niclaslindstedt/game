    - flight_jacket
    - micrometeoroid_vest
    - thermal_leggings
    - pressure_trousers
    - lunar_overshoes
    - moon_boots
    - moon_charm
    - bag
    - baseball_cap
    - hard_hat
    - welding_mask
    - riot_helmet
    - lab_coat
    - coveralls
    - kevlar_vest
    - cargo_pants
    - padded_work_pants
    - sneakers
    - steel_toe_boots
    - micrometeoroid_shield
    - courier_sling
    - sample_case
    - hatch_cover
    - riot_shield
    - tool_pouch
    - monogram_holdall
    # The deep-ladder jewellery. Both kinds are gated by their own
    # `minDifficulty` (rings from NIGHTMARE, amulets from JESUS), so they
    # sit inert in every pool until the rung that pays them out.
    - signet_ring
    - tungsten_band
    - orbital_seal
    - vacuum_weld
    - singularity_ring
    - dog_tags
    - null_pendant
    - event_horizon_locket
