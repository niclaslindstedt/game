description: |-
  LEVEL 2 - THE MOON. Ada's beacon dies near the old Apollo flag; THE FLAGBEARER
  haunts the far side. The venue is the regolith: basins of grey dust, rubble
  ridges, craters to hop, slabs to break line of sight and the wrecked hardware
  of the landings knotted into it. THE FEEL is open floaty moon - low gravity,
  long hops, a horizon of rubble with a gap in it - and a SNAPPY second-mission
  clear: the con rises evenly rather than walling, and the knots drain so the
  hero clears them on the move instead of getting pinned.
  THE CAST: wisps and ghosts near the landing, wraiths and the tanky SUCCESSOR
  further out. The four speaking dead unspool the conspiracy in order - the
  APOLLO GHOST in the grave under the dust, the PROSPECTOR's corporate claim, the
  QUARANTINE MEDIC, and the CARTOGRAPHER on Ada's trail - while the LOST
  COSMONAUT and THE THIRTEENTH MAN keep the caches worth detouring for. METEOR
  RAIN falls on a gentle cadence: a rare, dodgeable spectacle that rewards
  reading the ground.
  The far side itself is carved fresh every run from `content/maps/moon.yaml` -
  the flag is planted at a different landing site each time, and walking the
  basins to find it is the mission.
campaign: true
id: moon
index: 2
name: THE MOON
prelude:
  - launch
  - voyage_moon
# THE SEND-OFF, played when the flag is won rather than when Mars opens, and it
# is TWO SCENES because the trip has two ends. THE FLAGBEARER — beaten and
# satisfied — sees the hero off this landing site, and that belongs to the moon:
# the hero flies to Mars from his OWN LAWN, so opening Mars with a man in a
# spacesuit saying goodbye on regolith showed the player a departure he had not
# made. Then `earth_return` lands him, which is the other half of the same
# problem: `exitTo: garage` puts him back home between voyages, and without a
# scene of the ship coming down he simply MATERIALIZED there — and the second
# fire the landing sets on his own house would have happened off-screen.
farewell:
  - moon_depart
  - earth_return
music: regolith_ride
intro:
  - - ADA'S TRACKER WENT QUIET NEAR THE OLD APOLLO FLAG. THAT'S WHERE I'M HEADED.
  # HOW A JACKET IS HEARD FROM ANOTHER WORLD, ANSWERED ONCE AND NEVER RAISED
  # AGAIN. The beacon is a GOODCO part off his own bench, so it talks on GOODCO's
  # own relays — and a company that ships everywhere has hung relays everywhere,
  # which is the only reason the trail did not end at the atmosphere. Said flat,
  # in passing, as one more thing about his old employer: the joke is that the
  # firm which took her is the infrastructure he is following her on. Nothing
  # later leans on it, and nothing later may explain it again.
  - - IT RUNS ON GOODCO'S OWN RELAYS, AND THEY PUT THOSE WHEREVER THEY SHIP - THE ONE FAVOUR THEY'VE EVER DONE ME.
  - - AND SOMETHING IS MOVING OUT THERE IN THE DUST. THIS PLACE IS SUPPOSED TO BE EMPTY.
gravity: 340
biome: moon
tiles:
  ground:
    common: moon_0
    rare: moon_1
    rareEvery: 23
  patch:
    a: gravel_0
    b: gravel_1
    every: 7
foes: GHOSTS
merchant:
  sprite: merchant_moon
  line: EVERY ITEM HERE CAME UP ON A ROCKET. THAT'S THE PRICE, NOT THE MARKUP.
  greeting:
    - - I CAME UP ON THE '76 SALVAGE RUN AND MISSED THE RIDE HOME. THE GHOSTS DON'T CARRY COIN.
  returnGreeting:
    - STILL BREATHING, I SEE. GOOD - MY ONLY CUSTOMER.
objective:
  type: killBoss
# Home between voyages: there is no food on the moon.
exitTo: garage
# METEOR RAIN - the moon has no air to burn them up, so rocks fall out of the
# black sky and slam the regolith near the hero: a firming ground shadow
# telegraphs each impact, then it DETONATES - vaporizing weak mobs at the core,
# flinging the rest (and the hero) to the sides, and punching a fresh crater
# into the plain (the moon is pocked with them for a reason). A GENTLE cadence
# on the second mission: a rare, dodgeable spectacle that rewards reading the
# ground, never a barrage. Craters use the surface's own scar sprites.
asteroids:
  everyMs:
    - 4600
    - 8000
  craterSprites:
    - crater_small
    - crater_big
placedItems:
  - kind: story
    defId: ada_sneaker
  - kind: medkit
  - kind: xp
  - kind: medkit
decorClearance: 80
firstSightThoughts:
  - enemy: wisp
    thought: moon_wisp_sight
  # HELLBORN (config HELLGATES): the first time a rampage-opened hellgate lets
  # one of these through on this map, the run stops for the hero's read on it.
  # The radius is WIDE - one steps out of a tear half a screen off, and the
  # beat has to land on the sighting, not after it has closed to arm's length.
  - enemy: dust_pharaoh
    thought: hellborn_pharaoh
    radius: 260
  - enemy: selene_drowned
    thought: hellborn_drowned
    radius: 260
firstKillThoughts:
  - enemy: wisp
    thought: moon_wisp_kill
    after: moon_wisp_sight
  - enemy: successor
    thought: moon_successor
loot:
  weaponPool:
    - lunar_wrench
    - service_revolver
    - geology_hammer
    - surplus_carbine
    - retro_raygun
    - pulsar_rod
    - box_cutter
    - security_baton
    - nine_mm
    - prototype_laser
    - microwave_emitter
    - pump_shotgun
    - scrap_greatsword
