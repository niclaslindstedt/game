description: |-
  LEVEL 1 - GOODCO HQ. The beacon in Ada's jacket is answering from the campus
  the hero used to build engines at, so he drives out there to walk her home -
  and arrives an hour too late. She has already been flown off the planet, and
  the only thing this building can still give him is the one part his own garage
  ship has always been short of. The venue is the assembly floor: fuselage jigs,
  belts, workstations
  and the bays they feed, with PAYLOAD-1 - the prototype the whole line is built
  to make - booting up wherever the floor plan ends.
  THE ONBOARDING FEEL: a gentle start that eases the player into steering and the
  loot loop (the opening-strike beat draws the weapon, early drops reward the
  first kills), then a build-and-release arc as the floor's STAFF harden from
  interns and office drones to security and SUCCESSOR units. THE EMPLOYEE OF THE
  MONTH and the keycard-carrying elites hold rooms of their own; the
  vending-machine merchant trades where the fighting stops.
  The floor plan itself is carved fresh every run from `content/maps/goodco_hq.yaml`
  - which bay PAYLOAD-1 sits in is the run's own answer, and finding it is the
  mission.
campaign: true
id: goodco_hq
index: 1
name: GOODCO HQ
music: hq_lockdown
intro:
  # PICKS UP WHERE THE PRELUDE FADED OUT — it does not recap it. The scene the
  # player just watched ends on "SHE NEVER CAME BACK", so opening the monologue
  # by restating that (and the chips and the soda and the two hours) told them
  # nothing they had not been shown thirty seconds earlier. The jacket answering
  # is the new fact, and it pays off the prelude's own quiet detail: the one he
  # "fixed the zipper on".
  #
  # AND IT NEVER MENTIONS THE PART, which is the whole design of this level. A
  # monologue that lays out on a black screen that the beacon points at space,
  # that following it needs a ship, that the ship is one part short and that the
  # part happens to be in the very building his girlfriend vanished into is four
  # coincidences stacked up before the player has pressed anything — and a plot
  # the hero has already solved is not a plot.
  #
  # So he comes here for HER, full stop, and everything else is discovered in
  # the order a person would discover it: she is not here (the CHIEF OF
  # SECURITY, PAYLOAD-1), she went up an hour ago, and — from DR. NOVA, bragging
  # unprompted to a man who never asked — the thing in the cleanroom vault is
  # the part he has needed for ten years. He leaves with it because by then it
  # is the only way to follow anybody.
  - - THE JACKET'S STILL ANSWERING. NOT FROM ANY STREET I KNOW. FROM IN THERE.
  - - GOODCO. I BUILT THEIR ENGINES FOR TEN YEARS, TILL AN AI LEARNED MY JOB AND THEY WALKED ME OUT.
  - - THE WHOLE BLOCK WENT THE SAME WAY. NOW IT'S WELFARE AND MOVIE NIGHTS.
  - - I KNOW THAT BUILDING. I KNOW THE PEOPLE IN IT. I DON'T WANT TROUBLE WITH ANY OF THEM.
  - - SO I GO IN, AND I WALK OUT WITH HER.
gravity: 800
biome: goodco
tiles:
  # THREE READABLE FLOOR ZONES so the plant reads as a workplace at a glance
  # (no random patch blobs): the light lab tile is the level-wide default for the
  # OFFICES, the corner vaults and the walkways; a warm checker-plate deck floors
  # the central ASSEMBLY FLOOR; a blue rivet deck floors the LAUNCH BAY past the
  # last aisle where PAYLOAD-1 boots up. Zones are purely visual — collision never
  # reads tiles — so the tested wall/path geometry is untouched.
  ground:
    common: lab_0
    rare: lab_1
    rareEvery: 13
heroSuited: false
foes: STAFF
# EMPLOYEE STAMPEDES — the "asteroid" beat of the assembly floor: every 20-37s a wall
# of five panicked staffers charges right-to-left across the floor at a steady,
# heavy pace, a dust cloud boiling off its back and a line of dust telegraphing its
# lane a beat before it appears. It BOWLS any minion in its lane over (knocked out a
# few seconds, not killed — no farm) and knocks the grounded hero down (~20% hp + a
# 2s knockdown) unless he jumps it (its hitbox is a thin line, easy to hop) or steps
# out of its lane. Jumping is the intended dodge.
stampedes:
  everyMs: [20000, 36667]
  # Held back until the hero is halfway to PAYLOAD-1: the stampedes are the
  # SECOND-HALF beat of the assembly floor, so the opening aisles — where a
  # fresh player is still learning to steer and jump — stay clear of the herd.
  afterProgress: 0.5
# THE STAFF LOT, AND THE WAY IN (engine/game/arrivals.ts). The hero lands on a car
# park with a building in front of him and no visible door — the fog is over the
# whole wall — so the mission's first move is finding one. What tells him where
# it is, is the night shift: a car rolls in every twenty seconds or so, somebody
# gets out, walks to the entrance and TAPS A CARD, and the doors open. He goes
# in behind them.
#
# The entrance is a KEYED door with no key anywhere in the game (the blueprint's
# `entrance` object), so this is not a shortcut past a door he could have opened
# himself — it is the door. Everybody out here is NEUTRAL: two parking guards
# who are not looking for anybody, and staff who have not been told the building
# is locked down. The lot's ambient horde is off (`horde: 0` on the blueprint's
# `lot`), which is the other half of the same decision — the fight starts INSIDE,
# where the opening strike now plays.
arrivals:
  staff:
    - arriving_scientist
    - arriving_engineer
    - arriving_intern
  # THE GATEHOUSE — the lit kiosk flush against the gate with a guard sitting
  # behind the glass, which is what turns a slab of wall that occasionally
  # slides aside into a CONTROLLED entrance. It says, in one frame and from
  # across the tarmac, that somebody decides who comes through here — so the
  # badge beat reads as the building's rule rather than as a quirk of the level.
  # He is painted into the sprite rather than standing on the field: he sits all
  # night and never notices anybody, which is exactly the hero's relationship
  # with this place now.
  gatehouse:
    sprite: gate_booth
  guards:
    enemy: parking_guard
    count: 2
  # Soon, but not instantly: long enough for the doorstep monologue to clear and
  # for the player to have looked around the lot and found nothing.
  firstMs: 5000
  everyMs: [18000, 26000]
  # Three cars over the opening minutes and then the lot is full. A car park
  # that keeps filling forever is a queue, and the beat has done its work after
  # the first one anyway.
  maxCars: 3
  thought: goodco_follow_in
merchant:
  sprite: merchant_vendor
  # What he says across the counter, every visit (see `merchant.line`) — a
  # greeting the player can trade straight through, unlike the meeting scene
  # below it, which is played once ever.
  line: THE MACHINES ARE EMPTY, SO TONIGHT I'M THE MACHINE. WHAT'LL IT BE?
  greeting:
    - - EASY, FRIEND. I'M NOT STAFF. I STOCK THE VENDING MACHINES. SOMEBODY HAS TO, EVEN TONIGHT.
    - - LOCKDOWN IS A SELLER'S MARKET. I'LL BUY WHAT WEIGHS YOU DOWN, SELL WHAT KEEPS YOU UPRIGHT.
  returnGreeting:
    - BACK ALREADY, FRIEND? THE MACHINES MISSED YOU.
objective:
  type: killBoss
# LEVEL CLEAR goes home: the campaign breathes in THE GARAGE between
# missions (the D2 town loop), and the part comes back to the bench.
exitTo: garage
placedItems:
  - kind: story
    defId: ada_soda
  - kind: equipment
    defId: pump_shotgun
  - kind: repair
  - kind: repair
  - kind: medkit
  - kind: story
    defId: antigrav_unit
  - kind: xp
  - kind: xp
  - kind: story
    defId: core_log
  - kind: xp
  - kind: medkit
decorClearance: 70
firstSightThoughts:
  - enemy: intern
    thought: goodco_staff
    radius: 200
    # …BUT NOT UNTIL HE IS THROUGH THE GATE. The line is about the floor — every
    # desk manned, every lab lit — and the crowd it is about stands a step
    # inside the doorway, which is well within 200px of a man on the tarmac the
    # moment a badge opens the gate. Distance alone therefore reads the level's
    # first line out to somebody looking at a car park; `inside` holds it until
    # he is actually on the far side of the entrance.
    #
    # AND IT HOLDS THE FIRST BLOW WITH IT, for free: the opening strike waits on
    # this thought (`openingStrike.after`), so gating the read is what keeps the
    # scripted scientist from sprinting out onto the lot to swing at a holstered
    # man in front of two parking guards.
    inside: true
  - enemy: successor
    thought: goodco_successor
  # HELLBORN (config HELLGATES): the first time a rampage-opened hellgate lets
  # one of these through on this map, the run stops for the hero's read on it.
  # The radius is WIDE - one steps out of a tear half a screen off, and the
  # beat has to land on the sighting, not after it has closed to arm's length.
  - enemy: tunguska_walker
    thought: hellborn_tunguska
    radius: 260
  - enemy: first_investor
    thought: hellborn_investor
    radius: 260
# THE OPENING STRIKE — three blows, and he only answers the third.
#
# The hero walks in with the wall piece holstered, because this is where he
# used to work. A lone scientist breaks from the pack and hits him; he does not
# hit back. He names the man, tells the floor to stand down, says he has never
# raised a hand to anyone. They hit him again. Again. THEN he answers, the
# weapon comes out, and the game starts. `warnings` are the beats the first two
# blows play, in order; `thought` is the one the answering blow plays, and the
# blow that lands with every warning read is the blow that arms him.
openingStrike:
  enemy: vanguard_scientist
  thought: goodco_armed
  warnings:
    - goodco_first_blow
    - goodco_second_blow
  after: goodco_staff
  radius: 22
loot:
  weaponPool:
    - box_cutter
    - security_baton
    - nine_mm
    - prototype_laser
    - microwave_emitter
    - pump_shotgun
    # THE ONE WEAPON THAT NEVER LEAVES THE BUILDING. Every other base in this
    # pool is repeated by the later venues' pools, which is how the campaign's
    # arsenal accumulates; this one is deliberately not, so the flamethrower is
    # a GOODCO find and nothing else — a facilities tool that was never issued
    # off the campus, and a gimmick the player meets exactly where the story
    # says it lives. Six seconds of fuel is also not a thing to hand somebody
    # for the rest of a campaign.
    - attrition_flamethrower
  gearPool:
    - baseball_cap
    - hard_hat
    - welding_mask
    - riot_helmet
    - lab_coat
    - coveralls
    - kevlar_vest
    - cargo_pants
    - padded_work_pants
    - sneakers
    - steel_toe_boots
    - id_badge
    - bag
    - hatch_cover
    - riot_shield
    - tool_pouch
    - monogram_holdall
    # The deep-ladder jewellery. Both kinds are gated by their own
    # `minDifficulty` (rings from NIGHTMARE, amulets from JESUS), so they
    # sit inert in every pool until the rung that pays them out.
    - signet_ring
    - tungsten_band
    - orbital_seal
    - vacuum_weld
    - singularity_ring
    - dog_tags
    - null_pendant
    - event_horizon_locket
    - reliquary
  # POWERUPS: the four classics plus the assembly floor's own — the campaign
  # introduces TWO NEW POWERS PER MAP after this one, and every later pool keeps
  # what came before (see engine/game/defs/ability-catalog.ts). OVERPRESSURE sits
  # in the OPENING set rather than debuting on a later map for the ladder's own
  # sake: every map after this is spoken for by its own two, and a power the
  # whole campaign should be able to stumble into belongs where the campaign
  # starts. Its rarity (10, the dock's rarest rung) is what keeps it a treat
  # rather than a seventh classic.
  abilityPool:
    - fire_orbs
    - storm_cell
    - stasis_field
    - item_magnet
    - ion_wake
    - blast_shield
    - overpressure
  worldUniques:
    easy:
      - the_first_draft
      - deadsprint
      - longwatch
      - the_last_door
    medium:
      - the_first_draft
      - deadsprint
      - longwatch
      - the_last_door
    hard:
      - the_first_draft
      - deadsprint
      - longwatch
      - the_last_door
    nightmare:
      - stormlash
      - falconmail
    jesus:
      - lightbinder
      - starsight
      - the_anvil
      - the_last_word
      - the_severance
  intendedLevelByDifficulty:
    easy: 14
    medium: 15
    hard: 16
    nightmare: 47
    jesus: 65
  allClearWeapon: golden_stapler
  # THE ONBOARDING LOOT CADENCE — a deliberate difficulty CURVE, not a dump.
  # The player opens on his bare starter weapon (EASY's ranged wand) and has to
  # SURVIVE the first knot of interns on it — difficult but doable, learning to
  # steer and to keep his distance. Around kill 10, once he's found his feet, the
  # SECURITY BATON drops: his first real AoE, a cone that clears the crowd — the
  # floor eases. Around kill 20 the SMART GLASSES (+1 INT, carried passively)
  # widen that cone for free — the floor eases again — right as the aisles swell
  # toward PAYLOAD-1, who bites hardest of all.
  earlyDrops:
    - atKills: 10
      weapon: security_baton
    - atKills: 20
      gear: smart_glasses
    # A guaranteed RANGED sidearm for the BACK HALF — the fix for the "past the
    # night manager but no further" wall: where the probabilistic rain used to
    # leave the hero stranded on a worn starter (or on his bare hands) as the
    # aisles swell toward PAYLOAD-1, this hands him a real kiting tool so his DPS
    # never craters. Landed around aisle 2-3.
    - atKills: [34, 46]
      weapon: nine_mm
    # A repair kit alongside it, so the freshly-armed hero can also keep his
    # weapon of choice alive through the surge instead of watching it snap.
    - atKills: [50, 64]
      item: repair
