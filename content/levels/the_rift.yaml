description: |-
  LEVEL 4 - THE RIFT. A hallucinatory void between universes, walked toward the
  door THE FOUNDER fled through. There is no floor and no north: what defines the
  road is the BLACK HOLES strewn across it, gravity wells the hero threads
  between - a core devours on contact - and the debris drifting overhead. THE
  FEEL is DREAD and DISORIENTATION on a rising tide: the noise thickens and the
  con climbs from a meek voidling drift to a graviton-heavy crush.
  THE CAST is history's missing, met in walking order: HOUDINI and TESLA early,
  LUCKY on a dare, THE KING beside a black hole of his own, EARHART on Ada's
  trail, RASPUTIN barring the deep end, and BRO OMEGA guarding the far door with
  the reveal. THE FOUNDER flees a second time there. A travel gate to the secret
  bunker opens here, for a hero who noticed what RASPUTIN dropped.
  The road is carved fresh every run from `content/maps/the_rift.yaml`.
campaign: true
id: the_rift
index: 4
name: THE RIFT
prelude: rift_entry
music: rift_drift
intro:
  - - THERE'S NO FLOOR IN HERE. NO SKY. NO NORTH. MY BOOTS GRIP SOMETHING ANYWAY.
  - - "THE MARS TABLET SAID IT PLAIN: ADA IS THE TRIBUTE, HANDED OVER IN HERE. SHE CAME THROUGH THIS PLACE."
  - - HER BEACON PINGS FROM EVERYWHERE AT ONCE. EVEN THE SIGNAL IS HALLUCINATING.
  - - FIND THE FAR SIDE. CATCH THE COWARD. BRING HER HOME.
gravity: 200
biome: rift
tiles:
  ground:
    common: void_0
    rare: void_1
    rareEvery: 17
  patch:
    a: nebula_0
    b: nebula_1
    every: 8
foes: ENTITIES
merchant:
  sprite: merchant
  line: COIN SPENDS IN EVERY WORLD I'VE LOST. HAVE A LOOK, TRAVELER.
  greeting:
    - - AH. YOU AGAIN. DON'T LOOK SO SURPRISED - EVERY MARKET I RAN FELL THROUGH HERE.
    - - THE VENDING MACHINES. THE MOON. THE DOME. ALL ROADS LEAD HERE. COIN SPENDS ON ALL.
    - - BRING ME RELICS, TRAVELER. TAKE WHAT YOU NEED. WE'RE BOTH FAR FROM HOME.
  returnGreeting:
    - YOU AGAIN. OF COURSE. ALL ROADS STILL LEAD HERE.
# THE WAY ON IS THE FAR DOOR — the tear the intro sends him to find, opening on
# the western. `rift_exit` (Boot Hill's prelude) is the scene of him stepping
# through it, and the crossing teaches the seam at home that road.
riftExit: true
# THE COWARD'S OWN EXIT — the tear THE FOUNDER rips open and bolts through, left
# standing where he vanished (`flees.landmark: rift` on his def; the landmark
# outlives the scene on purpose, so the map remembers where he went). Tapping it
# FOLLOWS HIM, which is the whole of the chase in one gesture, and the crossing
# teaches the seam back home this road.
#
# A SET destination: a tear goes where its owner went, and a picker with one row
# on it is a confirmation dialog nobody asked for. The seam in the garage is the
# only portal in the game with a question to put.
travelDoors:
  - id: rift
    name: THE COWARD'S TEAR
    to: [boot_hill]
    direct: true

objective:
  type: killBoss
gates:
  - id: bunker_gate
    to: the_bunker
    opensWith: severed_hand
    sprite: bunker_gate
# BLACK HOLES STREWN ACROSS THE ROAD - the void's real geometry, FLANKING the
# road the hero threads. He never stands ON one - a core devours on contact - so
# the way through any room with a hole in it is the floor BESIDE it. The mission
# says how many the rift has and how hard each one pulls; the carve re-anchors
# each into a room of its own, so which rooms are dangerous is the run's answer.
wells:
  # Eight holes, from a small one to skirt to the hungriest in the void.
  - pullRadius: 120
  - pullRadius: 130
  - pullRadius: 130
  - pullRadius: 120
  - pullRadius: 140
  - pullRadius: 140
  - pullRadius: 160
  - pullRadius: 150
asteroids:
  everyMs:
    - 2800
    - 5200
  struckThought: rift_asteroid
placedItems:
  # ADA'S JACKET on her trail. The story pieces are strung along the carve's own
  # depth axis, so the trail is FOLLOWED rather than stumbled over.
  - kind: story
    defId: ada_jacket
  # THE TRUST ME BRO AI PROBE - the machine-mind reveal made physical, the paper
  # trail snagged somewhere out on the road.
  - kind: story
    defId: bro_probe
  - kind: medkit
  - kind: xp
  - kind: xp
# THE CANOPY — lost junk drifting BETWEEN the eye and the ground, drawn over the
# hero and the horde, out of focus and sliding faster than the void does (see
# `LevelDef.canopy`). It is what makes the rift read as a SPACE rather than a
# purple rug: seen from directly above with nothing overhead, a tear between
# universes looks like a floor. Everything that was ever lost ends up here, so
# what is floating past is somebody's suitcase, somebody's biplane, somebody's
# sock.
#
# Deliberately sparse, faint and blurred: this layer sits between the player and
# whatever is trying to kill him, so it must never compete for attention. Three
# bands at different parallax and blur, so the junk reads as being at different
# heights rather than as one sheet of stickers.
canopy:
  # High and far: small, very blurred, barely there.
  - kind: rift_junk_sock
    count: 5
    drift: [3, 8]
    parallax: 1.5
    blur: 3
    alpha: 0.32
    scale: [0.9, 1.2]
  - kind: rift_junk_spectacles
    count: 4
    drift: [3, 8]
    parallax: 1.5
    blur: 3
    alpha: 0.32
  - kind: rift_junk_keys
    count: 4
    drift: [4, 9]
    parallax: 1.5
    blur: 3
    alpha: 0.32
  - kind: rift_junk_dice
    count: 4
    drift: [4, 10]
    parallax: 1.5
    blur: 3
    alpha: 0.34
  # Mid: the recognisable things — a hat, a cup, a bulb — a little sharper.
  - kind: rift_junk_top_hat
    count: 3
    drift: [5, 11]
    parallax: 1.32
    blur: 2
    alpha: 0.44
  - kind: rift_junk_teacup
    count: 3
    drift: [5, 11]
    parallax: 1.32
    blur: 2
    alpha: 0.44
  - kind: rift_junk_lightbulb
    count: 3
    drift: [5, 12]
    parallax: 1.32
    blur: 2
    alpha: 0.46
  - kind: rift_junk_pocket_watch
    count: 3
    drift: [4, 10]
    parallax: 1.32
    blur: 2
    alpha: 0.44
  - kind: rift_junk_umbrella
    count: 3
    drift: [6, 13]
    parallax: 1.3
    blur: 2
    alpha: 0.42
  - kind: rift_junk_boot
    count: 3
    drift: [4, 10]
    parallax: 1.3
    blur: 2
    alpha: 0.42
  - kind: rift_junk_guitar
    count: 2
    drift: [5, 11]
    parallax: 1.3
    blur: 2
    alpha: 0.44
  - kind: rift_junk_handcuffs
    count: 2
    drift: [5, 12]
    parallax: 1.32
    blur: 2
    alpha: 0.44
  # Low and near: the big pieces, sharpest and fastest, passing close overhead.
  - kind: rift_junk_biplane
    count: 2
    drift: [10, 18]
    parallax: 1.7
    blur: 1
    alpha: 0.6
    scale: [1, 1.4]
  - kind: rift_junk_satellite
    count: 2
    drift: [9, 16]
    parallax: 1.65
    blur: 1
    alpha: 0.58
  - kind: rift_junk_suitcase
    count: 2
    drift: [8, 15]
    parallax: 1.6
    blur: 1
    alpha: 0.56
  - kind: rift_junk_shopping_cart
    count: 2
    drift: [8, 15]
    parallax: 1.6
    blur: 1
    alpha: 0.54
  - kind: rift_junk_gramophone
    count: 2
    drift: [7, 14]
    parallax: 1.58
    blur: 1
    alpha: 0.56
  - kind: rift_junk_typewriter
    count: 2
    drift: [7, 14]
    parallax: 1.58
    blur: 1
    alpha: 0.54
  - kind: rift_junk_kite
    count: 3
    drift: [11, 20]
    parallax: 1.75
    blur: 1
    alpha: 0.6
  - kind: rift_junk_globe
    count: 2
    drift: [6, 13]
    parallax: 1.55
    blur: 1
    alpha: 0.56
decorClearance: 80
firstSightThoughts:
  - enemy: voidling
    thought: rift_arrival
  # HELLBORN (config HELLGATES): the first time a rampage-opened hellgate lets
  # one of these through on this map, the run stops for the hero's read on it.
  # The radius is WIDE - one steps out of a tear half a screen off, and the
  # beat has to land on the sighting, not after it has closed to arm's length.
  - enemy: first_vanishing
    thought: hellborn_vanishing
    radius: 260
  - enemy: scaled_ancestor
    thought: hellborn_ancestor
    radius: 260
firstKillThoughts:
  - enemy: graviton
    thought: rift_graviton
