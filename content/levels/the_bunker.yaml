  # HELLBORN (config HELLGATES): the first time a rampage-opened hellgate lets
  # one of these through on this map, the run stops for the hero's read on it.
  # The radius is WIDE - one steps out of a tear half a screen off, and the
  # beat has to land on the sighting, not after it has closed to arm's length.
  - enemy: permafrost_saint
    thought: hellborn_saint
    radius: 260
  - enemy: dead_hand
    thought: hellborn_deadhand
    radius: 260
