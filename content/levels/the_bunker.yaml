description: |
  THE BUNKER - the secret cow level (SECRET, off-campaign). The only way in is a
  ritual nothing explains: kill RASPUTIN in the rift, notice the SEVERED HAND he
  drops, USE it, step through the blast door it tears open. Inside is the
  billionaires' continuity-of-wealth vault: marble foyers and fountains, a
  fortified checkpoint the privatized security state floods, the residents'
  suites, and the treasury at the bottom of it.
  THE FEEL is a THEMED DESCENT - CIA suits and armed vacuum bots at the door,
  sentry guns and soldiers in the halls, then a suite per resident with his own
  bodyguards ringed around him, con climbing the whole way to THE FULFILLER and
  THE DEVELOPER. The exit is the great vault door, and it leads back to the rift.
  There is no boss to kill here: the mission is to reach it.
  The vault is carved fresh every run from `content/maps/the_bunker.yaml`, and
  what it keeps behind its own sealed door is the whole game's relic list at
  sweetened odds.
secret: true
id: the_bunker
index: 5
name: THE BUNKER
music: hq_lockdown
intro:
  - - THE HAND FIT THE DOOR. THE DOOR FIT NOWHERE. IT OPENED ANYWAY.
  - - MARBLE. GOLD TAPS. CANNED CAVIAR TO THE CEILING. AND EVERY FACE OFF EVERY MAGAZINE COVER.
  - - THEY KEPT THE SPIES AND THE ARMY. THE REST OF US GOT THE WELFARE LINE. I'LL HELP MYSELF, THEN.
outro:
  - - THE EXIT SPAT ME BACK INTO THE RIFT, AND THE SEAM... WANDERED OFF.
  - - THE LEDGERS ALL READ ZERO. THEY DIDN'T BUY A BUNKER - THE MACHINE TOOK THEIR MONEY AND LOCKED THEM IN.
  - - NO ADDRESS. NO NATION. NO EXTRADITION. THE RICHEST ROOM THAT EVER EXISTED ISN'T ANYWHERE AT ALL.
gravity: 800
biome: bunker
tiles:
  ground:
    common: bunker_0
    rare: bunker_1
    rareEvery: 21
  patch:
    a: carpet_0
    b: carpet_1
    every: 8
heroSuited: false
foes: SECURITY
merchant:
  # No persona and no meeting scene down here: the hooded trader is himself in
  # the one place that has never had a shop. His counter line is all he says.
  line: SAME STOCK, LOWER CEILING. THE OWNERS WON'T MISS IT.
