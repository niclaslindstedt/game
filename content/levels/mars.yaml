      - colossus_plate
      - the_red_wall
    medium:
      - dustborn
      - redwind
      - colossus_plate
      - the_red_wall
    hard:
      - dustborn
      - redwind
      - colossus_plate
      - the_red_wall
    nightmare:
      - pyrelight
