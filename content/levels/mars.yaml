description: |-
  LEVEL 3 - MARS. An assault on GOODCO's secret colony. The venue is two places
  under one sky: the open red desert of rover-worked dust, and the pressurized
  colony it surrounds - deck plating, terrariums, and the dome's own servo and
  fembot lines. THE FEEL is a rising power fantasy that starts as a dusty patrol
  and ends storming a billionaire's dome, with SAND STORMS drifting through the
  open ground slow enough to walk clear of.
  THE CAST hardens with the ground: scout and mining rovers out on the dust, THE
  INDEXER holding an airlock, THE VENDOR, SUCCESSOR PRIME and THE SEED inside,
  and THE FOUNDER at the end of it - the man who owns the planet, who doesn't die
  but flees into a rift.
  The colony is carved fresh every run from `content/maps/mars.yaml` - which dome
  the founder is in is the run's own answer.
campaign: true
id: mars
index: 3
name: MARS
prelude:
  - moon_depart
  - voyage_mars
music: red_dust
intro:
  - - HE SAID THE MOON WAS GOODCO'S BIG MISTAKE - THE COMPANY PACKED IT ALL INTO CRATES AND RAN. TO MARS.
  - - I KNOW WHAT A GOODCO COLONY LOOKS LIKE - I REBUILT THEIR LANDER ONCE. DOMES. ROBOTS. SECRETS.
  - - SOMEBODY DOWN HERE TRADED MY GIRL AWAY LIKE CARGO. BAD TRADE. FOR THEM.
gravity: 520
biome: mars
tiles:
  ground:
    common: mars_0
    rare: mars_1
    rareEvery: 19
  patch:
    a: rust_0
    b: rust_1
    every: 7
foes: MACHINES
# Small sand storms roll across the red planet: every so often a churning dust
# gust drifts in from off-screen and sweeps the hero's surroundings. Walk clear
# and it's harmless; stand in its path and it flattens you - a bite of damage
# and a knockout, prone on the dirt for a couple of seconds while it passes over
# and fades. Tuning (speed, size, damage, knockout length) lives in config
# SANDSTORMS / DifficultyDef.sandstormDamageFrac.
sandstorms:
  everyMs:
    - 9000
    - 16000
merchant:
  sprite: merchant_mars
  greeting:
    - - A BREATHING CUSTOMER. AT LAST. I RAN THE COLONY COMMISSARY TILL THE AI RAN THE NUMBERS.
    - - IT KEPT THE DOME. I KEPT THE SCALES. SELL ME WHAT THE MACHINES DROP - BUY WHAT HELPS.
  returnGreeting:
    - THE LIVE ONE RETURNS. SCALES ARE STILL HONEST.
# THE WAY ON IS A TEAR. THE FOUNDER rips one open and bolts through it at a
# quarter health, and the hero follows — which is what `rift_entry` (the rift's
# own prelude) is a scene of. Crossing it teaches the garage's seam the road,
# so the way home starts reaching the rift once it has been walked the long way.
riftExit: true
# THE COWARD'S OWN EXIT — the tear THE FOUNDER rips open and bolts through, left
# standing where he vanished (`flees.landmark: rift` on his def; the landmark
# outlives the scene on purpose, so the map remembers where he went). Tapping it
# FOLLOWS HIM, which is the whole of the chase in one gesture, and the crossing
# teaches the seam back home this road.
#
# A SET destination: a tear goes where its owner went, and a picker with one row
# on it is a confirmation dialog nobody asked for. The seam in the garage is the
# only portal in the game with a question to put.
travelDoors:
  - id: rift
    name: THE COWARD'S TEAR
    to: [the_rift]
    direct: true

objective:
  type: killBoss
placedItems:
  - kind: story
    defId: ada_message
  # The green keycard, strung along the search like every other story piece, so
  # the TERRARIUM detour is opt-in but always reachable.
  - kind: story
    defId: keycard_terrarium
  - kind: story
    defId: tribute_schedule
  - kind: xp
  - kind: xp
  - kind: medkit
decorClearance: 80
firstSightThoughts:
  # HELLBORN (config HELLGATES): the first time a rampage-opened hellgate lets
  # one of these through on this map, the run stops for the hero's read on it.
  # The radius is WIDE - one steps out of a tear half a screen off, and the
  # beat has to land on the sighting, not after it has closed to arm's length.
  - enemy: olympus_engine
    thought: hellborn_olympus
    radius: 260
  - enemy: phobos_shepherd
    thought: hellborn_shepherd
    radius: 260
firstKillThoughts:
  - enemy: scout_rover
    thought: mars_rover
  - enemy: fembot
    thought: mars_fembot
