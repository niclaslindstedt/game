      - the_motherlode
  intendedLevelByDifficulty:
    easy: 24
    medium: 26
    hard: 27
    nightmare: 52
    jesus: 70
  earlyDrops:
    # A guaranteed RANGED sidearm within the first handful of kills: the colony
    # boss (THE FOUNDER) is fast and summons, so a hero needs a kiting tool, not just
    # the melee bases the elites drop. cyber_katana still lands later as a
    # flavor melee option for those who want it.
    - atKills:
        - 10
        - 22
      weapon: smart_pistol
    - atKills:
        - 55
        - 95
      weapon: cyber_katana
