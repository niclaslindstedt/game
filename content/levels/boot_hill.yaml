description: |-
  LEVEL 5 - BOOT HILL. The rift's far side opens onto a knockoff wild-west theme
  park built in Russia by THE STRONGMAN and THE STUNT DOUBLE, run on robotics
  licensed from TRUST ME BRO. The venue is the park: a frontier town of storefront
  facades and side alleys, a saloon, a corral, the dust road out of town and the
  fenced CONTROL CENTER compound at the end of it. THE FEEL is a GAUNTLET - the
  street funnels, the horde presses from ahead and spills out of the alleys, and
  the answer is to keep pushing forward and shoot your way through. SPINNING HAY
  BALLS roll the lanes as the park's own nuisance.
  THE CAST walks the street in hardening order: friendly COWBOTS at the gate,
  SALOON BRAWLERS and TIN OUTLAWS deeper in, the charging LONGHORN heavies at the
  far end. The resident staff each hold a place of their own - THE LEAK leaking
  from cover, THE LEADING MAN parked like a landslide, THE STRONGMAN in the town
  square, and THE STUNT DOUBLE with the keycard to the compound gate. Inside it,
  THE FOUNDER is cornered and finally dies, and then THE BRO SUPERCORE, shielded
  by its three BRO controllers.
  The park is carved fresh every run from `content/maps/boot_hill.yaml`.
campaign: true
id: boot_hill
index: 5
name: BOOT HILL
prelude: rift_exit
music: long_noon
intro:
  - - I STEPPED THROUGH THE FAR SIDE AND LANDED IN A WESTERN. DUST. SALOONS. A ROBOT TIPPED ITS HAT.
  - - THE SIGN SAYS 'BOOT HILL'. THE FINE PRINT SAYS 'POWERED BY TRUST ME BRO'. OF COURSE IT DOES.
  # EXPLICIT BREAK: the vow, then the deadpan.
  - - HANG ON, ADA. I'M COMING.
    - YEE-HAW, I GUESS.
outro:
  - - THE SUPERCORE DIED AND THE WHOLE PARK SHOOK. EVERY HAND TIPPED ITS HAT AND SAT DOWN.
  # EXPLICIT BREAK: her second line is the punchline and needs the beat.
  - - "SHE WAS BEHIND THE GLASS, FURIOUS. FIRST SHE SAID: 'YOU TOOK YOUR TIME.'"
    - "THEN: 'NICE HAT.'"
  - - AFTER THAT THE MACHINES JUST STOPPED. PEOPLE STARTED GETTING CALLED BACK IN. SLOWLY.
  - - "AND ON FRIDAY: MOVIE NIGHT. CHIPS AND SODA. SHE WENT OUT FOR THEM. I WENT WITH HER."
gravity: 700
biome: boot_hill
tiles:
  ground:
    common: hardpan_0
    rare: hardpan_1
    rareEvery: 15
  patch:
    a: scrub_0
    b: scrub_1
    every: 8
foes: HANDS
heroSuited: false
merchant:
  sprite: merchant_boot_hill
  name: THE BARKEEP
  line: BAR'S DRY. THE STOCK ISN'T. NAME IT, PARTNER.
  greeting:
    - - WELL HOWDY. MIND THE GLASSES - THE ROBOTS DON'T DRINK, BUT THEY TIP IN PARTS.
    - - YES, IT'S ME. A MARKET FELL THROUGH A RIFT AND I FELL WITH IT. I'VE COME INTO SOME ESTATE PIECES. BRING WATCHES.
  returnGreeting:
    - WELL, LOOK WHO'S BACK. SAME STOOL, PARTNER?
  stockUniques:
    - strongmans_tracksuit
    - the_incumbents_ushanka
    - courtesy_star
objective:
  type: killBoss
# The campaign's last clear walks back out of the West to the garage -
# the rift seam on the wall is the going-back loop from here on.
exitTo: garage
# SPINNING HAY BALLS: the park's western prop hazard. Bales roll in from the
# right and bounce straight across the hero's surroundings to the left, spinning
# as they go. A bale caught on the grounded hero costs a very slight bite of hp
# and SHOVES him left, back the way he came - he has to step out of its lane (or
# jump it) to stop being pushed. A rolling-tumbleweed nuisance that dresses the
# park without threatening the duels.
hayBalls:
  everyMs:
    - 1600
    - 3000
placedItems:
  - kind: story
    defId: park_brochure
  - kind: story
    defId: ada_hand
  - kind: repair
  - kind: medkit
  - kind: medkit
  - kind: xp
  - kind: xp
decorClearance: 80
firstSightThoughts:
  - enemy: cowbot
    thought: boot_hill_arrival
    radius: 200
  # HELLBORN (config HELLGATES): the first time a rampage-opened hellgate lets
  # one of these through on this map, the run stops for the hero's read on it.
  # The radius is WIDE - one steps out of a tear half a screen off, and the
  # beat has to land on the sighting, not after it has closed to arm's length.
  - enemy: the_long_noon
    thought: hellborn_noon
    radius: 260
  - enemy: manifest_ruin
    thought: hellborn_ruin
    radius: 260
firstKillThoughts:
  - enemy: cowbot
    thought: boot_hill_hands
    after: boot_hill_arrival
