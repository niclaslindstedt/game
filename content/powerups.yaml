# The POWERUP catalog — every time-limited power a pickup can grant, and the
# single source of truth for their balance. Compiled to
# `src/generated/powerups.ts` by `scripts/generate-powerups.mjs` (folded into
# `make levels` / `make assets`); the engine reads it through
# `src/game/defs/abilities.ts`, which owns the TYPES and documents what every
# param block means. Nothing here needs a rebuild of engine code to retune — a
# damage figure, a duration, or a whole new power is an edit to this file.
#
# THE CAMPAIGN INTRODUCES TWO NEW POWERS PER MAP, and every map's pool KEEPS
# what came before, so the dock's vocabulary grows the whole way down and each
# new venue is announced by two powers that could only have come from THERE:
#
#   SPACEZ HQ   the classics + ION WAKE, BLAST SHIELD,
#               OVERPRESSURE                                 (the launch pad)
#   THE MOON    MOONFALL, PALE SHROUD                        (rock and ghosts)
#   MARS        DUST DEVIL, REACTOR SURGE                    (the red colony)
#   THE RIFT    EVENT HORIZON, THE UNMAKING                  (the void road)
#   EASTWORLD   DEAD MAN'S HAND, IRON STAMPEDE               (the robot west)
#   THE BUNKER  CONTINUITY PROTOCOL, SENTRY GRID             (the vault)
#
# The pools themselves are authored per level (`loot.abilityPool` in
# content/levels/<id>.yaml); this file is only the powers.
#
# BALANCING NOTES. Every damage figure is authored AT LEVEL 1 and rides
# `abilityPowerScale` (level ramp × INT), so a power keeps clipping the same
# fraction of a level-appropriate healthbar all campaign. The level-1 reference
# minion has ~45 hp (`LEVELING.refMobHp`) — the yardstick every number below is
# picked against, so "damage: 45" is "one reference minion per tick". Each
# power's `kind` decides which param block it must carry (and it may carry only
# that one); the block's fields are documented on `AbilityDef`.
#
#   lore        REQUIRED, and the one field here written for a READER rather
#               than for the engine: a sentence or two on what the power IS and
#               how it wants to be spent. Nothing in the GAME ever explains a
#               power — it arrives as an icon, runs for six seconds and is gone
#               — so the library is its only surface, and a power without one
#               fails the build exactly as a monster without one does.
#   stackable   several copies may run at once (a second STORM CELL doubles the
#               lightning). Off = a running copy blocks re-activation and the
#               pickup stays banked instead of being wasted.
#   uniqueHeld  at most ONE may sit in the dock at a time (the NUKE, the ward).
#   rarity      RELATIVE odds this power is the one a drop (or a stall slot)
#               rolls out of the level's pool — a WEIGHT against the engine's
#               default 100, not a probability. Omitted IS 100.
#
# RARITY: A POWERUP IS A MOMENT, NOT A RESOURCE. A level's pool is a flat list
# and it grows to fourteen entries by the bunker, so picking uniformly made the
# run-saving powers exactly as common as three orbiting fireballs — and a
# CONTINUITY PROTOCOL that turns up as often as a MAGNET is not a moment, it is
# an item slot. The weights below are the one place the catalog says how big a
# deal each power is, on a five-rung ladder:
#
#   100  the classics and the situational ones — the rain's bread and butter
#    70  a strong utility or a good area power (STASIS, MOONFALL, DUST DEVIL)
#    40  a fight-turner: crowd control, an escape, held ground
#    30  a heavy: a damage multiplier, a piercing charge, a damage sponge
#    15  the anchored black hole — the one power that deletes a doorway
#    10  the death ward, and the blow that quadruples — the two that stop
#        being a power and start being a story about the run
#
# The stall reads the same weight, both to CHOOSE what it stocks and to PRICE it
# (ECONOMY.abilityRarityMarkupCap), so coins can't buy past the rationing. A
# power authored at 0 is refused by the build: a pool entry that can never be
# picked is a content bug, not a tuning number — drop it from the pool instead.

powerups:
  # ── THE CLASSICS (SPACEZ HQ) ──────────────────────────────────────────────
  fire_orbs:
    name: FIRE ORBS
    lore: >-
      Three igniter charges off the assembly floor, lit and set turning around
      the man who lit them. It is the one power with no reach at all — the ring
      IS the weapon — so it is spent by walking INTO the crowd rather than away
      from it, and a second pickup thickens the ring rather than widening it.
    kind: orbit
    durationMs: 12000
    stackable: true
    icon: icon_fire_orbs
    look:
      core: "255, 154, 60"
      hot: "255, 236, 178"
      deep: "72, 24, 8"
      spark: "255, 196, 92"
    orbit:
      count: 3
      radius: 38
      angularSpeed: 3.2
      damage: 14
      hitCooldownMs: 140
      orbRadius: 8
      sprite: fireball

  storm_cell:
    name: STORM CELL
    lore: >-
      A charged cell that will not hold its charge, grounding itself through
      whatever body is nearest on a beat the hero has no say in. It picks its
      own target and it never misses; the only way to waste one is to be
      standing somewhere with nothing in range.
    kind: storm
    durationMs: 10000
    stackable: true
    icon: icon_storm
    storm:
      intervalMs: 450
      damage: 25
      range: 220

  stasis_field:
    name: STASIS FIELD
    lore: >-
      A holding field of the kind the pad uses on things it would rather not
      have moving. It does no damage whatsoever and it does not stop the horde
      — everything inside it simply arrives at a crawl, which is the difference
      between being surrounded and being followed.
    kind: stasis
    # A strong utility — it does not kill, it buys the room to.
    rarity: 70
    durationMs: 9000
    icon: icon_stasis
    look:
      core: "140, 214, 235"
      hot: "226, 248, 255"
      deep: "24, 58, 78"
      spark: "198, 240, 255"
    stasis:
      radius: 130
      slowFactor: 0.3

  screen_nuke:
    name: NUKE
    lore: >-
      The one power that is over the instant it is spent. It bills every body
      within sight — minion, elite and boss alike, nobody exempt — twice what
      the average one of them is carrying, so the rank and file are simply gone
      and the heavy things are merely badly hurt. It is the answer to a room,
      never the answer to a fight.
    kind: nuke
    # Instant — it never becomes a running ability.
    durationMs: 0
    # One bomb in the dock at a time: a pocket full of screen-wipes trivializes
    # every swarm.
    uniqueHeld: true
    icon: icon_nuke
    nuke:
      # Comfortably covers the phone-landscape view (half-diagonal ≈ 232 world
      # px, see AGENTS.md) from a player at its centre.
      radius: 240

  item_magnet:
    name: MAGNET
    lore: >-
      A salvage hook wound the wrong way round, hauling every loose thing on the
      floor to the man instead of the man to it. The only power in the dock that
      does no damage and grants no protection: what it buys is the loot off
      ground the hero has no business standing still on.
    kind: magnet
    durationMs: 12000
    icon: icon_magnet
    look:
      core: "232, 108, 96"
      hot: "255, 208, 168"
      deep: "70, 20, 20"
      spark: "255, 226, 150"
    magnet:
      radius: 80
      radiusPerInt: 8
      pullSpeed: 200

  # ── SPACEZ HQ: the assembly floor's own two ───────────────────────────────
  ion_wake:
    name: ION WAKE
    lore: >-
      A test-fired thruster strapped to the hero's back. He drags the engine
      wash behind him and the floor stays lit: the power is MOVEMENT, so the
      way to spend it is to run the horde over your own exhaust rather than to
      stand and burn. Two wakes lay a wider burn.
    kind: trail
    durationMs: 10000
    stackable: true
    icon: icon_ion_wake
    look:
      core: "96, 186, 255"
      hot: "226, 246, 255"
      deep: "12, 34, 62"
      spark: "168, 224, 255"
    trail:
      dropMs: 110
      patchMs: 2200
      radius: 15
      damage: 9
      tickMs: 220

  blast_shield:
    name: BLAST SHIELD
    lore: >-
      A launch-pad deflector panel, held. It eats a chunk of the hero's own
      healthbar in incoming damage and then SHATTERS — the power ends with its
      pool rather than with its clock — which makes it the one powerup that is
      spent BEFORE the blow lands rather than after it.
    kind: barrier
    # A heavy: most of the hero's own healthbar, absorbed.
    rarity: 30
    durationMs: 14000
    icon: icon_blast_shield
    look:
      core: "108, 180, 255"
      hot: "236, 248, 255"
      deep: "16, 40, 76"
      spark: "200, 232, 255"
    barrier:
      poolFrac: 0.6

  # A pressure line off the assembly floor, cut open and pointed the wrong way.
  # Nothing is conjured, nothing is thrown, nothing gets faster: every blow the
  # hero already throws simply arrives with FOUR TIMES behind it. What that does
  # to a body is the joke — the horde stops dying and starts coming apart, one
  # burst per swing, because a blow four times what a thing was holding is what
  # the gore ladder has always been waiting for (see
  # pwa/src/game/game-screen/overkill.ts). The dock's second-rarest treat, and
  # deliberately SHORT: it is a punchline, not a phase of the fight.
  overpressure:
    name: OVERPRESSURE
    lore: >-
      A regulator with its stop filed off, wired into whatever the hero is
      already holding. It adds no reach, no reactor surge cadence and nothing
      of its own to look at — it simply makes every blow four times too big for
      the body receiving it, so the horde stops falling over and starts coming
      apart. Six seconds, because the joke does not survive being told slowly.
    kind: surge
    # As rare as the death ward. A power that turns a room into a red mist
    # cannot turn up as often as three orbiting fireballs.
    rarity: 10
    durationMs: 6000
    icon: icon_overpressure
    look:
      core: "239, 71, 111"
      hot: "255, 236, 236"
      deep: "48, 8, 18"
      spark: "255, 150, 170"
    surge:
      # FOUR TIMES, and the cadence deliberately untouched at 1: REACTOR SURGE
      # already owns "hits harder AND swings faster", and the whole read here is
      # the SIZE of one blow. Speeding the swing up as well would only blur the
      # thing the power exists to show.
      damageMult: 4
      cooldownMult: 1

  # ── THE MOON: rock and ghosts ─────────────────────────────────────────────
  moonfall:
    name: MOONFALL
    lore: >-
      The sky over the far side still hasn't finished falling. Struck regolith
      comes down on the fight in twos, cratering wherever it lands. The only
      power that reaches PAST the hero's own body, so it is the one that clears
      the pack he is running away from rather than the one on top of him.
    kind: rain
    # A good area power, and the only one that reaches past the hero.
    rarity: 70
    durationMs: 9000
    stackable: true
    icon: icon_moonfall
    look:
      core: "206, 214, 226"
      hot: "255, 255, 255"
      deep: "38, 40, 50"
      spark: "232, 238, 248"
    rain:
      intervalMs: 620
      count: 2
      radius: 40
      damage: 38
      range: 190

  pale_shroud:
    name: PALE SHROUD
    lore: >-
      What ARMSTRONG has been wearing out there. For a handful of seconds the
      hero is as dead as the things chasing him: they walk him down and their
      hands go straight through. It buys time and never damage — it is the
      escape hatch, and it drifts him along faster than boots ever did.
    kind: phase
    # A fight-turner: the escape hatch out of a closed circle.
    rarity: 40
    durationMs: 5000
    icon: icon_pale_shroud
    look:
      core: "176, 226, 236"
      hot: "236, 252, 255"
      deep: "26, 48, 58"
      spark: "206, 242, 250"
    phase:
      speedMult: 1.35

  # ── MARS: the red colony ──────────────────────────────────────────────────
  dust_devil:
    name: DUST DEVIL
    lore: >-
      A rover-scale cyclone cut loose off the red desert. It HUNTS: the column
      walks itself to the nearest body, drags what it reaches into the grit and
      grinds it. Fire and forget — spend it into a crowd and go fight somewhere
      else while it works.
    kind: well
    # A good area power — fire and forget, and it hunts.
    rarity: 70
    durationMs: 11000
    icon: icon_dust_devil
    look:
      core: "206, 132, 84"
      hot: "246, 214, 156"
      deep: "62, 32, 18"
      spark: "232, 176, 112"
      wellLook: grit
    well:
      radius: 40
      damage: 13
      tickMs: 200
      pull: 22
      chase: 95

  reactor_surge:
    name: REACTOR SURGE
    lore: >-
      A tap straight off the colony's fusion stack. Nothing is conjured and
      nothing is thrown: the hero's OWN weapon runs hot, swinging harder and
      coming around faster, so what it is worth depends entirely on what he is
      holding. The power for the fight already being won, to end it before it
      turns.
    kind: surge
    # A heavy: the hero's own weapon at 1.65x, swinging faster.
    rarity: 30
    durationMs: 8000
    icon: icon_reactor_surge
    look:
      core: "255, 176, 46"
      hot: "255, 246, 214"
      deep: "78, 30, 4"
      spark: "255, 214, 120"
    surge:
      damageMult: 1.65
      cooldownMult: 0.68

  # ── THE RIFT: the void road ───────────────────────────────────────────────
  event_horizon:
    name: EVENT HORIZON
    lore: >-
      One of the road's own black holes, torn open where the hero stands and
      left there. It does not follow him: it holds that ground, hauling
      everything that comes near into the throat and crushing it. Drop it in a
      doorway and the doorway stops being one.
    kind: well
    # It deletes a doorway for six seconds. Nearly the rarest thing
    # in the dock.
    rarity: 15
    durationMs: 6500
    icon: icon_event_horizon
    look:
      core: "180, 93, 240"
      hot: "236, 214, 255"
      deep: "8, 4, 16"
      spark: "206, 150, 255"
      wellLook: void
    well:
      radius: 92
      damage: 20
      tickMs: 240
      pull: 78
      # Anchored: it holds the ground it was spent on.
      chase: 0

  the_unmaking:
    name: THE UNMAKING
    lore: >-
      The rift's answer to being walked through. A ring of nothing washes out
      of the hero on a beat, unwriting what it touches and throwing the rest
      clear. The crowd-breaker: it will not kill a boss, it gives back the room
      that was being lost.
    kind: pulse
    # A fight-turner: the crowd-breaker that gives back the room.
    rarity: 40
    durationMs: 9000
    stackable: true
    icon: icon_unmaking
    look:
      core: "168, 108, 236"
      hot: "232, 208, 255"
      deep: "14, 8, 26"
      spark: "196, 154, 255"
    pulse:
      intervalMs: 900
      radius: 128
      damage: 30
      push: 46

  # ── EASTWORLD: the robot west ─────────────────────────────────────────────
  dead_mans_hand:
    name: DEAD MAN'S HAND
    lore: >-
      A host gunslinger's last draw, still loaded. Phantom rounds crack off on
      their own and go looking for the nearest thing wearing a hat, whatever
      the hero happens to have in his hands — so it stacks on top of a build
      rather than replacing one. Two hands, two guns.
    kind: volley
    # Ordinary-ish: good damage, but it needs the hero to stay in it.
    rarity: 80
    durationMs: 10000
    stackable: true
    icon: icon_dead_mans_hand
    look:
      core: "124, 198, 255"
      hot: "240, 250, 255"
      deep: "18, 34, 58"
      spark: "196, 232, 255"
    volley:
      intervalMs: 480
      count: 2
      spread: 0.34
      speed: 320
      radius: 5
      damage: 26
      lifetimeMs: 1200
      sprite: phantom_round
      range: 240
      homing: 3.4

  iron_stampede:
    name: IRON STAMPEDE
    lore: >-
      The park's LONGHORN line, off its leash and pointed the other way. Three
      tonnes of licensed robotics comes through in a line and keeps going
      through whatever is standing in it. The heaviest thing in the dock: slow,
      wide, and it does not stop at the first body — so it is spent down the
      length of a crowd rather than into the middle of one.
    kind: volley
    # A heavy: three tonnes through eight bodies without slowing.
    rarity: 30
    durationMs: 9000
    icon: icon_iron_stampede
    look:
      core: "196, 200, 208"
      hot: "255, 236, 200"
      deep: "44, 40, 40"
      spark: "216, 190, 150"
    volley:
      intervalMs: 1400
      count: 3
      spread: 0.5
      speed: 190
      radius: 11
      damage: 52
      lifetimeMs: 2000
      sprite: longhorn_charge
      range: 300
      pierce: 8

  # ── THE BUNKER: the vault ─────────────────────────────────────────────────
  continuity_protocol:
    name: CONTINUITY PROTOCOL
    lore: >-
      What the residents actually bought down here. While it holds, the killing
      blow is not permitted: damage that would take the hero under leaves him
      standing on one hp instead. It buys a window, never a life — when it
      lapses the next blow kills like any other.
    kind: ward
    # THE RAREST POWER IN THE GAME: the killing blow is not permitted.
    # Nothing else in the dock hands a run back.
    rarity: 10
    durationMs: 7000
    uniqueHeld: true
    icon: icon_continuity
    look:
      core: "232, 185, 62"
      hot: "255, 244, 206"
      deep: "62, 44, 8"
      spark: "255, 226, 140"
    ward:
      floor: 1

  sentry_grid:
    name: SENTRY GRID
    lore: >-
      The VAULT WARDEN's own defence grid, repurposed. Four guns bolt
      themselves to the floor where the power was spent and rake everything
      that comes into the room. It holds GROUND rather than the hero: plant it
      on the choke he is about to be pushed off, then go stand somewhere else.
    kind: turret
    # A fight-turner: four guns holding a choke the hero has left.
    rarity: 40
    durationMs: 12000
    icon: icon_sentry_grid
    look:
      core: "216, 58, 58"
      hot: "255, 226, 182"
      deep: "40, 36, 40"
      spark: "255, 176, 46"
    turret:
      count: 4
      radius: 44
      intervalMs: 420
      damage: 17
      range: 210
      speed: 300
      projectileRadius: 4
      sprite: sentry_slug
