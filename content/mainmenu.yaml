# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# THE TITLE MENU — the whole tree, as content.
#
# Every screen the title menu can be on, the ORDER of its rows, each row's
# LABEL, ICON and HELP line, and which row opens which child screen. Compiled by
# `make levels` (scripts/generate-menu.mjs) into the gitignored
# `pwa/src/generated/menu.ts`, which the title-screen builders read through
# `pwa/src/game/title-screen/menu-tree.ts`.
#
# THE SHAPE LIVES HERE; THE BEHAVIOUR LIVES IN CODE. A row's `action` — what
# pressing it does, and whether it is offered at all on this build — stays in the
# `menus-*.ts` builder that owns its screen. This file is the answer to "what is
# on the menu, in what order, called what". The two meet on the row's `id`.
#
# WHY IT IS ONE FILE. Before this, the order lived in an array in one module,
# the labels in another, the page headings in a `switch` in a third, and every
# BACK row carried a HARDCODED CURSOR INDEX into the screen above it — so moving
# a settings row one place down silently landed the player's cursor on the wrong
# row three screens away. Here the hierarchy is stated once: `parent` says where
# BACK goes, the parent's own row list says where the cursor lands, and the chain
# of parents draws the heading's trail. Nothing can drift because nothing is
# written twice.
#
# ---------------------------------------------------------------------------
# A SCREEN
#
#   title:      the page heading, drawn large under the shrunken logo. Omitted
#               on `main` (its logo IS the header) and on a surface that draws
#               its own.
#   trailName:  the SHORT name this screen goes by inside a child's trail
#               (defaults to `title` — the coin vault is "THE COIN VAULT" at the
#               head of its own page and "COIN VAULT" in a child's breadcrumb).
#   trail:      override the derived breadcrumb; "" drops it entirely (the
#               campaign pickers, whose flavour titles are long enough alone).
#   tone:       player | dev | store — which accent the heading's trail and rule
#               wear. Amber belongs to the SELECTION, so a tone never gilds the
#               rows.
#   form:       menu | settings.  `settings` renders as a stable form: a
#               fixed-width column so a changing value can't shift the controls,
#               and every row's help hoisted to ONE bottom help line so flipping
#               a switch can't reflow the list. `menu` keeps the inline blurb
#               under each row.
#   parent:     where BACK (and Escape) goes. Required on every screen but
#               `main`; the chain must reach `main`.
#   home:       which row of the parent the cursor lands on coming back.
#               Defaults to the parent row that `opens` this screen, so it is
#               only written where code opens the screen instead.
#   surface:    full | column — the screen draws its OWN surface instead of a
#               row list (the achievements shelf, the arsenal, the vault, the
#               effects gallery draw `full`; the high-score board rides in the
#               menu column, so `column`).
#   scroll:     true when the row list can genuinely outgrow a short viewport
#               and should cap and scroll on its own (measured — see
#               `useMenuOverflow`).
#   notice:     true when the import/export/purchase result line shows under it.
#   dev:        true for the hidden DEVELOPER tree — folded out of the store
#               build entirely (`__DEV_TOOLS__`). A dev screen's children are
#               dev too, and the build refuses a plain screen under a dev one.
#
# A ROW
#
#   id:         what the builder matches on, and what a BACK row homes onto.
#   label:      what it says. Uppercase; every glyph must be in the pixel font.
#   icon:       a sprite drawn as the row's own emblem. TOUCH ONLY — a mouse
#               keeps the wisp cursor — so it is what makes a row look pressable
#               on a phone. Carried by NAVIGATION rows (a row that goes
#               somewhere), never by a plain switch or slider: an icon beside
#               every setting is noise, an icon beside every destination is a
#               map.
#   help:       one line, in the present tense, saying what the row DOES right
#               now. Either a plain string, or a map of STATE to line for a row
#               whose help depends on what it is set to — never both states in
#               one line ("ON … - OFF …" makes the reader pick their own half
#               out of a table). A row whose help is computed (a live cloud sync
#               state, a level's clear status) carries none here and words
#               itself in code.
#   opens:      the child screen this row navigates to.
#
# Rows that come from a CATALOG rather than from here — the difficulty ladder,
# the mission list, the rebindable actions, the balance knobs, the roster, the
# installed mods, the coin packs — are built in code from that catalog. A screen
# then lists only its own fixed rows (a RESET, a START), in the place they sit.
#
# THE BACK ROW IS NEVER WRITTEN DOWN. Every screen but `main` ends with one, and
# it is appended from `parent` + `home` — so a screen cannot forget it, and
# cannot point it somewhere the tree does not agree with.
# ---------------------------------------------------------------------------

screens:
  # =========================================================================
  # THE FRONT DOOR
  #
  # The play block leads, exactly as it has since Doom: the thing 90% of players
  # came for is the first thing the cursor is already on. RESUME above NEW GAME
  # only when a run is actually parked; NEW GAME above LOAD GAME because a first
  # launch has nothing to load.
  #
  # Everything that is NOT playing sits below it, and everything that is neither
  # playing nor configuring is folded into EXTRAS — the established shelf for
  # the badges, the boards, the reference and the odds and ends. Flat, that
  # material ran the front door to eleven rows on a phone held in landscape,
  # which is the length at which a menu stops being read and starts being
  # scanned.
  # =========================================================================
  main:
    tone: player
    form: menu
    rows:
      # Offered only while a run sits parked in memory.
      - id: resume
        label: RESUME
        icon: icon_menu_resume
      - id: new-game
        label: NEW GAME
        icon: icon_menu_new
      # Absent until a hero exists to load — not greyed out. A dead row owes the
      # player a line explaining its grey, and that line is a second row of text
      # hanging off a centred column; the working row's label says everything on
      # its own, so it carries no help at all.
      - id: load-game
        label: LOAD GAME
        icon: icon_menu_load
      # A play action, not a document: it launches a real self-playing run. So
      # it stays with the play block rather than going down into EXTRAS, where a
      # first-time player would never look for it.
      - id: how-to-play
        label: HOW TO PLAY
        icon: icon_menu_help
      # MINIGAMES — the arcade shelf, played on its own for the score. With the
      # PLAY block because that is what it is: a way to play, not a shelf to
      # look at. Absent until a hero on this roster has BEATEN a whole campaign
      # — the shelf is what finishing the game buys — and it carries no help
      # line for the same reason the three verbs above it don't: a front-door
      # row that needs a sentence is a row with the wrong label.
      - id: minigames
        label: MINIGAMES
        icon: icon_menu_minigames
        opens: minigames
      # MULTIPLAYER — Steam builds only (a phone has no listening socket and a
      # browser tab is not a server). It sits with the PLAY block because it is
      # a way to play rather than a preference, and below HOW TO PLAY because a
      # first launch has nobody to play with yet.
      - id: multiplayer
        label: MULTIPLAYER
        icon: icon_menu_cloud
        opens: multiplayer
      # The coin store — native app builds only (purchases need the platform's
      # own store). Struck out of gold by the builder; no help line, because a
      # row that glitters has already said what it is.
      - id: store
        label: STORE
        icon: icon_coins
        opens: store
      # MODS — Steam builds only, and on the FRONT DOOR rather than under
      # SETTINGS because a total conversion is a second way into the game, not a
      # preference.
      - id: mods
        label: MODS
        icon: icon_menu_mods
        opens: mods
      - id: extras
        label: EXTRAS
        icon: icon_menu_extras
        opens: extras
      - id: settings
        label: SETTINGS
        icon: icon_menu_settings
        opens: settings
      # Desktop only, and always last — the one row every PC player expects to
      # find at the bottom of a main menu. A browser tab cannot close itself and
      # a phone has a home button, so it exists in the Steam shell alone.
      - id: quit
        label: QUIT
        icon: icon_menu_quit

  # =========================================================================
  # EXTRAS — the shelf: what the roster has earned, what it lost, and the
  # reference. Every row here is something to LOOK at rather than something to
  # set, which is what makes it one screen instead of three main-menu rows.
  # =========================================================================
  extras:
    title: EXTRAS
    parent: main
    tone: player
    form: menu
    rows:
      - id: achievements
        label: ACHIEVEMENTS
        icon: icon_medal
        help: EVERY BADGE THIS ROSTER HAS EARNED
        opens: achievements
      # Hardcore-only (softcore banks no score), so the row appears once a
      # hardcore hero has played a campaign to its end — or wherever the
      # platform's own WORLD RANKINGS can be reached, which any player has a
      # standing on from their first run.
      - id: high-scores
        label: HIGH SCORES
        icon: icon_trophy
        help: THE HARDCORE CAMPAIGN BOARD, RUN BY RUN
        opens: scores
      # Only once a paid AUTO PILOT ride has actually thrown something away.
      - id: lost-found
        label: LOST & FOUND
        icon: icon_bag
        help: BUY BACK WHAT THE AUTO PILOT THREW AWAY
        opens: vault
      # The pictures the player took — with the SCREENSHOT key, or with the
      # SHUTTER on the gear rail, which is what a thumb has instead of a key.
      - id: screenshots
        label: SCREENSHOTS
        icon: icon_menu_screenshots
        help: THE PICTURES YOU TOOK - VIEW, SHARE, SAVE
        opens: screenshots
      # Leaves the app for the static reference site. A real link, not a screen:
      # the library is documents, and carries none of the game's JavaScript.
      - id: library
        label: LIBRARY
        icon: icon_menu_library
        help: THE FIELD GUIDE - MONSTERS, RELICS, MISSIONS
      # Leaves the app entirely, for the chat server the players keep. Last on
      # the shelf because it is the only row that goes somewhere this project
      # does not serve, and absent from any build that was not given an address
      # to send them to (COMMUNITY_URL — see the builder).
      - id: community
        label: COMMUNITY
        icon: icon_menu_community
        help: TALK TO OTHER PLAYERS - CHAT, TIPS AND RUNS

  # =========================================================================
  # SETTINGS — six pages, and the split between them is the one players already
  # know from every other game they own:
  #
  #   GAMEPLAY   what the game DOES for you (loot, powers, story beats)
  #   CONTROLS   how you tell it what to do
  #   INTERFACE  what the HUD draws over the field
  #   GORE       how much of a mess a kill makes
  #   AUDIO      how loud
  #   DATA       where your heroes live
  #
  # Getting this wrong is invisible and expensive: a player looking for "turn
  # off the blood" opens GORE, and a player looking for "stop wearing every
  # sword I pick up" opens GAMEPLAY. Nobody hunts, because nobody has to learn
  # THIS game's filing system — which is also why the index carries no help
  # lines. A blurb under each of seven destinations is a second line the reader
  # does not need, and it ran BACK clean off the bottom of a landscape phone.
  # =========================================================================
  settings:
    title: SETTINGS
    parent: main
    tone: player
    form: menu
    rows:
      - id: gameplay
        label: GAMEPLAY
        icon: icon_swords
        opens: gameplay
      # Absent where the page behind it would be blank — a touch device with no
      # vibration motor has nothing on CONTROLS at all (see below).
      - id: controls
        label: CONTROLS
        icon: icon_menu_controls
        opens: controls
      - id: interface
        label: INTERFACE
        icon: icon_menu_interface
        opens: interface
      # Absent where the DEVICE says no mature content (see the GORE screen
      # below) — a parental control the game still offers to defeat is not one.
      - id: gore
        label: GORE
        icon: icon_skull
        opens: gore
      - id: audio
        label: AUDIO
        icon: icon_menu_sound
        opens: audio
      # Absent on every build that carries no VOICE capability, which is every
      # browser, every phone, and every desktop build not stamped with it — so
      # this row is the one settings entry most players never see. It is its own
      # page rather than three rows on AUDIO because it is not "how loud": it
      # opens a microphone, which is a different kind of question and the one
      # players go looking for under its own name.
      # The COMMUNITY icon rather than the SOUND one, and for a better reason
      # than the schema's one-icon-per-screen rule (AUDIO above already wears
      # SOUND): this row is not about loudness, it is about the other people in
      # the room. A dedicated microphone sprite would be better still and is
      # deliberately left to an art pass rather than drawn here.
      - id: voice
        label: VOICE CHAT
        icon: icon_menu_community
        opens: voice
      - id: data
        label: DATA
        icon: icon_menu_data
        opens: data
      # Hidden until the sun gesture unlocks it, and absent from the store build
      # altogether.
      - id: developer
        label: DEVELOPER
        icon: icon_wrench
        opens: developer

  # -------------------------------------------------------------------------
  # SETTINGS -> GAMEPLAY — the four things the game will do on the player's
  # behalf, and whether the story is allowed to interrupt.
  # -------------------------------------------------------------------------
  gameplay:
    title: GAMEPLAY
    parent: settings
    tone: player
    form: settings
    rows:
      - id: auto-equip
        label: AUTO-EQUIP
        help:
          on: STRONGER FINDS GO ON THE MOMENT YOU GRAB THEM
          off: STRONGER FINDS WAIT IN THE BAG UNTIL YOU WEAR THEM
      - id: powerups
        label: POWERUPS
        help:
          auto: POWERS FIRE THE MOMENT YOU GRAB THEM
          manual: TAP A POWERUP SLOT / CLICK / E / 1-3 SPENDS ONE
      # Touch devices only (the builder drops it elsewhere): a one-hand
      # accessibility mode — swipe in from a screen edge and the item/powerup
      # bars open right under the thumb, bigger, wherever along the edge the
      # swipe landed. Sits under POWERUPS because it is the next question
      # about the same slots: HOW you reach them.
      - id: swipe-bars
        label: SWIPE BARS
        help:
          on: SWIPE IN FROM A SCREEN EDGE - THE BARS OPEN AT YOUR THUMB
          off: THE ITEM AND POWERUP BARS SIT FIXED IN THE CORNERS
      - id: quick-draw
        label: QUICK DRAW
        help:
          dps: THE SWITCHER LEADS WITH YOUR HARDEST HITTER
          bag: THE SWITCHER LISTS WEAPONS THE WAY YOUR BACKPACK DOES
      - id: dialogue
        label: DIALOGUE
        help:
          on: ARRIVALS, THOUGHTS AND LORE PLAY IN-WORLD
          off: IN-WORLD TALK STAYS SILENT
      - id: cutscenes
        label: CUTSCENES
        help:
          on: THE PRELUDE SCENES PLAY BEFORE A LEVEL
          off: A LEVEL STARTS STRAIGHT AWAY - NO PRELUDE
      # Sits under CUTSCENES because it is the same kind of answer — whether
      # the game hands you something between one place and the next. A minigame
      # pays no loot and no XP and cannot cost you the run, so this is not a
      # difficulty row; a party skips them whatever it says.
      - id: minigames
        label: MINIGAMES
        help:
          on: DRIVE THE CAR YOURSELF BETWEEN THE GARAGE AND GOODCO
          off: THE TRIP IS A STRAIGHT CUT - NO DRIVING
      # Sits under CUTSCENES because it is the same kind of answer — whether the
      # game stops to show you something. Deliberately NOT beside the blood
      # knobs on GORE: those decide what a death LOOKS like, this decides
      # whether there is a scene at all.
      - id: death-scenes
        label: DEATH SCENES
        help:
          on: BOSSES DIE ON THEIR KNEES - YOUR OWN DEATH GETS A SEND-OFF
          off: A BOSS DIES WHERE IT STOOD - DEATH GOES STRAIGHT TO THE SPLASH

  # -------------------------------------------------------------------------
  # SETTINGS -> CONTROLS — the mouse/keys rows are desktop-only (touch always
  # steers by holding and dragging), and VIBRATION shows only where a buzz can
  # land, so this screen is a different length on every device — down to NO
  # ROWS AT ALL on a touch device with no motor (iOS in a browser or an
  # installed PWA). The SETTINGS index drops its own CONTROLS row when that
  # happens, so nobody is ever walked to a page holding nothing but BACK.
  # -------------------------------------------------------------------------
  controls:
    title: CONTROLS
    parent: settings
    tone: player
    form: settings
    rows:
      # STEERING rather than MOUSE: the row picks between input DEVICES now, and
      # "MOUSE: GAMEPAD" would be nonsense.
      - id: steering
        label: STEERING
        help:
          hover: THE HERO CHASES THE CURSOR - CLICK USES AN ITEM
          aim: WASD WALKS - THE POINTER AIMS - CLICK SHOOTS
          gamepad: THE LEFT STICK WALKS - PUSH FURTHER TO RUN - A STRIKES
      - id: auto-fire
        label: AUTO-FIRE
        help:
          on: THE HERO SHOOTS ANYTHING IN SIGHT ON HIS OWN
          # The trigger is a different thing in each mode, so the line names the
          # one the player is actually holding.
          click: THE HERO FIRES ONLY WHILE YOU HOLD THE CLICK
          button: THE HERO STRIKES ONLY WHILE YOU HOLD THE BUTTON
      - id: keys
        label: KEYS
        help:
          wasd: STEER WITH THE KEYBOARD - REBIND IN KEY BINDINGS
          mouse: STEERING STAYS ON THE MOUSE
          # Locked at WASD MOVE in the two modes that always walk by keyboard —
          # the greyed row SHOWS that instead of hiding where the movement went.
          aim: AIM & SHOOT ALWAYS WALKS BY KEYBOARD
          gamepad: THE STICK WALKS - WASD STILL WORKS ALONGSIDE IT
      - id: vibration
        label: VIBRATION
        help:
          on: THE PHONE BUZZES ON HITS, DEATH, MENUS & DIALOGUE
          off: THE PHONE STAYS STILL - NOTHING BUZZES
      - id: keybindings
        label: KEY BINDINGS
        help: REBIND EVERY DESKTOP KEY - MOVEMENT, ACTIONS, THE DOCK
        opens: keybindings

  # One row per rebindable action (from the keybinding catalog), Quake style:
  # the action at the left, its bound key far right.
  keybindings:
    title: KEY BINDINGS
    parent: controls
    tone: player
    form: settings
    scroll: true
    rows:
      - id: reset
        label: RESET TO DEFAULTS
        help: RESTORE THE SHIPPED WASD + ACTION KEY SCHEME

  # -------------------------------------------------------------------------
  # SETTINGS -> INTERFACE — everything the HUD draws over the field, and where
  # it sits. Ordered by how much of the screen it occupies: the bars riding the
  # mobs, then the numbers off a kill, then the cards, then the map, then the
  # thumb furniture.
  # -------------------------------------------------------------------------
  interface:
    title: INTERFACE
    parent: settings
    tone: player
    form: settings
    rows:
      - id: health-bars
        label: HEALTH BARS
        help:
          on: A TINY HP BAR RIDES OVER EVERY WOUNDED MOB
          off: NO HP BARS - READ A MOB'S WOUNDS OFF ITS SPRITE
      - id: xp-float
        label: XP ON KILL
        help:
          on: A BLUE +N XP FLOATS OFF EACH KILL
          off: KILLS PAY OUT QUIETLY - NO FLOATING NUMBERS
      # The value column already names the tier this is set to, so the help says
      # what that setting DOES rather than repeating the rarity.
      - id: item-cards
        label: ITEM CARDS
        help:
          every: EVERY FIND POPS A FRAMED LOOT CARD
          tier: QUIETER FINDS DROP TO THE CORNER FEED INSTEAD
      - id: minimap
        label: MINIMAP
        help:
          follow: A CLOSE-UP HOVERS OVER THE HERO AS HE MOVES
          full: THE WHOLE LEVEL FITS IN THE FRAME
      - id: quick-bars
        label: QUICK BARS
        help:
          right: THE BIG POWERUP SLOTS SIT BY YOUR RIGHT THUMB
          left: THE BIG POWERUP SLOTS SIT BY YOUR LEFT THUMB

  # -------------------------------------------------------------------------
  # SETTINGS -> GORE — one switch per kind, because "is this too much"
  # is not one question. Three groups, in the order a player thinks about them:
  #
  #   WHOSE GORE         one row per gore FAMILY (game-screen/gore.ts). A player
  #                      who does not want to see a PERSON come apart is not
  #                      asking for a rover to stop throwing sparks, and the one
  #                      EXTRA GORE switch this replaced gave them no way to say
  #                      so. HUMAN GORE off with the other three on is exactly
  #                      that.
  #   WHAT A KILL DOES   the two ways a body comes apart. They cross every
  #                      family: a machine cut in two is still a body cut in two.
  #   WHAT IT LEAVES     blood on the hero and the trail his boots carry out.
  #                      Both are blood's own art in blood's own colours, so both
  #                      are meaningless with HUMAN GORE off — shown LOCKED there
  #                      rather than hidden, the way the KEYS row shows where the
  #                      movement went.
  # -------------------------------------------------------------------------
  gore:
    title: GORE
    parent: settings
    tone: player
    form: settings
    # Eight switches and a reset — longer than any other settings page, so it
    # caps and scrolls under a header and help line that stay put.
    scroll: true
    rows:
      - id: blood
        label: HUMAN GORE
        help:
          on: PEOPLE BLEED WITH THE BLOW AND THE FLOOR STAYS RED
          off: PEOPLE TAKE A SMALL SPLASH AND LEAVE A CLEAN FLOOR
      - id: ecto
        label: GHOST GORE
        help:
          on: HAUNTINGS BURST IN COLD GREEN ECTOPLASM
          off: HAUNTINGS TAKE A SMALL SPLASH AND NOTHING MORE
      - id: sparks
        label: ROBOTIC GORE
        help:
          on: MACHINES THROW OIL, SPARKS AND SMOKE
          off: MACHINES TAKE A SMALL SPLASH AND NOTHING MORE
      - id: cosmic
        label: COSMIC GORE
        help:
          on: RIFT THINGS COME APART IN COLD LIGHT THAT GOES OUT
          off: RIFT THINGS TAKE A SMALL SPLASH AND NOTHING MORE
      - id: cleaves
        label: CLEAVES
        help:
          on: A BLADE FAR PAST WHAT A BODY HOLDS CUTS IT IN TWO
          off: BODIES A BLADE OVERKILLS TOPPLE IN ONE PIECE
      - id: gibs
        label: GIBS
        help:
          on: A HUGE BLUNT BLOW BURSTS THE BODY INTO PIECES
          off: BODIES A BLUNT BLOW OVERKILLS TOPPLE IN ONE PIECE
      - id: hero-soak
        label: BLOODY HERO
        help:
          on: WHAT SPRAYS BACK STAYS ON THE GEAR YOU ARE WEARING
          off: YOUR GEAR STAYS CLEAN NO MATTER WHAT YOU KILL
          # The two states BLOOD off leaves them in — the row is greyed, and its
          # line says where the setting went rather than what it does.
          locked: NOTHING TO WEAR WHILE HUMAN GORE IS OFF
      - id: bootprints
        label: BOOTPRINTS
        help:
          on: YOUR BOOTS TRACK BLOOD OUT ONTO CLEAN GROUND
          off: YOUR BOOTS LEAVE NOTHING BEHIND THEM
          locked: NOTHING TO TRACK WHILE HUMAN GORE IS OFF
      - id: reset
        label: RESET ALL
        help: PUT EVERY KIND OF GORE BACK THE WAY THE GAME SHIPPED

  # -------------------------------------------------------------------------
  # SETTINGS -> AUDIO — MUTE on top as a straight switch (it silences everything
  # while the sliders keep their values, so unmuting restores the exact mix),
  # then the two levels.
  # -------------------------------------------------------------------------
  audio:
    title: AUDIO
    parent: settings
    tone: player
    form: settings
    rows:
      - id: mute
        label: MUTE
        help:
          on: EVERYTHING IS SILENT - THE SLIDERS KEEP THEIR LEVELS
          off: SOUND PLAYS AT THE LEVELS BELOW
      - id: music
        label: MUSIC
        help: HOW LOUD THE THEME PLAYS
      - id: sfx
        label: SOUND FX
        help: HOW LOUD BLASTERS, GHOSTS AND PICKUPS PLAY

  # -------------------------------------------------------------------------
  # SETTINGS -> VOICE CHAT — talking to the party, on the builds that carry it.
  #
  # MODE on top, because it is the only row that can turn the microphone on at
  # all and every row under it is meaningless until it has: a page that opened
  # with a level slider for a device nobody had opened would be three dead
  # controls over the one that matters. Then what the OTHERS sound like, then
  # what YOU sound like, then the gate that only OPEN MIC reads.
  #
  # THE KEY IS NOT ON THIS PAGE, deliberately — PUSH TO TALK is rebound in
  # SETTINGS -> CONTROLS -> KEY BINDINGS with every other key, because a player
  # looking for "which key do I hold" looks where the keys are.
  # -------------------------------------------------------------------------
  voice:
    title: VOICE CHAT
    parent: settings
    tone: player
    form: settings
    rows:
      - id: mode
        label: VOICE
        help:
          off: YOUR MICROPHONE STAYS CLOSED - NOBODY HEARS YOU
          ptt: HOLD THE TALK KEY TO SPEAK - SETTINGS - CONTROLS REBINDS IT
          open: YOU ARE HEARD WHENEVER YOU SPEAK UP
      - id: volume
        label: THEIR VOICES
        help: HOW LOUD THE REST OF YOUR PARTY IS
      - id: mic
        label: YOUR MICROPHONE
        help: HOW LOUD YOU ARE TO THEM - WATCH THE BAR WHILE YOU TALK
      - id: threshold
        label: OPEN MIC GATE
        help:
          open: HOW LOUD YOU MUST BE BEFORE THEY HEAR YOU
          idle: ONLY READ IN OPEN MIC - SET VOICE ABOVE TO OPEN MIC

  # -------------------------------------------------------------------------
  # SETTINGS -> DATA — the two ways a hero leaves this device, and each build
  # gets exactly one of them: CLOUD SAVE in the store app, EXPORT/IMPORT on the
  # web. The CLOUD SAVE row words itself from the live sync state.
  # -------------------------------------------------------------------------
  data:
    title: DATA
    parent: settings
    tone: player
    form: settings
    notice: true
    rows:
      - id: cloud-save
        label: CLOUD SAVE
        icon: icon_menu_cloud
      - id: export
        label: EXPORT CHARACTER
        icon: icon_menu_export
        help: SAVE ONE OR MORE HEROES TO FILES
        opens: export
      - id: import
        label: IMPORT CHARACTER
        icon: icon_menu_import
        help: LOAD A HERO EXPORTED FROM ANOTHER DEVICE

  # A ticked list of the WHOLE roster, then one download per ticked hero.
  export:
    title: EXPORT CHARACTER
    parent: data
    tone: player
    form: settings
    scroll: true
    notice: true
    rows:
      - id: none
        label: NO HEROES YET
        help: CREATE A HERO FROM PLAY - NEW GAME FIRST
      - id: confirm
        label: EXPORT
        icon: icon_menu_export
        help:
          ready: DOWNLOAD THE TICKED HEROES AS SIGNED FILES
          empty: TICK A HERO ABOVE TO EXPORT

  # =========================================================================
  # THE CAMPAIGN PICKERS — difficulty, then mission. Opened from NEW GAME /
  # LOAD GAME (through the roster) and from the developer warp, which ignores
  # every unlock gate and backs out to the PLAYGROUND page that armed it.
  #
  # Both drop the breadcrumb: their flavour titles are long enough on a phone
  # without one, and the screen above is a single press away.
  # =========================================================================
  difficulty:
    title: CHOOSE YOUR NIGHTMARE
    trail: ""
    parent: main
    home: new-game
    tone: player
    form: menu
    rows: []

  levels:
    title: CHOOSE YOUR MISSION
    trail: ""
    parent: difficulty
    home: dynamic
    tone: player
    form: menu
    scroll: true
    rows: []

  # =========================================================================
  # MINIGAMES — the arcade shelf: the cabinets a BEATEN CAMPAIGN has earned,
  # played on their own for the score and nothing else.
  #
  # THE CABINETS COME FROM THE CATALOG, not from here, and they stand ABOVE the
  # one authored row: a screen opened to play something should open with the
  # cursor already on the thing to play. DIFFICULTY sits under them because it
  # is an adjustment to the next go rather than a destination — it decides what
  # the road WEIGHS, which is the only thing a rung changes about a minigame
  # (engine/game/drive/index.ts), and the board it feeds is one board for every
  # rung and tags each row with the one it was set on.
  #
  # AND IT OFFERS ONLY WHAT HAS BEEN FINISHED: a rung is on this row once the
  # whole campaign has been beaten on it, which is the same key that put the
  # shelf on the front door. With one rung earned there is nothing to cycle and
  # the row greys.
  #
  # NOT A LINE OF HELP ON THE SCREEN, deliberately. Every row here says what it
  # is in its own label and its own value — a cabinet's name, a rung — and a
  # grey second line under each of them was clutter around a list of three
  # things. The front door above it makes the same call for the same reason.
  # =========================================================================
  minigames:
    title: MINIGAMES
    parent: main
    tone: player
    form: menu
    rows:
      - id: difficulty
        label: DIFFICULTY

  # =========================================================================
  # MULTIPLAYER — the three doors (HOST, the server browser, JOIN BY ADDRESS),
  # Steam builds only.
  #
  # HOST and JOIN are two different questions and they are asked on two
  # different screens, deliberately: hosting is a handful of settings answered
  # once and then largely forgotten, and joining is a list you look at every
  # time. A single screen carrying both makes the list the smaller half of a
  # settings page.
  # =========================================================================
  multiplayer:
    title: MULTIPLAYER
    parent: main
    tone: player
    form: menu
    rows:
      - id: host-game
        label: HOST GAME
        icon: icon_menu_new
        help: OPEN YOUR NEXT RUN TO FRIENDS
        opens: host
      - id: join-game
        label: JOIN GAME
        icon: icon_menu_load
        help: TAKE A SEAT IN A GAME SOMEBODY IS HOSTING
        opens: sessions
      - id: join-address
        label: JOIN BY ADDRESS
        icon: icon_menu_import
        help: TYPE THE ADDRESS A HOST GAVE YOU
        opens: address

  # The session's own settings. A form rather than a list: every row here is a
  # value, and the one thing it does not carry is the mission — HOST GAME walks
  # into the ordinary difficulty and level pickers, because a hosted session IS
  # a run and there is no second way to choose one.
  host:
    title: HOST GAME
    parent: multiplayer
    tone: player
    form: settings
    rows:
      - id: doors
        label: OPEN TO
        help:
          both: FRIENDS ON STEAM AND ANYBODY WITH YOUR ADDRESS
          steam: STEAM FRIENDS ONLY - NO PORT TO OPEN
          direct: ANYBODY WITH YOUR ADDRESS
      - id: max-players
        label: PLAYERS
        help: HOW MANY SEATS THE SESSION HAS - YOURS INCLUDED
      # A bot seat is a real client seat that yields the moment a person wants
      # it, so the row reads as "how full the party starts" rather than a cap.
      - id: bots
        label: BOTS
        help: FILL EMPTY SEATS WITH AUTOPILOT HEROES
      # Free for all is the shipped answer and the row exists for the other
      # case: the scramble for a legendary is what makes a party feel like a
      # party among friends, and what makes strangers stop playing together.
      - id: loot
        label: LOOT
        help:
          free: ANY DROP GOES TO WHOEVER REACHES IT FIRST
          allocated: EVERY DROP IS SET ASIDE FOR ONE PLAYER
      - id: password
        label: PASSWORD
        help:
          set: JOINERS MUST TYPE IT - PRESS TO CHANGE IT
          none: ANYBODY WHO FINDS THE GAME CAN JOIN IT
      # The port the socket TRIES. What it GOT is a different number and is
      # printed by the session panel in the run (server/net/udp.ts), which is
      # the rule this row exists to not break.
      - id: port
        label: PORT
        help:
          direct: THE PORT TO TRY FIRST FOR DIRECT CONNECTIONS
          steam: NOT USED WHILE ONLY STEAM FRIENDS CAN JOIN
      # One press, once, and only when the check says a rule is missing. Never
      # at launch and never without being asked — a game that pops an
      # elevation prompt when it starts is a game people uninstall.
      - id: firewall
        label: FIREWALL
      - id: start
        label: START A HOSTED GAME
        icon: icon_swords
        help: PICK A DIFFICULTY AND A MISSION AS USUAL

  # The browser. Rows come from the lobbies this Steam account can see, so the
  # screen authors only the two alternates that stand in for an empty list and
  # the row that refills it.
  sessions:
    title: JOIN GAME
    parent: multiplayer
    tone: player
    form: menu
    scroll: true
    rows:
      - id: searching
        label: LOOKING FOR GAMES...
      - id: empty
        label: NO GAMES FOUND
        help: ONLY GAMES OPEN TO STEAM FRIENDS SHOW UP HERE
      - id: refresh
        label: REFRESH
        icon: icon_menu_resume

  # The typed door. The list is the addresses this device has joined before —
  # a LAN party is one press after the first time — and the row above it is
  # where a new one is typed.
  address:
    title: JOIN BY ADDRESS
    parent: multiplayer
    tone: player
    form: menu
    scroll: true
    rows:
      - id: enter
        label: TYPE AN ADDRESS
        icon: icon_menu_import
        help: HOST AND PORT - LIKE 192.168.1.42:27015
      - id: empty
        label: NOTHING JOINED YET

  # =========================================================================
  # MODS — every installed mod in LOAD ORDER, and the way into them. Steam
  # builds only.
  # =========================================================================
  mods:
    title: MODS
    parent: main
    tone: player
    form: menu
    notice: true
    rows:
      # Compiling a folder of YAML per mod takes a moment on a cold disk, and an
      # empty list would read as "you have no mods" — a different and wrong
      # answer. Both stand in for the list itself, so only ever one of the three
      # is on screen.
      - id: loading
        label: LOADING...
      - id: empty
        label: NO MODS INSTALLED
        help: SUBSCRIBE ON THE WORKSHOP - THEY APPEAR HERE
      - id: order
        label: LOAD ORDER
        help:
          many: WHICH MOD WINS WHEN TWO SHIP THE SAME THING
          one: NOTHING TO ORDER WITH ONLY ONE MOD
        opens: modorder
      - id: play
        label: PLAY WITH THESE MODS
        help:
          none: SWITCH AT LEAST ONE MOD ON FIRST
      # The two folders the game reads, so "where do I put it" is answered on
      # the screen rather than in a document nobody opened. Pressing one opens
      # it in the desktop's own file manager; the list re-reads itself every
      # time this screen is entered, so dropping a mod in and coming back is
      # the whole loop. GAME FOLDER is absent where the platform has none.
      - id: folder-mods
        label: OPEN MODS FOLDER
        help: DROP A MOD OR A .ZIP IN, THEN COME BACK
      - id: folder-game
        label: OPEN GAME FOLDER
        help: ITS MODS/ FOLDER IS READ TOO

  # ONE MOD, opened from the list: what its author says it puts in the game, and
  # the switch that decides whether it does. The list can only say ON or OFF and
  # count what a mod ships; this is where the mod's own words are — its
  # description, and its manifest's line for every file the game loads.
  #
  # The switch lives HERE rather than on the list row for a reason worth keeping:
  # switching on a total conversion changes what the game IS, and a screen that
  # first tells the player what a mod does and then offers the switch is the
  # order those two things belong in.
  modinfo:
    # The heading is the MOD'S OWN NAME, put there by the builder (see
    # `headingFor`) — this is the fallback for the case that cannot happen from
    # the UI, a mod page with no mod on it.
    title: MOD
    trail: MODS
    parent: mods
    home: dynamic
    tone: player
    form: menu
    scroll: true
    notice: true
    rows:
      - id: enabled
        label: ENABLED
        help:
          broken: IT DID NOT COMPILE - NOTHING TO SWITCH ON
      - id: publish
        label: PUBLISH TO WORKSHOP
        help: UPLOADS THIS FOLDER - UPDATES THE SAME ITEM
      # A mod compiled before its manifest could carry an inventory, or one
      # whose author left it out. The counts on the row above still say what it
      # ships; only the per-file words are missing.
      - id: undeclared
        label: IT LISTS NO CONTENTS
        help: ITS AUTHOR DID NOT SAY WHAT ITS FILES ARE

  modorder:
    title: LOAD ORDER
    parent: mods
    tone: player
    form: menu
    scroll: true
    rows:
      - id: none
        label: NOTHING TO ORDER

  # =========================================================================
  # THE SURFACES — screens that draw their own display rather than a row list.
  # They still hang in the tree, because BACK and Escape have to know where they
  # came from.
  # =========================================================================
  achievements:
    parent: extras
    tone: player
    surface: full

  vault:
    parent: extras
    tone: player
    surface: full

  # The screenshot roll — its own viewer, and the same one a live run raises
  # when the player presses the flash the SCREENSHOT key throws up.
  screenshots:
    parent: extras
    tone: player
    surface: full

  # The board draws itself but rides IN the menu column, so it takes the shared
  # page header rather than printing a title of its own.
  scores:
    title: HIGH SCORES
    parent: extras
    tone: player
    surface: column

  # =========================================================================
  # THE COIN VAULT — the one tree that keeps its warm gold banner. Native app
  # builds only.
  # =========================================================================
  store:
    title: THE COIN VAULT
    trailName: COIN VAULT
    parent: main
    tone: store
    form: menu
    notice: true
    rows:
      # The coin packs are the catalog's, and stand above this row. What is
      # bought lands in the UNDISTRIBUTED bank; this is where it is handed out,
      # so its help counts the bank when there is one.
      - id: distribute
        label: DISTRIBUTE
        help:
          empty: NOTHING UNDISTRIBUTED
        opens: storehero

  # A tapped pack pauses here before anything is spent, so a mis-tap on a coin
  # row cannot charge the player (or, in a free build, bank coins) by itself.
  storeconfirm:
    title: STRIKE GOLD
    parent: store
    home: dynamic
    tone: store
    form: menu
    notice: true
    rows:
      # The builder appends the pack's size to the label. A FREE grant needs no
      # help line — the row's own FREE price tag says it.
      - id: buy
        label: BUY
        help:
          paid: CHARGED VIA THE STORE
      - id: cancel
        label: CANCEL

  # Every living hero is offered with their current purse; the fallen keep their
  # graves, since coins cannot help them.
  storehero:
    title: DISTRIBUTE
    parent: store
    tone: store
    form: menu
    notice: true
    rows:
      - id: none
        label: NO HEROES YET
        help: CREATE A HERO FROM PLAY - NEW GAME FIRST

  # A hero is picked: the slider spans 0 to everything undistributed, and SEND
  # commits it. The remainder simply stays banked for later.
  storesend:
    title: DISTRIBUTE
    trail: COIN VAULT
    parent: storehero
    home: dynamic
    tone: store
    form: menu
    notice: true
    rows:
      - id: amount
        label: AMOUNT
      - id: send
        label: SEND
        help:
          empty: SLIDE TO PICK AN AMOUNT
      - id: none
        label: NOTHING TO SEND

  # =========================================================================
  # THE DEVELOPER TREE — hidden behind the two-movement sun gesture, and
  # compiled out of the store build entirely.
  #
  # THE INDEX IS A SET OF DOORS, NOT A DRAWER OF TOOLS. Flat, this page ran to
  # twelve rows of four unrelated kinds — two warps, two galleries, two minting
  # cheats, two tuning subpages, three switches and a cycled label — in one
  # column a developer had to READ every time to find the row they came for.
  # The rows are the same rows; they are now filed by WHAT KIND OF THING THEY
  # DO, so the index is scanned once and the page behind it holds one kind:
  #
  #   PLAYGROUND  a run — how it is carved, how the hero grows, what is drawn
  #               over it, and two doors into one
  #   CHEATS      putting into the save what a run would have to earn
  #   BALANCE     the engine's numbers
  #   VISUALS     what the game looks like
  #   GALLERIES   browsing what the game ships
  #
  # EVERY ROW HERE IS A DOOR, WITH NO EXCEPTION PARKED BESIDE THEM, and that is
  # also what keeps the page off the scrollbar: five rows and a BACK are what
  # fits above the help line on the reference phone held in landscape, which is
  # the device this menu is drawn for.
  # =========================================================================
  developer:
    title: DEVELOPER
    parent: settings
    tone: dev
    form: settings
    dev: true
    rows:
      - id: playground
        label: PLAYGROUND
        icon: icon_treasure_map
        help: WARP INTO A RUN, THE TERMS IT IS BUILT ON, THE FPS METER
        opens: playground
      - id: cheats
        label: CHEATS
        icon: icon_coins
        help: MINT HEROES, COINS AND A STORE TO SPEND THEM IN
        opens: cheats
      - id: balance
        label: BALANCE
        icon: icon_ledger
        help: TUNE XP, MOB STRENGTH AND LOOT MULTIPLIERS
        opens: balance
      - id: visuals
        label: VISUALS
        icon: icon_menu_display
        help: TUNE THE FEEL, THE CAMERA AND THE PICTURE'S OWN WASHES
        opens: visuals
      - id: galleries
        label: GALLERIES
        icon: icon_menu_library
        help: BROWSE EVERY UNIQUE ITEM AND EVERY VISUAL EFFECT
        opens: galleries

  # -------------------------------------------------------------------------
  # DEVELOPER -> PLAYGROUND — A RUN, and nothing else. The two doors lead,
  # because they are what the page is opened for; under them sit the terms a
  # run is built on (both read when a level is BUILT, so a change lands on the
  # next run rather than one in progress) and the one thing drawn OVER a run,
  # the FPS meter — the first probe for a performance regression.
  # -------------------------------------------------------------------------
  playground:
    title: PLAYGROUND
    parent: developer
    tone: dev
    form: settings
    dev: true
    rows:
      - id: select-level
        label: SELECT LEVEL
        help: WARP TO ANY DIFFICULTY & MISSION - SKIPS THE INTRO
      - id: bot-view
        label: BOT VIEW
        help: WATCH THE AUTOPILOT PLAY ANY LEVEL WITH A REAL HERO
      # The arcade shelf with its lock off: every cabinet, every rung, no
      # campaign to beat first. The player's own MINIGAMES screen offers only
      # what has been earned, which is exactly what makes it useless for working
      # ON a minigame.
      - id: minigames
        label: MINIGAMES
        help: PLAY ANY MINIGAME ON ANY RUNG - NOTHING TO EARN FIRST
        opens: devminigames
      - id: auto-level-stats
        label: AUTO LEVEL STATS
        help:
          on: FREE BASE STATS EACH LEVEL - MOBS SCALE TO MATCH
          off: BASE STATS ONLY FROM POINTS YOU SPEND
      - id: debug
        label: DEBUG MODE
        help:
          on: THE FPS METER SHOWS DURING RUNS
          off: NO FPS METER DURING RUNS

  # DEVELOPER -> PLAYGROUND -> MINIGAMES — the same shelf the player has, with
  # the two gates off: every cabinet is listed whether or not a campaign has
  # been beaten, and DIFFICULTY cycles the whole ladder rather than the rungs
  # somebody finished. Same rows, same builder, same screen behind them, so
  # what is judged here is what ships.
  # -------------------------------------------------------------------------
  devminigames:
    title: MINIGAMES
    parent: playground
    tone: dev
    form: menu
    dev: true
    rows:
      - id: difficulty
        label: DIFFICULTY

  # -------------------------------------------------------------------------
  # DEVELOPER -> CHEATS — everything that puts into the save what a run would
  # otherwise have to earn: the heroes, the purse, and the shop that sells the
  # purse (FORCE STORE hands its packs over free, which is what makes it one of
  # these rather than a build flag).
  # -------------------------------------------------------------------------
  cheats:
    title: CHEATS
    parent: developer
    tone: dev
    form: settings
    notice: true
    dev: true
    rows:
      - id: seed
        label: SEED CHARACTERS
        icon: icon_class_melee
        help: MINT MELEE / RANGED / MAGIC HEROES AT THE HIGH TIERS
        opens: seed
      - id: grant-coins
        label: GRANT 10B COINS
        help: POUR 10 BILLION COINS INTO EVERY BANKED HERO
      - id: force-store
        label: FORCE STORE
        help:
          on: THE COIN STORE SHOWS IN THIS BUILD - PACKS ARE FREE
          off: THE COIN STORE SHOWS IN NATIVE BUILDS ONLY

  # -------------------------------------------------------------------------
  # DEVELOPER -> GALLERIES — the two shelves that only LOOK at what the game
  # ships. Neither starts anything, neither writes anything, and both take the
  # whole screen, which is why they sit together and away from the rows that
  # change a run.
  # -------------------------------------------------------------------------
  galleries:
    title: GALLERIES
    parent: developer
    tone: dev
    form: settings
    dev: true
    rows:
      - id: arsenal
        label: ARSENAL
        icon: icon_zweihander
        help: EVERY UNIQUE & LEGENDARY ITEM, BY ITEM LEVEL
        opens: arsenal
      - id: effects
        label: EFFECTS
        icon: icon_storm
        help: EVERY VISUAL EFFECT, STAGED FULLSCREEN - BROWSE AND REPLAY
        opens: effects

  visuals:
    title: VISUALS
    parent: developer
    tone: dev
    form: settings
    scroll: true
    dev: true
    rows:
      - id: knockback
        label: KNOCKBACK
        help: HOW FAR AN OVERKILL FLINGS THE MOB FLYING
      - id: blood
        label: BLOOD
        help: HOW MUCH A WOUND SPRAYS AND HOW RED THE FLOOR GETS
      - id: gore-linger
        label: GORE LINGER
        help: HOW LONG THE PIECES OF A BODY LIE WHERE THEY LANDED
      - id: camera-pitch
        label: CAMERA PITCH
        help: HOW FAR THE CAMERA LEANS OVER THE FLOOR - 100% IS TOP DOWN
      - id: camera-yaw
        label: CAMERA YAW
        help: HOW FAR THE CAMERA STANDS ROUND - 45° MAKES THE FLOOR DIAMONDS
      # Sits under CAMERA YAW because it is only ever about what the yaw did:
      # a turned floor staircases, and this is the switch that smooths it.
      - id: anti-aliasing
        label: ANTI-ALIASING
        help:
          on: THE TURNED FLOOR IS SMOOTHED INSTEAD OF STAIRCASED
          idle: NOTHING TO SMOOTH UNTIL CAMERA YAW TURNS THE FLOOR
          off: THE TURNED FLOOR KEEPS ITS HARD PIXEL STAIRCASE
      # …and the other thing the camera decides about the level's own furniture:
      # whether a wall panel stands on its footprint or lies down on it.
      - id: standing-walls
        label: STANDING WALLS
        help:
          on: WALL PANELS STAND UP OFF THE FLOOR ON THEIR FOOTPRINT
          off: WALL PANELS LIE FLAT WITH THE FLOOR, AS PLAIN TILES
      # The one row on this page that is not about a RUN: the main menu's own
      # backdrop is a working orrery on true distances, and this hands its
      # camera over so it can be flown through and checked.
      - id: sky-camera
        label: SKY CAMERA
        help:
          on: SCROLL OR PINCH THE MAIN MENU TO FLY THE SOLAR SYSTEM
          off: THE MAIN MENU SKY IS A BACKDROP AND TAKES NO GESTURES
      # THE THREE WASHES LAID OVER THE FINISHED PICTURE (render/postfx.ts), so
      # they come last: everything above decides what is drawn, these three
      # decide what the drawn frame is then seen through. All three are CSS on
      # the canvas and one overlay, so none of them costs a per-frame draw —
      # which is why they sit here with the camera rather than on a player page
      # about frame budget.
      - id: color-grade
        label: COLOR GRADE
        help:
          on: A LITTLE MORE CONTRAST AND COLOR IN THE WHOLE PICTURE
          off: THE ART'S OWN PALETTE, UNTOUCHED
      - id: vignette
        label: VIGNETTE
        help:
          on: THE CORNERS FALL AWAY INTO THE DARK
          off: THE FIELD IS LIT EVENLY TO ITS EDGES
      - id: depth-haze
        label: DEPTH HAZE
        help:
          on: THE FLOOR FADES AS IT RAKES OFF TOWARD THE HORIZON
          off: THE FAR FLOOR READS AS CLEARLY AS THE NEAR

  balance:
    title: BALANCE
    parent: developer
    tone: dev
    form: settings
    scroll: true
    dev: true
    rows:
      - id: reset
        label: RESET ALL
        help: EVERY KNOB BACK TO 1X - THE SHIPPED TUNING

  seed:
    title: SEED CHARACTERS
    parent: cheats
    tone: dev
    form: settings
    scroll: true
    notice: true
    dev: true
    rows:
      - id: all
        label: SEED ALL
        help: EVERY BUILD AT EVERY TIER - 12 HEROES

  # The GAME SPEED step of BOT VIEW, reached after a difficulty and a level.
  botspeed:
    title: BOT VIEW
    trail: PLAYGROUND
    parent: levels
    home: dynamic
    tone: dev
    form: settings
    dev: true
    rows:
      - id: speed
        label: GAME SPEED
        help:
          real: THE BOT RUN PLAYS AT REAL TIME
          fast: THE BOT RUN FAST-FORWARDS - MORE STEPS PER FRAME
      - id: spec
        label: BOT SPEC
      - id: start
        label: START

  arsenal:
    parent: galleries
    tone: dev
    surface: full
    dev: true

  effects:
    parent: galleries
    tone: dev
    surface: full
    dev: true
