description: |-
  GENERATED GOODCO HQ — the campus as a floorplan that is different every shift.
  THE READ: an interior map, so unlike the outdoor missions it is walls all the
  way: open PRODUCTION FLOOR partitioned by half-height dividers, sealed ASSEMBLY
  BAYS, and sterile LABS, and PAYLOAD-1 is idling in one of them. WHICH one is rolled
  per run out of the six outer thirds, so the prototype rocket is never in the same
  wing twice and the only way to it is to walk the building room by room, reading
  the fog-of-war minimap as it fills in. The hero badges in at whichever floor is
  farthest from the boss by door count.
  FEEL: the onboarding mission, so it stays legible — straight walls, wide
  doorways, and the same escalating staff (interns, scientists, engineers, guards,
  assemblers, hazmat, then SUCCESSOR units deep in the bays). Being indoors is what
  makes this the one blueprint where the DISTRICTS OWN THEIR FLOOR: a lab really
  does have a different floor from a bay, the override rectangle really is the
  room, and the ground changing underfoot is the map telling you where you are. The
  scripted first swing still lands beside the hero wherever he badges in.
id: goodco_hq
level: goodco_hq

# WHAT THE CAMPUS IS MADE OF. Every district is enclosed — it is a building — so
# the walls come from the pairing as always, but nothing here is `none`: a FLOOR
# meets its neighbour behind a half-height divider with a broad opening, and a BAY
# or a LAB is sealed with a single doorway. PAYLOAD-1 idles in a bay or a lab, never
# out on the open floor, and the hero always badges in on the floor.
areas:
  - id: floor
    enclosure: soft
    weight: 3
    horde: 1
    boss: false
    label: PRODUCTION FLOOR
    ground: { common: lab_0, rare: lab_1, rareEvery: 13 }
  - id: bay
    enclosure: hard
    weight: 3
    horde: 1.25
    spawn: false
    label: ASSEMBLY BAY
    ground: { common: deck_0, rare: deck_1, rareEvery: 13 }
  # A cleanroom is a LAB floor kept spotless, with the extraction vents clustered
  # through it — not a khaki floor. Given `vent` wall to wall it came out as a
  # city block of mud beside the blue-grey lab, which is not what a cleanroom
  # looks like and not what the hand-authored floor does either: there the vents
  # are one zone among several, not the surface.
  - id: lab
    enclosure: hard
    weight: 2
    horde: 1.1
    spawn: false
    label: CLEANROOM
    ground: { common: lab_0, rare: lab_1, rareEvery: 5 }
    patch: { a: vent_0, b: vent_1, every: 6 }
  # THE KEYCARD ROOMS. The floor's three cards — SUPPLY BAY B, the CLEANROOM
  # VAULT and the AI CORE — are carried by three named elites out on the floor,
  # and this is what they open: a small sealed room with a haul in it and
  # somebody standing over the haul. `lock` is a PERMISSION, not an instruction
  # (see `MapArea.lock`): the carve seals one of these per unspent key in
  # `locks:` below, deepest first, and leaves any others standing open. Nothing
  # the run needs is ever put behind one, which is why `boss` and `spawn` are
  # both refused here. The WEIGHT is deliberately low: the three rooms are
  # PROMISED (one seed per key — see `locks:`), so the weight only decides how
  # often a FOURTH sealed store turns up, and a floor of vaults is a floor with
  # nothing on it.
  - id: vault
    enclosure: hard
    weight: 0.6
    horde: 0.9
    boss: false
    spawn: false
    lock: true
    label: SECURE STORE
    ground: { common: lab_0, rare: lab_1, rareEvery: 7 }

sizes:
  small:
    width: 2600
    height: 1700
    rooms: 10
  medium:
    width: 3400
    height: 2200
    rooms: 16
  large:
    width: 4200
    height: 2800
    rooms: 24

# THE CARVE. Smaller rooms than the outdoor maps (520px) — an office floor is not
# a plain — and no `wander` on the wall material: a building's partitions are
# straight, and a meandering interior wall would read as damage rather than as
# architecture.
layout:
  minRoom: 520
  doorWidth: 220
  loopDoors: 0.3
  cluster: 0.5
  wall: partition

objects:
  - id: partition
    type: wall
    kind: wall
    radius: 8

  # ── THE ASSEMBLY LINE ────────────────────────────────────────────────────
  # RANKS, not scatter (see the `row` object type). A rocket does not get built
  # by parts lying about at random: the fuselage sections queue down the bay in a
  # line, the gantries flank it, and the aisle between them is where the fight
  # happens. Every rank is broken in the middle so the bay keeps a cross-corridor.
  # The BELT itself: a flat rank the hero walks straight over, dense enough to
  # read as one continuous run down the bay (the sprite animates on five frames,
  # so a line of them is a moving belt). It is what makes a bay read as a
  # STATION rather than as a room with hardware in it, and the ranks below queue
  # their parts along it.
  - id: conveyor
    type: row
    areas: [bay]
    chance: 0.75
    spacing: 16
    gap: 420
    bank: 1
    aisle: 420
    coverage: 0.85
  - id: fuselage_section
    type: row
    areas: [bay]
    chance: 0.8
    spacing: 40
    gap: 300
    bank: 1
    aisle: 420
    coverage: 0.6
    collide: true
    half: { x: 13, y: 7 }
  - id: gantry
    type: row
    areas: [bay]
    chance: 0.55
    spacing: 22
    gap: 420
    bank: 1
    aisle: 420
    coverage: 0.5
    collide: true
    half: { x: 8, y: 6 }
  - id: nose_cone
    type: obstacle
    radius: 10
    density: 5
    areas: [bay]
  - id: engine_bell
    type: obstacle
    radius: 8
    density: 7
    areas: [bay]
  - id: robot_arm
    type: obstacle
    radius: 7
    density: 9
    areas: [bay]
  - id: fuel_drum
    type: crate
    radius: 6
    density: 8
    areas: [bay, floor]
  - id: gas_rack
    type: obstacle
    radius: 7
    density: 6
    areas: [bay]
  - id: part_rack
    type: obstacle
    radius: 7
    density: 8
    areas: [bay, floor]
  - id: tool_chest
    type: crate
    radius: 6
    density: 9
    areas: [bay, floor]
    loot:
      chance: 0.4
      drop:
        gear: 2
        health: 1
        stamina: 1

  # ── THE SERVER HALL ──────────────────────────────────────────────────────
  # Racks in AISLES, in banks of two with a service corridor between banks —
  # which is what a data hall is, and what makes it a place to fight through
  # rather than an empty room with boxes in it.
  - id: server_rack
    type: row
    areas: [lab]
    chance: 0.9
    spacing: 18
    gap: 56
    bank: 2
    aisle: 200
    coverage: 0.66
    collide: true
    half: { x: 6, y: 7 }
  - id: cooling_unit
    type: obstacle
    radius: 6
    density: 12
    areas: [lab]
  - id: power_cabinet
    type: obstacle
    radius: 6
    density: 9
    areas: [lab]
  - id: console_desk
    type: obstacle
    radius: 7
    density: 8
    areas: [lab, floor]
  - id: server
    type: obstacle
    radius: 9
    density: 6
    areas: [lab, bay]

  # ── THE OPEN FLOOR ───────────────────────────────────────────────────────
  - id: vending
    type: obstacle
    radius: 8
    density: 6
    areas: [floor]
    loot:
      chance: 0.6
      drop:
        stamina: 3
  - id: desk
    type: crate
    radius: 8
    density: 8
    areas: [floor]
    loot:
      chance: 0.35
      drop:
        health: 2
        stamina: 1
        gear: 1
  - id: crate
    type: crate
    radius: 7
    density: 11
    areas: [bay, floor]
  - id: cache
    type: chest

  # ── FLOOR MARKINGS ───────────────────────────────────────────────────────
  # Painted, not built: the hero walks straight over them. A factory floor with
  # no lanes on it reads as a warehouse nobody has moved into yet.
  - id: lane_line
    type: row
    areas: [bay, floor]
    chance: 0.5
    spacing: 16
    gap: 460
    bank: 1
    aisle: 460
    coverage: 0.7
  - id: hazard_chevron
    type: decor
    density: 14
    areas: [bay]
  - id: floor_grate
    type: decor
    density: 12
    areas: [lab, bay]
  - id: cable_run
    type: decor
    density: 16
    areas: [lab]
  - id: floor_marks
    type: decor
    density: 14
  - id: conduit
    type: decor
    density: 12
    areas: [bay, lab]
  - id: parts_bin
    type: decor
    density: 11
    areas: [bay]
  - id: weld_scorch
    type: decor
    density: 9
    areas: [bay]
  - id: entrance
    type: landmark
    at: spawn
  - id: rocket
    type: landmark
    at: goal

# THE HORDE: one finite knot per room, the staff escalating with depth exactly as
# the authored floor does — interns at the door, SUCCESSOR units in the deep bays.
horde:
  perRoom: [48, 66]
  maxAlive: 18
  lingering: 8
  ramps: [vanguard, meek, meek, bold, bold, fierce, fierce, savage]
  hellgates: 7
  members:
    - enemy: intern
      window: [0, 0.35]
      weight: 5
    - enemy: scientist
      window: [0.1, 0.55]
      weight: 4
    - enemy: engineer
      window: [0.3, 0.75]
      weight: 4
    - enemy: guard
      window: [0.45, 0.9]
      weight: 3
    - enemy: assembler
      window: [0.6, 1]
      weight: 3
    - enemy: hazmat
      window: [0.75, 1]
      weight: 2
    - enemy: successor
      window: [0.85, 1]
      weight: 1

elites:
  # THE NIGHT MANAGER paces his floor — the beat he was walking on the
  # hand-drawn plant, now measured across whichever room the carve gave him.
  - enemy: night_manager
    patrol: true
    ramp: bold
    hp: 150
  # THE SECURITY CHIEF walks his rounds.
  - enemy: security_chief
    patrol: true
    ramp: fierce
    hp: 210
  # THE JANITOR works his way across the room with the mop.
  - enemy: janitor
    patrol: true
    ramp: fierce
    hp: 230
  - enemy: head_scientist
    ramp: savage
    hp: 190
  - enemy: architect
    ramp: savage
    hp: 190

# THE ARCHIVE UNIT — the campaign chain's non-combatant on the floor. It is the
# records terminal, it is not fighting anybody, and it holds the only
# countersignature left in the building
# (content/conversations/archive_unit).
bystanders:
  - enemy: archive_unit

guardians:
  - enemy: employee_of_the_month
    ramp: fierce
    hp: 180
  - enemy: wandering_tourist
    ramp: savage
    hp: 160

hellborn:
  ramp: hellborn
  members:
    - enemy: tunguska_walker
      count: 6
    - enemy: first_investor
      count: 4
      minDifficulty: jesus

boss:
  enemy: payload_1
  ramp: merciless
  hp: 480
  regions:
    - northwest
    - northeast
    - southwest
    - southeast
    - center-west
    - center-east

# THE KEYS, in the order the carve spends them (deepest room first) — each the
# `unlocks` of a card one of the floor's elites drops: the night manager's
# supply bay, the head scientist's cleanroom vault, and THE ARCHITECT's own AI
# core. Three cards, three rooms, never a fourth.
locks:
  - core
  - vault
  - storage

rareSpawns:
  rare:
    - wandering_tourist
    - night_shift_temp
  unique:
    - employee_of_the_month
