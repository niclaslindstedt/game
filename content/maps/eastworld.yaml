description: |-
  GENERATED EASTWORLD — the knockoff robot western as a scatter of TOWN BLOCKS
  across open hardpan, with the ZAI COMPOUND hidden somewhere in it. THE READ:
  sun-bleached dust broken by fenced corrals and clapboard town blocks, and the
  control center is behind a hazard fence in one of the six outer thirds — rolled
  per run, so the compound is never where it was last time and the only way to it
  is to ride the flats block by block, reading the fog-of-war minimap as it fills
  in. The hero comes through the gate wherever the map put it, always out on open
  dust.
  FEEL: still the theme park with the safety off — hay bales rolling down the
  street, cowbots and tin outlaws boiling out of the storefronts. A TOWN is a
  proper block of buildings with lanes between them, a CORRAL is a fenced yard you
  can vault into, and the hardpan between is open riding country. Every district
  holds one finite knot that arms as he rides in and drains as he clears it, and
  the knots ramp with DEPTH (cowbots at the gate, LONGHORNS deep in). The dead-end
  yards hold the caches, each with a lone keeper.
id: eastworld
level: eastworld

# WHAT THE PARK IS MADE OF. Three kinds of ground, and the fences between them
# fall out of the pairing: two stretches of HARDPAN flow into each other with
# nothing between them, a CORRAL is fenced with a wide gate, and a TOWN block is
# walled with one way in. The ZAI COMPOUND is the only district that may hold the
# boss — the control center is behind the hazard fence, not out on the street —
# and the hero always arrives on open dust.
#
# The town and the compound override the FLOOR, and that is the case the mechanism
# is for: a boardwalk and a deck really are a different surface, and the rectangle
# really is the block. The hardpan declines it.
areas:
  - id: hardpan
    enclosure: none
    weight: 3
    horde: 1
    boss: false
    label: HARDPAN
  - id: corral
    enclosure: soft
    weight: 2
    horde: 1.1
    boss: false
    label: CORRAL
    wall: fence
  - id: town
    enclosure: hard
    weight: 2.5
    horde: 1.25
    boss: false
    label: TOWN BLOCK
    wall: fence
    ground: { common: hardpan_0, rare: hardpan_1, rareEvery: 6 }
  - id: compound
    enclosure: hard
    weight: 1.2
    horde: 1.35
    spawn: false
    label: ZAI COMPOUND
    wall: fence
    ground: { common: deck_0, rare: deck_1, rareEvery: 13 }
    apron:
      ground: { common: hardpan_0, rare: hardpan_1, rareEvery: 6 }
      radius: 100

sizes:
  small:
    width: 3000
    height: 1800
    rooms: 9
  medium:
    width: 3800
    height: 2300
    rooms: 15
  large:
    width: 4800
    height: 2900
    rooms: 23

layout:
  minRoom: 560
  doorWidth: 230
  loopDoors: 0.3
  cluster: 0.52
  wall: fence

objects:
  # The park's own barrier: a ZAI-deck hazard fence. Straight — it was bolted
  # together, not piled up.
  - id: fence
    type: wall
    kind: compound_fence
    radius: 10
  - id: eastrock
    type: obstacle
    radius: 9
    density: 3
    areas: [hardpan, corral]
    rockSizes:
      - [1, 1]
      - [1, 2]
      - [2, 2]
    cell: 16
  - id: cactus
    type: cover
    radius: 6
    density: 5
    areas: [hardpan, corral]
  - id: barrel
    type: crate
    radius: 6
    density: 9
    areas: [town, corral, compound]
    loot:
      chance: 0.55
      drop:
        health: 3
        stamina: 2
  - id: wagon
    type: crate
    radius: 9
    density: 4
    areas: [town, corral]
    loot:
      chance: 0.35
      drop:
        gear: 2
        health: 1
        stamina: 1
  - id: cache
    type: chest
  # THE TOWN ITSELF — clapboard blocks with lanes between them. Restricted to the
  # town and compound districts, so a saloon never turns up alone in the desert.
  - id: general_store
    type: building
    density: 3
    w: 52
    h: 40
    areas: [town]
  - id: saloon
    type: building
    density: 2.4
    w: 60
    h: 60
    areas: [town]
  - id: hotel
    type: building
    density: 2
    w: 68
    h: 48
    areas: [town]
  - id: bank
    type: building
    density: 1.8
    w: 52
    h: 44
    areas: [town]
  - id: sheriff_office
    type: building
    density: 1.8
    w: 44
    h: 36
    areas: [town]
  - id: church
    type: building
    density: 1.4
    w: 44
    h: 60
    areas: [town]
  - id: barn
    type: building
    density: 2
    w: 60
    h: 52
    areas: [town, corral]
  - id: house_3x2
    type: building
    density: 3.4
    w: 48
    h: 32
    areas: [town]
  - id: house_4x3
    type: building
    density: 3
    w: 64
    h: 48
    areas: [town]
  - id: house_5x3
    type: building
    density: 2.2
    w: 80
    h: 48
    areas: [town]
  - id: water_tower
    type: building
    density: 1.6
    w: 40
    h: 40
    areas: [town, compound]
  - id: tumbleweed
    type: decor
    density: 14
  - id: cow_skull
    type: decor
    density: 6
    areas: [hardpan]
  - id: dry_shrub
    type: decor
    density: 12
  - id: horseshoe
    type: decor
    density: 5
    areas: [town, corral]
  - id: eastworld_gate
    type: landmark
    at: spawn
    anchor: base
  - id: control_center
    type: landmark
    at: goal
    anchor: base

horde:
  perRoom: [40, 56]
  maxAlive: 14
  lingering: 5
  ramps: [meek, bold, fierce, savage, brutal, merciless, monstrous]
  hellgates: 7
  members:
    - enemy: cowbot
      window: [0, 0.55]
      weight: 5
    - enemy: saloon_brawler
      window: [0.25, 0.8]
      weight: 4
    - enemy: tin_outlaw
      window: [0.5, 1]
      weight: 4
    - enemy: longhorn
      window: [0.8, 1]
      weight: 1

elites:
  - enemy: edward_snow
    ramp: savage
    hp: 480
  - enemy: gerald_depardieu
    ramp: brutal
    hp: 950
  - enemy: vladimir_putain
    ramp: merciless
    hp: 700
  - enemy: steven_seagull
    ramp: endgame
    hp: 520

guardians:
  - enemy: haywire_greeter
    ramp: savage
    hp: 200
  - enemy: counterfeit_outlaw
    ramp: endgame
    hp: 280

hellborn:
  ramp: hellborn
  members:
    - enemy: the_long_noon
      count: 6
    - enemy: manifest_ruin
      count: 4
      minDifficulty: jesus

# THE ZAI SUPERCORE, in its compound in one of the SIX OUTER THIRDS, with the whole
# showdown standing round it — MOSQUE's Eastworld body and the three GROK units,
# exactly the set piece the authored map ends on.
boss:
  enemy: zai_supercore
  ramp: apex
  hp: 1400
  escort:
    - enemy: elon_mosque_eastworld
      count: 1
      ramp: apex
      hp: 900
    - enemy: grok_alpha
      count: 1
      ramp: apex
      hp: 380
    - enemy: grok_beta
      count: 1
      ramp: apex
      hp: 380
    - enemy: grok_gamma
      count: 1
      ramp: apex
      hp: 380
  regions:
    - northwest
    - northeast
    - southwest
    - southeast
    - center-west
    - center-east

rareSpawns:
  rare:
    - haywire_greeter
    - counterfeit_outlaw
  unique:
    - one_armed_bandit
