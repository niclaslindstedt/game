# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
description: |-
  GENERATED THE BUNKER — the oligarchs' hole in the ground, re-plumbed every time
  you break in. THE READ: an interior, so it is walls all the way: marble HALLS,
  carpeted WINGS, an open ATRIUM, and somewhere in it the VAULT with the warden
  standing in front of the door out. WHICH corner the vault is in is rolled per
  run, so the way out is never where it was last time and finding it means walking
  the whole bunker — which is the point of a bunker.
  THE VAULT IS NOT ON THE FLOOR PLAN. You do not walk to a vault; that is what a
  vault is. It sits below the bunker with no corridor to it at all, and the only
  way down is a SERVICE LIFT standing in one of the six outer thirds — rolled per
  run, so the last thing to find is the WAY out rather than the door itself, and
  until the hero has ridden it the minimap has nothing to show where the finale
  is. The warden is waiting at the bottom, in front of the door.
  FEEL: obscene wealth under bad lighting. Gold pallets, wine racks, marble
  columns, art on pedestals, and a security agent behind every one of them. Each
  of the six oligarchs holds a room with his own three-man detail, strung along
  the depth axis so the roll call still unspools in order as the hero works
  inward — and TWO OF THEM ARE HOME: their suites stand in the hall like any
  other frontage until he walks up, and then the door folds back. The floor
  changes underfoot as he crosses from marble into carpet into the vault's
  plating — this is the mission the district-floor mechanism exists for, because
  down here the rectangle really is the room.
id: the_bunker
level: the_bunker

# WHAT THE BUNKER IS MADE OF. Everything is enclosed — it is a building — so no
# district is `none`: an ATRIUM meets its neighbour behind a balustrade with a wide
# opening, and a HALL, a WING or the VAULT is sealed with a single doorway. The
# VAULT WARDEN holds the vault and nowhere else, and the hero always breaks in
# through an atrium.
areas:
  - id: atrium
    enclosure: soft
    weight: 2.5
    horde: 1
    boss: false
    label: ATRIUM
    ground: { common: bunker_0, rare: bunker_1, rareEvery: 21 }
  - id: hall
    enclosure: hard
    weight: 3
    horde: 1.15
    boss: false
    spawn: false
    label: MARBLE HALL
    ground: { common: bunker_0, rare: bunker_1, rareEvery: 9 }
  - id: wing
    enclosure: hard
    weight: 2.5
    horde: 1.2
    boss: false
    spawn: false
    label: PRIVATE WING
    ground: { common: carpet_0, rare: carpet_1, rareEvery: 7 }
  # THE VAULT. Weight 0 — it is never seeded as a room, because it is not on the
  # floor plan at all: it is the ANNEX below, and the service lift is its door.
  - id: vault
    enclosure: hard
    weight: 0
    horde: 0
    spawn: false
    label: THE VAULT
    wall: bunker_wall
    ground: { common: deck_0, rare: deck_1, rareEvery: 17 }

# The strongroom the lift rides to, in its own band below the bunker's floor.
annex:
  area: vault
  width: 1100
  widthFrac: 0.38
  height: 760
  margin: 120
  ground: { common: shaft_rock_0, rare: shaft_rock_1, rareEvery: 7 }
  padSprite: elevator_pad
  downLabel: THE VAULT
  upLabel: UP

size:
  width: 4200
  height: 2300
  rooms: 16

layout:
  minRoom: 540
  doorWidth: 220
  loopDoors: 0.28
  cluster: 0.5
  wall: bunker_wall

objects:
  - id: bunker_wall
    type: wall
    kind: bunker_wall
    sprite: wall
    radius: 10
  - id: marble_column
    type: obstacle
    radius: 9
    density: 7
    areas: [hall, atrium]
  - id: server
    type: obstacle
    radius: 9
    density: 14
    areas: [vault, hall]
  - id: art_pedestal
    type: obstacle
    radius: 8
    density: 6
    areas: [wing, hall, vault]
  - id: vending
    type: obstacle
    radius: 8
    density: 1.5
    areas: [atrium]
    loot:
      chance: 0.6
      drop:
        stamina: 3
  - id: wine_rack
    type: crate
    radius: 8
    density: 3
    areas: [wing]
    loot:
      chance: 0.5
      drop:
        health: 3
        stamina: 1
  - id: gold_pallet
    type: crate
    radius: 7
    density: 60
    areas: [vault]
    loot:
      chance: 0.4
      drop:
        gear: 1
  - id: crate
    type: crate
    radius: 7
    density: 5
    areas: [atrium, hall]
  # THE ARMORY CABINETS. A shelter sold to people who expected to need one came
  # with lockers on every corridor, and they are still stocked — a solid,
  # non-jumpable obstacle that happens to break, which is what a `loot` block on
  # an `obstacle` buys (see buildObstacles).
  - id: weapon_locker
    type: obstacle
    radius: 8
    density: 4.5
    areas: [hall, wing]
    loot:
      drop:
        ammo: 9
        gear: 4
        health: 1
  - id: cache
    type: chest
  # THE FURNITURE THE RESIDENTS PAID FOR. The columns and pedestals say
  # "expensive"; only a sofa somebody sat on, a fern somebody watered and a
  # bar cart abandoned mid-pour say "inhabited" — which is the difference
  # between a bunker and a marble corridor.
  - id: leather_sofa
    type: obstacle
    radius: 11
    density: 3
    areas: [atrium, wing]
  - id: potted_fern
    type: obstacle
    radius: 6
    density: 5
    areas: [atrium, hall, wing]
  - id: bar_cart
    type: obstacle
    radius: 7
    density: 2.5
    areas: [wing, hall]
  # …AND THE ONE RESIDENT THE VETTING MISSED. Rats, everywhere — including
  # the vault, where they are the only thing the gold is any use to. A
  # critter: collides with nothing, costs the simulation nothing.
  - id: rat
    type: critter
    animated: true
    density: 2.2
    range: [40, 110]
    speed: [10, 24]
    scale: [0.8, 1.1]
  # THE OCCUPIED SUITES. A marble frontage in a hall like any other, right up
  # until the hero is close enough for the door to matter.
  - id: penthouse
    type: lair
    sprite: private_suite
    door: suite_door
    doorOpen: suite_door_open
    w: 68
    h: 46
    trigger: 250
    areas: [hall, wing]
  - id: safe_room
    type: lair
    sprite: private_suite
    door: suite_door
    doorOpen: suite_door_open
    w: 68
    h: 46
    trigger: 230
    areas: [wing, hall]
  - id: fountain
    type: building
    density: 1.2
    w: 44
    h: 44
    areas: [atrium]
  - id: reception_desk
    type: building
    density: 1.4
    w: 44
    h: 26
    areas: [atrium, hall]
  - id: money_pile
    type: decor
    density: 45
    areas: [vault, wing]
  - id: chandelier
    type: decor
    density: 5
    areas: [hall, wing]
  - id: security_camera
    type: decor
    density: 5
  - id: papers
    type: decor
    density: 7
  - id: cable
    type: decor
    density: 5
  - id: stain
    type: decor
    density: 4
  - id: bunker_entrance
    type: landmark
    sprite: bunker_gate
    at: spawn
    anchor: base
  - id: bunker_exit
    type: landmark
    sprite: vault_door
    at: goal
    anchor: base

# THE STATIC PARTS DECK — the floor plan the bunker is SEWN from (the shipping
# generator; the carve above stays behind the developer LEGACY MAP GENERATOR
# switch). Every part is a room the sales brochure promised: the entry atrium
# the hero breaks in through, marble halls, the grand atrium under its
# chandeliers, the residents' carpeted wing, the gallery, the armory cabinets
# the shelter was sold with, the wine cellar, the security room. The horde is
# the deck's own spawn markers: ONE mob to a post (WoW-style), dormant until
# aggroed, refilled on the difficulty's respawn clock, breeds rolled by DEPTH
# from `horde.members` below — CIA suits and vacuum bots at the door, soldiers
# deep in.
#
# NO BOSS PART, ON PURPOSE: the ending is the ANNEX (the vault below), so the
# deal owes the SERVICE LIFT a long walk instead of a throne — the lift lands
# in a rolled goal room picked far from the landing. The start part keeps to
# TWO sockets so the landing always sits at the rim of the plan rather than in
# the middle of it, which is what keeps that walk long on every deal.
#
# THE SIX OLIGARCHS are dealt onto the deck's elite stands (six stands across
# six parts), each bringing his own three-man detail; the two who are HOME
# (`lair:` above) are re-homed by the engine into hall/wing cells, which the
# deck always deals. Sewn seams follow the areas exactly as the carve's
# borders do: atrium-to-atrium is an archway behind a balustrade, anything
# into a hall or a wing is a single doorway.
parts:
  count: [7, 10]
  list:
    # THE ENTRY ATRIUM — the blast door tore open onto this: marble, columns,
    # and the first suits looking up. The gate landmark stands at his spawn.
    # The camp is explicit where the story pins a read on the breed — the CIA
    # agent is the arrival thought, the vacuum bot its follow-up (and the
    # housekeeping errand's target) — and one patroller works the colonnade so
    # a hero who never moves is still found.
    - id: entry_atrium
      area: atrium
      start: true
      width: 640
      height: 520
      doors:
        - { edge: e, at: 260, width: 160 }
        - { edge: s, at: 320, width: 160 }
      props:
        - { object: marble_column, at: [150, 130] }
        - { object: marble_column, at: [150, 390] }
        - { object: crate, at: [500, 400] }
      spawns:
        - { at: [320, 430] }
        - { at: [320, 250], enemy: cia_agent }
        - { at: [370, 280], enemy: vacuum_bot }
        - { at: [320, 310] }
        - { at: [500, 170], patrol: true }
    # A MARBLE HALL — the corridor piece, repeatable, flippable to serve
    # either hand of the plan, with a spur socket south so the bunker branches
    # instead of running out in a line. PROMISED ONCE, and that min is
    # load-bearing: the deal satisfies its owed parts FIRST, and the two owed
    # dead ends below are one south socket each — dealt straight onto the
    # entry atrium's two sockets they would wall the whole deal in at three
    # rooms. A promised three-socket corridor keeps the frontier alive while
    # the owed set is spent.
    - id: marble_hall
      area: hall
      flip: true
      min: 1
      max: 3
      weight: 3
      width: 620
      height: 300
      doors:
        - { edge: w, at: 150, width: 120 }
        - { edge: e, at: 150, width: 120 }
        - { edge: s, at: 310, width: 120 }
      props:
        - { object: marble_column, at: [160, 80] }
        - { object: marble_column, at: [460, 80] }
        - { object: art_pedestal, at: [310, 220] }
      spawns:
        - { at: [140, 220] }
        - { at: [140, 150], patrol: true }
        - { at: [320, 110] }
        - { at: [370, 150] }
        - { at: [320, 190] }
        - { at: [500, 220] }
    # THE GRAND ATRIUM — the court the wings meet on, four ways out behind its
    # balustrades. One oligarch holds the floor from the middle of it.
    - id: grand_atrium
      area: atrium
      flip: true
      max: 2
      weight: 2
      width: 700
      height: 560
      doors:
        - { edge: n, at: 350, width: 170 }
        - { edge: s, at: 350, width: 170 }
        - { edge: w, at: 280, width: 170 }
        - { edge: e, at: 280, width: 170 }
      props:
        - { object: marble_column, at: [170, 150] }
        - { object: marble_column, at: [530, 150] }
        - { object: marble_column, at: [170, 410] }
        - { object: marble_column, at: [530, 410] }
      spawns:
        - { at: [350, 460] }
        - { at: [350, 280], slot: elite }
        - { at: [250, 250] }
        - { at: [300, 220] }
        - { at: [300, 300] }
        - { at: [560, 160], patrol: true }
        - { at: [160, 430] }
    # THE RESIDENTS' WING — carpet, art on pedestals, money where it fell. The
    # suites the two who are HOME fold out of stand in cells like this one.
    - id: private_wing
      area: wing
      flip: true
      max: 2
      weight: 2
      width: 640
      height: 460
      doors:
        - { edge: w, at: 230, width: 110 }
        - { edge: e, at: 230, width: 110 }
        - { edge: n, at: 320, width: 110 }
        - { edge: s, at: 320, width: 110 }
      props:
        - { object: art_pedestal, at: [160, 120] }
        - { object: wine_rack, at: [480, 120] }
        - { object: chandelier, at: [320, 120] }
        - { object: money_pile, at: [500, 340] }
      spawns:
        - { at: [140, 330] }
        - { at: [320, 240], slot: elite }
        - { at: [200, 300] }
        - { at: [250, 330] }
        - { at: [200, 360] }
        - { at: [490, 140] }
    # THE GALLERY — the art the owners bought as ballast, racked down a marble
    # hall with an agent behind every pedestal.
    - id: gallery_hall
      area: hall
      flip: true
      max: 2
      weight: 1.8
      width: 660
      height: 480
      doors:
        - { edge: n, at: 330, width: 130 }
        - { edge: s, at: 330, width: 130 }
        - { edge: e, at: 240, width: 130 }
      props:
        - { object: art_pedestal, at: [180, 140] }
        - { object: art_pedestal, at: [330, 120] }
        - { object: art_pedestal, at: [480, 140] }
        - { object: art_pedestal, at: [330, 370] }
        - { object: marble_column, at: [120, 340] }
      spawns:
        - { at: [540, 240] }
        - { at: [330, 240], slot: elite }
        - { at: [200, 290] }
        - { at: [250, 320] }
        - { at: [520, 340], patrol: true }
        - { at: [520, 140] }
    # THE ARMORY — the lockers the shelter was sold with, still stocked (the
    # cabinets break for ammunition). One door: a dead end, which is what the
    # cache picker looks for, with a stand over the haul.
    - id: armory_store
      area: hall
      flip: true
      min: 1
      max: 2
      weight: 1
      width: 480
      height: 400
      doors:
        - { edge: s, at: 240, width: 110 }
      props:
        - { object: weapon_locker, at: [130, 100] }
        - { object: weapon_locker, at: [190, 100] }
        - { object: weapon_locker, at: [250, 100] }
        - { object: crate, at: [370, 120] }
      spawns:
        - { at: [240, 330] }
        - { at: [240, 200], slot: elite }
        - { at: [130, 280] }
        - { at: [360, 280] }
    # THE WINE CELLAR — the other dead end: racks to break, money on the
    # floor, and one of the residents down among his bottles.
    - id: wine_cellar
      area: wing
      flip: true
      min: 1
      max: 2
      weight: 1
      width: 460
      height: 380
      doors:
        - { edge: s, at: 230, width: 100 }
      props:
        - { object: wine_rack, at: [120, 90] }
        - { object: wine_rack, at: [180, 90] }
        - { object: wine_rack, at: [240, 90] }
        - { object: art_pedestal, at: [360, 110] }
        - { object: money_pile, at: [330, 290] }
      spawns:
        - { at: [230, 190], slot: elite }
        - { at: [340, 260] }
    # THE SECURITY ROOM — the racks that watch every camera in the building,
    # and the detail that watches the racks.
    - id: security_room
      area: hall
      flip: true
      max: 2
      weight: 1.5
      width: 560
      height: 440
      doors:
        - { edge: w, at: 220, width: 120 }
        - { edge: s, at: 280, width: 120 }
      props:
        - { object: server, at: [150, 100] }
        - { object: server, at: [210, 100] }
        - { object: server, at: [370, 100] }
        - { object: server, at: [430, 100] }
        - { object: security_camera, at: [280, 90] }
        - { object: crate, at: [450, 340] }
      spawns:
        - { at: [120, 320] }
        - { at: [280, 230], slot: elite }
        - { at: [180, 150] }
        - { at: [230, 180] }
        - { at: [180, 210] }
        - { at: [440, 320], patrol: true }

horde:
  perRoom: [30, 44]
  maxAlive: 12
  lingering: 5
  ramps: [meek, bold, fierce, savage, brutal, merciless, monstrous]
  hellgates: 7
  members:
    - enemy: cia_agent
      window: [0, 0.5]
      weight: 4
    - enemy: vacuum_bot
      window: [0, 0.4]
      weight: 2
    - enemy: fbi_agent
      window: [0.25, 0.75]
      weight: 3
    - enemy: ice_agent
      window: [0.45, 0.9]
      weight: 3
    - enemy: soldier
      window: [0.7, 1]
      weight: 3

# THE SIX OLIGARCHS, each holding a room with his own detail — the escort keeps a
# name attached to its guards, so a hall reads as somebody's floor rather than as
# a mob with a boss in it.
elites:
  - enemy: the_moderator
    ramp: savage
    hp: 1700
    lair: penthouse
    escort:
      - enemy: guard_feed
        count: 3
        ramp: savage
        hp: 380
  - enemy: the_safety_officer
    ramp: savage
    hp: 1600
    escort:
      - enemy: guard_alignment
        count: 3
        ramp: savage
        hp: 380
  - enemy: strongman_clone
    ramp: savage
    hp: 2000
    escort:
      - enemy: guard_continuity
        count: 3
        ramp: savage
        hp: 380
  - enemy: the_root
    ramp: savage
    hp: 1800
    escort:
      - enemy: guard_ledger
        count: 3
        ramp: savage
        hp: 380
  - enemy: the_fulfiller
    ramp: brutal
    hp: 2200
    escort:
      - enemy: guard_depot
        count: 3
        ramp: brutal
        hp: 400
  - enemy: the_developer
    ramp: brutal
    hp: 2600
    lair: safe_room
    escort:
      - enemy: guard_loyalty
        count: 3
        ramp: brutal
        hp: 400

guardians:
  - enemy: moonlighting_agent
    ramp: savage
    hp: 320
  - enemy: the_mole
    ramp: endgame
    hp: 420

hellborn:
  ramp: hellborn
  members:
    - enemy: permafrost_saint
      count: 6
    - enemy: dead_hand
      count: 4
      minDifficulty: jesus

# The VAULT WARDEN stands in front of the door out. The mission's objective is
# `reachExit`, so the carve puts the exit at the vault's centre and the warden
# beside it — reaching the door still means going through him.
boss:
  enemy: vault_warden
  ramp: apex
  hp: 2600
  regions:
    - northwest
    - northeast
    - southwest
    - southeast
    - center-west
    - center-east

rareSpawns:
  rare:
    - moonlighting_agent
  unique:
    - the_mole
