# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
description: |-
  GENERATED THE MOON — the far side as a warren of CRATER BASINS instead of the
  authored serpentine. THE READ: the regolith is broken by rubble ridges into a
  grid of walled basins joined by wide dust passes, and THE FLAGBEARER is haunting one
  of them. WHICH one is rolled per run out of the six outer thirds of the map, so
  the flag is never where it was last time and the only way to the boss is to
  walk the moon basin by basin, reading the fog-of-war minimap as it fills in.
  The hero lands in whichever basin is farthest from the boss by pass count, so
  the search is always the longest one this grid can offer.
  FEEL: still open floaty moon — low gravity, craters to hop, slabs to break line
  of sight — but the horizon is now a wall of rubble with a gap in it. Every basin
  holds one finite knot that arms as he steps in and drains as he clears it, and
  the knots ramp with DEPTH (wisps in the basins near the lander, wraiths and
  SUCCESSOR out where the flag might be), so the search gets colder the further it
  runs. The dead-end basins — the ones with a single pass in and out — are where
  the caches sit, each with a lone keeper: the LOST COSMONAUT and THE THIRTEENTH
  MAN now guard whichever cul-de-sacs the carve grew, so exploring off the line
  still pays and still costs.
id: moon
level: moon

# WHAT THE FAR SIDE IS MADE OF. Three kinds of ground, and the walls between them
# fall out of the pairing: two BASINS flow into each other with nothing between
# them (the moon is open, and it should read open), a RILLE fences its neighbour
# off behind a rubble ridge with a wide pass through it, and an APOLLO STATION —
# the wrecked hardware of the landings — is sealed, one doorway in. So the plain
# is mostly walkable dust with ridges cutting across it and pressurized wrecks
# knotted into it, which is a place; a uniform grid of boxes is a spreadsheet.
# THE FLAGBEARER only ever haunts a STATION (`boss: true` there alone) — the flag is
# planted at a landing site, not out on bare regolith — and the hero always puts
# down on open dust.
#
# NONE of the three overrides the FLOOR, though the area format allows it. A
# regional ground override is an axis-aligned rectangle, which indoors is exactly
# right (deck plating inside a base, carpet in a wing) and outdoors is exactly
# wrong: on an open plain the seam reads as a tiled floor, and swapping in another
# biome's plating stops the moon looking like the moon. The districts here are told
# apart by what STANDS on them — crates and hardware on a station pad, grit and
# rubble down a rille, pits and slabs out on the basins — and by the ridges between
# them.
areas:
  # Open regolith — the default moon. No walls of its own, so two basins are one
  # continuous plain and the map still reads as somewhere you can drift across.
  - id: basin
    enclosure: none
    weight: 3
    horde: 1
    boss: false
    label: BASIN
  # A collapsed lava channel: its floor is gravel wall to wall and a rubble ridge
  # fences it off with one broad gap, so it reads as a place you enter.
  - id: rille
    enclosure: soft
    weight: 3
    horde: 1.1
    boss: false
    label: RILLE
  # An Apollo landing pad: deck plating over the dust, sealed behind rubble with
  # one way in. The flag is planted at one of these, never on bare regolith.
  - id: station
    enclosure: hard
    weight: 2
    horde: 1.25
    spawn: false
    label: APOLLO STATION
size:
  width: 3600
  height: 2400
  rooms: 15
# THE CARVE. Big basins (600px floor) with WIDE passes (260px) — the moon's whole
# character is room to drift, and a pressured hero rounds a rubble ridge without
# lining up on it. A third of the shut station doors are reinstated as loops, and
# a strong cluster grows the three kinds of ground into districts rather than
# sprinkling them cell by cell.
layout:
  minRoom: 600
  doorWidth: 260
  loopDoors: 0.34
  cluster: 0.55
  wall: ridge

objects:
  # THE RUBBLE RIDGES the districts are cut from. FIFTEEN different stones, picked per
  # stone down the chain, and the chain MEANDERS up to 18px off true — a ridge is
  # rubble, and rubble neither repeats one rock nor rules a pencil line across a
  # plain. Ten rather than three because the eye reads the SEQUENCE before it reads
  # any one stone, and a short pool falls into a visible pattern every few paces.
  # The wander is a bounded walk tapered to nothing at the ends, so the spine still
  # seals and still meets the ridge it joins (see `LevelDef.walls`).
  - id: ridge
    type: wall
    kind: boulder
    radius: 13
    wander: 18
    sprites:
      - boulder
      - boulder_slab
      - boulder_jagged
      - boulder_twin
      - boulder_pitted
      - boulder_tilted
      - boulder_split
      - boulder_stack
      - boulder_shard
      - boulder_crumble
      - boulder_wedge
      - boulder_tooth
      - boulder_plate
      - boulder_cluster
      - boulder_hunch

  # Sized slabs: cover that blocks sight and shots. The renderer blits the
  # per-footprint sprite, so the atlas carries moonrock_1x1 … 2x2, not a base.
  - id: moonrock
    type: obstacle
    radius: 8
    density: 17
    areas: [basin, rille]
    rockSizes:
      - [1, 1]
      - [1, 1]
      - [1, 2]
      - [2, 2]
    cell: 16
  # Craters: jumpable to the hero, a wall to a horde that never jumps.
  - id: crater_small
    type: cover
    kind: crater
    sprite: crater_small
    radius: 7
    density: 9
    areas: [basin, rille]
  - id: crater_big
    type: cover
    kind: crater
    sprite: crater_big
    radius: 12
    density: 5
    areas: [basin, rille]
  # Expedition supply boxes — they were stacked at the landing sites, so that is
  # where they still are.
  - id: crate
    type: crate
    radius: 7
    density: 16
    areas: [station]
  # EXPEDITION SUPPLY BOXES — the mission stores, dropped at the landing sites
  # and never unpacked. Thickest on the pad, but scattered out on the basin too:
  # a shooter crossing open regolith needs somewhere to top up that is not the
  # one room everything else is in. Their spill leans hard on AMMUNITION (the
  # rest of the crate weights stand), which is the whole reason to break one.
  - id: supply_crate
    type: crate
    radius: 8
    density: 9
    areas: [station]
    loot:
      drop:
        ammo: 8
        health: 3
        stamina: 2
        gear: 2
  # …and a THIN scatter out on the open basin. Thin on purpose and measured
  # rather than guessed: a crate is a wall to the horde (nothing but the hero
  # jumps), so boxes strewn across the ground the horde has to cross to reach a
  # standing hero buy him cover he did not earn. At 3.4 the idle-overrun
  # benchmark (tests/content/balance_test.ts) stopped being able to kill a
  # motionless hero on MEDIUM at all. One per district-ish is the most this
  # ground can carry.
  - id: supply_crate_basin
    type: crate
    kind: supply_crate
    radius: 8
    density: 1.1
    areas: [basin, rille]
    loot:
      drop:
        ammo: 8
        health: 3
        stamina: 2
        gear: 2
  # IMPASSABLE PITS — holes blown clean through the crust. Unlike the craters
  # above (which the hero HOPS and the horde piles up against) these are solid:
  # nothing crosses them, so they break a line of sight and a line of retreat and
  # force the walk around. Three sizes, thickest out on the open basins where
  # there is room to route around them; a station pad was cleared of them.
  - id: moon_pit_small
    type: obstacle
    radius: 8
    density: 7
    areas: [basin, rille]
  - id: moon_pit
    type: obstacle
    radius: 12
    density: 4.5
    areas: [basin, rille]
  - id: moon_sinkhole
    type: obstacle
    radius: 17
    density: 2
    areas: [basin, rille]
  - id: cache
    type: chest
  # GROUND TEXTURE — flat marks the hero walks straight over. A bare grey plain
  # reads as an unfinished level however good the props on it are; pebbles, grit,
  # drag scars and micrometeorite pocks are what make the same plain read as a
  # SURFACE. They are cheap (no collision, no logic) and thick on purpose.
  - id: rocks
    type: decor
    density: 6.5
  - id: moon_pebbles
    type: decor
    density: 9.4
  - id: moon_grit
    type: decor
    density: 7.2
    areas: [rille]
  - id: moon_pocks
    type: decor
    density: 7.9
    areas: [basin, rille]
  - id: moon_scar
    type: decor
    density: 3.6
  - id: moon_dust
    type: decor
    density: 4.3
    areas: [basin]
  - id: moon_debris
    type: decor
    density: 5
    areas: [rille, station]
  # THE EXPEDITION'S HARDWARE, still standing where it was deployed. The decor
  # speckle gives the plain a SURFACE; only something knee-high and man-made
  # makes a basin read as a PLACE somebody worked. All of it is kept thin —
  # an obstacle is a wall to the horde, so the density here is a difficulty
  # knob before it is a look (tests/content/balance_test.ts).
  - id: dish_antenna
    type: obstacle
    radius: 8
    density: 3.5
    areas: [basin, station]
  - id: solar_array
    type: obstacle
    radius: 11
    density: 3
    areas: [basin, station]
  - id: seismometer
    type: obstacle
    radius: 6
    density: 4.5
    areas: [basin, rille]
  - id: moon_buggy
    type: obstacle
    radius: 12
    density: 2
    areas: [basin]
  # The buggy's own wake, pressed where the traverses ran.
  - id: rover_tracks
    type: decor
    density: 10
    areas: [basin, rille]
  # DUST THAT MOVES WITH NO WIND TO MOVE IT — the haunting, on the ground
  # plane. A critter collides with nothing and costs the simulation nothing;
  # it is the difference between a dead grey plain and one that is wrong in
  # a way you can see.
  - id: dust_eddy
    type: critter
    animated: true
    density: 5
    areas: [basin, rille]
    range: [60, 140]
    speed: [3, 8]
    scale: [0.8, 1.1]
  # The lander is where the hero put down; the flag is what he came to find, so
  # it stands wherever the boss turned out to be.
  - id: lander
    type: landmark
    at: spawn
  - id: flag
    type: landmark
    at: goal
    anchor: base

# THE STATIC PARTS DECK — the floor plan the moon is SEWN from (the shipping
# generator; the old carve stays behind the developer LEGACY MAP GENERATOR
# switch). Every part is a hand-drawn piece of the far side: crater basins to
# drift across, rille channels behind their rubble ridges, and the Apollo
# stations knotted into them — with the FLAG SITE as the boss's own room, sewn
# farthest from wherever the lander comes down. The horde is the deck's own
# spawn markers: ONE mob to a post (WoW-style), dormant until aggroed,
# refilled on the difficulty's respawn clock once killed or dragged away.
# Breeds are rolled by DEPTH from the horde members below, so the same basin
# part fields wisps by the lander and wraiths out at the flag.
parts:
  count: [7, 10]
  list:
    # THE LANDING — the hero puts down here; the lander landmark stands at his
    # spawn. One patroller sweeps the basin so a hero who never moves is still
    # found (the promise the whole difficulty curve rests on).
    - id: landing_basin
      area: basin
      start: true
      width: 640
      height: 520
      doors:
        - { edge: n, at: 320 }
        - { edge: s, at: 320 }
        - { edge: e, at: 260 }
        - { edge: w, at: 260 }
      spawns:
        - { at: [140, 100] }
        - { at: [520, 120], patrol: true }
        - { at: [540, 420] }
    # A dust pass — the corridor piece, repeatable, flippable to serve either
    # hand of the plan.
    - id: dust_pass
      area: rille
      width: 560
      height: 300
      flip: true
      max: 3
      weight: 3
      doors:
        - { edge: w, at: 150, width: 180 }
        - { edge: e, at: 150, width: 180 }
      props:
        - { object: crater_small, at: [200, 90] }
        - { object: moon_pit_small, at: [360, 210] }
        - { object: moon_grit, at: [280, 150] }
      spawns:
        - { at: [140, 150], patrol: true }
        - { at: [300, 80] }
        - { at: [300, 230] }
        - { at: [450, 160] }
    # Open regolith pocked with craters — the drift-and-hop ground the moon's
    # feel lives on.
    - id: crater_field
      area: basin
      width: 660
      height: 560
      flip: true
      max: 2
      weight: 2
      doors:
        - { edge: n, at: 330 }
        - { edge: w, at: 280 }
        - { edge: s, at: 330 }
      props:
        - { object: crater_big, at: [230, 190] }
        - { object: crater_small, at: [430, 330] }
        - { object: moon_pit, at: [500, 150] }
        - { object: crater_small, at: [160, 420] }
        - { object: moon_scar, at: [340, 260] }
      spawns:
        - { at: [330, 120] }
        - { at: [160, 280] }
        - { at: [480, 240], patrol: true }
        - { at: [340, 460] }
        - { at: [560, 470] }
    # A collapsed rille elbow — gravel wall to wall, one way in, one way on.
    - id: rille_bend
      area: rille
      width: 480
      height: 480
      flip: true
      max: 2
      weight: 2
      doors:
        - { edge: n, at: 240 }
        - { edge: e, at: 240 }
      props:
        - { object: moon_pit_small, at: [180, 310] }
        - { object: crater_small, at: [330, 170] }
        - { object: moon_debris, at: [240, 240] }
      spawns:
        - { at: [240, 130] }
        - { at: [130, 240], patrol: true }
        - { at: [350, 340] }
    # THE MISSION STORES — an Apollo supply dump, stacked and never unpacked.
    # A dead end, which is what the cache picker looks for; its stand is one of
    # the posts the blueprint's speaking elites are dealt onto.
    - id: supply_dump
      area: station
      width: 460
      height: 380
      flip: true
      min: 1
      max: 2
      doors:
        - { edge: s, at: 230, width: 130 }
      props:
        - { object: supply_crate, at: [100, 90] }
        - { object: supply_crate, at: [160, 80] }
        - { object: crate, at: [130, 140] }
        - { object: supply_crate, at: [370, 100] }
        - { object: crate, at: [350, 160] }
      spawns:
        - { at: [230, 200], slot: elite }
        - { at: [100, 260] }
        - { at: [360, 270] }
    # A wrecked lander stage — the landing site the flag was NOT planted at.
    - id: apollo_wreck
      area: station
      width: 580
      height: 460
      flip: true
      min: 1
      max: 2
      doors:
        - { edge: w, at: 230, width: 130 }
        - { edge: s, at: 290, width: 130 }
      props:
        - { object: crate, at: [150, 110] }
        - { object: supply_crate, at: [460, 130] }
        - { object: moon_debris, at: [300, 230] }
        - { object: crate, at: [430, 350] }
        - { object: moon_buggy, at: [180, 220] }
        - { object: solar_array, at: [420, 250] }
        - { object: rover_tracks, at: [260, 300] }
      spawns:
        - { at: [290, 120], slot: elite }
        - { at: [140, 330] }
        - { at: [300, 350] }
        - { at: [460, 230], patrol: true }
    # The relay hut — small, one door, somebody minding it.
    - id: comm_relay
      area: station
      width: 420
      height: 360
      flip: true
      max: 1
      doors:
        - { edge: s, at: 210, width: 130 }
      props:
        - { object: crate, at: [110, 100] }
        - { object: supply_crate, at: [320, 110] }
        - { object: dish_antenna, at: [210, 90] }
        - { object: seismometer, at: [320, 240] }
      spawns:
        - { at: [210, 170], slot: elite }
        - { at: [120, 250] }
    # THE FLAG SITE — the boss's own room, sewn farthest from the landing. The
    # flag landmark stands at the goal anchor, which is this room's own centre,
    # and THE FLAGBEARER holds it with an honor guard of posts around him.
    - id: flag_site
      area: station
      width: 720
      height: 560
      doors:
        - { edge: s, at: 360, width: 150 }
      boss: { at: [360, 240] }
      props:
        - { object: supply_crate, at: [120, 120] }
        - { object: crate, at: [610, 130] }
        - { object: moon_debris, at: [360, 400] }
      spawns:
        # THE SUCCESSOR stands the flag's own guard EXPLICITLY: the sight-beat
        # `moon_successor` waits on the breed, and a depth-rolled honor guard
        # missed it on real seeds. Pinning one here keeps the read on every
        # deal — and the flag is exactly where a SUCCESSOR belongs.
        - { at: [150, 260], enemy: successor }
        - { at: [570, 260] }
        - { at: [220, 450] }
        - { at: [500, 450] }

# THE HORDE: one finite knot per basin, its breed mix handing over along the
# depth axis and its mob level climbing the ladder — wisps near the lander,
# wraiths and the tanky SUCCESSOR only out at the deep end, so they never wall the
# middle of the search. On the PARTS generator these members and ramps price
# the spawn markers instead (breed by depth, one mob a post); perRoom/maxAlive/
# lingering are the legacy carve's alone.
horde:
  perRoom: [30, 44]
  maxAlive: 10
  lingering: 5
  ramps: [meek, bold, fierce, savage, brutal, merciless, monstrous]
  hellgates: 7
  members:
    - enemy: wisp
      window: [0, 0.5]
      weight: 4
    - enemy: ghost
      window: [0.2, 0.85]
      weight: 4
    - enemy: wraith
      window: [0.45, 1]
      weight: 3
    - enemy: successor
      window: [0.8, 1]
      weight: 1

# The four speaking elites, strung along the depth axis so the conspiracy still
# unspools in order — the grave under the dust, the corporate claim, the
# quarantine, and Ada's trail — whichever basins the carve put in that order.
elites:
  - enemy: apollo_ghost
    ramp: brutal
    hp: 200
  - enemy: prospector
    ramp: merciless
    hp: 220
  - enemy: quarantine_medic
    ramp: monstrous
    hp: 240
  - enemy: cartographer
    ramp: endgame
    hp: 220

# THE SURVEY GHOST — the campaign chain's non-combatant out here. He walks the
# WHOLE grid rather than haunting a spot (`ai.idle: roam`), so he is genuinely
# hard to find and the pin on the minimap records where he WAS. Neutral: he is
# not fighting anybody, and how the hero opens the conversation decides whether
# there is one (content/conversations/site_surveyor).
bystanders:
  - enemy: site_surveyor

# The cache keepers, cycled across the dead-end basins.
guardians:
  - enemy: lost_cosmonaut
    ramp: savage
    hp: 160
  - enemy: the_thirteenth_man
    ramp: endgame
    hp: 300

# HELLGATES (config HELLGATES): rampage-only tears, laced basin to basin and
# gated to NIGHTMARE and up, with the worse breed gated again to JESUS.
hellborn:
  ramp: hellborn
  members:
    - enemy: dust_pharaoh
      count: 6
    - enemy: selene_drowned
      count: 4
      minDifficulty: jesus

# THE FLAGBEARER haunts one of the SIX OUTER THIRDS — the four corners and the two
# middle flanks. Never the centre: a boss in the middle of the map is found by
# accident on the way to somewhere else, which is the opposite of a search.
boss:
  enemy: the_flagbearer
  ramp: endgame
  hp: 450
  regions:
    - northwest
    - northeast
    - southwest
    - southeast
    - center-west
    - center-east

rareSpawns:
  rare:
    - moonstruck_mourner
    - lost_cosmonaut
  unique:
    - the_thirteenth_man
