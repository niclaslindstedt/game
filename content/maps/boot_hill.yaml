  # THE LIVESTOCK. Nothing here collides, nothing can be hurt, and none of it is
  # stepped — the wander comes off the render clock (see `LevelDef.fauna`). It is
  # the difference between a range and an empty green rectangle.
  - id: cow
    type: critter
    animated: true
    density: 5
    areas: [prairie, corral]
