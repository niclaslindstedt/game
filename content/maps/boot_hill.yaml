    h: 48
    areas: [town]
  - id: house_5x3
    type: building
    density: 1.4
    w: 80
    h: 48
    areas: [town]
  # A HOMESTEAD is one family's place: a house, a barn, a water tower, and after
  # that the garden does the talking. Densities here are per 1,000,000 px² and a
  # cell is roughly half that, so these come out at about one of each.
  - id: homestead_house
    type: building
    sprite: house_4x3
    density: 2.2
    w: 64
    h: 48
    areas: [homestead]
  - id: barn
    type: building
    density: 1.8
    w: 60
    h: 52
    areas: [homestead, corral]
  - id: water_tower
    type: building
