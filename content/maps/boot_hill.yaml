    radius: 6
    density: 3
    areas: [homestead]
  - id: stone_well
    type: obstacle
    radius: 9
    density: 2.5
    areas: [homestead, corral]
  - id: water_trough
    type: obstacle
    radius: 8
    density: 4
    areas: [corral, homestead]
  - id: haystack
    type: obstacle
    radius: 9
    density: 4
    areas: [corral, homestead]
  - id: laundry_line
