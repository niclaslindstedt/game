description: |-
  GENERATED BOOT HILL — the knockoff robot western as OPEN COUNTRY with one town
  in it. THE READ: fenced grazing RANGE and sun-bleached HARDPAN rolling away in
  every direction, cattle standing in the grass, scattered HOMESTEADS with their
  gardens and their chickens, a fenced CORRAL here and there — and somewhere in
  all of it, exactly ONE TOWN: a plank main street with storefronts facing each
  other across it, which is where the shooting happens.
  THE ENDING IS NOT ON THE MAP. The TRUST ME BRO CONTROL ROOM is not a compound the hero
  walks up to and reads off the minimap two districts early; it is underground,
  and the only way in is a steel ELEVATOR PAD standing somewhere out in the
  country. Which of the six outer thirds the lift is in is rolled per run, so the
  last thing to find is the WAY to the boss rather than the boss — and until the
  hero has ridden it, the minimap has nothing at all to show where the finale is.
  There are no walls up here at all: the districts flow into each other and the
  hero rides where he likes.
  FEEL: still the theme park with the safety off — hay bales rolling, cowbots and
  tin outlaws boiling out of the storefronts — but the park is now mostly a place
  people (and cows) live in, which is what makes the town worth finding and the
  lift worth hunting. Two of the resident staff LIVE HERE: their houses stand on
  the street like any other frontage until the hero walks up, and then the door
  bangs open. Every district holds one finite knot that ramps with DEPTH, and the
  dead-end yards hold the caches, each with a lone keeper.
id: boot_hill
level: boot_hill

# WHAT THE PARK IS MADE OF. Five kinds of place, and NOTHING BETWEEN THEM: every
# district on the surface is `enclosure: none`, so the whole park is one
# continuous piece of ground you ride across in any direction. That is the shape
# of a western — the distances are the obstacle, not the doors — and it is what
# makes the lift worth hunting: there is no corridor to follow and no wall to
# work along, just open country and a steel plate somewhere in it.
#
# The only wall left on the map is seventy feet down, around the control room.
#
# THE LAND IS MOSTLY NOTHING, and that is not an omission — it is what a western
# landscape IS. Hardpan outweighs everything else nine to one; grass appears only
# where somebody fenced a GRAZING RANGE (which is to say, where the water is); a
# HOMESTEAD is a dusty yard with a house, a barn and a garden on it rather than a
# lawn; and out on the open flats there are lone houses and windmills standing by
# themselves with nothing around them for a mile. The distances between the
# things worth walking to ARE the setting.
#
# THE TOWN IS `once`. Weights alone cannot say "there is A town": low odds give
# runs with none, high odds give runs with five, and either way the map reads as
# suburbs rather than as frontier. One town, in a rolled corner of a big empty
# country, is the whole difference.
#
# The town and the control room override the FLOOR, and that is the case the
# mechanism is for — a plank street and a steel deck really are a different
# surface. The RANGE overrides it too, because grass is not a texture on dust: it
# is why the cattle are standing there and why somebody fenced it.
areas:
  - id: hardpan
    enclosure: none
    weight: 9
    horde: 1
    label: HARDPAN
  - id: prairie
    enclosure: none
    weight: 1.5
    horde: 0.85
    label: GRAZING RANGE
    ground: { common: prairie_0, rare: prairie_1, rareEvery: 5 }
  - id: homestead
    enclosure: none
    weight: 1.1
    horde: 1
    spawn: false
    label: HOMESTEAD
  - id: corral
    enclosure: none
    weight: 0.8
    horde: 1.1
    spawn: false
    label: CORRAL
  - id: town
    enclosure: none
    weight: 1.8
    once: true
    blocks: 140
    horde: 1.35
    spawn: false
    label: TOWN
    ground: { common: boardwalk_0, rare: boardwalk_1, rareEvery: 9 }
  # THE CONTROL ROOM. Weight 0 — it is never seeded as a district, because it is
  # not on the map at all: it is the ANNEX below, and the lift is the only door.
  - id: control
    enclosure: hard
    weight: 0
    horde: 0
    label: TRUST ME BRO CONTROL ROOM
    wall: control_wall
    ground: { common: control_floor_0, rare: control_floor_1, rareEvery: 37 }

# The buried room the lift rides to, in its own band past the carved country.
annex:
  area: control
  width: 900
  widthFrac: 0.6
  height: 620
  margin: 120
  ground: { common: shaft_rock_0, rare: shaft_rock_1, rareEvery: 7 }
  padSprite: elevator_pad
  downLabel: CONTROL ROOM
  upLabel: SURFACE
  # THE ALL-ACCESS PASS. The control centre is past the lift, and an annex has no
  # border to hang a door in — so the lock goes on the CAR: the hoist will not
  # come for a hero who has not taken the pass off THE STUNT DOUBLE, which is
  # what makes him the gate to the finale rather than one more duel on the way.
  lock: control

size:
  width: 3800
  height: 2300
  rooms: 15

layout:
  minRoom: 560
  doorWidth: 230
  loopDoors: 0.32
  cluster: 0.5
  wall: control_wall

objects:
  # THE ONE WALL LEFT ON THE MAP is seventy feet down, around the control room.
  # Up here nothing is walled at all: the park is open country and you ride
  # across it, which is what a western is. What used to fence the districts is
  # now a PROP — a few lengths of rail standing about a yard, hoppable, marking
  # somebody's land without ever closing a route.
  - id: control_wall
    type: wall
    kind: control_wall
    radius: 10
  - id: picket_fence
    type: cover
    radius: 8
    density: 7
    areas: [homestead, corral]

  # OUT ON THE COUNTRY
  - id: boothill_rock
    type: obstacle
    radius: 9
    density: 2.6
    areas: [hardpan]
    rockSizes:
      - [1, 1]
      - [1, 2]
      - [2, 2]
    cell: 16
  - id: cactus
    type: cover
    radius: 6
    density: 4
    areas: [hardpan]
  - id: sage_bush
    type: cover
    radius: 7
    density: 6
    areas: [hardpan, prairie]
  - id: grass_tuft
    type: decor
    density: 22
    areas: [prairie, corral, homestead]
  - id: scrub_tuft
    type: decor
    sprite: grass_tuft
    density: 5
    areas: [hardpan]
  - id: grass_clump
    type: decor
    density: 14
    areas: [prairie, corral, homestead]
  - id: scrub_clump
    type: decor
    sprite: grass_clump
    density: 3
    areas: [hardpan]
  - id: wildflowers
    type: decor
    density: 9
    areas: [prairie, homestead]
  - id: tumbleweed
    type: decor
    density: 9
    areas: [hardpan]
  - id: cow_skull
    type: decor
    density: 5
    areas: [hardpan]
  - id: dry_shrub
    type: decor
    density: 9
    areas: [hardpan]

  # THE HOMESTEADS — a house, a garden, and the things a garden needs.
  - id: veg_row
    type: obstacle
    radius: 8
    density: 6
    areas: [homestead]
  - id: flower_bed
    type: obstacle
    radius: 8
    density: 3
    areas: [homestead]
  - id: pumpkin_patch
    type: cover
    radius: 7
    density: 3.5
    areas: [homestead]
  - id: corn_stalk
    type: cover
    radius: 6
    density: 6
    areas: [homestead]
  - id: scarecrow
    type: cover
    radius: 6
    density: 3
    areas: [homestead]
  - id: stone_well
    type: obstacle
    radius: 9
    density: 2.5
    areas: [homestead, corral]
  - id: water_trough
    type: obstacle
    radius: 8
    density: 4
    areas: [corral, homestead]
  - id: haystack
    type: obstacle
    radius: 9
    density: 4
    areas: [corral, homestead]
  - id: laundry_line
    type: decor
    density: 3
    areas: [homestead]
  - id: horseshoe
    type: decor
    density: 5
    areas: [corral, homestead, town]

  # THE TOWN — a plank street with frontages facing each other across it, and
  # the smashables a street fight scatters.
  - id: barrel
    type: crate
    radius: 6
    density: 18
    areas: [town, corral, homestead]
    loot:
      chance: 0.55
      drop:
        health: 3
        stamina: 2
  # CARTRIDGE CRATES off the last freight wagon — stacked in town and at the
  # homestead, where a frontier park keeps its ammunition.
  - id: ammo_crate
    type: crate
    radius: 8
    density: 7
    areas: [town, homestead, corral]
    loot:
      drop:
        ammo: 8
        health: 3
        stamina: 2
        gear: 2
  - id: wagon
    type: crate
    radius: 9
    density: 8
    areas: [town, corral, homestead]
    loot:
      chance: 0.35
      drop:
        gear: 2
        health: 1
        stamina: 1
  - id: cache
    type: chest
  - id: general_store
    type: building
    density: 3
    w: 52
    h: 40
    areas: [town]
  - id: saloon
    type: building
    density: 2.4
    w: 60
    h: 60
    areas: [town]
  - id: hotel
    type: building
    density: 1.8
    w: 68
    h: 48
    areas: [town]
  - id: bank
    type: building
    density: 1.8
    w: 52
    h: 44
    areas: [town]
  - id: sheriff_office
    type: building
    density: 1.8
    w: 44
    h: 36
    areas: [town]
  - id: church
    type: building
    density: 1.2
    w: 44
    h: 60
    areas: [town]
  - id: storefront
    type: building
    density: 2.6
    w: 48
    h: 40
    areas: [town]
  - id: house_3x2
    type: building
    density: 2.4
    w: 48
    h: 32
    areas: [town]
  - id: house_4x3
    type: building
    density: 2
    w: 64
    h: 48
    areas: [town]
  - id: house_5x3
    type: building
    density: 1.4
    w: 80
    h: 48
    areas: [town]
  # A HOMESTEAD is one family's place: a house, a barn, a water tower, and after
  # that the garden does the talking. Densities here are per 1,000,000 px² and a
  # cell is roughly half that, so these come out at about one of each.
  - id: homestead_house
    type: building
    sprite: house_4x3
    density: 2.2
    w: 64
    h: 48
    areas: [homestead]
  - id: barn
    type: building
    density: 1.8
    w: 60
    h: 52
    areas: [homestead, corral]
  - id: water_tower
    type: building
    density: 1
    w: 40
    h: 40
    areas: [town, homestead]
  # OUT ON THE FLATS. Densities an order of magnitude below the settled
  # districts', so a lone house with nothing round it for a mile stays lone —
  # which is the whole read. A hardpan cell mostly has none of these at all.
  - id: flats_shack
    type: building
    sprite: house_3x2
    density: 0.9
    w: 48
    h: 32
    areas: [hardpan]
  - id: flats_barn
    type: building
    sprite: barn
    density: 0.5
    w: 60
    h: 52
    areas: [hardpan]
  - id: flats_tower
    type: building
    sprite: water_tower
    density: 0.6
    w: 40
    h: 40
    areas: [hardpan]

  # THE OCCUPIED HOUSES. These stand on the street looking like any other
  # frontage until the hero walks up to the door.
  - id: marshal_house
    type: lair
    sprite: lair_house
    door: lair_door
    doorOpen: lair_door_open
    w: 72
    h: 60
    trigger: 250
    areas: [town]
  - id: dacha
    type: lair
    sprite: hotel
    door: lair_door
    doorOpen: lair_door_open
    w: 68
    h: 48
    trigger: 230
    areas: [town, homestead]

  # THE LIVESTOCK. Nothing here collides, nothing can be hurt, and none of it is
  # stepped — the wander comes off the render clock (see `LevelDef.fauna`). It is
  # the difference between a range and an empty green rectangle.
  - id: cow
    type: critter
    animated: true
    density: 5
    areas: [prairie, corral]
    range: [50, 130]
    speed: [4, 10]
    scale: [0.75, 1]
  - id: goat
    type: critter
    animated: true
    density: 4
    areas: [corral, homestead]
    range: [40, 90]
    speed: [7, 15]
  - id: pig
    type: critter
    animated: true
    density: 3.5
    areas: [homestead]
    range: [30, 70]
    speed: [5, 12]
  - id: chicken
    type: critter
    animated: true
    density: 9
    areas: [homestead, town, corral]
    range: [24, 60]
    speed: [10, 22]
  - id: jackrabbit
    type: critter
    animated: true
    density: 4
    areas: [hardpan, prairie]
    range: [90, 190]
    speed: [16, 34]

  # THE CONTROL ROOM, seventy feet down. It is a SMALL room on purpose — the
  # finale is a fight in somebody's operations centre, not a march across a
  # hangar — so everything in it is BIG and there is a lot of it: monitor walls,
  # mainframe cabinets, operator pits, a park map, and the core the whole place
  # runs on.
  - id: monitor_wall
    type: obstacle
    radius: 24
    density: 11
    areas: [control]
  - id: mainframe
    type: obstacle
    radius: 20
    density: 16
    areas: [control]
  - id: operator_pit
    type: obstacle
    radius: 26
    density: 12
    areas: [control]
  - id: park_map
    type: obstacle
    radius: 20
    density: 8
    areas: [control]
  - id: power_core
    type: obstacle
    radius: 16
    density: 5
    areas: [control]
  - id: holo_table
    type: obstacle
    radius: 13
    density: 7
    areas: [control]
  - id: control_console
    type: obstacle
    radius: 11
    density: 20
    areas: [control]
  - id: control_pipe
    type: obstacle
    radius: 9
    density: 10
    areas: [control]
  - id: bro_crate
    type: crate
    radius: 8
    density: 16
    areas: [control]
    loot:
      chance: 0.6
      drop:
        gear: 2
        health: 1
  - id: control_chair
    type: decor
    density: 30
    areas: [control]
  - id: control_cable
    type: decor
    density: 9
    areas: [control]

  - id: boot_hill_gate
    type: landmark
    at: spawn
    anchor: base
  - id: control_center
    type: landmark
    at: goal
    anchor: base

horde:
  perRoom: [40, 56]
  maxAlive: 14
  lingering: 5
  ramps: [meek, bold, fierce, savage, brutal, merciless, monstrous]
  hellgates: 7
  members:
    - enemy: cowbot
      window: [0, 0.55]
      weight: 5
    - enemy: saloon_brawler
      window: [0.25, 0.8]
      weight: 4
    - enemy: tin_outlaw
      window: [0.5, 1]
      weight: 4
    - enemy: longhorn
      window: [0.8, 1]
      weight: 1

# TWO OF THE FOUR LIVE HERE. SNOW leaks out of a shuttered marshal's house;
# THE STRONGMAN keeps a dacha on the street. Both look like scenery until the hero is
# close enough for the door to matter.
elites:
  - enemy: the_leak
    ramp: savage
    hp: 480
    lair: marshal_house
  - enemy: the_leading_man
    ramp: brutal
    hp: 950
  - enemy: the_strongman
    ramp: merciless
    hp: 700
    lair: dacha
  - enemy: the_stunt_double
    ramp: endgame
    hp: 520

guardians:
  - enemy: haywire_greeter
    ramp: savage
    hp: 200
  - enemy: counterfeit_outlaw
    ramp: endgame
    hp: 280

hellborn:
  ramp: hellborn
  members:
    - enemy: the_long_noon
      count: 6
    - enemy: manifest_ruin
      count: 4
      minDifficulty: jesus

# THE BRO SUPERCORE, in the buried control room with the whole showdown standing
# round it — THE FOUNDER's Boot Hill body and the three BRO units, exactly the set
# piece the authored map ends on. The `regions` now place the LIFT rather than
# the boss: which outer third the pad is standing in is what the run rolls.
boss:
  enemy: bro_supercore
  ramp: apex
  hp: 1400
  escort:
    - enemy: the_founder_boot_hill
      count: 1
      ramp: apex
      hp: 900
    - enemy: bro_alpha
      count: 1
      ramp: apex
      hp: 380
    - enemy: bro_beta
      count: 1
      ramp: apex
      hp: 380
    - enemy: bro_gamma
      count: 1
      ramp: apex
      hp: 380
  regions:
    - northwest
    - northeast
    - southwest
    - southeast
    - center-west
    - center-east

rareSpawns:
  rare:
    - haywire_greeter
    - counterfeit_outlaw
  unique:
    - one_armed_bandit
