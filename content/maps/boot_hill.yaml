  # THE TOWN — a plank street with frontages facing each other across it, and
  # the smashables a street fight scatters.
  - id: barrel
    type: crate
    radius: 6
    density: 18
    areas: [town, corral, homestead]
    loot:
      chance: 0.55
      drop:
        health: 3
        stamina: 2
  # CARTRIDGE CRATES off the last freight wagon — stacked in town and at the
  # homestead, where a frontier park keeps its ammunition.
  - id: ammo_crate
    type: crate
    radius: 8
    density: 7
