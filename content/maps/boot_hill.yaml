    animated: true
    density: 1.6
    areas: [hardpan]
    range: [150, 320]
    speed: [14, 30]
    scale: [0.8, 1.2]

  # THE CONTROL ROOM, seventy feet down. It is a SMALL room on purpose — the
  # finale is a fight in somebody's operations centre, not a march across a
  # hangar — so everything in it is BIG and there is a lot of it: monitor walls,
  # mainframe cabinets, operator pits, a park map, and the core the whole place
  # runs on.
  - id: monitor_wall
    type: obstacle
    radius: 24
    density: 11
    areas: [control]
  - id: mainframe
    type: obstacle
    radius: 20
    density: 16
    areas: [control]
  - id: operator_pit
    type: obstacle
    radius: 26
    density: 12
    areas: [control]
  - id: park_map
    type: obstacle
    radius: 20
    density: 8
    areas: [control]
  - id: power_core
    type: obstacle
    radius: 16
    density: 5
    areas: [control]
  - id: holo_table
    type: obstacle
    radius: 13
    density: 7
    areas: [control]
  - id: control_console
    type: obstacle
    radius: 11
    density: 20
    areas: [control]
  - id: control_pipe
    type: obstacle
    radius: 9
    density: 10
    areas: [control]
  - id: bro_crate
    type: crate
    radius: 8
