# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
description: |-
  GENERATED MARS — the oxide plain as a field of OUTCROPS and COLONY MODULES
  instead of the authored run to the shrine. THE READ: rust-red hardpan broken by
  rock outcrops and studded with pressurized colony pads, and THE FOUNDER is
  holding court inside one of them. WHICH one is rolled per run out of the six
  outer thirds of the map, so the shrine is never where it was last time and the
  only way to the boss is to walk Mars pad by pad, reading the fog-of-war minimap
  as it fills in. The hero lands on whichever plain is farthest from the boss by
  door count, so the search is always the longest one this grid can offer.
  FEEL: still thin-aired Mars — long sightlines over dust, sand storms drifting
  through, rovers grinding out of the haze — but the horizon is now broken by
  marsrock spines and the hard rectangles of colony plating. Every district holds
  one finite knot that arms as he steps in and drains as he clears it, and the
  knots ramp with DEPTH (scout rovers out where he lands, SUCCESSOR units deep in
  the colony), so the search gets colder the further it runs. SINKHOLES are the
  Martian terrain twist: unlike the craters, a collapse cannot be jumped, so the
  open plains have to be routed around rather than crossed in a straight line.
  The dead-end districts hold the caches, each with a lone keeper — the
  MISPRINTED FEMBOT and the DERELICT ROVER now guard whichever cul-de-sacs the
  carve grew.
id: mars
level: mars

# WHAT MARS IS MADE OF. Three kinds of ground, and the walls between them fall out
# of the pairing: two PLAINS flow into each other with nothing between them (Mars
# is open, and it should read open), an OUTCROP fences its neighbour off behind a
# marsrock spine with a wide pass through it, and a COLONY pad is sealed, one way
# in. THE FOUNDER only ever holds the TERRARIUM (`boss` false everywhere else) —
# he holds court in the garden, never out on bare hardpan — and the hero always
# puts down on open dust.
#
# The OUTDOOR districts decline to override the FLOOR, though the format allows
# it: out on a plain a ground override is an axis-aligned rectangle the size of a
# city block, and it reads as tiling laid over Mars rather than as terrain. They
# are told apart by what STANDS on them instead — sinkholes and slabs on the
# hardpan, grit and rubble round an outcrop — and by the spines between them. The
# two COLONY shells DO override it, and that is the case the mechanism is for:
# inside a pressure dome the rectangle really IS the room, and the floor changing
# underfoot is the map telling you that you are indoors now.
areas:
  - id: plain
    enclosure: none
    weight: 3
    horde: 1
    boss: false
    label: HARDPAN
  - id: outcrop
    enclosure: soft
    weight: 3
    horde: 1.1
    boss: false
    label: OUTCROP
  # THE COLONY, in two shells.
  #
  # INNER DOME — the billionaires' lifeboat garden (docs/story.md: "a secret
  # billionaires' lifeboat"). Lawn and timber decking, trees, ponds and a
  # swimming pool, watered while the planet outside chokes on dust. It is the ONE
  # warm, green, wet place in the whole mission, and that contrast is the point:
  # the hero crosses a poisoned desert to find somebody's lawn. THE FOUNDER holds
  # court here and nowhere else. Weighted LOW — a dome covering half of Mars is
  # scenery, where a rare one is the reveal it should be.
  #
  # CONCRETE AT THE DOOR: nobody steps off an airlock onto grass, so every doorway
  # into the garden lays an apron of hard standing just inside it.
  - id: terrarium
    enclosure: hard
    weight: 1.4
    horde: 1.15
    spawn: false
    label: TERRARIUM
    wall: dome
    ground: { common: colony_lawn_0, rare: colony_lawn_1, rareEvery: 5 }
    patch: { a: colony_wood_0, b: colony_wood_1, every: 11 }
    apron:
      ground: { common: colony_paving_0, rare: colony_paving_1, rareEvery: 6 }
      radius: 110
  # OUTER DOME — a band of plating and hardware wrapped around the garden, and
  # never a district of its own (weight 0). Grown as a district it came out as
  # acres of empty deck with a lawn lost somewhere in it; as a BAND it is what it
  # should be — the handspan of plant you walk through on the way in, the same
  # depth whether the dome behind it is one cell or nine.
  - id: dome_shell
    enclosure: hard
    weight: 0
    shellOf: terrarium
    shellWidth: 150
    label: DOME SHELL
    ground: { common: deck_0, rare: deck_1, rareEvery: 13 }
  # THE LIZARD SHRINE — the one room on Mars with a door on it, and the green
  # keycard THE SEED carries is what the door answers to. It is a DETOUR, never
  # the way on: nothing the mission needs is ever carved behind a key (which is
  # what `boss: false` / `spawn: false` state, and what the carve enforces), so
  # what is in here is a cache and whoever the colony left standing over it.
  - id: shrine
    enclosure: hard
    weight: 0.9
    horde: 1
    boss: false
    spawn: false
    lock: true
    label: SHRINE
    wall: dome
    ground: { common: colony_lawn_0, rare: colony_lawn_1, rareEvery: 5 }
    patch: { a: colony_wood_0, b: colony_wood_1, every: 11 }

size:
  width: 3600
  height: 2300
  rooms: 15

# THE CARVE. Wide districts (580px floor) with broad passes (250px) — Mars is a
# long-sightline map and a pressured hero rounds a spine without lining up on it.
# A third of the shut colony doors are reinstated as loops, and a strong cluster
# grows the three kinds of ground into regions rather than sprinkling them cell by
# cell.
layout:
  minRoom: 580
  doorWidth: 250
  loopDoors: 0.32
  cluster: 0.55
  wall: spine

objects:
  # THE MARSROCK SPINES the districts are cut from. Fifteen different stones,
  # picked per stone down the chain, and the chain MEANDERS up to 18px off true —
  # a spine is rubble, and rubble neither repeats one rock nor rules a pencil line
  # across a plain. The wander is a bounded walk tapered to nothing at the ends, so
  # the spine still seals and still meets the one it joins.
  - id: spine
    type: wall
    kind: marsboulder
    radius: 13
    wander: 18
    sprites:
      - marsboulder
      - marsboulder_slab
      - marsboulder_jagged
      - marsboulder_twin
      - marsboulder_pitted
      - marsboulder_tilted
      - marsboulder_split
      - marsboulder_stack
      - marsboulder_shard
      - marsboulder_crumble
      - marsboulder_wedge
      - marsboulder_tooth
      - marsboulder_plate
      - marsboulder_cluster
      - marsboulder_hunch
  # THE DOME PANEL — the colony's own wall. Straight (no `wander`): a pressure
  # shell is a manufactured thing and a meandering one would read as a breach.
  - id: dome
    type: wall
    kind: mars_dome
    radius: 9
  # Sized slabs: cover that blocks sight and shots. The renderer blits the
  # per-footprint sprite, so the atlas carries marsrock_1x1 … 2x2, not a base.
  - id: marsrock
    type: obstacle
    radius: 8
    density: 6.6
    areas: [plain, outcrop]
    rockSizes:
      - [1, 1]
      - [1, 1]
      - [1, 2]
      - [2, 2]
    cell: 16
  # Craters: jumpable to the hero, a wall to a horde that never jumps.
  - id: crater_red_small
    type: cover
    kind: crater
    sprite: crater_red_small
    radius: 7
    density: 3.3
    areas: [plain, outcrop]
  - id: crater_red_big
    type: cover
    kind: crater
    sprite: crater_red_big
    radius: 12
    density: 1.8
    areas: [plain, outcrop]
  # IMPASSABLE COLLAPSES — where the crust gave way over old lava tube. Unlike the
  # craters these are solid: nothing crosses them, so they break a line of sight
  # and a line of retreat and force the walk around. A colony pad was cleared of
  # them before it was poured.
  - id: mars_pit_small
    type: obstacle
    radius: 8
    density: 2.9
    areas: [plain, outcrop]
  - id: mars_pit
    type: obstacle
    radius: 12
    density: 1.8
    areas: [plain, outcrop]
  - id: mars_sinkhole
    type: obstacle
    radius: 17
    density: 0.8
    areas: [plain, outcrop]
  # Colony supply crates, stacked where the colony is.
  - id: crate
    type: crate
    radius: 7
    density: 15
    areas: [dome_shell]
  # SUPPLY BOXES out on the hardpan too — landing stores and dumped pallets, so
  # the long walk in across the dust has somewhere to restock rather than making
  # the dome the only place a shooter is ever solvent.
  - id: supply_crate
    type: crate
    radius: 8
    density: 3.2
    areas: [plain, outcrop]
    loot:
      drop:
        ammo: 8
        health: 3
        stamina: 2
        gear: 2
  # THE COLONY ARMORY — a steel weapons locker bolted to the dome plating. A
  # billionaires' lifeboat came stocked, and the guns are still in the cabinet.
  - id: weapon_locker
    type: obstacle
    radius: 8
    density: 6
    areas: [dome_shell]
    loot:
      drop:
        ammo: 9
        gear: 4
        health: 1
  # THE GARDEN. Solid, all of it: a tree is cover, and you cannot walk into a
  # swimming pool any more than you can walk into a sinkhole.
  - id: colony_tree
    type: obstacle
    radius: 8
    density: 18
    areas: [terrarium]
  - id: colony_tree_big
    type: obstacle
    radius: 12
    density: 4.1
    areas: [terrarium]
  - id: colony_palm
    type: obstacle
    radius: 9
    density: 9
    areas: [terrarium]
  - id: colony_shrub
    type: obstacle
    radius: 6
    density: 16.4
    areas: [terrarium, shrine]
  - id: colony_hedge
    type: obstacle
    radius: 8
    density: 4.9
    areas: [terrarium]
  - id: colony_planter
    type: obstacle
    radius: 9
    density: 4.1
    areas: [terrarium, dome_shell, shrine]
  - id: colony_pond
    type: obstacle
    radius: 14
    density: 2
    areas: [terrarium]
  - id: colony_pool
    type: obstacle
    radius: 16
    density: 1.6
    areas: [terrarium]
  - id: colony_pool_round
    type: obstacle
    radius: 12
    density: 1.2
    areas: [terrarium]
  - id: colony_fountain
    type: obstacle
    radius: 11
    density: 1.6
    areas: [terrarium]
  - id: colony_flowers
    type: decor
    density: 9.2
    areas: [terrarium, shrine]
  - id: colony_lawn_stripe
    type: decor
    density: 4.1
    areas: [terrarium]
  - id: colony_lounger
    type: decor
    density: 2.8
    areas: [terrarium]
  - id: cache
    type: chest
  # THE MINE THE COLONY RAN — bore rigs, their tailings, the pipeline between
  # them and the relay chain that reported the yield. Thin on purpose: an
  # obstacle is a wall to the horde before it is a look
  # (tests/content/balance_test.ts), and a plain is still a plain — it is just
  # a plain somebody WORKED once.
  - id: drill_rig
    type: obstacle
    radius: 11
    density: 2.6
    areas: [plain, outcrop]
  - id: pipeline
    type: obstacle
    radius: 11
    density: 3
    areas: [plain, outcrop]
  - id: ore_pile
    type: cover
    radius: 8
    density: 4
    areas: [plain, outcrop]
  - id: relay_mast
    type: obstacle
    radius: 6
    density: 2.5
    areas: [plain]
  # THE ONLY WEATHER MARS STILL GETS. A critter collides with nothing, costs
  # the simulation nothing, and cannot desync a replay — and a dust devil
  # walking the horizon is the difference between a dead plain and a live one.
  - id: dust_devil
    type: critter
    animated: true
    density: 3
    areas: [plain, outcrop]
    range: [120, 260]
    speed: [8, 18]
    scale: [0.9, 1.3]
  # GROUND TEXTURE — flat marks the hero walks straight over. A bare oxide plain
  # reads as an unfinished level however good the props on it are; pebbles, grit,
  # rover tracks and drag scars are what make the same plain read as a SURFACE.
  - id: red_rocks
    type: decor
    kind: rocks
    sprite: red_rocks
    density: 4.1
  - id: tracks
    type: decor
    density: 3.2
  - id: mars_pebbles
    type: decor
    density: 6
  - id: mars_grit
    type: decor
    density: 4.6
    areas: [outcrop]
  - id: mars_pocks
    type: decor
    density: 4.6
    areas: [plain, outcrop]
  - id: mars_scar
    type: decor
    density: 2.3
  - id: mars_dust
    type: decor
    density: 3.2
    areas: [plain]
  - id: mars_debris
    type: decor
    density: 5.1
    areas: [outcrop, dome_shell]
  # The pads take a heavy share of loose hardware, which is what tells a pad from
  # the hardpan now that the ground under it is the same dust.
  - id: marsrock_pad
    type: obstacle
    kind: marsrock
    radius: 8
    density: 5.7
    areas: [dome_shell]
    rockSizes:
      - [1, 1]
      - [1, 2]
    cell: 16
  # The starship is where the hero put down; the shrine is what he came to find,
  # so it stands wherever the boss turned out to be.
  - id: starship
    type: landmark
    at: spawn
  - id: shrine
    type: landmark
    at: goal
    anchor: base

# THE STATIC PARTS DECK — the floor plan Mars is SEWN from (the shipping
# generator; the old carve stays behind the developer LEGACY MAP GENERATOR
# switch). Every part is a hand-drawn piece of the colony's ground: hardpan
# flats to cross, outcrop passes behind their marsrock spines, the working
# hardware of the colony — a rover depot, a drill site, a colony pad on deck
# plating — and THE TERRARIUM as the boss's own room, sewn farthest from
# wherever the starship comes down. The horde is the deck's own spawn markers:
# ONE mob to a post (WoW-style), dormant until aggroed, refilled on the
# difficulty's respawn clock. Breeds are rolled by DEPTH from the horde members
# below, so the same flats field scout rovers by the ship and fembots at the
# dome.
parts:
  count: [7, 10]
  list:
    # THE LANDING — the starship puts down on open dust; the landmark stands at
    # the hero's spawn. One patroller sweeps the flats so a hero who never
    # moves is still found (the promise the difficulty curve rests on).
    - id: landing_flats
      area: plain
      start: true
      width: 660
      height: 540
      doors:
        - { edge: n, at: 330 }
        - { edge: s, at: 330 }
        - { edge: e, at: 270 }
        - { edge: w, at: 270 }
      spawns:
        - { at: [150, 390] }
        - { at: [150, 110] }
        - { at: [530, 130], patrol: true }
        - { at: [550, 430] }
    # A dust road — the corridor piece, rover-tracked, repeatable, flippable to
    # serve either hand of the plan.
    - id: dust_road
      area: plain
      width: 560
      height: 300
      flip: true
      max: 3
      weight: 3
      doors:
        - { edge: w, at: 150, width: 200 }
        - { edge: e, at: 150, width: 200 }
      props:
        - { object: crater_red_small, at: [200, 90] }
        - { object: mars_pit_small, at: [370, 210] }
        - { object: tracks, at: [280, 150] }
      spawns:
        - { at: [120, 220] }
        - { at: [140, 150], patrol: true }
        - { at: [300, 80] }
        - { at: [300, 230] }
        - { at: [460, 160] }
    # Open hardpan where the crust gave way — sinkholes to route around, which
    # is the Martian terrain twist made into a room.
    - id: sinkhole_basin
      area: plain
      width: 640
      height: 560
      flip: true
      max: 2
      weight: 2
      doors:
        - { edge: n, at: 320 }
        - { edge: w, at: 280 }
        - { edge: s, at: 320 }
      props:
        - { object: mars_sinkhole, at: [230, 200] }
        - { object: crater_red_big, at: [450, 330] }
        - { object: mars_pit, at: [500, 140] }
        - { object: supply_crate, at: [150, 440] }
        - { object: mars_scar, at: [340, 270] }
      spawns:
        - { at: [500, 400] }
        - { at: [320, 110] }
        - { at: [150, 300] }
        - { at: [470, 240], patrol: true }
        - { at: [330, 460] }
        - { at: [550, 470] }
    # An outcrop elbow — grit behind the marsrock spine, one way in, one way
    # on, and somebody minding the corner.
    - id: outcrop_pass
      area: outcrop
      width: 500
      height: 480
      flip: true
      max: 2
      weight: 2
      doors:
        - { edge: n, at: 250, width: 220 }
        - { edge: e, at: 240, width: 220 }
      props:
        - { object: mars_pit_small, at: [180, 320] }
        - { object: crater_red_small, at: [330, 170] }
        - { object: mars_debris, at: [250, 240] }
      spawns:
        - { at: [110, 350] }
        - { at: [250, 130], slot: elite }
        - { at: [130, 250], patrol: true }
        - { at: [350, 340] }
    # THE ROVER DEPOT — pallets dropped at the landing stores and never
    # unpacked. A dead end, which is what the cache picker looks for; its stand
    # is one of the posts the blueprint's speaking elites are dealt onto.
    - id: rover_depot
      area: outcrop
      width: 520
      height: 400
      flip: true
      min: 1
      max: 2
      doors:
        - { edge: s, at: 260, width: 180 }
      props:
        - { object: supply_crate, at: [110, 90] }
        - { object: supply_crate, at: [170, 80] }
        - { object: tracks, at: [140, 150] }
        - { object: supply_crate, at: [420, 110] }
        - { object: mars_debris, at: [390, 170] }
      spawns:
        - { at: [260, 330] }
        - { at: [260, 200], slot: elite }
        - { at: [110, 280] }
        - { at: [420, 290] }
    # THE DRILL SITE — the colony's mining ground, scarred and pitted, the
    # mining units still working it.
    - id: drill_site
      area: plain
      width: 620
      height: 500
      flip: true
      min: 1
      max: 2
      doors:
        - { edge: w, at: 250 }
        - { edge: s, at: 310 }
      props:
        - { object: mars_scar, at: [300, 240] }
        - { object: mars_pit, at: [460, 140] }
        - { object: supply_crate, at: [150, 110] }
      spawns:
        - { at: [480, 360] }
        - { at: [310, 130], slot: elite }
        - { at: [150, 340] }
        - { at: [310, 360], patrol: true }
        - { at: [470, 240] }
    # A COLONY PAD — deck plating, crates and the armory lockers, the hard
    # rectangle of the colony out on the dust.
    - id: colony_pad
      area: dome_shell
      width: 560
      height: 440
      flip: true
      min: 1
      max: 2
      doors:
        - { edge: w, at: 220, width: 150 }
        - { edge: s, at: 280, width: 150 }
      props:
        - { object: crate, at: [150, 110] }
        - { object: weapon_locker, at: [460, 120] }
        - { object: colony_planter, at: [300, 230] }
        - { object: crate, at: [430, 340] }
      spawns:
        - { at: [100, 220] }
        - { at: [280, 120], slot: elite }
        - { at: [140, 320] }
        - { at: [300, 340] }
        - { at: [460, 230], patrol: true }
    # THE LIZARD SHRINE — the one room on Mars with a door on it, a dead end
    # the green keycard answers to. What is in here is a cache and whatever the
    # colony left standing over it — never an elite, whose own key must not be
    # sealed inside the room it opens.
    - id: lizard_shrine
      area: shrine
      width: 460
      height: 400
      max: 1
      doors:
        - { edge: s, at: 230, width: 140 }
      props:
        - { object: colony_shrub, at: [120, 100] }
        - { object: colony_flowers, at: [230, 180] }
        - { object: colony_planter, at: [340, 110] }
        - { object: colony_shrub, at: [150, 280] }
      spawns:
        - { at: [230, 330] }
        - { at: [230, 190] }
        - { at: [340, 290] }
    # THE TERRARIUM — the billionaires' lifeboat garden, the boss's own room,
    # sewn farthest from the landing. THE FOUNDER holds court on the lawn with
    # an honor guard of posts around him.
    - id: terrarium_garden
      area: terrarium
      width: 720
      height: 600
      doors:
        - { edge: s, at: 360, width: 160 }
      boss: { at: [360, 250] }
      props:
        - { object: colony_tree, at: [130, 120] }
        - { object: colony_palm, at: [590, 130] }
        - { object: colony_fountain, at: [360, 470] }
        - { object: colony_hedge, at: [130, 470] }
        - { object: colony_tree_big, at: [590, 460] }
      spawns:
        - { at: [160, 280] }
        - { at: [560, 280] }
        - { at: [230, 470] }
        - { at: [490, 470] }

# THE HORDE: one finite knot per district, its breed mix handing over along the
# depth axis and its mob level climbing the ladder — scout rovers where he lands,
# servo bots and fembots through the middle, and the tanky SUCCESSOR only deep in,
# so they never wall the middle of the search.
horde:
  perRoom: [34, 48]
  maxAlive: 12
  lingering: 5
  ramps: [meek, meek, bold, fierce, savage, brutal, monstrous]
  hellgates: 7
  members:
    - enemy: scout_rover
      window: [0, 0.5]
      weight: 4
    # The mining units work the mid dust — and an errand on this map asks the
    # hero for six of them (content/quests/mars_recovery.yaml), so the colony
    # has to actually field them.
    - enemy: mining_rover
      window: [0.2, 0.6]
      weight: 2
    - enemy: servo_bot
      window: [0.25, 0.85]
      weight: 4
    - enemy: fembot
      window: [0.5, 1]
      weight: 3
    - enemy: successor
      window: [0.82, 1]
      weight: 1

# The four speaking elites, strung along the depth axis so the colony's story
# still unspools in order — the indexer, the foundation, the prime unit, and the
# seal.
elites:
  - enemy: the_indexer
    ramp: fierce
    hp: 260
  - enemy: the_vendor
    ramp: brutal
    hp: 250
  - enemy: successor_prime
    ramp: merciless
    hp: 340
  - enemy: the_seed
    ramp: endgame
    hp: 280

# THE TITHE ASSESSOR — the campaign chain's non-combatant on the colony. It
# works its own roaming round and stays neutral unless the hero deliberately
# talks it into an argument it cannot lose politely
# (content/conversations/tithe_assessor).
bystanders:
  - enemy: tithe_assessor

# The cache keepers, cycled across the dead-end districts.
guardians:
  - enemy: misprinted_fembot
    ramp: savage
    hp: 170
  - enemy: derelict_rover
    ramp: endgame
    hp: 260

# HELLGATES (config HELLGATES): rampage-only tears, laced district to district and
# gated to NIGHTMARE and up, with the worse breed gated again to JESUS.
hellborn:
  ramp: hellborn
  members:
    - enemy: olympus_engine
      count: 6
    - enemy: phobos_shepherd
      count: 4
      minDifficulty: jesus

# THE FOUNDER holds one of the SIX OUTER THIRDS — the four corners and the two
# middle flanks. Never the centre: a boss in the middle of the map is found by
# accident on the way to somewhere else, which is the opposite of a search.
boss:
  enemy: the_founder
  ramp: apex
  hp: 700
  regions:
    - northwest
    - northeast
    - southwest
    - southeast
    - center-west
    - center-east

# THE KEY: the green keycard THE SEED carries, which is what the SHRINE's door
# answers to. One card, one room.
locks:
  - terrarium

rareSpawns:
  rare:
    - misprinted_fembot
    - derelict_rover
  unique:
    - unit_zero
