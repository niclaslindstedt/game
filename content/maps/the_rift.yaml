# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
description: |-
  GENERATED THE RIFT — the tear between universes, rebuilt out of physics instead
  of terrain. THE READ: open void broken by DRIFTS of crystallized somewhere-else
  and knotted into CAGES where space froze solid, and THE FOUNDER is cowering in
  one of them. WHICH one is rolled per run out of the six outer thirds, so the far
  door is never where it was last time and the only way to him is to walk the void
  drift by drift, reading the fog-of-war minimap as it fills in.
  FEEL: nothing quite solid. Gravity is a fifth of Earth's, so a hop carries half a
  screen — and the barriers say so: out here there is nothing to pile up, so a wall
  is a piece of FRONTIER PHYSICS rather than masonry. A drift is fenced by frozen
  crystal you can round; a cage is sealed behind ANTI-GRAVITY BAFFLES strung
  between emitter pylons, and the only way through one is the gate somebody left
  open. VOID TEARS the floor never closed over are scattered across the open —
  unlike a crater they cannot be crossed at all, so the walk bends round them.
  The dead-end drifts hold the caches, each with a lone keeper.
id: the_rift
level: the_rift

# WHAT THE TEAR IS MADE OF. Three kinds of nothing, and the barriers between them
# fall out of the pairing: two VOIDS flow into each other with nothing between
# them, a DRIFT is fenced off behind frozen crystal with a broad gap through it,
# and a CAGE is sealed behind a baffle curtain with one gate. THE FOUNDER is only
# ever found in a CAGE — he tore his way in here and pulled it shut — and the hero
# always arrives in open void.
#
# The DRIFT and the CAGE override the FLOOR and the open VOID does not, which is
# the right way round out here: a drift and a cage are places where the nothing
# has thickened or frozen, and the seams between them are soft because every rift
# tile is mottled to begin with.
areas:
  - id: void
    enclosure: none
    weight: 3
    horde: 1
    boss: false
    label: OPEN VOID
  # A drift is where the tear's debris has collected, so the nothing there is
  # THICKER — nebula wall to wall rather than the open void's star-flecked black.
  # It is the one thing that tells the districts apart out here: with a single
  # ground everywhere the whole rift reads as one flat purple field.
  - id: drift
    enclosure: soft
    weight: 3
    horde: 1.15
    boss: false
    label: SHARD DRIFT
    wall: shardfence
    ground: { common: nebula_0, rare: nebula_1, rareEvery: 4 }
  # A cage is space frozen hard: the void with the lattice crystallizing through
  # it, so the ground shows the freeze rather than staying open black.
  - id: cage
    enclosure: hard
    weight: 1.6
    horde: 1.3
    spawn: false
    label: FROZEN CAGE
    wall: baffle
    ground: { common: void_0, rare: void_1, rareEvery: 3 }
    patch: { a: asteroid_0, b: asteroid_1, every: 5 }

size:
  width: 3800
  height: 2500
  rooms: 14

# THE CARVE. The widest cells and the widest gaps of any mission (620px floor,
# 280px gates): low gravity means the hero crosses ground fast and in long arcs,
# and a tight grid would have him bouncing off geometry he never meant to touch.
layout:
  minRoom: 620
  doorWidth: 280
  loopDoors: 0.34
  cluster: 0.5
  wall: shardfence

objects:
  # A DRIFT'S FENCE: crystallized moments of somewhere else, fifteen silhouettes
  # picked per stone, the chain meandering off true. It is the closest thing the
  # rift has to rubble.
  - id: shardfence
    type: wall
    kind: riftstone
    radius: 12
    wander: 20
    sprites:
      - riftstone
      - riftstone_slab
      - riftstone_jagged
      - riftstone_twin
      - riftstone_pitted
      - riftstone_tilted
      - riftstone_split
      - riftstone_stack
      - riftstone_shard
      - riftstone_crumble
      - riftstone_wedge
      - riftstone_tooth
      - riftstone_plate
      - riftstone_cluster
      - riftstone_hunch
  # A CAGE'S WALL: an anti-gravity baffle curtain. Straight and unmeandering —
  # a field is emitted between posts, and a field that wandered would be a leak.
  - id: baffle
    type: wall
    kind: rift_baffle
    radius: 9
    sprites:
      - rift_baffle
      - rift_baffle
      - rift_baffle_hot
      - rift_lattice
      - rift_pylon
  # Loose shards and salvage floating in the open.
  - id: rift_shard
    type: obstacle
    radius: 9
    density: 6.2
  - id: space_junk
    type: crate
    radius: 7
    density: 5.5
    loot:
      chance: 0.45
      drop:
        gear: 2
        health: 1
        stamina: 1
  # VOID TEARS: holes the floor never closed over. Impassable, unlike anything
  # else out here — the rift's one hard "no".
  - id: rift_pit_small
    type: obstacle
    radius: 8
    density: 4.1
    areas: [void, drift]
  - id: rift_pit
    type: obstacle
    radius: 12
    density: 2.8
    areas: [void, drift]
  - id: rift_sinkhole
    type: obstacle
    radius: 17
    density: 1.4
    areas: [void, drift]
  # Pinned singularities and seams, knotted into the cages where the tear is
  # worst.
  - id: rift_singularity
    type: obstacle
    radius: 10
    density: 4.8
    areas: [cage]
  - id: rift_seam
    type: obstacle
    radius: 8
    density: 5.5
    areas: [cage, drift]
  - id: cache
    type: chest
  # VOID FAUNA. The junk field is all THINGS — lost objects standing still —
  # so the one moving light matters: star moths drifting between the shards,
  # navigating by lights that burned out long ago. A critter: collides with
  # nothing, costs the simulation nothing, cannot desync a replay.
  - id: star_moth
    type: critter
    animated: true
    density: 2.6
    range: [70, 180]
    speed: [5, 14]
    scale: [0.8, 1.2]
  # LOOSE PHYSICS — flat texture over the nothing, so the void reads as a place
  # rather than as an unfinished level.
  - id: stardust
    type: decor
    density: 5.4
  - id: floating_rock
    type: decor
    density: 3.8
  - id: lost_tv
    type: decor
    density: 1.4
  - id: rift_pebbles
    type: decor
    density: 5.9
  - id: rift_grit
    type: decor
    density: 4.3
    areas: [drift]
  - id: rift_pocks
    type: decor
    density: 4.9
  - id: rift_scar
    type: decor
    density: 3.2
  - id: rift_dust
    type: decor
    density: 3.8
    areas: [void]
  - id: rift_debris
    type: decor
    density: 4.3
    areas: [drift, cage]
  # The rift he stepped through, and the far door he is running for.
  # THE WAY IN — the tear the hero arrived through, standing where he landed.
  # Its own id rather than `rift`, because that KIND belongs to the tear THE
  # FOUNDER rips open when he bolts (`flees.landmark`), which is a door the
  # player can follow him through. Two tears that read the same and answer
  # differently need two names.
  - id: arrival_tear
    type: landmark
    sprite: rift
    at: spawn
  - id: far_door
    type: landmark
    sprite: rift
    at: goal

# THE STATIC PARTS DECK — the floor plan the tear is SEWN from (the shipping
# generator; the old carve stays behind the developer LEGACY MAP GENERATOR
# switch). Every part is a hand-drawn piece of frontier physics: void shelves
# to drift across, shard drifts behind their crystal fences, the cages where
# space froze solid behind baffle curtains — and THE FOUNDER'S CAGE as the
# boss's own room, sewn farthest from wherever the arrival tear opens. The
# horde is the deck's own spawn markers: ONE mob to a post (WoW-style),
# dormant until aggroed, refilled on the difficulty's respawn clock. Breeds
# are rolled by DEPTH from the horde members below, so the same shelf fields
# voidlings by the tear and gravitons out at the far door.
parts:
  count: [7, 10]
  list:
    # THE ARRIVAL SHELF — the hero steps out of the tear here; the landmark
    # stands at his spawn. One patroller sweeps the shelf so a hero who never
    # moves is still found (the promise the difficulty curve rests on).
    - id: arrival_shelf
      area: void
      start: true
      width: 660
      height: 540
      doors:
        - { edge: n, at: 330 }
        - { edge: s, at: 330 }
        - { edge: e, at: 270 }
        - { edge: w, at: 270 }
      spawns:
        - { at: [150, 390] }
        - { at: [150, 110] }
        - { at: [530, 130], patrol: true }
        - { at: [550, 430] }
    # A void channel — the corridor piece, repeatable, flippable to serve
    # either hand of the plan.
    - id: void_channel
      area: void
      width: 580
      height: 300
      flip: true
      max: 3
      weight: 3
      doors:
        - { edge: w, at: 150, width: 200 }
        - { edge: e, at: 150, width: 200 }
      props:
        - { object: rift_pit_small, at: [200, 90] }
        - { object: rift_shard, at: [370, 210] }
        - { object: stardust, at: [290, 150] }
      spawns:
        - { at: [450, 220] }
        - { at: [140, 150], patrol: true }
        - { at: [300, 80] }
        - { at: [300, 230] }
        - { at: [470, 160] }
    # A SHARD DRIFT — the tear's debris collected into thicker nothing, void
    # tears punched through it, one of the vanished standing among the shards.
    - id: shard_drift
      area: drift
      width: 640
      height: 560
      flip: true
      max: 2
      weight: 2
      doors:
        - { edge: n, at: 320, width: 220 }
        - { edge: w, at: 280, width: 220 }
        - { edge: s, at: 320, width: 220 }
      props:
        - { object: rift_shard, at: [230, 190] }
        - { object: rift_pit, at: [500, 150] }
        - { object: space_junk, at: [430, 330] }
        - { object: rift_debris, at: [340, 260] }
        - { object: rift_shard, at: [160, 420] }
      spawns:
        - { at: [500, 400] }
        - { at: [320, 120], slot: elite }
        - { at: [160, 290] }
        - { at: [480, 240], patrol: true }
        - { at: [340, 460] }
        - { at: [560, 470] }
    # A drift elbow — crystal wall to wall, one way in, one way on.
    - id: drift_elbow
      area: drift
      width: 480
      height: 480
      flip: true
      max: 2
      weight: 2
      doors:
        - { edge: n, at: 240, width: 200 }
        - { edge: e, at: 240, width: 200 }
      props:
        - { object: rift_seam, at: [180, 310] }
        - { object: rift_shard, at: [330, 170] }
        - { object: space_junk, at: [240, 240] }
      spawns:
        - { at: [110, 350] }
        - { at: [240, 130] }
        - { at: [130, 250], patrol: true }
        - { at: [350, 340] }
    # THE JUNK FIELD — everything that was ever lost, drifted into one shoal:
    # somebody's television, somebody's luggage, salvage worth breaking open.
    - id: junk_field
      area: void
      width: 620
      height: 500
      flip: true
      min: 1
      max: 2
      doors:
        - { edge: w, at: 250 }
        - { edge: s, at: 310 }
      props:
        - { object: space_junk, at: [150, 110] }
        - { object: space_junk, at: [210, 90] }
        - { object: rift_shard, at: [470, 150] }
        - { object: lost_tv, at: [310, 250] }
        - { object: space_junk, at: [440, 350] }
      spawns:
        - { at: [110, 250] }
        - { at: [310, 140], slot: elite }
        - { at: [150, 340] }
        - { at: [320, 370] }
        - { at: [480, 250], patrol: true }
    # THE FROZEN GALLERY — a cage sealed behind its baffle curtain, one gate
    # in and out. A dead end, which is what the cache picker looks for; its
    # stand is one of the posts the vanished are dealt onto.
    - id: frozen_gallery
      area: cage
      width: 520
      height: 420
      flip: true
      min: 1
      max: 2
      doors:
        - { edge: s, at: 260, width: 150 }
      props:
        - { object: rift_singularity, at: [130, 110] }
        - { object: rift_seam, at: [390, 120] }
        - { object: rift_debris, at: [260, 210] }
        - { object: rift_singularity, at: [420, 290] }
      spawns:
        - { at: [260, 340] }
        - { at: [260, 190], slot: elite }
        - { at: [120, 290] }
    # THE PYLON YARD — a cage with two gates somebody left open, pinned
    # singularities knotted between the emitter pylons.
    - id: pylon_yard
      area: cage
      width: 560
      height: 460
      flip: true
      max: 2
      doors:
        - { edge: w, at: 230, width: 150 }
        - { edge: s, at: 280, width: 150 }
      props:
        - { object: rift_singularity, at: [150, 120] }
        - { object: rift_seam, at: [300, 230] }
        - { object: rift_singularity, at: [440, 340] }
      spawns:
        - { at: [440, 130] }
        - { at: [280, 120], slot: elite }
        - { at: [140, 330] }
        - { at: [460, 230], patrol: true }
    # THE FOUNDER'S CAGE — the boss's own room, sewn farthest from the
    # arrival. He tore his way in here and pulled it shut; BRO OMEGA stands
    # over him, and the honor guard of posts holds the corners.
    - id: founders_cage
      area: cage
      width: 740
      height: 600
      doors:
        - { edge: s, at: 370, width: 160 }
      boss: { at: [370, 250] }
      props:
        - { object: rift_singularity, at: [140, 130] }
        - { object: rift_singularity, at: [600, 130] }
        - { object: rift_seam, at: [370, 460] }
        - { object: rift_debris, at: [150, 470] }
      spawns:
        # A GRAVITON stands the cage's own guard EXPLICITLY: the sight-beat
        # `rift_graviton` waits on the breed, and a depth-rolled watch missed
        # it on real seeds (same fix as the moon's pinned SUCCESSOR).
        - { at: [180, 280], enemy: graviton }
        - { at: [560, 280] }
        - { at: [240, 470] }
        - { at: [500, 470] }

# THE HORDE: one finite knot per drift, handing over along the depth axis —
# voidlings where he arrives, gravitons only out at the deep end.
horde:
  perRoom: [26, 40]
  maxAlive: 11
  lingering: 4
  ramps: [meek, bold, fierce, savage, brutal, merciless, monstrous]
  hellgates: 7
  members:
    - enemy: voidling
      window: [0, 0.5]
      weight: 4
    - enemy: star_jelly
      window: [0.2, 0.7]
      weight: 3
    - enemy: unraveler
      window: [0.45, 1]
      weight: 4
    - enemy: graviton
      window: [0.78, 1]
      weight: 1

# The six vanished, strung along the depth axis so the roll call still unspools
# in order.
elites:
  - enemy: harry_houdini
    ramp: savage
    hp: 50
  - enemy: nikola_tesla
    ramp: brutal
    hp: 320
  - enemy: lucky
    ramp: merciless
    hp: 300
  - enemy: the_residency
    ramp: merciless
    hp: 50
  - enemy: amelia_earhart
    ramp: merciless
    hp: 290
  - enemy: grigori_rasputin
    ramp: endgame
    hp: 360

guardians:
  - enemy: stray_comet
    ramp: savage
    hp: 150
  - enemy: collapsed_star
    ramp: endgame
    hp: 240

hellborn:
  ramp: hellborn
  members:
    - enemy: first_vanishing
      count: 6
    - enemy: scaled_ancestor
      count: 4
      minDifficulty: jesus

# THE FOUNDER, cornered in a cage in one of the SIX OUTER THIRDS, with BRO OMEGA
# standing over him — the pair the authored rift ends on, kept together.
boss:
  enemy: the_founder_rift
  ramp: apex
  hp: 750
  escort:
    - enemy: bro_omega
      count: 1
      ramp: apex
      hp: 850
  regions:
    - northwest
    - northeast
    - southwest
    - southeast
    - center-west
    - center-east

rareSpawns:
  rare:
    - stray_comet
    - collapsed_star
  unique:
    - the_last_photon
