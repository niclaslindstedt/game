# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
description: |-
  THE GARAGE — the hub, and the one STATIC blueprint in the game: `carveSeed`
  pins the carve, so home lays out identically every visit. THE READ IS THE CUTSCENE'S OWN ESTABLISHING SHOT, walkable: the
  GARAGE BAY southwest (poured CEMENT underfoot — no tiles — the furniture
  against the walls, oil patches, papers and cable on the floor, the car
  mid-floor, the ROLL-UP DOOR on its east wall, the rift seam humming beside
  the car once it exists at all); the clean PAVED DRIVE out front of the
  door (swept pavement, no garbage — the house stands just south of it, off
  the map's edge); THE LAWN behind the garage to the north, grass with the
  rocket standing on its burnt patch at the west end of it; and — down the whole east edge, the
  one piece of the lot that is not the household's — THE ROAD, two lanes of
  dark tarmac with a painted centre line, running off both ends of the map.
  The road is where the driveway leads and where a driven car is finally
  GONE (`driveOut`), so the trip to GOODCO is a drive out of the bay, across
  the drive and onto the tarmac rather than a cut at the roll-up door.
  Small MEANS small — a Left 4 Dead
  staging area, not a level. Nothing is loot: no chests, no breakable
  crates — a hero does not shoot up his own garage — just furniture. No
  horde at all (`horde: 0` on every area — the mission's objective is `hub`
  and the whole lot is home ground), no boss, no locks but the garage door
  itself, which rolls up for anybody who walks or drives up to it. The
  three door landmarks (car, rocket, rift_seam) are what the mission's
  `travelDoors` stand on.
id: garage
level: garage

# THE PIN. A home does not rearrange its walls between errands — and a mod
# that wants a different garage changes this file like any other blueprint.
carveSeed: 35

areas:
  # The one INSIDE district on the lot: the bay has a roof on it, which is what
  # lets the workbench world stand here and nowhere else on the map. Every other
  # area below is open sky and says nothing, which is the default.
  - id: bay
    enclosure: hard
    space: inside
    weight: 1
    horde: 0
    boss: false
    label: THE GARAGE
    ground: { common: cement_0, rare: cement_1, rareEvery: 5 }
    # THE LIGHTS ARE ON IN HERE. It is a garage: a roof, a strip light over the
    # bench, and a man who has been working in it all evening. So the bay keeps
    # its own light when the lot outside goes dark (`sky: earth` on the
    # mission) — and it keeps it as a ROOM, right up to the walls, which is
    # what a district can express and a pool of light cannot. Short of 1 on
    # purpose: a working garage at midnight is lit, not sunlit, and the doorway
    # still has to read as the edge of somewhere.
    lit: 0.82
  - id: drive
    enclosure: none
    weight: 1
    horde: 0
    boss: false
    spawn: false
    label: THE DRIVEWAY
    ground: { common: pavement_0, rare: pavement_1, rareEvery: 4 }
  - id: lawn
    enclosure: none
    weight: 2
    horde: 0
    boss: false
    spawn: false
    label: THE LAWN
    ground: { common: grass_0, rare: grass_1, rareEvery: 9 }
  # THE PATCH THE SHIP STANDS ON — the lawn where it stops being lawn.
  #
  # A man built a rocket in the bay and lights it on the grass behind it
  # (`content/cutscenes/launch.yaml`), so the ground under it is whatever the
  # last fire left. It is its OWN district rather than the whole lawn's floor
  # because the lawn is mostly fine: the east half of the lot, between the garage
  # door and the road, has never had anything lit on it, and blacking all of it
  # reads as a different place. The cutscene draws exactly the same patch, derived from where the
  # ship is parked — the two have to agree, because the player walks the one and
  # watches the other.
  #
  # …AND IT IS GRASS TO BEGIN WITH. This is the ONE district in the game that
  # changes over a campaign (`MapStage`, engine/game/mapgen/stages.ts), and the
  # reason is that the burning is a THING THAT HAPPENS rather than a fact about
  # the lot: the first time the hero walks out here his ship has never flown, so
  # the ground under it is the same lawn as the ground around it. Charred
  # afterwards, and past charring once Mars is behind him.
  #
  # THE LADDER IS THE HOUSE'S LADDER, read off the same `cleared:` tags the
  # launch's props are (`content/cutscenes/launch.yaml`) — three fires, and
  # nothing between them ever puts any of it back:
  #
  #   green    he has not lit it yet
  #   charred  the moon is behind him — the launch AND the landing home
  #   ashen    Mars is too, and there was nothing left to burn by then
  #
  # Open ground with the lawn on every side (`enclosure: none`), so nothing is
  # walled off; it wears the same LABEL, because it is not somewhere else.
  - id: pad
    enclosure: none
    weight: 1
    horde: 0
    boss: false
    spawn: false
    label: THE LAWN
    ground: { common: grass_0, rare: grass_1, rareEvery: 9 }
    stages:
      - needs: "cleared:moon"
        ground: { common: grass_charred_0, rare: grass_charred_1, rareEvery: 9 }
      - needs: "cleared:mars"
        ground: { common: grass_ashen_0, rare: grass_ashen_1, rareEvery: 9 }
  # ── THE ROAD ────────────────────────────────────────────────────────────────
  # The two lanes down the far east edge, and the painted line between them.
  # They are separate areas ONLY because a district's floor is one ground pair:
  # the dash tile carries its own gaps (`road_dash`), so a one-tile-wide strip
  # of it between two lanes of plain tarmac paints an evenly broken centre line
  # with nothing having to place the dashes.
  #
  # `driveOut` is what makes this a road rather than a dark stripe: reaching it
  # in the car ends the level (see `MapArea.driveOut` / `vehicles.ts`). It sits
  # on BOTH lanes and on the line, so the tarmac is departure ground whichever
  # inch of it the bumper touches first.
  #
  # `beat` is the road's second job and the reason the lot has a trader at all
  # any more: THE DEALER paces this strip end to end all run
  # (`LevelDef.merchant.beat` / merchant.ts). Both lanes and the line carry it,
  # so his beat is the whole width of the tarmac rather than one kerb — which
  # is also what puts him in front of the departing car often enough for the
  # thing to be a real hazard rather than a trick shot.
  - id: road
    enclosure: none
    weight: 1
    horde: 0
    boss: false
    spawn: false
    driveOut: true
    beat: true
    label: THE ROAD
    ground: { common: asphalt_0, rare: asphalt_1, rareEvery: 11 }
  - id: road_line
    enclosure: none
    weight: 1
    horde: 0
    boss: false
    spawn: false
    driveOut: true
    beat: true
    label: THE ROAD
    ground: { common: road_dash, rare: road_dash, rareEvery: 1 }
  # THE VERGE — grass on the far side of the road, and the reason it is here is
  # the MAP'S OWN EDGE: the renderer dithers the last ~20 units of every map out
  # to black, and with the tarmac laid flush against the boundary that band ate
  # the far lane, so the road read as half a road. The verge takes the dither
  # instead and the road is a road all the way across. Not `driveOut`: a car has
  # already crossed the tarmac to get here.
  - id: verge
    enclosure: none
    weight: 1
    horde: 0
    boss: false
    spawn: false
    label: THE ROAD
    ground: { common: grass_0, rare: grass_1, rareEvery: 9 }

# THE FLOOR PLAN — authored, not carved: the cutscene's establishing shot as
# rooms. The GARAGE BAY southwest with its roll-up door east onto the clean
# PAVED DRIVE (the house stands south of the drive, just off the map's edge),
# and THE LAWN spanning the whole back of the lot to the north, with the rocket
# standing on its burnt patch at the WEST end of it. Walls derive from the areas' enclosures
# exactly as a carve's would: the hard bay is walled with ONE doorway (the
# garage door hangs across it); lawn and drive meet as open ground.
plan:
  rooms:
    # THE LAWN, in two pieces around the burnt PAD the ship stands on: the strip
    # north of the pad, which runs the whole width of the lot, and the long east
    # end running down to the road. A plan is rectangles, so a patch with lawn
    # around it is spelled as the lawn around it.
    #
    # THE PAD IS AT THE WEST END, hard against the lot's own boundary. A rocket
    # is not parked in the middle of somebody's back garden: it went up at the
    # far end, as far from the house as the ground allowed, and the fire ran to
    # the fence. Standing it there also leaves the whole east half of the lawn
    # walkable between the garage door and the road, which is the stretch the
    # player actually crosses on every errand.
    - area: lawn
      rect: { x: 0, y: 0, width: 400, height: 44 }
    - area: pad
      rect: { x: 0, y: 44, width: 160, height: 96 }
    - area: lawn
      rect: { x: 160, y: 44, width: 240, height: 96 }
    - area: bay
      rect: { x: 0, y: 140, width: 224, height: 140 }
    - area: drive
      rect: { x: 224, y: 140, width: 176, height: 140 }
    # THE ROAD, kept last in the list: a chamber's id is its position here, so a
    # room appended at the end leaves every id above it alone. Three rooms, all
    # TILE-ALIGNED (16 px): an open district's floor is emitted as a ragged patch
    # and then grown back out to the tile grid, so a strip whose edges already sit
    # on it comes out crisp and full height, which is what a painted line needs
    # and what a kerbside wants anyway.
    - area: road
      rect: { x: 400, y: 0, width: 32, height: 280 }
    - area: road_line
      rect: { x: 432, y: 0, width: 16, height: 280 }
    - area: road
      rect: { x: 448, y: 0, width: 32, height: 280 }
    - area: verge
      rect: { x: 480, y: 0, width: 32, height: 280 }
  doors:
    - between: [bay, drive]
  # The rocket stands on its own burnt patch. No `stall:` — the trader is not standing
  # anywhere: a flagged BEAT outranks an authored stall (mapgen/generate.ts),
  # so his pitch, his safe pocket and the street light hung on him all follow
  # him onto the road.
  goal: pad

# One look, every visit. A LOT smaller than the rest of the game's venues,
# because it is a garage, not a level. The lot itself is still 400 wide; the
# extra 112 is the ROAD and its far VERGE, which belong to the county rather
# than to the house. `rooms` is ignored under a plan.
size:
  width: 512
  height: 280
  rooms: 7

layout:
  minRoom: 128
  doorWidth: 64
  loopDoors: 0
  cluster: 0.6
  wall: partition

objects:
  - id: partition
    type: wall
    kind: wall
    radius: 8

  # ── THE GARAGE DOOR ──────────────────────────────────────────────────────
  # `at: spawn` — hung across the bay's doorway(s), the HERO'S OWN chamber: a
  # chain of roll-up slat segments that opens for anybody who walks or drives
  # up (LevelDef.doors, opens: approach), and the threshold the driven car
  # departs through. `rollUp` is what makes it go UP rather than aside: it
  # picks the chain-drive sound and the roll-up animation, and it is why it
  # needs no open frame — there is nothing left standing in the opening.
  - id: garage_door
    type: door
    sprite: garage_door
    at: spawn
    rollUp: true
    radius: 8
    # THE TWO BARN LIGHTS BOLTED EITHER SIDE OF THE OPENING — the lamps the
    # whole night out here hangs off (the mission carries `sky: earth`, so the
    # lot follows the clock). The carve stands one at each end of the chain, a
    # step onto the DRIVE side, so they flank the roll-up and their pools fall
    # on the pavement in front of it — which is what the driveway is lit by
    # once the sun is down, and what a man walking out to his car at midnight
    # actually sees. Sodium-warm, and WAVERING — gently, because these are the
    # fittings on this lot that still work: ten years on the same wall and the
    # same tired mains, so they breathe rather than stutter. The county's
    # street light is the one that is actually failing (0.18, below) and it
    # stays the worst of the four; two barn lights dipping hard together over
    # the one strip of pavement anybody has to walk across would be a strobe
    # rather than a night. Nothing keeps them in step — every lamp's waver is
    # phased off its OWN position (render/night.ts) — so the pair shimmers
    # against itself the way real outdoor pairs do.
    #
    # KEEP THE RADIUS SMALL. The whole lot is 512×280 and the phone sees most
    # of it at once, so two pools whose tails touch light the place back to
    # daylight — which is exactly how the first pass of this came out, and it
    # read as the brightness turned down rather than as night.
    #
    # AND BOLTED A COURSE CLEAR OF THE OPENING — `lift`, one tile of it. The
    # pair is placed at the chain's own ends, which is right on the floor plan
    # and wrong in the picture: a wall is drawn as an EXTRUDED FACE and a
    # fitting is painted from its foot upward, so a lamp at the chain's end sat
    # on the doorway's very last block with the roll-up door crossing it.
    #
    # THIS DOORWAY RUNS DOWN THE PICTURE, so the carve spends the lift as a
    # symmetric step ALONG the wall rather than as a height (see
    # `MapObject.lamps.lift`) — on this axis the two are the same screen move,
    # and spent as a height it put one lamp 52 px above the opening and the
    # other 20 px below its centre, hanging in the hole over the car. Spent
    # outward, the pair sits at 158 and 262 with the opening's centre at 210:
    # evenly flanking the roll-up, both on plain brickwork, each pool on the
    # pavement under its own fitting, which is where a barn light and its light
    # actually are.
    lamps:
      sprite: wall_lamp
      lift: 16
      light:
        radius: 58
        color: "255, 206, 138"
        intensity: 0.92
        flicker: 0.12

  # ── THE DOORS (see the mission's travelDoors) ────────────────────────────
  # The car sits in the bay at the hero's landing; the rocket holds the goal
  # cell out on the lawn; the seam lands beside the trader's counter — fixed
  # forever by the pinned carve. The car and the rocket are VEHICLES
  # (engine/game/vehicles.ts): the landmark is the travel door's tap anchor and
  # the assembly renderer draws the machine in its place, so the sprite here
  # only satisfies the atlas check.
  - id: car
    type: landmark
    sprite: car_doors_0
    at: spawn
    # …PARKED ON THE DOORWAY'S OWN LINE, which the hero's landing is not: the
    # roll-up is punched at y 178–242 and he lands at 198, so a wagon left on his
    # spot pulled out 12 px north of centre and spent the whole drive-out with
    # its roof inside the north jamb's stones. The car is 48 px long and 26 tall
    # and the hole is 64 wide — there is room to go through the middle of it, and
    # nothing but this was stopping it. Authored, like every other offset on this
    # map, because the carve is PINNED (`carveSeed`): the doorway lands on the
    # same 64 px every visit forever.
    offset: { x: 0, y: 12 }
  - id: rocket
    type: landmark
    sprite: starship
    at: goal
  # ── THE CACHE ────────────────────────────────────────────────────────────
  # THE ANTIQUE CHEST against the bay's NORTH WALL — the game's one stash
  # (engine/game/cache.ts), and the only landmark here that is not a door.
  #
  # It is authored whether or not the hero has earned it: the map's job is to
  # know WHERE the furniture goes, and whether it is standing there is the
  # RUN's business (`cacheOwned`, a session parameter off the character's
  # keepsakes). That split is what lets the chest be handed over mid-run and
  # simply be there on every visit afterwards, with nothing re-carved.
  #
  # `spawn` + a nudge NORTH, rather than a coordinate: the bay's north wall
  # runs along the top of the hero's own chamber, so a lift off his landing is
  # a description of the place that survives the floor plan moving. Being a
  # landmark also keeps the workbench world off it — the obstacle scatter
  # clears every landmark by `decorClearance`, which is exactly what a chest
  # somebody has to be able to walk up to needs.
  - id: cache
    type: landmark
    sprite: antique_chest
    at: spawn
    offset: { x: 0, y: -40 }
  # The seam hums on the bay floor beside the car — a step off the hero's own
  # landing and level with it, INSIDE the garage rather than up against the
  # wall behind it (`home`, mapgen/generate.ts, which is where that step is
  # measured). The app hides it until THE FOUNDER's RIFT CREATOR has come home
  # (nothing to see before the rift has been walked).
  - id: rift_seam
    type: landmark
    at: home

  # ── THE LAMPS ────────────────────────────────────────────────────────────
  # What is still burning out here after dark, and nothing more: two pools on
  # the open lot, with black grass between them and the barn lights flanking
  # the door (above). The bay itself is not on this list — a garage is LIT (see
  # the district's own `lit:`), and a room's lights are a room, not a circle.
  #
  # Both are pinned to the carve's own anchors and nudged off them (`at` +
  # `offset`), never to a coordinate: the pin makes this lot lay out identically
  # every visit, but a lamp authored at an absolute x/y would still be a lie the
  # day the floor plan moves.
  #
  # AND BOTH HAVE SOMETHING THROWING THEM. A pool on open ground with nothing
  # above it does not read as a lamp, it reads as a bug — a bulb burning in
  # mid-air. So the lawn's light gets a POST (`fixture`), and the machine's is
  # pinned to the machine itself, which the game already draws.
  #
  # AND EVERY LIGHT UNDER THE SKY OUT HERE WAVERS — these two and the barn pair
  # on the door, on a ladder from the county's failing street light (0.18) down
  # to the barn lights that merely breathe (0.12). A steady bulb is the thing
  # that gives a night lot away as a picture: it is the one light source with
  # no weather, no age and no bad connection anywhere in it. The bay is NOT on
  # this ladder and must not join it — a lit ROOM has no flicker to author, and
  # a garage whose strip light stuttered would read as a fault rather than as a
  # place somebody works.
  #
  # THE YARD LIGHT on the back lawn — the post that was put up to light the
  # driveway years before there was a rocket standing on the grass. Dim on
  # purpose: enough to find the ladder by and not a lumen more, and the OLDEST
  # fitting on the lot, so it wavers nearly as badly as the county's — the one
  # thing out here nobody has climbed a ladder to since the rocket went up.
  - id: lawn_light
    type: light
    at: goal
    offset: { x: -34, y: 16 }
    fixture: lamp_post
    light:
      radius: 52
      color: "255, 222, 170"
      intensity: 0.55
      flicker: 0.16
  # THE STREET LIGHT over the road — the county's, not the household's, which
  # is why it is the coldest light on a lot lit otherwise in sodium. Pinned to
  # `counter` (the trader's own spot, which on this map is the near lane), so
  # the beat he paces has one lit end and one dark one and a man in a black
  # hood is findable at midnight without being on show. Flickering, because
  # nobody has come out to fix it.
  - id: street_light
    type: light
    at: counter
    # …and a step WEST of the trader's spot, which puts the post on the kerb
    # instead of in the near lane. A lamp standing in live traffic is the kind
    # of thing nobody can name but everybody reads as wrong — and it is the
    # lane the departing car uses.
    offset: { x: -24, y: 0 }
    fixture: lamp_post
    light:
      radius: 46
      color: "182, 214, 240"
      intensity: 0.6
      flicker: 0.18

  # ── THE WORKBENCH WORLD (furniture, never loot) ──────────────────────────
  # PLACED, NOT SCATTERED — this is the STATIC map, and the furniture is the
  # last thing on it that was still being rolled. Each piece stands `at: spawn`
  # plus a nudge, which puts the whole bench world along the BAY'S NORTH WALL,
  # in a line with the chest, on every visit forever.
  #
  # It was `density` + `edge: true` and that was wrong twice over. Wrong in
  # PRINCIPLE, because a home is the one place in the game whose furniture the
  # player is supposed to learn — a bench that moves between errands is not a
  # bench, it is set dressing. And wrong in PRACTICE, because the scatter's
  # honest answer in a bay this snug (224×140, most of it inside the landmark
  # clearance around the car, the chest and the seam) was NOTHING AT ALL: every
  # seed placed zero of them, so the room authored a workbench world and shipped
  # bare cement.
  #
  # The offsets are off the hero's own landing rather than absolute, for the
  # reason the chest's are (see `cache` above): the bay's north wall runs along
  # the top of his chamber, so "a lift off where he lands" survives the floor
  # plan moving in a way an authored x/y never would. −40 is the chest's own
  # lift, which is what puts the four pieces on one line.
  #
  # NO TOOLBOXES IN HERE, of either kind: the rolling `tool_chest` against the
  # wall and the `parts_bin` heaped on the floor are both gone. They were the
  # only props on the lot that read as CONTAINERS — a box with its lid off and
  # coloured hardware sticking out of it looks exactly like something to walk
  # over and pick up, and there is nothing to pick up in a man's own garage
  # (see the blueprint's own note at the top: nothing here is loot). A bench
  # and a rack of parts say "somebody works here" without making that promise.
  - id: workbench
    type: obstacle
    radius: 8
    at: spawn
    offset: { x: -60, y: -40 }
  # Two racks, east of the chest — separate entries because an object id is the
  # palette's key and each anchored piece is one entry; they share the sprite.
  - id: part_rack_mid
    type: obstacle
    sprite: part_rack
    radius: 6
    at: spawn
    offset: { x: 50, y: -40 }
  - id: part_rack_east
    type: obstacle
    sprite: part_rack
    radius: 6
    at: spawn
    offset: { x: 80, y: -40 }
  # …and the floor wears the years: oil where the car stands, stains, loose
  # cable, papers and scorch — a lot of garbage, none of it loot.
  - id: oil_patch
    type: decor
    density: 180
    areas: [bay]
  - id: stain
    type: decor
    density: 90
    areas: [bay]
  - id: cable
    type: decor
    density: 130
    areas: [bay]
  - id: papers
    type: decor
    density: 130
    areas: [bay]
  - id: weld_scorch
    type: decor
    density: 90
    areas: [bay]
  # THE LAWN'S OWN TENANTS. A couple of sparrows working the grass — the one
  # moving thing on a lot that is otherwise a parked car and a rocket, and
  # what makes the home hub read as a HOME. Critters: no collision, no cost,
  # unbothered by the launch history under the pad.
  - id: sparrow
    type: critter
    animated: true
    density: 60
    areas: [lawn]
    range: [40, 120]
    speed: [10, 26]
    scale: [0.8, 1.1]
    # …AND THEY GO UP INTO THE TREES. A bird that only ever walks is a mouse
    # with wings: `perches` breaks the lap to sit in the nearest crown for a
    # few seconds and drops back onto whatever patch of grass the wander has
    # reached by then (engine/game/fauna.ts). The trees below carry the other
    # half of it.
    perches: true

  # ── THE TREES ────────────────────────────────────────────────────────────
  # THE ONES ON THE PAD ARE THE POINT. A patch of ground going black is a
  # texture swap and reads as one — it is the trees standing in it that make the
  # damage a thing that HAPPENED to somewhere, because a tree is the same object
  # in all three states and the player has already walked past it green.
  #
  # So they climb the pad's own ladder, and a rung may swap the SPRITE and
  # nothing else (`MapStage`): the carve is identical on every rung, which is
  # what stands them in exactly the same places all campaign. A tree that had
  # moved by the time it was charred would read as a different lot rather than
  # as a burnt one.
  #
  # SOLID, like the colony's (`content/maps/mars.yaml`) — you cannot walk
  # through a tree — and no `loot`: nothing on this lot is loot. Every one of
  # them is `perch`: a crown is where the lot's sparrows go to sit, which is the
  # half of "birds" that is not walking about (see the `sparrow` line above).
  #
  # PLACED, NOT SCATTERED, for the reason the workbench world below is (see its
  # note): this is the STATIC map and the player is meant to learn it. The four
  # stand at the pad's own corners, off the `goal` the ship holds, so they RING
  # the launch rather than crowding it — and being anchored they are stamped
  # rng-free, so adding them shifted no roll on the lot.
  - id: pad_tree_nw
    type: obstacle
    sprite: lawn_tree
    radius: 7
    perch: true
    at: goal
    offset: { x: -52, y: -32 }
    stages:
      - needs: "cleared:moon"
        sprite: lawn_tree_charred
      - needs: "cleared:mars"
        sprite: lawn_tree_ashen
  - id: pad_tree_ne
    type: obstacle
    sprite: lawn_tree
    radius: 7
    perch: true
    at: goal
    offset: { x: 50, y: -36 }
    stages:
      - needs: "cleared:moon"
        sprite: lawn_tree_charred
      - needs: "cleared:mars"
        sprite: lawn_tree_ashen
  - id: pad_tree_sw
    type: obstacle
    sprite: lawn_tree
    radius: 7
    perch: true
    at: goal
    offset: { x: -54, y: 30 }
    stages:
      - needs: "cleared:moon"
        sprite: lawn_tree_charred
      - needs: "cleared:mars"
        sprite: lawn_tree_ashen
  - id: pad_tree_se
    type: obstacle
    sprite: lawn_tree
    radius: 7
    perch: true
    at: goal
    offset: { x: 48, y: 32 }
    stages:
      - needs: "cleared:moon"
        sprite: lawn_tree_charred
      - needs: "cleared:mars"
        sprite: lawn_tree_ashen
  # …AND THE THREE BEYOND THE PATCH NEVER BURN, which is the half that proves
  # the other half. A lot where everything green goes black at once is a lot
  # with a SETTING; a lot where the fire stopped at the edge of the patch it was
  # lit on is a lot where somebody DID something. Same sprite, no ladder — the
  # lawn east of the patch and the strip along the back fence have never had
  # anything lit on them, and after Mars they are the only green left out here.
  - id: lawn_tree_far_east
    type: obstacle
    sprite: lawn_tree
    radius: 7
    perch: true
    at: goal
    offset: { x: 250, y: -14 }
  - id: lawn_tree_east
    type: obstacle
    sprite: lawn_tree
    radius: 7
    perch: true
    at: goal
    offset: { x: 110, y: 10 }
  - id: lawn_tree_north
    type: obstacle
    sprite: lawn_tree
    radius: 7
    perch: true
    at: goal
    offset: { x: -8, y: -70 }
  # ── THE LAWN ─────────────────────────────────────────────────────────────
  - id: fuel_drum
    type: obstacle
    radius: 5
    density: 8
    areas: [lawn]
  - id: laundry_line
    type: decor
    density: 10
    areas: [lawn]
  - id: haystack
    type: obstacle
    radius: 7
    density: 8
    areas: [lawn]
  - id: plant
    type: decor
    density: 24
    areas: [lawn]

# No horde stands here — every area above is `horde: 0`, so no knot is ever
# placed — but the block itself is required and its members must resolve, so
# it names the gentlest staffer at zero pressure.
horde:
  perRoom: [1, 1]
  maxAlive: 1
  lingering: 0
  ramps: [meek]
  hellgates: 0
  members:
    - enemy: intern
      window: [0, 1]
      weight: 1

# No elites, no guardians, no boss: a hub casts nobody — the mission's
# objective is `hub` and never clears.
boss: null
