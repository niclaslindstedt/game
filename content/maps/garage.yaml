# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
description: |-
  THE GARAGE — the hub, and the one STATIC blueprint in the game: `carveSeed`
  pins the carve (and the size roll), so home lays out identically every
  visit. THE READ IS THE CUTSCENE'S OWN ESTABLISHING SHOT, walkable: the
  GARAGE BAY southwest (poured CEMENT underfoot — no tiles — the furniture
  against the walls, oil patches, papers and cable on the floor, the car
  mid-floor, the ROLL-UP DOOR on its east wall, the rift seam humming beside
  the car once it exists at all); the clean PAVED DRIVE out front of the
  door (swept pavement, no garbage — the house stands just south of it, off
  the map's edge); and THE LAWN behind the garage to the north, grass where
  the rocket stands and the trader parks. Small MEANS small — a Left 4 Dead
  staging area, not a level. Nothing is loot: no chests, no breakable
  crates — a hero does not shoot up his own garage — just furniture. No
  horde at all (`horde: 0` on every area — the mission's objective is `hub`
  and the whole lot is home ground), no boss, no locks but the garage door
  itself, which rolls up for anybody who walks or drives up to it. The
  three door landmarks (car, rocket, rift_seam) are what the mission's
  `travelDoors` stand on.
id: garage
level: garage

# THE PIN. A home does not rearrange its walls between errands — and a mod
# that wants a different garage changes this file like any other blueprint.
carveSeed: 35

areas:
  - id: bay
    enclosure: hard
    weight: 1
    horde: 0
    boss: false
    label: THE GARAGE
    ground: { common: cement_0, rare: cement_1, rareEvery: 5 }
  - id: drive
    enclosure: none
    weight: 1
    horde: 0
    boss: false
    spawn: false
    label: THE DRIVEWAY
    ground: { common: pavement_0, rare: pavement_1, rareEvery: 4 }
  - id: lawn
    enclosure: none
    weight: 2
    horde: 0
    boss: false
    spawn: false
    label: THE LAWN
    ground: { common: grass_0, rare: grass_1, rareEvery: 9 }

# THE FLOOR PLAN — authored, not carved: the cutscene's establishing shot as
# rooms. The GARAGE BAY southwest with its roll-up door east onto the clean
# PAVED DRIVE (the house stands south of the drive, just off the map's edge),
# and THE LAWN spanning the whole back of the lot to the north, where the
# rocket stands and the trader parks. Walls derive from the areas' enclosures
# exactly as a carve's would: the hard bay is walled with ONE doorway (the
# garage door hangs across it); lawn and drive meet as open ground.
plan:
  rooms:
    - area: lawn
      rect: { x: 0, y: 0, width: 400, height: 140 }
    - area: bay
      rect: { x: 0, y: 140, width: 224, height: 140 }
    - area: drive
      rect: { x: 224, y: 140, width: 176, height: 140 }
  doors:
    - between: [bay, drive]
  # The rocket stands on the grass; the vending machine parks on the drive.
  goal: lawn
  stall: drive

# One look, three times: the sizes are identical on purpose — a static hub
# must not change scale under the GENERATED MAPS setting. A LOT smaller than
# the rest of the game's venues, because it is a garage, not a level.
sizes:
  small:
    width: 400
    height: 280
    rooms: 4
  medium:
    width: 400
    height: 280
    rooms: 4
  large:
    width: 400
    height: 280
    rooms: 4

layout:
  minRoom: 128
  doorWidth: 64
  loopDoors: 0
  cluster: 0.6
  wall: partition

objects:
  - id: partition
    type: wall
    kind: wall
    radius: 8

  # ── THE GARAGE DOOR ──────────────────────────────────────────────────────
  # Hung across the bay's doorway(s): a chain of roll-up slat segments that
  # slides open for anybody who walks or drives up (LevelDef.doors, opens:
  # approach) — and the threshold the driven car departs through.
  - id: garage_door
    type: door
    sprite: garage_door
    radius: 8

  # ── THE DOORS (see the mission's travelDoors) ────────────────────────────
  # The car sits in the bay at the hero's landing; the rocket holds the goal
  # cell out on the lawn; the seam lands beside the trader's counter — fixed
  # forever by the pinned carve. The car and the rocket are VEHICLES
  # (src/game/vehicles.ts): the landmark is the travel door's tap anchor and
  # the assembly renderer draws the machine in its place, so the sprite here
  # only satisfies the atlas check.
  - id: car
    type: landmark
    sprite: car_doors_0
    at: spawn
  - id: rocket
    type: landmark
    sprite: starship
    at: goal
  # The seam hums on the bay wall beside the car — a step off the hero's own
  # landing, INSIDE the garage. The app hides it until THE FOUNDER's RIFT
  # CREATOR has come home (nothing to see before the rift has been walked).
  - id: rift_seam
    type: landmark
    at: home

  # ── THE WORKBENCH WORLD (furniture, never loot) ──────────────────────────
  # Furniture stands AGAINST THE WALLS (`edge`), the way a real garage keeps
  # its floor open for the car; the densities are sized to the snug bay
  # (density is per-million px², and the bay is ~22k), so each line lands
  # about its count.
  - id: workbench
    type: obstacle
    radius: 8
    density: 50
    areas: [bay]
    edge: true
  - id: tool_chest
    type: obstacle
    radius: 6
    density: 95
    areas: [bay]
    edge: true
  - id: part_rack
    type: obstacle
    radius: 6
    density: 50
    areas: [bay]
    edge: true
  # …and the floor wears the years: oil where the car stands, stains, loose
  # cable, papers and scorch — a lot of garbage, none of it loot.
  - id: oil_patch
    type: decor
    density: 180
    areas: [bay]
  - id: stain
    type: decor
    density: 90
    areas: [bay]
  - id: cable
    type: decor
    density: 130
    areas: [bay]
  - id: papers
    type: decor
    density: 130
    areas: [bay]
  - id: weld_scorch
    type: decor
    density: 90
    areas: [bay]
  - id: parts_bin
    type: decor
    density: 90
    areas: [bay]

  # ── THE LAWN ─────────────────────────────────────────────────────────────
  - id: fuel_drum
    type: obstacle
    radius: 5
    density: 8
    areas: [lawn]
  - id: laundry_line
    type: decor
    density: 10
    areas: [lawn]
  - id: haystack
    type: obstacle
    radius: 7
    density: 8
    areas: [lawn]
  - id: plant
    type: decor
    density: 24
    areas: [lawn]

# No horde stands here — every area above is `horde: 0`, so no knot is ever
# placed — but the block itself is required and its members must resolve, so
# it names the gentlest staffer at zero pressure.
horde:
  perRoom: [1, 1]
  maxAlive: 1
  lingering: 0
  ramps: [meek]
  hellgates: 0
  members:
    - enemy: intern
      window: [0, 1]
      weight: 1

# No elites, no guardians, no boss: a hub casts nobody — the mission's
# objective is `hub` and never clears.
boss: null
