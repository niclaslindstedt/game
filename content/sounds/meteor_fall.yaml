id: meteor_fall
description: >-
  MOONFALL landing: a dead-weight rock hitting regolith — a low lowpassed
  thud with a short gravel crack over it. No ring: this is stone, not
  ordnance, and it repeats every half second, so it stays dry.
on:
  type: meteorFall
voices:
  - call: noise
    durationMs: 130
    volume: 0.055
    filter:
      type: lowpass
      frequency: 340
  - call: tone
    type: sine
    from: 120
    to: 40
    durationMs: 180
    volume: 0.045
  - call: noise
    durationMs: 45
    volume: 0.03
    delayMs: 20
    filter:
      type: bandpass
      frequency: 1600
      q: 1.1
