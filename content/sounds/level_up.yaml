id: level_up
description: >-
  The DING — the game's biggest triumph, sized to fill the engine's
  ding-celebration window (LEVELING.dingCelebrationMs) while the light
  EXPLODES off the hero and the horde is hurled back, so sound and light
  are one moment. Anatomy of the triumph, ground-up: 1. THE DETONATION — a
  deep sub-boom the instant the light bursts: a low sine dropping into the
  floor under a soft filtered thump, so the ding lands with WEIGHT before
  the fanfare lifts off it.
