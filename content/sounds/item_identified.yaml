id: item_identified
description: >-
  The scroll doing its work: a rising sine arpeggio with a glass octave over
  the top and a long echo — the reveal is a small ceremony, and the card that
  follows is the payoff. Deliberately tier-agnostic: the LOOT SHINE already
  says how good the piece is, and doubling that here would make identifying a
  blue sound like identifying an orange.
on:
  type: itemIdentified
