id: loot_shine_unique
description: >-
  The gold find — the one every Diablo player learns to hear from across
  a room: a bright four-note major arpeggio with a shimmer over the top,
  and enough echo to hang for a beat after the item has settled.
on:
  type: lootShine
  tier: unique
