id: enemy_miss
description: >-
  A blow going past — one short breathy band of noise, quiet enough to read as
  a near thing rather than as a hit.
on:
  type: enemyMiss
voices:
  - call: noise
    durationMs: 60
    volume: 0.022
    filter:
      type: bandpass
      frequency: 2200
      q: 0.8
