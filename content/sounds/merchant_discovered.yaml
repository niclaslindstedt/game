id: merchant_discovered
description: >-
  Finding somebody selling something out here: a bright little three-note
  triangle flourish with a coin-bright sine on the end. It is one of the few
  genuinely GOOD surprises a level hands out, so it is allowed to be a small
  fanfare — but a short one, and well under a boss's.
on:
  type: merchantDiscovered
voices:
  - call: tone
    type: triangle
    from: 523
    durationMs: 80
    volume: 0.034
    echo: 0.2
  - call: tone
    type: triangle
    from: 659
    durationMs: 80
    volume: 0.034
    delayMs: 80
    echo: 0.2
  - call: tone
    type: triangle
    from: 784
    durationMs: 180
    volume: 0.036
    delayMs: 160
    echo: 0.3
  - call: tone
    type: sine
    from: 2093
    durationMs: 120
    volume: 0.013
    delayMs: 200
    echo: 0.3
