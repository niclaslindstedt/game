id: rocket_boom_b
description: >-
  An explosion in the shell, SECOND take — snappier and brighter than the
  first: the crack opens higher, the shell falls faster, the debris arrives
  sooner. A satellite's tanks rather than a hull.
voices:
  - call: noise
    durationMs: 55
    volume: 0.07
    filter:
      type: bandpass
      frequency: 2200
  - call: tone
    type: sawtooth
    from: 520
    to: 44
    durationMs: 420
    volume: 0.08
    detuneCents: 26
    echo: 0.28
  - call: noise
    durationMs: 700
    volume: 0.05
    filter:
      type: lowpass
      frequency: 380
    echo: 0.32
  - call: noise
    durationMs: 420
    volume: 0.03
    delayMs: 110
    filter:
      type: highpass
      frequency: 4400
    echo: 0.22
