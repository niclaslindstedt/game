id: achievement_legend
description: >-
  The fanfare for a LEGEND badge — the sound of the card reveal, in the four
  beats the light is drawn in: a filtered rip sweeping up over a sub as the
  rays tear open, a slow choir triad swelling behind them, the badge chime's
  arpeggio carried two octaves higher and racing the card in, and the full
  chord landing under the bloom with an impact beneath it. The only achievement
  cue allowed to stand beside the level-up ding rather than under it.
