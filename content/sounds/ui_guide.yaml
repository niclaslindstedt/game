id: ui_guide
description: >-
  The "go this way" beacon: a soft sonar ping in step with the guidance
  arrow's blink (~once a second while the way is clear). A gentle sine
  pulse with a glassy octave sparkle and a breath of echo — it sits at the
  very bottom of the mix, a nudge onward, never an alert. Repeats often,
  so it stays among the quietest and shortest voices in the set.
voices:
  - call: tone
    type: sine
    from: 1245
    durationMs: 70
    volume: 0.02
    echo: 0.18
  - call: tone
    type: sine
    from: 2490
    durationMs: 40
    volume: 0.01
    echo: 0.15
