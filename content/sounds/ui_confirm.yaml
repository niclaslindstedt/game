id: ui_confirm
description: >-
  Two rising detuned steps: "accepted", with a little room on it.
voices:
  - call: tone
    type: square
    from: 660
    durationMs: 60
    volume: 0.045
    detuneCents: 5
    echo: 0.15
  - call: tone
    type: square
    from: 990
    durationMs: 100
    volume: 0.045
    delayMs: 60
    detuneCents: 5
    echo: 0.2
