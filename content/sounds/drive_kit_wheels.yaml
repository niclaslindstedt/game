id: drive_kit_wheels
description: >-
  …AND WHAT THEY WERE ON, OR PUSHING — a small hard wheel let loose and
  skittering off across the road. The skater's board, the cyclist's bike, a
  pram. It is a rattle rather than a clatter: high, fast, three ticks in
  under a fifth of a second, and gone. The one thing on this road that keeps
  travelling after the body has stopped.
