id: drive_panel_c
description: >-
  The third panel rung — the dull one: a wing that has already been folded
  twice going a third time, which has no ring left in it at all.
voices:
  - call: tone
    type: triangle
    from: 240
    to: 148
    durationMs: 130
    volume: 0.028
    detuneCents: 16
  - call: noise
    durationMs: 60
    volume: 0.018
    filter:
      type: lowpass
      frequency: 900
