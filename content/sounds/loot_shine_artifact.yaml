id: loot_shine_artifact
description: >-
  The red-white find, and the rarest sound in the game: a sub swell, a
  full rising figure over it, and a long shimmering tail. It is allowed to
  be the biggest thing on screen because a player may go a whole campaign
  without hearing it.
