id: gate_entered
description: >-
  Stepping through: a swept lowpass whoosh and a sine falling away behind it.
  The whole sound is DEPARTURE — everything in it moves away from the
  listener, which is what makes it read as a transition rather than an
  arrival.
on:
  type: gateEntered
voices:
  - call: noise
    durationMs: 300
    volume: 0.04
    echo: 0.35
    filter:
      type: lowpass
      frequency: 900
  - call: tone
    type: sine
    from: 660
    to: 220
    durationMs: 340
    volume: 0.028
    delayMs: 40
    echo: 0.4
