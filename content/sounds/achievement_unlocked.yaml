id: achievement_unlocked
description: >-
  The badge chime, at the middle of the effort ladder — G, C, E climbing 70 ms
  apart, each triangle note shadowed an octave up by a quiet sine, with a
  bright airy hiss over the top and a last shimmer rising out of the tail, over
  a warm root swell and the fifth it settles on. A lesser badge plays the same
  chime quieter and without those last two; the top rung plays a different
  piece entirely (achievement_legend).
