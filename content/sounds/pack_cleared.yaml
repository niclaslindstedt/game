    type: triangle
    from: 659
    durationMs: 150
    volume: 0.045
    delayMs: 0
    echo: 0.3
  - call: tone
    type: sine
    from: 1318
    durationMs: 130
    volume: 0.016
    delayMs: 0
    echo: 0.35
  - call: tone
    type: triangle
    from: 988
    durationMs: 150
    volume: 0.045
    delayMs: 90
    echo: 0.3
  - call: tone
    type: sine
    from: 1976
    durationMs: 130
    volume: 0.016
    delayMs: 90
