id: item_landed_relic
description: >-
  A story piece coming to rest: a low resonant hum that swells rather
  than strikes, wet with echo. Rare enough to be allowed the length.
on:
  type: itemLanded
  kind: relic
voices:
  - call: tone
    type: sine
    from: 294
    durationMs: 260
    volume: 0.028
    attackMs: 40
    echo: 0.4
  - call: tone
    type: sine
    from: 587
    durationMs: 200
    volume: 0.016
    delayMs: 40
    echo: 0.45
  - call: noise
    durationMs: 30
    volume: 0.012
    filter:
      type: lowpass
      frequency: 700
