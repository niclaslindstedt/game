id: quest_progress
description: >-
  A tally moved: one clipped high tick, a tally mark going down on paper.
  Under a twentieth of the completion cue's volume — this fires once per kill
  on a long errand, so it has to sit UNDER the combat rather than on top of it.
on:
  type: questProgress
voices:
  - call: tone
    type: square
    from: 1568
    durationMs: 45
    volume: 0.016
  - call: noise
    durationMs: 40
    volume: 0.006
    filter:
      type: highpass
      frequency: 5200
