    durationMs: 30
    volume: 0.026
    filter:
      type: highpass
      frequency: 3000
  - call: tone
    type: square
    from: 1420
    to: 1180
    durationMs: 24
    volume: 0.02
    delayMs: 46
    detuneCents: 14
  - call: tone
    type: square
    from: 980
    to: 880
    durationMs: 20
    volume: 0.015
    delayMs: 104
    detuneCents: 10
  - call: noise
    durationMs: 44
