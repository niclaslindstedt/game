id: drive_kit_steel
description: >-
  WHAT THEY WERE HOLDING, arriving a moment after they do — light steel tube
  going end over end down the tarmac. A walking frame, a pair of crutches, a
  wheelchair: the crowd is not eighteen silhouettes, it is eighteen people
  carrying eighteen different things, and this is the cheapest possible way to
  say so. Three bounces getting quieter and lower, no body in it at all —
  that is the thud's job, and this is only ever laid over one.
voices:
