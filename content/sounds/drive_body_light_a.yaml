id: drive_body_light_a
description: >-
  A LIGHT BODY on the bumper — the old woman, the girl with the headphones,
  somebody on crutches. The whole bank sits a fifth higher and a third shorter
  than the ordinary thud beside it, because that is what less mass does to a
  collision: the same blow arrives faster, leaves sooner and has nothing under
  it. The first of three.
