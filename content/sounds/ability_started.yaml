id: ability_started
description: >-
  Enabling a powerup: a bright ascending power-up flourish. A rising saw
  sweep swells underneath a four-note arpeggio (C–E–G–C), capped with a
  shimmering bell — the unmistakable "power ON" moment.
on:
  type: abilityStarted
voices:
