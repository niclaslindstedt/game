id: mercy_drop
description: >-
  The guardian's arrival: a soft, consonant halo of sound — a rising major
  arpeggio of sine bells (C6–E6–G6–C7) under a shimmering high sine, all
  wet with echo. Gentle (a rescue, not a fanfare) and pitched above the
  drop's own tick so the two layer rather than clash.
on:
  type: mercyDrop
voices:
  - call: tone
    type: sine
    from: 1047
    durationMs: 260
    volume: 0.032
    delayMs: 0
    echo: 0.4
  - call: tone
    type: sine
    from: 1319
    durationMs: 260
    volume: 0.032
    delayMs: 90
    echo: 0.4
  - call: tone
    type: sine
    from: 1568
    durationMs: 260
    volume: 0.032
    delayMs: 180
    echo: 0.4
  - call: tone
    type: sine
    from: 2093
    durationMs: 260
    volume: 0.032
    delayMs: 270
    echo: 0.4
  - call: tone
    type: sine
    from: 3136
    durationMs: 220
    volume: 0.014
    delayMs: 360
    echo: 0.5
