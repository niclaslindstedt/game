dialogue:
  - - AN UNINVITED GUEST. I HAVE PLAYED THIS SCENE TWICE. I DID MY OWN STUNTS IN BOTH.
  - hero:
      - THE STUNT DOUBLE. OF COURSE. WHAT IS A MOVIE MAN DOING RUNNING A ROBOT COWBOY TOWN?
  - - THE BOSS SAW MY REEL AND WEPT. 'BUILD ME THE OLD WEST,' HE SAID. I DELEGATED.
  - hero:
      - I'M HEADED FOR YOUR CONTROL CENTER. HAND OVER THE PASS, AND KEEP YOUR TECHNIQUE.
  - - THE BIG BOX KEEPS YOUR GIRL. IT ASKED FOR HER BY NAME. I SIGNED IT. GOOD PENMANSHIP.
  - - I RUN THE CONTROL CENTER AND A STYLE OF MY OWN INVENTION. NOBODY ELSE HAS IT. OBSERVE.
lastWords:
  - IN MY FILMS... ...I ALWAYS GOT UP...
