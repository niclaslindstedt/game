id: the_stunt_double
name: THE STUNT DOUBLE
lore: >-
  The park's co-founder, handed a budget on the strength of a filmography
  nobody checked, who delegated everything except the credit. He signed the delivery
  paperwork himself, which is how he knows the SUPERCORE asked for a live
  human by name.
