id: the_founder_boot_hill
name: THE FOUNDER
lore: >-
  Two universes of running end here, in a compound with no rift left to tear
  and nobody left to call. He dies as he lived, offering equity, and his
  entire estate turns out to be three pieces of worthless trash.
role: boss
levelBonus: 5
sprite: the_founder_beach
hp: 900
speed: 42
radius: 20
contactDamage: 36
critChance: 0.15
contactCooldownMs: 900
dialogue:
  - - NO. NO NO NO. HOW. I SOLD THE RIFT TO EXACTLY ONE DICTATOR. THIS WAS A GATED COMMUNITY.
  - hero:
      - YOU MADE ME CHASE YOU ACROSS UNIVERSES, THE FOUNDER. NOWHERE LEFT TO RUN. WHERE IS ADA?
  - - LOOK - BOOT HILL RUNS ON MY TRUST ME BRO AI. LICENSING, RECURRING REVENUE. I AM A SUBSCRIPTION.
  - hero:
      - WHERE. IS. SHE. LAST TIME I ASK NICELY.
  - - DELIVERED. THE SUPERCORE WANTED HER. I DON'T READ ITS LOGS ANYMORE. IT READS MINE.
  - hero:
      - THE SUPERCORE? YOUR OWN AI GIVES ORDERS NOW? SHE'S SOLD TO AN AI YOU DON'T CONTROL?
  - - FINE. FINE! TAKE THE PARK. TAKE THE COMPANY. I'LL START ANOTHER. I ALWAYS DO.
  - hero:
      - SOMEONE ALWAYS HANDS YOU ANOTHER CHAIR, DON'T THEY. EVER WONDER WHO? OR WHY?
  - - SECURITY! CONTROLLERS! ANYONE! ...I'LL GIVE YOU EQUITY.
# THE DEATH RITE — Same end as Mars, and it should read as the same man being finished the same way.
death: execution

# THE HERO'S LINE as the blade goes in — the one place he gets to answer a
# man who has lectured him across three worlds.
deathBark:
  - NO BOARD MEETING. NO OTHER UNIVERSE. JUST THE FLOOR.

lastWords:
  - THIS ISN'T FAIR... ...I WAS GOING PRIVATE...
mechanics:
  enrage:
    belowHpFrac: 0.25
    speedMult: 1.4
    damageMult: 1.35
  abilities:
    # The resort has a concierge service. It arrives from orbit.
    - id: airstrike
      windupMs: 950
      windupFloorMs: 700
      cooldownMs: 11000
      count: 3
      spread: 130
      fallMs: 1450
      blastRadius: 56
      damageFrac: 0.8
      hatch: cowbot
      hatchCount: 1
    # CALL OF INCELS, NIGHTMARE AND ABOVE — the boardwalk fills up.
    - id: call_horde
      minDifficulty: nightmare
      windupMs: 900
      cooldownMs: 16000
      waves: 2
      waveGapMs: 3000
      runnerSprite: incel
      bark:
        - THE COMMUNITY IS
        - VERY EXCITED TO
        - MEET YOU.
ai:
  aggroRadius: 280
  leashRadius: 460
loot:
  items:
    - defId: soggy_cardboard_sword
      tier: trash
    - defId: legal_distinction_empty
      tier: trash
    - defId: demo_wiper
      tier: trash
  weapons: 0
  gear: 0
  xpArrows: 0
  repairs: 0
  medkits: 0
  tierBonus: 0
