id: the_founder_boot_hill
name: THE FOUNDER
lore: >-
  Two universes of running end here, in a compound with no rift left to tear
  and nobody left to call. He dies as he lived, offering equity, and his
  entire estate turns out to be three pieces of worthless trash.
role: boss
levelBonus: 5
sprite: the_founder_beach
# WEALTH (config GOLD): the richest man alive, and it is all in his pockets.
wealth: 6
hp: 900
speed: 42
radius: 20
contactDamage: 36
critChance: 0.15
contactCooldownMs: 900
dialogue:
  - - NO. NO NO NO. I SOLD THE RIFT TO EXACTLY ONE DICTATOR. THIS WAS A GATED COMMUNITY.
  - hero:
      - THAT'S THE END OF THE STREET, THE FOUNDER. WHERE IS SHE?
  - - DELIVERED. THE SUPERCORE WANTED HER. I DON'T READ ITS LOGS ANYMORE. IT READS MINE.
  - hero:
      - SOMEBODY ALWAYS PULLS OUT ANOTHER CHAIR FOR YOU. DO YOU EVER WONDER WHO?
  - - SECURITY! CONTROLLERS! ANYONE! ...I'LL GIVE YOU EQUITY.
# THE DEATH RITE — Same end as Mars, and it should read as the same man being finished the same way.
death: execution

# THE HERO'S LINE as the blade goes in — the one place he gets to answer a
# man who has lectured him across three worlds.
deathBark:
  - NO BOARD MEETING. NO OTHER UNIVERSE. THAT'S ALL IT WAS.

lastWords:
  - THIS ISN'T FAIR. IT ISN'T FAIR. I DIDN'T DO ANY OF IT.
mechanics:
  enrage:
    belowHpFrac: 0.25
    speedMult: 1.4
    damageMult: 1.35
  abilities:
    # The resort has a concierge service. It arrives from orbit.
    - id: airstrike
      windupMs: 950
      windupFloorMs: 700
      cooldownMs: 11000
      count: 3
      spread: 130
      fallMs: 1450
      blastRadius: 56
      damageFrac: 0.8
      hatch: cowbot
      hatchCount: 1
    # CALL OF INCELS, NIGHTMARE AND ABOVE — the boardwalk fills up.
    - id: call_horde
      minDifficulty: nightmare
      windupMs: 900
      cooldownMs: 16000
      waves: 2
      waveGapMs: 3000
      runnerSprite: incel
      bark:
        - THE COMMUNITY IS
        - VERY EXCITED TO
        - MEET YOU.
ai:
  aggroRadius: 280
  leashRadius: 460
loot:
  items:
    - defId: soggy_cardboard_sword
      tier: trash
    - defId: legal_distinction_empty
      tier: trash
    - defId: demo_wiper
      tier: trash
  weapons: 0
  gear: 0
  xpScrolls: 0
  repairs: 0
  medkits: 0
  tierBonus: 0
