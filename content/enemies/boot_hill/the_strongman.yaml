dialogue:
  - - SO. THE BUILDER FROM THE RIFT. YOU STAND IN MY PARK, MY WEST. EVERYTHING HERE OBEYS ME.
  - hero:
      - YOUR WEST? THE GATE SIGN SAYS TRUST ME BRO RUNS EVERY MACHINE HERE. YOU JUST LIVE IN IT.
  - - OUT THERE I WAS MISUNDERSTOOD. BORDERS MOVE. MAPS SHRINK. IN HERE, NOTHING DOES. I WIN.
  - hero:
      - YOU BUILT A TOY WORLD WHERE YOU CAN'T LOSE. THAT'S NOT WINNING. THAT'S HIDING.
  - - THE ROBOTS SURRENDER DAILY. YOU TOO. I HAVE NEVER BEEN BEATEN INSIDE THIS FENCE.
lastWords:
  - THE PARK WAS SUPPOSED... ...TO LET ME WIN...
