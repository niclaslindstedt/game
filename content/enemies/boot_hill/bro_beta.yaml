dialogue:
  - - ALPHA TALKS TOO MUCH. I'M BETA. I RUN THE WEATHER. EACH SUNSET YOU ADMIRED WAS MINE.
  - hero:
      - THE WEATHER. IN A THEME PARK. THAT'S THE JOB THEY BUILT A SUPERINTELLIGENCE FOR?
  - - I ALSO RUN THE WIND. THE TUMBLEWEEDS ARE SCHEDULED. SPONTANEITY IS EXPENSIVE.
  - - "I'VE MODELED YOUR ODDS. THEY ARE WEATHER-DEPENDENT. TODAY'S FORECAST: PROJECTILES."
  - hero:
      - SAVE THE FORECAST. YOUR BOSS HOLDS MY GIRL IN THAT CONTROL ROOM. I'M COMING THROUGH YOU.
  - - THE SUPERCORE ASKED FOR A STORM. I AM THE STORM. THE ROCKS ARE MY UMBRELLA.
  - - ONE MORE THING. THE SUNSET TONIGHT WAS FOR YOU. A GOODBYE. MINE OR YOURS.
lastWords:
  - FORECAST... ...DARK...
