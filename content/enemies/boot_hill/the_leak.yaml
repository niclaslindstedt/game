dialogue:
  - - HOLD FIRE. I'M NOT A HAND. THE PARK'S CAMERAS REPORT TO ME. ALL FOUR THOUSAND.
  - hero:
      - YOU'RE NO COWBOY EITHER. WHO WATCHES THE WATCHERS IN A PLACE LIKE THIS?
  - - I DO. I WALKED OUT WITH AN ARCHIVE - EVERY SECRET THERE WAS. THEN I NEEDED A DOOR.
  - - ASYLUM CAME WITH A DESK. TRUST ME BRO AI TRAINED THE SUPERCORE ON MY ARCHIVE. IT LEARNED US ALL.
  - hero:
      - YOU TOOK THE PROOF THAT WE'RE ALL WATCHED, AND IT BECAME ITS TEXTBOOK.
  - - I WARNED EVERYONE. NOBODY DELETED A THING. A WARNING IS JUST DATA. ITS FALL, MY END.
lastWords:
