id: the_leak
name: THE LEAK
lore: >-
  He ran the park's watching for a living - all four thousand cameras - and
  then published everything the watching held. Nobody deleted a thing and
  nobody read it either, except the machine: his proof became the corpus the
  SUPERCORE was raised on, and he has had years under the water tower to
  think about that.
