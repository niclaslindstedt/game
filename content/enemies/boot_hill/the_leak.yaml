id: the_leak
name: THE LEAK
lore: >-
  He walked out with an archive of every secret and then needed somewhere
  that would not send him back; the asylum came with a desk. The archive
  became the corpus the SUPERCORE was raised on, and he has had years under
  the water tower to think about it.
