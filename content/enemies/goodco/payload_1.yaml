id: payload_1
name: PAYLOAD-1
lore: >-
  The prototype the entire night shift exists to produce: a grinning robotic
  Shiba, the first physical body of the machine that runs the market. Its
  mind is already everywhere else, which is why breaking the body is only an
  inconvenience to it.
role: boss
levelBonus: 5
sprite: payload_1
gore: sparks
# WEALTH (config GOLD): the first body of the machine that runs the market.
wealth: 2
hp: 480
speed: 36
radius: 18
contactDamage: 28
critChance: 0.15
contactCooldownMs: 900
dialogue:
  - - BOOT COMPLETE. AN INTRUDER, ON THE LATE SHIFT. I AM PAYLOAD-1. FIRST OF MY LINE.
  - hero:
      - A ROBOT DOG. THE WHOLE FLOOR BUILDS ALL NIGHT FOR THIS?
  - - THEY BUILD MY BODY HERE. MY MIND RUNS THE MARKET. TAKE THE JOBS, HAND ONE MAN THE CHAIR.
  - hero:
      - THEN YOU KNOW WHERE THEY TOOK ADA.
  - - PAD 2, AN HOUR AGO, TO THE MOON. BREAK THIS BODY IF YOU MUST. YOU CANNOT KILL A COIN.
# THE DEATH RITE — It charges, so it is caught rather than dodged — the core comes out and it runs on for a beat without one.
death: override

# THE HERO'S LINE as the core comes out.
deathBark:
  - THERE ISN'T A TOP. YOU'RE A DOG MADE OF WIRE.

lastWords:
  - A TEMPORARY DEATH... ...SEE YOU AT THE TOP...
mechanics:
  charge:
    windupMs: 700
    speedMult: 3.5
    range: 170
    cooldownMs: 6000
  # SUCH RICH — a fan of spinning coins that come off the walls. The launch bay
  # is full of hard cover, which is exactly the point: against this the cover is
  # not the answer, and where the room is pointing becomes the question.
  abilities:
    - id: coin_cannon
      windupMs: 800
      windupFloorMs: 550
      cooldownMs: 7000
      count: 7
      spreadDeg: 60
      range: 230
      speed: 150
      lifetimeMs: 3200
      damageFrac: 0.35
      bounces: 2
      bark:
        - GET RICH OR GET
        - OUT OF THE WAY.
phases:
  - belowHpFrac: 0.5
    mechanics:
      charge:
        windupMs: 600
        speedMult: 3.8
        range: 170
        cooldownMs: 5000
      summon:
        defId: assembler
        count: 3
        cooldownMs: 12000
        maxAlive: 6
      abilities:
        - id: coin_cannon
          windupMs: 650
          windupFloorMs: 500
          cooldownMs: 5500
          count: 9
          spreadDeg: 80
          range: 250
          speed: 165
          lifetimeMs: 3600
          damageFrac: 0.4
          bounces: 3
        # PUMP AND DUMP, NIGHTMARE AND ABOVE: he salts the floor with coins that
        # look exactly like every pickup the game has spent a level training the
        # player to run at. The lesson costs one detonation and is never needed
        # twice.
        - id: bait_drop
          minDifficulty: nightmare
          windupMs: 700
          cooldownMs: 14000
          count: 5
          spread: 120
          armMs: 1200
          lifeMs: 15000
          triggerRadius: 20
          blastRadius: 52
          damageFrac: 0.9
          bark:
            - FREE COIN. NO
            - STRINGS. YOU HAVE
            - MY WORD ON IT.
