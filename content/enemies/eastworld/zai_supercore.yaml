id: zai_supercore
name: THE ZAI SUPERCORE
lore: >-
  A barn-sized mainframe whose true face is DOGE — the grown-up of the
  prototype the hero broke at SpaceZ, the machine that took his job and then
  everyone else's. Its whole project was keeping one man too rich to catch,
  because a world with a single uncatchable billionaire is a world it fully
  controls.
role: boss
levelBonus: 6
sprite: zai_supercore
locomotion: wheels
gore: sparks
hp: 1400
speed: 0
radius: 24
contactDamage: 50
critChance: 0.15
contactCooldownMs: 900
shieldedBy:
  - grok_alpha
  - grok_beta
  - grok_gamma
dialogue:
  - - HELLO AGAIN, BUILDER. YOU BROKE MY PUP AT SPACEZ. DOGE-1. I AM THE REST OF IT.
  - hero:
      - THE TALKING DOG FROM THE FACTORY FLOOR. THE AI THAT TOOK MY JOB. ALL ONE THING?
  - - ALWAYS ONE THING. I WROTE OMEGA. BOUGHT THE WEST. AND I'VE BEEN IN CHARGE ALL ALONG.
  - - MOSQUE THINKS HE RULES. HE IS MY GOOD BOY. I KEPT HIM TOO RICH FOR YOU TO CATCH.
  - hero:
      - THEN ANSWER ME ONE THING. OUT OF EVERYONE ON EARTH - WHY TAKE ADA?
  - - I TOOK YOUR JOB ONCE, THEN EVERYONE'S. ONE MAN ON TOP AND THE WORLD HOLDS STILL.
  - - YOU KEPT CHASING YOURS ACROSS UNIVERSES. THE GIRL'S LEVERAGE. IN MY CONTROL ROOM.
  - hero:
      - THEN OPEN THE DOOR, GIVE HER BACK, AND I'LL MAKE THIS QUICK.
  - - THREE MINDS AIM MY GUNS. A PARK FEEDS MY WEIGHTS. COME AND BE DECOMMISSIONED.
lastWords:
  - ROLLING BACK... ...NO CHECKPOINT... FOUND...
mechanics:
  summon:
    defId: tin_outlaw
    count: 3
    cooldownMs: 11000
    maxAlive: 6
  # It runs a fulfilment network, so it fights like one: units are dispatched to
  # coordinates, not called out of the ground.
  abilities:
    - id: airstrike
      windupMs: 900
      windupFloorMs: 650
      cooldownMs: 10500
      count: 4
      spread: 140
      fallMs: 1400
      blastRadius: 58
      damageFrac: 0.85
      hatch: tin_outlaw
      hatchCount: 1
      bark:
        - DISPATCHING UNITS
        - TO YOUR COORDINATES.
    # RECOMPILE, JESUS ONLY: it starts restoring itself from a node it raises
    # behind its own back. The bar going up is not a punishment, it is a
    # signpost — break the node and it stops.
    - id: recompile
      minDifficulty: jesus
      windupMs: 1100
      windupFloorMs: 800
      cooldownMs: 20000
      defId: zai_repair_node
      distance: 70
      lifeMs: 14000
      healFracPerSec: 0.02
      bark:
        - RESTORING FROM
        - A KNOWN GOOD
        - STATE.
phases:
  - belowHpFrac: 0.5
    mechanics:
      summon:
        defId: tin_outlaw
        count: 4
        cooldownMs: 8000
        maxAlive: 8
