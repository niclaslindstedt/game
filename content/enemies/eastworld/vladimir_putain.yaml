      - YOU BUILT A TOY WORLD WHERE YOU CAN'T LOSE. THAT'S NOT WINNING. THAT'S HIDING.
  - - THE ROBOTS SURRENDER DAILY. YOU TOO. I'M A BLACK BELT - HONORARY. IT DOESN'T KNOW.
