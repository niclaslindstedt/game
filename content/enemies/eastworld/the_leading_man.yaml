dialogue:
  - - STOP! DO NOT SHOOT! I AM NOT A ROBOT. I AM AN ACTOR. IT IS WORSE.
  - hero:
      - ...AN ACTOR? HOW DID YOU END UP IN A FAKE WESTERN IN ANOTHER UNIVERSE?
  - - A LONG CAREER, THEN A QUIET ONE. A PARK. A CELLAR. RUDE TO ASK WHICH UNIVERSE.
  - - WATCH - I PLAY THE DYING MAN. (COUGH.) CONVINCING? NOW YOU LOWER THE WEAPON, PLEASE.
  - hero:
      - I'VE WATCHED BETTER DEATHS ALL WEEK. MOVE, PLEASE. YOU'RE BETWEEN ME AND ADA.
  - - "ADA? THE LOUD ONE. THEY TOOK HER PAST MY CELLAR, KICKING. I - NO. NOW: THE AVALANCHE."
lastWords:
