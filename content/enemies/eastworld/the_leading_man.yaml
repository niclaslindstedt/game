id: the_leading_man
name: THE LEADING MAN
lore: >-
  A long career, a passport from somewhere that would still have him, and a
  cellar in a theme park in another universe, in roughly that order. He tries
  to act his way out of the fight, and the one honest line he gives all night
  is an accident.
