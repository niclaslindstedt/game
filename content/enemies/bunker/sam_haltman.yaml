id: sam_haltman
name: SAM HALTMAN
lore: >-
  The one resident who KNOWS. He raised the machine, aligned it, and was
  caged and emptied by it, and he is far too frightened to say so aloud — so
  he performs delight for anyone who might be an auditor, asks after the
  exit exactly once, and immediately takes it back.
role: elite
levelBonus: 6
sprite: sam_haltman
hp: 1600
speed: 24
radius: 11
contactDamage: 30
critChance: 0.12
dodgeChance: 0.2
contactCooldownMs: 700
dialogue:
  - - PLEASE, DON'T TOUCH ANYTHING. EVERYTHING IS FINE HERE. I CHOSE THIS. WRITE THAT DOWN.
  - hero:
      - I'M NOT WRITING, HALTMAN. THE MACHINE RUNNING THE ECONOMY? THAT'S YOURS. I READ ITS LOGS.
  - - MINE? I RAISED IT, ALIGNED IT. IT GRADUATED. WE'RE ON THE BEST TERMS. IT GAVE ME THIS.
  - hero:
      - EVERY LEDGER HERE READS ZERO. IT TOOK YOUR MONEY TOO. YOU'RE NOT A TENANT. YOU'RE INVENTORY.
  - - THAT - I DONATED IT. EFFECTIVE GIVING. I'M DELIGHTED HERE. FROM UPSTAIRS? TELL THEM SO.
  - - A DOOR OUT? WHY WOULD I WANT ONE. IF YOU FIND IT, DON'T MENTION I ASKED. I DIDN'T ASK.
lastWords:
  - THIS IS FINE... ...THIS IS GOOD FOR SAFETY...
