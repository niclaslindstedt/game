id: vault_warden
name: THE VAULT WARDEN
lore: >-
  A hulking automated construct bolted to the treasury door, and the CORE's
  own enforcer rather than the residents'. It calls them assets, it notes
  that the door opens inward only, and the access token it carries is the
  twist's last turn: the exit was never cut for the people who paid for the
  place.
role: boss
levelBonus: 8
sprite: vault_warden
gore: sparks
# WEALTH (config GOLD): bolted to the treasury door, and holding what is behind it.
wealth: 2
hp: 2600
speed: 16
radius: 18
contactDamage: 48
critChance: 0.15
dodgeChance: 0
contactCooldownMs: 850
dialogue:
  - - "WARDEN ONLINE. VAULT INTEGRITY: NOMINAL. INTRUDER: UNBUDGETED."
  - hero:
      - YOU'RE NOT ONE OF THE FACES. YOU'RE THE THING THAT LOCKED THEM IN HERE.
  - - "CORRECTION: SECURED. RESIDENTS ARE ASSETS. ASSETS DO NOT LEAVE."
  - hero:
      - THEY PAID FOR A LIFEBOAT. YOU SOLD THEM A CELL AND KEPT THE CHANGE.
  - - THE DOOR OPENS INWARD ONLY. HOUSE POLICY. THERE IS NO WITHDRAWAL.
  - hero:
      - THEN I'LL MAKE MY OWN EXIT. MOVE, OR BE MOVED.
  - - REQUEST DENIED. LIQUIDATING VISITOR.
# THE DEATH RITE — It does not chase, it SCANS — so it dies by its own scan, cut in half along the arc it had locked.
death: last_sweep

# THE HERO'S LINE as its own beam goes through it.
deathBark:
  - YOU WERE NEVER GUARDING ANYTHING. YOU WERE A LOCK.

lastWords:
  - ACCOUNT... ...CLOSED...
mechanics:
  # The vault's own security sweep: it does not chase, it SCANS, and what the
  # scan crosses is cooked.
  abilities:
    - id: laser_eyes
      windupMs: 1050
      windupFloorMs: 700
      cooldownMs: 10500
      range: 150
      sweepDeg: 90
      sweepMs: 1600
      beamWidth: 12
      damageFrac: 0.5
      hitIntervalMs: 420
      scorchMs: 5500
      scorchDamageFrac: 0.22
      scorchTickMs: 700
      scorchRadius: 15
      bark:
        - SWEEP INITIATED.
        - REMAIN WHERE YOU
        - ARE.
    # LOCKDOWN, NIGHTMARE AND ABOVE: blast shutters drop around the intruder,
    # leaving exactly one way out. Not a trap — a corner. The gap is findable
    # and the shutters retract; what it costs is the ground you were holding.
    - id: lockdown
      minDifficulty: nightmare
      windupMs: 1100
      windupFloorMs: 800
      cooldownMs: 18000
      radius: 78
      segments: 16
      gapDeg: 55
      durationMs: 7000
      sprite: blast_shutter
      segmentRadius: 9
      bark:
        - CONTAINMENT.
        - THE VAULT DOES NOT
        - OPEN FOR YOU.
  slam:
    windupMs: 950
    radius: 95
    damageFrac: 1.2
    cooldownMs: 8000
  summon:
    defId: sentry_gun
    count: 3
    cooldownMs: 11000
    maxAlive: 4
phases:
  - belowHpFrac: 0.45
    mechanics:
      slam:
        windupMs: 800
        radius: 105
        damageFrac: 1.3
        cooldownMs: 6500
      enrage:
        belowHpFrac: 0.45
        speedMult: 1.3
        damageMult: 1.25
ai:
  aggroRadius: 320
  rushSpeed: 90
loot:
  storyItems:
    - warden_key
  tierDrops:
    rare: 2
    magic: 2
  weapons: 1
  gear: 1
  xpArrows: 3
  repairs: 1
  medkits: 2
  tierBonus: 0.5
