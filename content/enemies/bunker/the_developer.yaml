      - SO THE SECURITY OUT THERE IS YOUR OWN STOCK. YOU SOLD YOURSELF THE LOCK YOU'RE BEHIND.
  - - THEY'RE UNDER WARRANTY. MY LEDGER READS ZERO - CLERICAL. I'M DISPUTING IT. NOW MOVE ALONG.
