id: the_developer
name: THE DEVELOPER
lore: >-
  He built this bunker and sold every suite in it, then sold the fleets that
  made the suites necessary — the vacuum units and the door detail both. He
  has not yet worked out that the guards on his own door are his own stock,
  or that the zero on his account is not a clerical error.
