id: the_flagbearer
name: THE FLAGBEARER
lore: >-
  The first man to walk here, who planted the flag, learned what it was
  planted on, and never went home — while a copy grown in a tank on the ride
  back shook hands and cut ribbons for forty years. He has kept the watch
  alone ever since, and he only ever loses to the worthy.
role: boss
levelBonus: 5
sprite: the_flagbearer
locomotion: float
gore: ecto
phasing: true
# WEALTH (config GOLD): forty years of mission pay he was never alive to spend.
wealth: 1
hp: 550
speed: 40
radius: 20
contactDamage: 30
critChance: 0.15
contactCooldownMs: 900
dialogue:
  - - YOU SMELL LIKE EARTH. RAIN AND CUT GRASS AND TELEVISION. GO HOME.
  - hero:
      - NOT WITHOUT ADA. YOU'RE HIM, AREN'T YOU. FIRST BOOTS DOWN, NEVER WENT HOME.
  - - THEY GREW A SMILING COPY OF ME FOR THE PARADES. I KEPT THE FLAG AND THE GRAVE UNDER IT.
  - hero:
      - GOODCO DUG HERE. WHAT DID THEY FIND?
  - - THE WRECK SANG AND THE GRAVES OPENED. THEY CRATED IT ALL FOR MARS - HER TOO, BITING.
# THE DEATH RITE — It floats: there is nothing to pin and nothing to stand on, so the blade goes UP through it and the suit vents what was inside.
death: unmaking

# THE HERO'S LINE as the rite lands (see EnemyDef.deathBark) — a bark,
# floated over him while play continues, never a box.
deathBark:
  - FIRST MAN UP HERE. SOMEBODY SHOULD HAVE COME BACK FOR YOU.

lastWords:
  - THE WATCH... HHH... IT'S... YOURS... NOW...
mechanics:
  slam:
    windupMs: 900
    radius: 75
    damageFrac: 1.2
    cooldownMs: 8000
  # THE VIGIL — his hollow eyes light and a beam sweeps the regolith on fire.
  # The sweep itself is generous (a wide, slow arc off a bearing locked when
  # the eyes lit, so walking beats it); the pressure is the burning ground it
  # leaves, which eats the room the player has been circling in.
  abilities:
    - id: laser_eyes
      windupMs: 1100
      # Squeezed toward the floor as the ladder climbs — a move the player has
      # learned gets faster, but 700ms is a reaction and the tell never goes
      # under it.
      windupFloorMs: 700
      cooldownMs: 11000
      # Reach and arc are sized against the PHONE viewport (~422x195 world
      # units): the band has to be something the player routes around, and a
      # sweep that covers the whole visible floor is not a hazard, it is a
      # wall. Measured in the effects gallery, not guessed.
      range: 150
      sweepDeg: 80
      sweepMs: 1500
      beamWidth: 11
      damageFrac: 0.5
      hitIntervalMs: 420
      scorchMs: 5000
      scorchDamageFrac: 0.22
      scorchTickMs: 700
      scorchRadius: 15
      bark:
        - I HAVE WATCHED
        - THIS GROUND FOR
        - FIFTY YEARS.
phases:
  - belowHpFrac: 0.4
    mechanics:
      slam:
        windupMs: 700
        radius: 80
        damageFrac: 1.3
        cooldownMs: 6000
      enrage:
        belowHpFrac: 0.4
        speedMult: 1.4
        damageMult: 1.25
      abilities:
        # The beam comes back hotter and more often once he is cornered.
        - id: laser_eyes
          windupMs: 900
          windupFloorMs: 650
          cooldownMs: 8500
          range: 175
          sweepDeg: 105
          sweepMs: 1600
          beamWidth: 12
          damageFrac: 0.55
          hitIntervalMs: 400
          scorchMs: 6000
          scorchDamageFrac: 0.25
          scorchTickMs: 700
          scorchRadius: 16
        # NIGHTMARE AND ABOVE: he plants the flag again, and the graves it was
        # driven into open. Gated rather than tuned — the top rungs get a new
        # thing to learn, not a longer health bar.
        - id: flag_plant
          minDifficulty: nightmare
          windupMs: 1000
          cooldownMs: 16000
          defId: the_planted_flag
          distance: 60
          lifeMs: 22000
          bark:
            - I PLANTED IT ON
            - A GRAVE. LET THE
            - GRAVE ANSWER.
ai:
  aggroRadius: 280
  leashRadius: 460
loot:
  items:
    - machete
  tierDrops:
    magic: 1.5
    rare: 0.5
  weapons: 0
  gear: 1
  xpScrolls: 1
  repairs: 1
  medkits: 2
  tierBonus: 0.35
uniquesByDifficulty:
  easy:
    - the_long_vigil
    - palegrave
  medium:
    - the_long_vigil
    - palegrave
  hard:
    - the_long_vigil
    - palegrave
  nightmare:
    - the_long_vigil
    - palegrave
    - sentinels_greaves
    - marewalkers
  jesus:
    - the_long_vigil
    - palegrave
    - sentinels_greaves
    - marewalkers
    - the_fallen_standard
