dialogue:
  - - A LIVE ONE. BREATHING AND EVERYTHING. WE STOPPED THAT HABIT DECADES AGO.
  - hero:
      - YOU'RE A DEAD ASTRONAUT. HOW ARE THERE DEAD MEN UP HERE? NOBODY EVER DIED ON THE MOON.
