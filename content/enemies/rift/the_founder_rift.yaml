id: the_founder_rift
name: THE FOUNDER
lore: >-
  The same coward, cornered a second time in a place with no security to
  call and no regulator to charm. He tears open the far door rather than
  answer a straight question, and leaves the golden parachute behind him.
role: boss
levelBonus: 5
sprite: the_founder_rift
# WEALTH (config GOLD): the richest man alive, and it is all in his pockets.
wealth: 6
hp: 750
speed: 44
radius: 20
contactDamage: 34
critChance: 0.15
contactCooldownMs: 900
dialogue:
  - - YOU?! HOW ARE YOU - I FIRED YOU, SUED YOU, AND LEFT YOU IN ANOTHER UNIVERSE.
  - hero:
      - AND I'M STILL RIGHT BEHIND YOU. NO SECURITY IN HERE, THE FOUNDER. WHERE IS SHE?
  - - FINE. EXIT INTERVIEW. THE GODS GOT PAID. I GET ASYLUM - NO REGULATORS, AND NO YOU.
  - hero:
      - "'PAYMENT'. SAY HER NAME. YOU SOLD A HUMAN BEING TO SAVE YOUR OWN SKIN."
  - - DELIVERED, TECHNICALLY. IN TRANSIT. PAPERWORK'S CLEAN. IF IT HELPS, SHE KICKED A LIZARD.
  - hero:
      - IT DOESN'T. WHERE DOES THE FAR DOOR GO, THE FOUNDER?
  - - NICE TRY. THAT'S PROPRIETARY. LET'S JUST SAY THE PHYSICS ARE... FLEXIBLE.
  - - SECURITY! ...RIGHT. ALL DEAD OR HALLUCINATIONS. KEEP THE RIFT, GARAGE MAN. IT'S A BAD MARKET.
# THE FLIGHT RITE — he does not die here, he RUNS: tears the rift open,
# bolts for it with his back turned, and is spun out of existence.
death: bolt

# THE HERO'S LINE as he bolts a second time.
deathBark:
  - STILL RUNNING. IT'S THE ONLY THING YOU EVER BUILT YOURSELF.

lastWords:
  - INVESTOR CALL! OTHER SIDE! DON'T FOLLOW ME - LEGALLY!
flees:
  landmark: rift
mechanics:
  summon:
    defId: voidling
    count: 3
    cooldownMs: 12000
    maxAlive: 6
  # He kept the logistics. The pods come through the tear now, and what climbs
  # out of them was never manufactured.
  abilities:
    - id: airstrike
      windupMs: 900
      windupFloorMs: 650
      cooldownMs: 10000
      count: 4
      spread: 140
      fallMs: 1400
      blastRadius: 60
      damageFrac: 0.85
      hatch: voidling
      hatchCount: 2
      bark:
        - LOGISTICS SCALE.
        - EVEN HERE. ESPECIALLY
        - HERE.
phases:
  - belowHpFrac: 0.35
    mechanics:
      summon:
        defId: voidling
        count: 4
        cooldownMs: 10000
        maxAlive: 8
      enrage:
        belowHpFrac: 0.35
        speedMult: 1.35
        damageMult: 1.25
ai:
  aggroRadius: 280
  leashRadius: 460
loot:
  items:
    - golden_parachute
  # "KEEP THE RIFT, GARAGE MAN." — he means it: the rig that unseals the
  # garage's rift seam falls here (see content/story-items.yaml).
  storyItems:
    - rift_creator
  tierDrops:
    magic: 2
    rare: 1
  weapons: 0
  gear: 1
  xpArrows: 2
  repairs: 1
  medkits: 2
  tierBonus: 0.35
