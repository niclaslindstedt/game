dialogue:
  - - A VISITOR! ALIVE! MAGNIFICENT. MIND THE LAWS OF MOTION HERE. THEY ARE MORE OF A SUGGESTION.
  - hero:
      - NIKOLA TESLA. I'M A BUILDER - HALF MY TOOLS RUN ON YOUR IDEAS. HOW ARE YOU IN HERE?
  - - IN 1943 THE SKY TORE OPEN. I FELL INTO PURE CURRENT. MY FUNERAL BACK HOME WAS PADDED.
  - - LATELY A NEW THING HUMS AT THE FAR DOOR. A MACHINE MIND. IT MEASURES ALL, LOVES NONE.
  - hero:
      - A MACHINE MIND - IN HERE TOO? I KNOW THAT MAKE. IT'S GUARDING THE DOOR I NEED.
  - - THEN ASK YOUR QUESTIONS - IF YOU REACH IT. THE RIFT MAKES US GUARD OUR CORNERS. EN GARDE.
lastWords:
