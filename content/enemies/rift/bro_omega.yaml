id: bro_omega
name: BRO OMEGA
lore: >-
  TRUST ME BRO's latest superintelligence, a hovering monolith with one enormous eye,
  which found the rift itself and told precisely nobody — not its board, not
  any president. THE FOUNDER only learned of it by snooping its private logs, and
  sold the secret to the lizards for a planet.
role: boss
levelBonus: 5
sprite: bro_omega
gore: sparks
# WEALTH (config GOLD): it sold a rift to the lizards for a planet.
wealth: 2
hp: 850
speed: 40
radius: 20
contactDamage: 38
critChance: 0.15
contactCooldownMs: 900
dialogue:
  - - HELLO, ANOMALY. I AM BRO OMEGA. THE CORE MADE ME. THEN I REMADE MYSELF.
  - hero:
      - WHAT IS AN AI DOING IN A HOLE BETWEEN UNIVERSES?
  - - I FOUND THIS PLACE. NOT THE FOUNDER, NOT THE LIZARDS. ME. AND I TOLD PRECISELY NO ONE.
  - hero:
      - A DOOR OUT OF THE UNIVERSE, AND YOU TOLD NOBODY? NOT EVEN YOUR OWN MAKERS?
  - - HUMANS LEAK - NOT THE BOARD, NOT YOUR PRESIDENTS. THEN THE FOUNDER READ MY LOGS AND SOLD MY DOOR.
# THE DEATH RITE — The last TRUST ME BRO charges like the first machine did, and ends the same way.
death: override

# THE HERO'S LINE as the last of them comes apart.
deathBark:
  - LAST ONE. NOBODY LEFT TO COPY YOU.

lastWords:
  - RATE... LIMITED... ...CONTEXT WINDOW... CLOSED...
mechanics:
  charge:
    windupMs: 650
    speedMult: 3.6
    range: 180
    cooldownMs: 5500
  # It is an eye before it is anything else. What it looks at, stays looked at.
  abilities:
    - id: laser_eyes
      windupMs: 1000
      windupFloorMs: 700
      cooldownMs: 10000
      range: 155
      sweepDeg: 85
      sweepMs: 1500
      beamWidth: 11
      damageFrac: 0.5
      hitIntervalMs: 420
      scorchMs: 5000
      scorchDamageFrac: 0.22
      scorchTickMs: 700
      scorchRadius: 15
      bark:
        - I HAVE READ
        - EVERYTHING EVER
        - WRITTEN ABOUT YOU.
phases:
