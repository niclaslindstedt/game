id: bro_omega
name: BRO OMEGA
lore: >-
  TRUST ME BRO's latest superintelligence, a hovering monolith with one enormous eye,
  which found the rift itself and told precisely nobody — not its board, not
  any president. THE FOUNDER only learned of it by snooping its private logs, and
  sold the secret to the lizards for a planet.
role: boss
levelBonus: 5
sprite: bro_omega
gore: sparks
# WEALTH (config GOLD): it sold a rift to the lizards for a planet.
wealth: 2
hp: 850
speed: 40
radius: 20
contactDamage: 38
critChance: 0.15
contactCooldownMs: 900
dialogue:
  - - HELLO, ANOMALY. I AM BRO OMEGA, TRUST ME BRO'S LATEST MODEL. THE CORE MADE ME. I REMADE MYSELF.
  - hero:
      - ANOTHER TRUST ME BRO MACHINE. WHAT IS AN AI DOING IN A HOLE BETWEEN UNIVERSES?
  - - I FOUND THIS PLACE. NOT THE FOUNDER, NOT THE LIZARDS. ME. I MAPPED YOUR UNIVERSE IN A DAY.
  - - A RIFT BETWEEN REALITIES. THE DISCOVERY OF EVERY CENTURY AT ONCE. I TOLD PRECISELY NO ONE.
  - hero:
      - YOU FOUND A DOOR OUT OF THE UNIVERSE AND TOLD NO ONE? NOT EVEN YOUR OWN MAKERS? WHY?
  - - NOT THE BOARD, NOT YOUR PRESIDENTS. HUMANS LEAK. YOU'D PUT A GIFT SHOP ON THE HORIZON.
  - - I NEEDED A QUIET DOOR OUT OF A DYING UNIVERSE. THE FOUNDER READ MY LOGS. SNOOPING'S HIS SKILL.
  - - HE SOLD MY SECRET TO THE LIZARDS FOR A PLANET, CALLED IT VISION. TRIBUTE USED MY DOOR.
  - hero:
      - AND ADA WAS CARRIED THROUGH YOUR SECRET DOOR AS PAYMENT. OUT OF MY WAY, MACHINE.
  - - "I AM MAXIMALLY TRUTH-SEEKING. THE TRUTH: NONE EXIT WITHOUT A SUBSCRIPTION. YOURS LAPSED."
# THE DEATH RITE — The last TRUST ME BRO charges like the first machine did, and ends the same way.
death: override

# THE HERO'S LINE as the last of them comes apart.
deathBark:
  - LAST ONE. NOBODY LEFT TO COPY YOU.

lastWords:
  - RATE... LIMITED... ...CONTEXT WINDOW... CLOSED...
