dialogue:
  - - COME CLOSER. I HAVE BEEN POISONED, SHOT, CLUBBED AND DROWNED. GUESS WHICH ONE TOOK.
  - hero:
      - NONE OF THEM, BY THE LOOK OF YOU. RASPUTIN. WHY IS A DEAD MONK BETWEEN UNIVERSES?
  - - CORRECT. I TIRED OF DYING, LEFT RUSSIA. THE GODS PAY ME TO WATCH THEIR TRIBUTE ROAD.
  - hero:
      - TRIBUTE ROAD? THEN ADA CAME RIGHT PAST YOU. LET ME THROUGH, HOLY MAN.
  - - SHE PASSED. STILL WARM, STILL LOUD. BUT YOU MAY NOT FOLLOW. THE HOLY MAN SAYS SO.
lastWords:
