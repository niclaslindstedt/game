id: elon_mosque_rift
name: ELON MOSQUE
lore: >-
  The same coward, cornered a second time in a place with no security to
  call and no regulator to charm. He tears open the far door rather than
  answer a straight question, and leaves the golden parachute behind him.
role: boss
levelBonus: 5
sprite: elon_mosque_rift
hp: 750
speed: 44
radius: 20
contactDamage: 34
critChance: 0.15
contactCooldownMs: 900
dialogue:
  - - YOU?! HOW ARE YOU - I FIRED
    - YOU, SUED YOU, AND LEFT YOU
    - IN ANOTHER UNIVERSE.
  - hero:
      - AND I'M STILL RIGHT BEHIND
      - YOU. NO SECURITY IN HERE,
      - MOSQUE. WHERE IS SHE?
  - - FINE. EXIT INTERVIEW. THE GODS
    - GOT PAID. I GET ASYLUM - NO
    - REGULATORS, AND NO YOU.
  - hero:
      - "'PAYMENT'. SAY HER NAME."
      - YOU SOLD A HUMAN BEING TO
      - SAVE YOUR OWN SKIN.
  - - DELIVERED, TECHNICALLY. IN
    - TRANSIT. PAPERWORK'S CLEAN. IF
    - IT HELPS, SHE KICKED A LIZARD.
  - hero:
      - IT DOESN'T. WHERE DOES THE
      - FAR DOOR GO, MOSQUE?
  - - NICE TRY. THAT'S PROPRIETARY.
    - LET'S JUST SAY THE PHYSICS
    - ARE... FLEXIBLE.
  - - SECURITY! ...RIGHT. ALL DEAD OR
    - HALLUCINATIONS. KEEP THE RIFT,
    - GARAGE MAN. IT'S A BAD MARKET.
lastWords:
  - INVESTOR CALL! OTHER SIDE!
  - DON'T FOLLOW ME - LEGALLY!
flees:
  landmark: rift
