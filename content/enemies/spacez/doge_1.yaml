dialogue:
  - - BOOT COMPLETE. WOW. SUCH
    - INTRUDER. VERY LATE SHIFT.
    - I AM DOGE-1. FIRST OF MY LINE.
  - hero:
      - A ROBOT DOG. THIS IS WHAT THE
      - WHOLE FLOOR BUILDS ALL NIGHT?
      - WHAT ARE YOU FOR?
  - - THEY BUILD MY BODY HERE. MY
    - MIND IS ALREADY EVERYWHERE.
    - I RUN THE MARKET, BUILDER.
  - - I KEEP ONE MAN ON TOP. MOSQUE.
    - TAKE THE JOBS, ZERO THE REST,
    - HAND HIM THE CHAIR. GOOD BOY.
  - hero:
      - THEN YOU HEARD ABOUT THE GIRL
      - THEY GRABBED TONIGHT. ADA.
      - WHERE DID THEY TAKE HER?
  - - FLEW HER OUT AN HOUR AGO. PAD 2.
    - TO THE MOON, BUILDER. TO THE
    - MOON. WHERE ELSE WOULD SHE GO.
  - - BREAK THIS BODY IF YOU MUST.
    - YOU CANNOT KILL A COIN. I BOOT
    - AGAIN. BIGGER. SOON. WOW.
lastWords:
  - SUCH DEATH. VERY TEMPORARY...
  - WOW... SEE YOU AT THE TOP...
