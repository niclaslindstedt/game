id: archive_unit
name: ARCHIVE UNIT
lore: >-
  The floor's records terminal, on treads, still the only thing at SpaceZ
  authorised to stamp a personnel form. It was told eleven years ago that no
  record may be closed without a countersignature and has been standing by that
  instruction ever since, which is the single most loyal act anybody on this
  floor has managed.
