dialogue:
  - - MIND THE FLOOR. I JUST DID IT. THIRTY YEARS MOPPING THIS LAB. YOU LEARN THINGS, MOPPING.
  - hero:
      - THEN YOU SEE EVERYTHING THAT GOES ON HERE. WHAT'S GOT THE WHOLE PLACE UP AT MIDNIGHT?
  - - "SOMETHING UP ON THE MOON. ONE BADGE PINGED: N. ARMSTRONG. DEAD SINCE 2012. FUNNY THING."
  - hero:
      - ARMSTRONG? THE FIRST MAN ON THE MOON? SOMEBODY'S JUST USING HIS OLD BADGE.
  - - OR WHOEVER CAME BACK FROM THE MOON IN '69 WASN'T THE FELLA THEY SENT UP. NOW DROP IT.
lastWords:
  - AND I JUST... URGH... ...DID THIS FLOOR...
