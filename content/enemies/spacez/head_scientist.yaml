dialogue:
  - - FASCINATING. AN INTRUDER WITH WORKING LEGS. KNOW WHAT WE KEEP IN THE CLEANROOM VAULT?
  - hero:
      - AN ENGINE PART. I CAME TO TAKE IT. I HELPED BUILD THAT ENGINE, BEFORE YOU PEOPLE FIRED ME.
  - - BUILD IT? NOBODY BUILT IT. WE DUG IT FROM THE SEA OF TRANQUILITY IN '69. NOT EARTH'S.
  - hero:
      - NOT FROM EARTH? I MACHINED PARTS FOR THAT THING FOR TEN YEARS. IT'S JUST ENGINEERING.
  - - WE SPENT FIFTY YEARS COPYING A MACHINE THAT ISN'T BROKEN. IT'S WAITING. TO GO HOME.
lastWords:
  - IT'S STILL... HHH... STILL... HUMMING...
