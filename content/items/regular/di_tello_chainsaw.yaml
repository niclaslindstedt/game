id: di_tello_chainsaw
kind: weapon
rarity: regular
name: DI TELLO CHAINSAW
description: One of a kind, cut from aluminium and bronze in a back-street
  workshop by a man named DI TELLO, who had watched the new president of a
  southern republic wave mass-produced ones over his head at rallies and thought
  the office deserved better. The president handed it to MOSQUE on a stage, to
  applause, and nobody serviced it again — a thing given is not a thing used.
  Twenty teeth still hold an edge, and what they reach does not get a wound, it
  gets a verdict. Then it wants that workshop, and there are none on Mars.
material: metal
class: melee
levelReq: 14
# Claims the SECOND ARM: no shield, no bag (see WeaponDef.twoHanded). Nobody has
# ever run one of these one-handed.
twoHanded: true
# Forged on the damage-budget line (item-forge.mjs) at the two-handed premium —
# and it is the figure only a BOSS ever sees, since everything else is executed
# rather than damaged (see `execute` below). Authored anyway, because a weapon
# that lied about its damage would be a weapon the budget checker could not hold.
damage: 44
# It runs rather than swings: a short, fast, continuous bite.
cooldownMs: 450
# A TIGHT BUBBLE AT CONTACT RANGE, and it never grows (see `rigid` below). The
# reach is shorter than every blade in the game and the arc is the widest — the
# whole half-circle in front of him — because the way you use this is to WALK
# INTO the crowd, not to sweep one from a safe step back.
range: 30
sweepDeg: 180
# The reach and the arc are the BAR's, not the wielder's: no STRENGTH depth, no
# INTELLIGENCE breadth. A deep build makes every other melee weapon in the game
# reach further and cut wider; it does nothing at all to this one, which is what
# keeps a weapon that kills anything it touches honest — it can only ever touch
# what is against him.
rigid: true
# TWENTY TEETH, ONE PER BODY (src/game/items/execute.ts): durability is a body
# count here rather than a swing count, so this is exactly how many things it
# takes apart before it is scrap in the hand. A make-quality roll moves it a
# little either way, as it does on every plain drop.
durability: 20
# It neither cuts a body in two nor crushes one — it reduces it. See WeaponEdge.
edge: shred
# IT IS NOT SWUNG, so it is drawn with none of a swing's furniture: no blade
# riding a cone, no streak off the edge, no wedge of floor lighting up. It is
# leaned into a body and JUDDERS there, and what the player reads is the shiver
# and what comes off the thing in front of it. See WeaponMotion.
motion: shake
# It does not deal DAMAGE to a body it is TOUCHING, it takes it: six times
# whatever that body was holding, past armor, past the crit roll. The horde's
# numbers are not an answer to it — a workshop is. Anything else the cone
# catches is merely hit, for the ordinary damage above: the reach says who is
# struck, the touch says who is taken (see items/execute.ts).
execute:
  bars: 6
icon: icon_di_tello_chainsaw
