name: window
family: prelude
size: [28, 20]
description: >
  The living room's window: one white glazing bar each way over a pane onto
  the same street the front door opens on, with a potted flower on the inner
  sill in front of them. It hangs at the height a window is really hung at —
  head under the door's, sill at about a standing man's head — and looks onto
  the SAME view at the SAME height as the doorway: the neighbours' rooflines
  with two of their windows still lit, the road below them, a strip of lawn at
  the very bottom of the pane. The moon rides above it all, its lower half cut
  off by the window's own head.
subject:
  kind: prop
  build: a wide framed rectangular window pane crossed by one white glazing bar each way, into four lights
  features: the moon's underside cut off by the frame's head, stars, a band of rooflines in silhouette with two amber-lit windows, tarmac with a worn centre-line dash below them, a small red flower in a terracotta pot standing on the inner sill in front of the glass
  accent: the amber windows still lit across the street
  flavor: the moon hanging in it foreshadows level 2, the destination waiting outside
palette:
  J: "#2d3b84" # deep-blue night sky
  K: "#22243a" # neighbours' rooflines, in silhouette
  O: "#1a1c2c" # outline
  V: "#9095a5" # grey window frame
  W: "#f4f4f4" # white glazing bars, and the stars
  F: "#a2a4ad" # sunlit rim of the moon
  f: "#888a96" # pale moon
  D: "#60626c" # dark crater
  y: "#ffb02e" # windows still lit across the street
  t: "#3a3c42" # night tarmac
  d: "#7c7c75" # traffic white, worn thin
  u: "#2c2e34" # dark gutter grit
  g: "#3d6433" # dark night grass
  G: "#4a7a3e" # flower stem
  l: "#678f5d" # flower leaves
  R: "#ff5252" # the bloom
  B: "#c8ced8" # the glazing bars, a shade off the white frame
  T: "#8c4a30" # terracotta pot
  S: "#a86a44" # the pot's lit rim
