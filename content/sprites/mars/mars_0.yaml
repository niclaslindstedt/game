  build: rusty-orange Martian dust drawn as a fine scatter of grit under one broken wind ripple
  features: the ripple a line of lit crests meandering so it meets itself across the tile edge, kept faint so the floor never competes with what stands on it
  flavor: the open terrain west of the colony dome, worked over by wind rather than pocked like the moon
