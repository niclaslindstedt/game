  u: "#c38668" # light oxide face
  t: "#b2643e" # base oxide red
  d: "#80482d" # mid oxide shadow
  e: "#623722" # deep oxide shadow
  k: "#342c26" # pit shadow
  O: "#1a1c2c" # dark outline
