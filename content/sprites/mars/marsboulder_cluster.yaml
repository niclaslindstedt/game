name: marsboulder_cluster
family: mars
size: [32, 20]
description: >
  A cluster of four boulders shouldered together into one mass — hard-faceted red regolith in rust-red oxide with thin cold light. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: a cluster of four boulders shouldered together into one mass, solid red regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: rust-red oxide with thin cold light
  flavor: a ridge stone that walls the way across the surface — the living stop at it
