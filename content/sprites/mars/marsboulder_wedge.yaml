name: marsboulder_wedge
family: mars
size: [26, 20]
description: >
  A sharp wedge driven into the ground, one face sheared clean off — hard-faceted red regolith in rust-red oxide with thin cold light. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: a sharp wedge driven into the ground, one face sheared clean off, solid red regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: rust-red oxide with thin cold light
  flavor: a ridge stone that walls the way across the surface — the living stop at it
palette:
