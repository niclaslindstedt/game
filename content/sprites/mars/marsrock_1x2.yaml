name: marsrock_1x2
family: mars
size: [16, 32]
description: >
  A standing monolith of oxidized stone, its crown snapped at an
  angle and its foot cut back into the drift.
subject:
  kind: rock (obstacle / cover)
  build: a tall two-tile block of oxide stone leaning slightly, straight-flanked and notched
  features: a sun-caught dust rim down its upper-left flank, a long lit face falling to deep shadow at the lower right, scoured pits down its length, and pale wind-drift piled at its foot
  flavor: stops sight, shots and machines
palette:
  O: "#1a1c2c" # dark outline
  p: "#deaa86" # sun-caught dust rim
  u: "#c38668" # light oxide face
  t: "#b2643e" # base oxide red
  e: "#623722" # deep oxide shadow
  k: "#342c26" # pit shadow
