name: marsboulder
family: mars
size: [28, 24]
description: >
  A big blocky wedge with a tall left shoulder sloping away to the right — hard-faceted red regolith in rust-red oxide with thin cold light. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: a big blocky wedge with a tall left shoulder sloping away to the right, solid red regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: rust-red oxide with thin cold light
  flavor: a ridge stone that walls the way across the surface — the living stop at it
palette:
  p: "#deaa86" # sun-caught dust rim
  u: "#c38668" # light oxide face
  t: "#b2643e" # base oxide red
  e: "#623722" # deep oxide shadow
  k: "#342c26" # pit shadow
  O: "#1a1c2c" # dark outline
