name: marsrock_2x2
family: mars
size: [32, 32]
description: >
  A broken massif of oxidized stone, a scoured cleft splitting its
  crown, the largest of the field's rocks.
subject:
  kind: rock (obstacle / cover)
  build: a wide four-tile mass of oxide stone with a broad shoulder and a hard fall to its shadowed flank
  features: a sun-caught dust rim along its upper-left edge, a cleft scoured down through the crown, pits across the lit shoulder, and pale wind-drift piled along its foot
  flavor: stops sight, shots and machines
palette:
  O: "#1a1c2c" # dark outline
  p: "#deaa86" # sun-caught dust rim
  u: "#c38668" # light oxide face
  t: "#b2643e" # base oxide red
  e: "#623722" # deep oxide shadow
  k: "#342c26" # pit shadow
