name: olympus_engine_1
family: mars
size: [24, 24]
description: >
  OLYMPUS ENGINE, second grind frame: the same riveted mining drum settled a
  pixel lower on flexed legs, its exhaust grille flared to full white and the
  chimneys puffing shorter.
subject:
  kind: hellborn elite-sized minion
  name: OLYMPUS ENGINE
  build: a squat heavy machine drum, broader than tall, on four short thick legs
  attire: riveted dark-iron plating, pitted and oxide-stained at the seams
  features: three short chimneys along its back, mid-puff
  accent: the exhaust grille flared to full white, spilling heat past its frame
  pose: settled on flexed legs mid-grind, the drum dropped a notch
  flavor: the machine that was mining Mars before the planet had a name
