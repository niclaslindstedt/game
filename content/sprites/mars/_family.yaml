name: mars
ground: mars_0
style: >
  The rust-red Martian surface and its colony — oxide reds and dust, riveted
  weathered metal, thin cold light.
palette:
  C: "#529ea8"
  D: "#808698"
  N: "#303444"
  Q: "#e878a8"
  Z: "#f6b6cd"
  d: "#80482d"
  e: "#623722"
  s: "#5a5e6a"
  t: "#b2643e"
  u: "#c38668"
animations:
  scout_rover_roll: { frames: [scout_rover_0, scout_rover_1], delayMs: 240 }
  mining_rover_grind: { frames: [mining_rover_0, mining_rover_1], delayMs: 340 }
  servo_bot_walk: { frames: [servo_bot_0, servo_bot_1], delayMs: 300 }
  fembot_walk: { frames: [fembot_0, fembot_1], delayMs: 260 }
  misprinted_fembot_walk:
    { frames: [misprinted_fembot_0, misprinted_fembot_1], delayMs: 260 }
  derelict_rover_roll:
    { frames: [derelict_rover_0, derelict_rover_1], delayMs: 300 }
  unit_zero_walk: { frames: [unit_zero_0, unit_zero_1], delayMs: 320 }
  the_indexer_walk: { frames: [the_indexer_0, the_indexer_1], delayMs: 280 }
  the_vendor_walk: { frames: [the_vendor_0, the_vendor_1], delayMs: 300 }
  successor_prime_walk:
    { frames: [successor_prime_0, successor_prime_1], delayMs: 340 }
  the_seed_walk: { frames: [the_seed_0, the_seed_1], delayMs: 300 }
  the_founder_strut: { frames: [the_founder_0, the_founder_1], delayMs: 380 }
  sandstorm_churn:
    {
      frames: [sandstorm_0, sandstorm_1, sandstorm_2, sandstorm_3],
      delayMs: 120,
    }
  olympus_engine_grind:
    { frames: [olympus_engine_0, olympus_engine_1], delayMs: 280 }
  phobos_shepherd_orbit:
    { frames: [phobos_shepherd_0, phobos_shepherd_1], delayMs: 420 }
wounds:
  fembot: { splat: v, core: b }
  misprinted_fembot: { splat: v, core: b }
  unit_zero: { splat: x, core: b }
  scout_rover: { splat: y, core: H }
  servo_bot: { splat: y, core: Y, scuff: H }
  mining_rover: { splat: x, core: b }
  the_seed: { splat: r, core: r }
  the_founder: { splat: r, core: r }
contrastExempt:
  [
    mars_0,
    mars_1,
    rust_0,
    rust_1,
    deck_0,
    deck_1,
    crater_red_big,
    crater_red_small,
    red_rocks,
    tracks,
    sandstorm_0,
    sandstorm_1,
    sandstorm_2,
    sandstorm_3,
    mars_pebbles,
    mars_grit,
    mars_dust,
    mars_scar,
    mars_debris,
    mars_pocks,
  ]
