name: olympus_engine_0
family: mars
size: [24, 24]
description: >
  OLYMPUS ENGINE, a hellborn horror: a squat industrial mining machine on four
  stubby iron legs, a riveted dark-iron drum body, one wide white-hot exhaust
  vent glaring across its front, and a stack of three short chimneys venting
  heat-shimmer.
subject:
  kind: hellborn elite-sized minion
  name: OLYMPUS ENGINE
  build: a squat heavy machine drum, broader than tall, on four short thick legs
  attire: riveted dark-iron plating, pitted and oxide-stained at the seams
  features: three short chimneys along its back venting shimmer
  accent: one wide white-hot exhaust grille glaring across the front of the drum
  pose: planted low and hunched, chimneys smoking, grille facing forward
  flavor: the machine that was mining Mars before the planet had a name
palette:
  N: "#303444" # iron shadow / outline
  s: "#5a5e6a" # dark iron plate
  D: "#808698" # iron highlight
  d: "#80482d" # oxide stain
  y: "#ffb02e" # vent heat
  W: "#f4f4f4" # white-hot core
  q: "#96762e" # rivet brass
