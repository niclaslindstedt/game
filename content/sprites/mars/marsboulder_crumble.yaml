description: >
  A crumbled heap of broken fragments, three low bumps over a shadowed skirt — hard-faceted red regolith in rust-red oxide with thin cold light. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
