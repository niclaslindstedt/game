name: crater_red_big
family: mars
size: [32, 32]
description: >
  An old impact crater worn into the regolith — a low raised rim of oxide dust
  around a funnel that darkens to a shadowed throat.
subject:
  kind: crater (obstacle)
  build: a wide round impact crater sunk into the dust, its outline wobbled off true
  features: the rim's outward slope lit where it faces the sun and dark where it turns away, the near inner wall falling away into shadow that deepens toward the throat, and the far wall catching the light as it turns back up
  flavor: an old scar, softened by the air and the dust the way nothing on the moon ever is
palette:
  p: "#deaa86" # sun-caught rim crest
  u: "#c38668" # far inner wall, turned back toward the light
  t: "#b2643e" # dust on the lit side of the funnel
  d: "#80482d" # wall between the lit and shadowed sides
  e: "#623722" # shadowed wall
  k: "#342c26" # the funnel's throat
