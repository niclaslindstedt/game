name: crater_red_big
family: mars
size: [32, 32]
description: >
  A wide old impact crater, its rim worn down by the wind and its
  bowl half-filled with drifted fines.
subject:
  kind: crater (obstacle)
  build: a wide round crater ringed by a low raised rim of oxide dust
  features: the rim's outward slope lit where it faces the sun and dark where it turns away, the near inner wall in its own shadow and the far one catching the light, and a pool of paler drift settled across the low side of the bowl
  flavor: an old scar, softened by the air and the dust the way nothing on the moon ever is
palette:
  p: "#deaa86" # sun-caught rim crest
  u: "#c38668" # lit rim and far bowl wall
  t: "#b2643e" # drifted fines pooled in the bowl
  d: "#80482d" # rim turning away from the sun
  e: "#623722" # shadowed bowl floor
