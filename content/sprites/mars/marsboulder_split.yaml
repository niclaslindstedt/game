name: marsboulder_split
family: mars
size: [30, 20]
description: >
  One stone cleft in two, its shadowed base showing through the gap — hard-faceted red regolith in rust-red oxide with thin cold light. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: one stone cleft in two, its shadowed base showing through the gap, solid red regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: rust-red oxide with thin cold light
  flavor: a ridge stone that walls the way across the surface — the living stop at it
