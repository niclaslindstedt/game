name: mars_pit
family: mars
plane: floor
size: [30, 24]
description: >
  A hole blown clean through the crust, its lip heaped with ejecta — a black void ringed by a heaped, rust-red oxide with thin cold light lip. Unlike the jumpable craters it CANNOT be crossed, so it reads as a hole rather than a bowl: the centre goes to the darkest colour the surface owns.
subject:
  kind: prop
  build: a hole blown clean through the crust, its lip heaped with ejecta, a void with a heaped raised lip
  features: a black bottomless centre, a lit upper lip, ejecta stones on the rim
  accent: rust-red oxide with thin cold light
  flavor: a hole in the ground that stops hero and horde alike — walk around it
palette:
  p: "#deaa86" # sun-caught dust rim
  u: "#c38668" # light oxide face
  t: "#b2643e" # base oxide red
  e: "#623722" # deep oxide shadow
  k: "#342c26" # pit shadow
  O: "#1a1c2c" # dark outline
