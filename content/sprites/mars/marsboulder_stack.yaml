description: >
  A cairn — a small stone perched on a bigger one with a dark seam between them — hard-faceted red regolith in rust-red oxide with thin cold light. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
