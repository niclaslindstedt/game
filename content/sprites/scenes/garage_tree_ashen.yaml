name: garage_tree_ashen
family: scenes
size: [20, 30]
description: >
  What is left of the lawn tree once everything burnable has gone off it — a
  bare dead trunk and three thick limbs against the night, no crown at all.
subject:
  kind: scene prop / tree
  build: a trunk flaring at the root, forking into three thick limbs with two smaller forks off them
  features: open night showing between every limb where the crown used to be
  accent: pale dead wood down the lit face of each limb against near-black under it
  flavor: the third fire took the rest of it
palette:
  O: "#1a1c2c" # outline
  X: "#403a33" # dead wood
  x: "#2a2622" # dead wood, the shaded side
