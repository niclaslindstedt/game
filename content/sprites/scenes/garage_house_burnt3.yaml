name: garage_house_burnt3
family: scenes
size: [48, 19]
description: >
  The hero's house after the THIRD launch off the same lawn — the roof fallen in
  over the garage end, the whole frontage burnt black, the front door burnt out
  of its frame. The lit window is the only colour left in it.
subject:
  kind: scene backdrop / building
  build: a single-storey house under what is left of a peaked roof, joined to a gutted garage bay — the same frontage, three launches on
  features: the roof caved in from the garage end so the ridge line stands over an open hole, the flat garage roof gone to two charred stubs, and the front door burnt out of its frame at the far end; the siding black at the garage end and dark grey at the far one
  accent: the amber lit window, the one thing in the building that is not soot
  flavor: still standing, still lived in, and nobody in the game ever mentions it
palette:
  C: "#332c25" # the roof's last charred boards
  N: "#0e1016" # the dark inside, open to the night
  O: "#1a1c2c" # outline
  S: "#33302c" # near-black siding, garage end
  T: "#211f1c" # soot, run together into one black face
  c: "#1b1613" # burnt eaves
  s: "#514c45" # dark grey siding, the far end
  y: "#ffb02e" # amber lit window
