name: garage_tree_charred
family: scenes
size: [20, 30]
description: >
  The lawn tree after a rocket has gone up beside it — the same crown, its
  leaves scorched dry brown and burnt right through in three places.
subject:
  kind: scene prop / tree
  build: the same rounded crown on the same short trunk, holed through in three places well inside its rim
  features: curled brown foliage on the lit side going to burnt black on the shaded one, the trunk scorched but standing
  accent: scorched straw brown against burnt black
  flavor: still the same tree; nothing on it is alive
palette:
  B: "#4a3520" # trunk, scorched
  E: "#241a12" # trunk char
  F: "#42381f" # scorched leaf
  L: "#5c4c30" # scorched leaf, lit side
  O: "#1a1c2c" # outline
  d: "#1a150e" # burnt through
  f: "#2c2418" # burnt leaf
