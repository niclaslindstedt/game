name: rift_west
family: scenes
size: [32, 36]
description: >
  A tear in reality hanging in the air: the same tall almond slit as the rift's
  own doors, but this is the one you can see THROUGH — desert daylight glowing
  gold and orange inside a purple-pink fringed edge.
subject:
  kind: scene prop / portal
  build: a tall almond, lens-shaped slit hanging in the air
  features: a glowing gold core ringed by an orange band inside a purple-pink fringed edge
  accent: warm gold-orange desert-sunset light leaking from within
  flavor: the doorway out of the rift into Boot Hill, warm daylight bleeding through
palette:
  s: "#ffeca0" # pale gold core
  D: "#9c4032" # maroon inner edge
  C: "#eb8e3e" # orange inner ring
  P: "#b05cdc" # violet band
  m: "#a57de1e6" # pink-purple fringe
  M: "#644696e6" # dark purple outer fringe
