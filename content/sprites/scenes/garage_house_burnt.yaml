name: garage_house_burnt
family: scenes
size: [48, 19]
description: >
  The hero's house after the launch — the same building as garage_house, dusty
  on the living end and blackened on the garage end, with the flat roof burnt
  through. The window is still lit.
subject:
  kind: scene backdrop / building
  build: a single-storey house under a peaked roof on the left, joined to an open garage bay on the right — the same frontage as before it burned
  features: a scorched roof with two holes eaten through the flat garage end; siding merely dusty at the house end and heavily sooted at the garage end, with dark streaks running up the wall; the garage door panel scorched dark
  accent: the amber lit window still burning at the clean end
  flavor: the house survived the first launch, the garage nearly did not
