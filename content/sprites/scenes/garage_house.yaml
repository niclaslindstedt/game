name: garage_house
family: scenes
size: [48, 19]
description: >
  The hero's suburban home side-on: a small peaked-roof house with the front
  door at the far end and a warm amber-lit window to the RIGHT of it, joined to
  the garage bay where he built the ship, its door up on a dark interior.
subject:
  kind: scene backdrop / building
  build: a single-storey house under a peaked roof on the left, joined to an open garage bay on the right
  features: the front door at the far end of the house wall and a warm amber-lit living-room window to the RIGHT of it — the same hand round as the room seen from inside in the opening scene, which is the mirror of it; the garage door up on a dark interior, with a course of wall left as a reveal on every side of the opening
  accent: the amber glow of the lit living-room window
  flavor: the garage where he spent ten years of weekends building the ship, drawn against the night
