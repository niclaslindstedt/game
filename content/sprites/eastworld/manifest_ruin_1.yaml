name: manifest_ruin_1
family: eastworld
size: [24, 24]
description: >
  MANIFEST RUIN, second churn frame: the same dust wedge squatted lower, its
  claim banner snapped back the other way, the barbed wire rolled over, and the
  boiling dust at its base thrown wide.
subject:
  kind: hellborn elite-sized minion
  name: MANIFEST RUIN
  build: a low broad churning wedge of dust, widest at the base, with a tall mast rising from it
  attire: packed ochre dust wound through with rolled-over barbed fence-wire
  features: a tall surveyor's tripod standing straight out of the crest, bone stakes driven through the dust
  accent: the torn red claim banner snapped back the other way
  pose: squatted lower mid-churn, banner streaming left, dust thrown wide off the base
  flavor: the appetite that pushed every frontier westward until there was no west left
