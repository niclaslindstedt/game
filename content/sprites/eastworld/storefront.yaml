family: eastworld
plane: floor
size: [48, 40]
description: >
  A western false-front store, top-down - the tall square parapet board
  carrying a painted sign over a striped awning, a glazed amber shop
  window, a dark doorway and a plank boardwalk along the front.
subject:
  kind: "building obstacle - shop"
  build: "a false-front timber store seen top-down, wider than it is deep"
  features: "a tall parapet board with painted lettering on a red sign, a striped awning with a scalloped valance, a four-pane glazed window, a dark doorway, a raised boardwalk"
  accent: "the lit shop window and the red painted signboard"
  flavor: "the shop fronts that face each other across main street"
