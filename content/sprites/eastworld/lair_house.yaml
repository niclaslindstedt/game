name: lair_house
family: eastworld
size: [72, 60]
description: >
  A two-storey frontier house, top-down - dark stained planks under a
  shingled roof, a painted band beneath the eaves, shuttered upper
  windows, lamps burning on a covered porch and a deep doorway at the
  front. Somebody lives here.
