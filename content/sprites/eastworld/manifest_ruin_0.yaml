name: manifest_ruin_0
family: eastworld
size: [24, 24]
description: >
  MANIFEST RUIN, a hellborn horror: a churning wedge of ochre dust with a tall
  surveyor's tripod standing straight out of its crest flying a torn red claim
  banner, bone claim-stakes driven through the mass, and barbed fence-wire strung
  across its front.
subject:
  kind: hellborn elite-sized minion
  name: MANIFEST RUIN
  build: a low broad churning wedge of dust, widest at the base, with a tall mast rising from it
  attire: packed ochre dust wound through with strung barbed fence-wire
  features: a tall surveyor's tripod standing straight out of the crest, bone stakes driven through the dust
  accent: a torn blood-red claim banner flying from the tripod's head
  pose: advancing as a low wedge, banner streaming right, dust boiling off the base
  flavor: the appetite that pushed every frontier westward until there was no west left
