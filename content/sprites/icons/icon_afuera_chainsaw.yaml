name: icon_afuera_chainsaw
family: icons
# DELIBERATELY OVERSIZED. Every other weapon icon in the game is 12×12; this one
# is 16 wide, so in the hero's hands it is as long as he is tall — which is the
# joke, and the reason it was a stage prop rather than a tool. It grows only
# SIDEWAYS (still 12 tall) so it hangs off the doll horizontally, where the
# portrait canvas can widen for it, instead of poking out over his head.
size: [16, 12]
description: >
  An oversized stage-prop chainsaw seen side on — a blocky orange engine with a
  hoop handle over it at the left, and a long steel guide bar running the whole
  width, its chain drawn as bright teeth broken by dark gullets along both edges.
subject:
  kind: weapon icon
  features: a long side-on chainsaw, blocky orange engine with a hoop handle
    above it and an outsized steel guide bar running the full width, toothed
    along both edges
  accent: orange housing against pale steel teeth
  flavor: a president's campaign prop, far too big to be a tool
palette:
  O: "#1a1c2c" # dark outline and the gullets between teeth
  y: "#ffb02e" # orange housing
  r: "#d83a3a" # deep orange shadow
  V: "#9095a5" # steel guide bar
  w: "#dfe3e8" # bright chain teeth
grid: |
  ..OOOO..........
  ..O..O..........
  .OOyyOO.........
  .OyyyyO.........
  .OyyyyOwOwOwOwOw
  .OyrryOVVVVVVVVO
  .OyyyyOVVVVVVVVO
  .OyyyyOwOwOwOwOw
  .OyyyyO.........
  .OyyyyO.........
  .OyyyyO.........
  .OOOOOO.........
