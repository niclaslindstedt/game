  features: a single upright power cell, far taller than it is wide, a narrow
    metal terminal stub on top, a segmented cyan charge column running down the
    middle of a dark slim casing, and a bright contact plate across the foot
  accent: electric cyan in a dark casing
  flavor: what the rails, tasers and plasma burn
