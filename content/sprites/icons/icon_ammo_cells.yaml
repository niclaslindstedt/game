name: icon_ammo_cells
family: icons
size: [12, 12]
description: >
  The CELLS pouch icon — one power cell stood on end: a narrow metal terminal
  on top, a slim dark casing with a lit charge column down its middle, and a
  bare contact plate at the foot.
subject:
