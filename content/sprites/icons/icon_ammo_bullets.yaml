name: icon_ammo_bullets
family: icons
size: [12, 12]
description: >
  The BULLETS pouch icon — one cartridge standing point-up: a bright brass
  bullet tapering to a tip, seated in a darker straight case, over the groove
  and the overhanging rim of its head.
subject:
  kind: ammunition icon
  features: a single cartridge standing point-up, a bright brass bullet
    narrowing over four steps to a tip above a darker straight-walled case, a
    groove cut across the foot and a rim a shade wider than the case beneath it
  accent: bright brass over darker brass
  flavor: the round every firearm in the game takes
palette:
  O: "#1a1c2c" # dark outline and the extractor groove
  y: "#ffd27a" # bright brass bullet
  Y: "#c98b2a" # brass case
