name: icon_pilgrims_pack
family: icons
size: [12, 12]
description: >
  A framed pilgrim's pack with a bedroll lashed across the top — built to
  be lived out of, not carried to a car.
subject:
  kind: bag icon
  features: a tall framed canvas pack with a rolled blanket lashed across the top and a wooden frame showing through the straps
  accent: road-green canvas over a pale bedroll
  flavor: whoever packed it expected to be walking for a season
