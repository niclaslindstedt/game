name: icon_difficulty_jesus
family: icons
size: [12, 12]
description: >
  A mushroom cloud — a wide boiling cap over a narrow column, standing on a
  skirt of thrown-up debris — the JESUS CHRIST! rung's marker on the
  difficulty ladder.
subject:
