name: riftstone_wedge
family: rift
size: [26, 20]
description: >
  A sharp wedge driven into the ground, one face sheared clean off — hard-faceted crystallized void in unnatural violet crystal shot through with void black. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: a sharp wedge driven into the ground, one face sheared clean off, solid crystallized void rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: unnatural violet crystal shot through with void black
  flavor: a ridge stone that walls the way across the surface — the living stop at it
