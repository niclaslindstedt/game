name: stray_comet_0
family: rift
size: [16, 16]
description: >
  A stray comet — a ragged faceted ice shard, lit pale cyan on one face and deep
  teal on the other, shedding a tail of loose specks behind it.
subject:
  kind: minion
  build: a ragged ice-blue crystalline shard trailing a short streaming tail
  features: a hard facet break down the shard — pale-cyan lit face to the upper left, deep teal shadow to the lower right — with bright white glints on the break and the tail scattering into loose specks below
  accent: bright white ice glints
  flavor: void fauna — one of a small flock on a decaying orbit, a frozen drifter that cannot get back to wherever its tail points

