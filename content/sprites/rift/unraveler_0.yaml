name: unraveler_0
family: rift
size: [16, 16]
description: >
  An unraveler — a creature no longer all in one place: its head slid clear of
  the body it belongs to, ghosted cyan down one edge and hot-pink down the
  other, an image that failed to reassemble.
subject:
  kind: minion
  build: two blocky pieces of one creature, a head and a trunk, slid out of alignment with void showing in the seam between them
  features: a deep-violet body under a thin chromatic fringe, cyan lagging the left edge and hot-pink leading the right, one cold black eye set in the head
  accent: cyan-and-pink chromatic split
  flavor: void fauna — a glitch with intent; where it passes the local rules about distance stop being enforced, and it is awkward to hit because some of it has already arrived somewhere else
palette:
  K: "#0a0910" # cold black eye
  M: "#644696e6" # deep violet body
  O: "#1a1c2c" # outline
  Q: "#60f0d0" # cyan ghost, lagging edge
  X: "#ec52be" # hot-pink ghost, leading edge
  m: "#a57de1e6" # mid-violet body highlight
