name: stray_comet_1
family: rift
size: [16, 16]
description: >
  A stray comet mid-drift — the same shard with its tail specks streamed to new
  positions, so the trail reads as still coming off it.
subject:
  kind: minion
  build: a ragged ice-blue crystalline shard trailing a short streaming tail, its tail specks shifted from their positions in its other frame
  features: a hard facet break down the shard — pale-cyan lit face to the upper left, deep teal shadow to the lower right — with bright white glints on the break and the tail scattering into loose specks below
  accent: bright white ice glints
  flavor: void fauna — one of a small flock on a decaying orbit, a frozen drifter that cannot get back to wherever its tail points

palette:
  C: "#5b858ce1" # deep teal shadowed facet
  O: "#1a1c2c" # outline
  W: "#f4f4f4" # bright white ice glint
  c: "#8ccdd7e1" # ice-blue body
  x: "#c5e6ebe1" # pale-cyan lit facet
