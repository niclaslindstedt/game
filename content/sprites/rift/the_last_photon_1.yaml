name: the_last_photon_1
family: rift
size: [16, 16]
description: >
  The last photon mid-flicker — the same burst with its corona swung round to
  new bearings, so the flash never holds one shape.
subject:
  kind: minion
  build: a jagged five-pointed starburst of light with a spiky radiating corona, its spikes swung round to different bearings from its other frame
  features: a white-hot corona around a ring of pale gold, an orange-gold core at the centre, loose gold flecks flung off in pairs around it
  accent: warm orange-gold core
  flavor: the final flash of a dead universe — one of a kind, blindingly fast, pure incandescence given a shape

palette:
  O: "#1a1c2c" # outline
  W: "#f4f4f4" # white-hot corona
  Y: "#ffe3b6" # pale gold heat
  y: "#ffb02e" # orange-gold core and flung flecks
