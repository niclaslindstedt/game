name: rift_pit_small
family: rift
size: [22, 18]
description: >
  A small punched-through hole, barely wider than a man — a black void ringed by a heaped, unnatural violet crystal shot through with void black lip. Unlike the jumpable craters it CANNOT be crossed, so it reads as a hole rather than a bowl: the centre goes to the darkest colour the surface owns.
subject:
  kind: prop
  build: a small punched-through hole, barely wider than a man, a void with a heaped raised lip
  features: a black bottomless centre, a lit upper lip, ejecta stones on the rim
  accent: unnatural violet crystal shot through with void black
  flavor: a hole in the ground that stops hero and horde alike — walk around it
palette:
  L: "#d4a5ec" # lilac facet highlight
  P: "#b05cdc" # violet crystal
  e: "#6c4696" # mid violet facet
  M: "#644696e6" # shadowed violet
  K: "#0a0910" # void bottom
  O: "#1a1c2c" # outline
