name: gear_gate_5
family: ui
size: [32, 24]
description: >
  The wagon's shift gate with the lever in fifth — a five-speed H pattern,
  reverse at the bottom right, its engaged position lit and the rest left grey.
  One of seven; the dashboard's gearbox picks whichever one the box is in.
subject:
  kind: ui readout
  features: a five-speed H-pattern shift gate, its slots drawn as thin steel lines, with a lever knob resting in fifth
  accent: the lit label of the gear it is in
  flavor: the one thing on the dashboard that is a shape rather than a number
palette:
  G: "#5b6b82" # the gate's steel slots
  D: "#6d7789" # an unselected label
  K: "#e8e4d8" # the lever, and the label it is resting on
  A: "#e8635a" # …and both, in reverse
