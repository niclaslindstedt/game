description: >
  ARMSTRONG at the top of THE VIGIL's windup: the body still dead still, but
  the eye sockets are now four blazing white bars and the glare has flooded the
  whole visor — the frame that says the beam is about to open.
subject:
  kind: boss
  name: ARMSTRONG
  build: a giant translucent astronaut colossus, broad round body on stubby limbs, looming over the field
  attire: a pale mint-green pressure suit
  features: two wide blazing white-hot eye bars flooding the domed helmet with cyan glare
  accent: the cyan glare filling the visor from the inside
  pose: rooted and perfectly still at the top of the windup, only the light having changed
  flavor: the last held breath before the watchman burns a line across his own graveyard
