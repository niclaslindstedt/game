name: moon_pit_small
family: moon
size: [22, 18]
description: >
  A small punched-through hole, barely wider than a man — a black void ringed by a heaped, desaturated lunar grey with hard vacuum shadow lip. Unlike the jumpable craters it CANNOT be crossed, so it reads as a hole rather than a bowl: the centre goes to the darkest colour the surface owns.
subject:
  kind: prop
  build: a small punched-through hole, barely wider than a man, a void with a heaped raised lip
  features: a black bottomless centre, a lit upper lip, ejecta stones on the rim
  accent: desaturated lunar grey with hard vacuum shadow
  flavor: a hole in the ground that stops hero and horde alike — walk around it
palette:
  T: "#c0c5cf" # vacuum-lit rim
  F: "#a2a4ad" # light stone face
  f: "#888a96" # base regolith grey
  e: "#4e4f56" # deep stone shadow
  b: "#3f4553" # pit shadow
  O: "#1a1c2c" # dark outline
