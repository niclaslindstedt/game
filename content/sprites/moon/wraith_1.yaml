family: moon
size: [18, 18]
description: >
  WRAITH, the drift frame: the same peaked cowl with its arms trailed lower and
  the drift below it curling off true.
subject:
  kind: minion
  name: WRAITH
  build: a tall hooded shroud standing over the rank and file, its cowl drawn up to a peak and its body narrowing to a single long drift; no legs and no feet
  attire: a violet shroud, frayed along both edges of the drift
  features: a deep empty hood with nothing in it, and thin arms trailing lower than the settled frame
  accent: two burning red eyes set far back in the hood
  pose: mid-drift, arms trailing, the shroud curling to one side
  flavor: it does not walk, so its second frame is a drift rather than a stride
