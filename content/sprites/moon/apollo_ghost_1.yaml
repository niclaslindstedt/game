name: apollo_ghost_1
family: moon
size: [24, 23]
description: >
  MISSION SPECIALIST, the drift frame: the same astronaut with his arms
  trailed a row lower.
subject:
  kind: elite minion
  name: MISSION SPECIALIST
  build: a dead Apollo astronaut at elite size, the suit narrowing away below the waist into a drift; no legs and no feet
  attire: a chalk-white flight suit with a chest control unit, lit down its left and shaded down its right
  features: an empty black helmet behind the raised visor, and arms trailing lower than the settled frame
  accent: the gold visor pushed up into a band across the brow
  pose: mid-drift, arms trailing
  flavor: fifty years to work out what he stepped onto, and he is the one who says it plainly
palette:
  A: "#7c8da0e6" # suit shadow
  G: "#e8b64a" # gold visor, pushed up
  O: "#1a1c2c" # dark outline
  W: "#eef2f6" # lit suit white
  g: "#a87e2a" # gold visor shade
  v: "#101624" # the empty helmet behind the raised visor
  w: "#bac6d4e6" # suit mid-tone
