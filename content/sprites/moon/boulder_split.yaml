name: boulder_split
family: moon
size: [30, 20]
description: >
  One stone cleft in two, its shadowed base showing through the gap — hard-faceted grey regolith in desaturated lunar grey with hard vacuum shadow. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: one stone cleft in two, its shadowed base showing through the gap, solid grey regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: desaturated lunar grey with hard vacuum shadow
  flavor: a ridge stone that walls the way across the surface — the living stop at it
palette:
  T: "#c0c5cf" # vacuum-lit rim
  F: "#a2a4ad" # light stone face
  f: "#888a96" # base regolith grey
  d: "#676972" # mid stone shadow
  b: "#3f4553" # pit shadow
  O: "#1a1c2c" # dark outline
