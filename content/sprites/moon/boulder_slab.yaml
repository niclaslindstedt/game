name: boulder_slab
family: moon
size: [32, 14]
description: >
  A long low plate lying flat, far wider than it is tall — hard-faceted grey regolith in desaturated lunar grey with hard vacuum shadow. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: a long low plate lying flat, far wider than it is tall, solid grey regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: desaturated lunar grey with hard vacuum shadow
  flavor: a ridge stone that walls the way across the surface — the living stop at it
