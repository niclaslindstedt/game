name: selene_drowned_1
family: moon
size: [24, 24]
description: >
  THE DROWNED OF SELENE, second drift frame: the same helmeted drowned mariner
  settled a pixel lower, its porthole dimmed and the standing water beneath it
  sloshed wide and shallow.
subject:
  kind: hellborn elite-sized minion
  name: THE DROWNED OF SELENE
  build: a heavy waterlogged mariner, very wide at the shoulders, dissolving into water below
  attire: a rotted grey oilskin dive suit with a bolted brass collar
  features: the porthole dimmed to a dull green as the helmet tips forward
  accent: the kelp streamers swung forward, the water beneath sloshed wide
  pose: sagging under its waterlogged weight, helmet dipped
  flavor: a harbour crew from the nine hundred years the moon had a sea
