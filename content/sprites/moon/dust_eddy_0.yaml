name: dust_eddy_0
family: moon
size: [12, 14]
description: >
  A pale eddy of regolith curling off the ground where nothing is moving —
  thin, half-transparent, faintly cold-blue at its heart. On an airless moon
  the dust should lie still; around here it doesn't.
subject:
  kind: critter — spectral dust eddy
  build: a thin S-curl of lifted dust, wider at the base, tapering as it rises
  features: half-transparent pale grey, a faint cold-blue glow in the core
  accent: the cold-blue heart
  flavor: dust that moves with no wind to move it
palette:
  a: "#d6dce4c8" # pale lifted dust
  u: "#a9adb5b4" # dust shadow
  x: "#c5e6ebe1" # cold-blue heart
