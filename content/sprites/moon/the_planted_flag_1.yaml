name: the_planted_flag_1
family: moon
size: [24, 32]
description: >
  THE FLAGBEARER's planted flag on the swell of its pulse: the banner and pole are
  identical and dead still — nothing flutters in vacuum — while the cyan
  grave-light around its foot floods brighter and climbs further up the pole.
subject:
  kind: structure
  name: THE PLANTED FLAG
  build: a tall grey pole sunk into a low mound, a stiff rectangular banner across its top
  attire: a red-and-white striped banner with a blue star canton, held rigid on a wire crossbar
  features: the cyan grave-light around the foot swollen brighter and reaching higher up the pole
  accent: the blue star canton
  pose: driven upright into the ground, dead still, only the light beneath it moving
  flavor: the grave answering, one pulse at a time
palette:
  A: "#8d9196" # grey flagpole
  O: "#1a1c2c" # dark outline
  W: "#f4f4f4" # white stripes and stars
  j: "#4054bc" # blue canton
  r: "#d83a3a" # red stripes
  x: "#c5e6ebe1" # grave-light at full swell
