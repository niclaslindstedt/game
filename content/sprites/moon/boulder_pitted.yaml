name: boulder_pitted
family: moon
size: [26, 17]
description: >
  A squat wide dome, its face chewed up by micrometeorite pits — hard-faceted grey regolith in desaturated lunar grey with hard vacuum shadow. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: a squat wide dome, its face chewed up by micrometeorite pits, solid grey regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: desaturated lunar grey with hard vacuum shadow
  flavor: a ridge stone that walls the way across the surface — the living stop at it
palette:
