name: moonrock_1x2
family: moon
size: [16, 32]
description: >
  A tall standing slab of grey moonrock on a two-tile footprint: the same
  vacuum-lit crown and hard facet break as its one-tile sibling, run up a
  standing stone.
subject:
  kind: prop
  build: a tall standing slab of moonrock on a two-tile footprint, peaked at the top and widening as it falls
  features: hard flat facets meeting on one long diagonal break, and dark micrometeorite pits
  accent: a vacuum-lit crown well above the regolith's own grey, over a shadow side well below it
  flavor: solid cover that blocks sight and shots, but the haunting drifts straight through
palette:
  F: "#a2a4ad" # light stone face
  O: "#1a1c2c" # dark outline
  T: "#c0c5cf" # vacuum-lit crown
  b: "#3f4553" # micrometeorite pit
  e: "#4e4f56" # deep stone shadow
  f: "#888a96" # base stone grey, shadow side only
