name: moonrock_1x1
family: moon
size: [16, 16]
description: >
  A single angular shard of grey moonrock, a one-tile boulder that blocks sight
  and shots: a vacuum-lit crown, one hard facet break, and a deep shadow side.
subject:
  kind: prop
  build: a single angular shard of moonrock on a one-tile footprint, peaked at the top and falling away to the right
  features: hard flat facets meeting on one diagonal break, and dark micrometeorite pits
  accent: a vacuum-lit crown well above the regolith's own grey, over a shadow side well below it
  flavor: cover against GOODCO's robots that blocks sight and shots, but the haunting phases straight through it
palette:
  F: "#a2a4ad" # light stone face
  O: "#1a1c2c" # dark outline
  T: "#c0c5cf" # vacuum-lit crown
  b: "#3f4553" # micrometeorite pit
  e: "#4e4f56" # deep stone shadow
  f: "#888a96" # base stone grey, shadow side only
