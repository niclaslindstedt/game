name: selene_drowned_0
family: moon
size: [24, 24]
description: >
  THE DROWNED OF SELENE, a hellborn horror: a bloated drowned mariner in a big
  round brass diving helmet with one glowing green porthole, heavy kelp streamers
  hanging off both arms, and a lower body that is a column of standing water.
subject:
  kind: hellborn elite-sized minion
  name: THE DROWNED OF SELENE
  build: a heavy waterlogged mariner, very wide at the shoulders, dissolving into water below
  attire: a rotted grey oilskin dive suit with a bolted brass collar
  features: a big round brass diving helmet with one glowing green porthole for a face
  accent: thick dark kelp streamers hanging from both arms, and a column of unfallen water for legs
  pose: standing hunched under its own waterlogged weight, arms hanging heavy
  flavor: a harbour crew from the nine hundred years the moon had a sea
