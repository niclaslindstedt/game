name: wraith_0
family: moon
size: [18, 18]
description: >
  WRAITH, the horde's heaviest common ghost: a peaked cowl over an empty hood
  with two burning eyes, drawn on a bigger canvas than the moon ghost so twice
  its health reads at a glance.
subject:
  kind: minion
  name: WRAITH
  build: a tall hooded shroud standing over the rank and file, its cowl drawn up to a peak and its body narrowing to a single long drift; no legs and no feet
  attire: a violet shroud, frayed along both edges of the drift
  features: a deep empty hood with nothing in it, and thin arms seamed clear of the shroud
  accent: two burning red eyes set far back in the hood
  pose: rearing upright, cowl forward
  flavor: dead long enough to get good at it — it recalls less of having been a person and more of being cold
palette:
  L: "#d4a5ec" # lit violet cowl edge
  M: "#5a3d86e6" # deep shroud shadow
  O: "#1a1c2c" # dark outline
  R: "#ff5252" # burning eyes
  m: "#a57de1e6" # translucent violet shroud
  v: "#150e28" # the empty hood
