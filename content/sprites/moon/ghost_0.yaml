name: ghost_0
family: moon
size: [16, 16]
description: >
  MOON GHOST, the horde's mid-weight body: one of the moon's own dead, drifting
  hollow-eyed with no suit on and nothing below the waist.
subject:
  kind: minion
  name: MOON GHOST
  build: a bare drifting corpse — a head and hunched shoulders over a torso that narrows away below the waist into a spectral drift; no legs and no feet
  attire: none, it died with no suit on
  features: a black hollow where the face was, thin arms hanging clear of the torso, a shaded jaw under the sockets
  accent: cold cyan spectral light, brightest along the top-left of the crown
  pose: hovering forward, shoulders up, arms hanging
  flavor: the moon's own dead, up and walking since SpaceZ plugged its machines into the thing under the Sea of Tranquility
palette:
  C: "#4a7b86e1" # deep spectral shade
  O: "#1a1c2c" # dark outline
  c: "#8ccdd7e1" # translucent cyan body
  v: "#102730" # black hollow of the face
  x: "#d5f2f7e1" # pale cyan crown highlight
