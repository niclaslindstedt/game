name: cartographer_1
family: moon
size: [24, 23]
description: >
  THE CARTOGRAPHER, the drift frame: the same surveyor with his arms
  trailed a row lower over the board.
subject:
  kind: elite minion
  name: THE CARTOGRAPHER
  build: a suited surveyor at elite size, the suit narrowing away below the waist into a drift; no legs and no feet
  attire: a dust-purple pressure suit, lit down its left and shaded down its right
  features: a chart board of blue grid lines held across the chest, and arms trailing lower than the settled frame
  accent: a wide pale visor lit from inside, the only light he has to chart by
  pose: mid-drift, arms trailing, the board still up
  flavor: he charts a landing site that will not hold still, and the map keeps changing underneath the pen
palette:
  B: "#92643e" # the chart board's frame
  J: "#2d3b84" # chart ink, shaded
  L: "#ceb0ece6" # lit suit
  M: "#604a84e6" # suit shadow
  O: "#1a1c2c" # dark outline
  U: "#f4fcff" # visor glare
  W: "#eef2f6" # the grid lines he charts by
  j: "#4054bc" # chart blue
  m: "#9a7cc4e6" # suit mid-tone
  u: "#c4e8f0" # lit visor glass
