name: prospector_0
family: moon
size: [24, 23]
description: >
  THE PROSPECTOR, the elite that charges: a digger's ghost in a dust-caked slate
  working suit, a gold hard hat throwing its lamp down over his face and a rock
  drill carried at his side.
subject:
  kind: elite minion
  name: THE PROSPECTOR
  build: a broad-shouldered digger, heavy across the chest, the suit narrowing away below the waist into a dust drift; no legs and no feet
  attire: a dust-caked slate working suit with a tool belt, drawn well clear of the regolith's own grey so it cannot be lost against the floor
  features: a domed gold hard hat with a short brim, a dark face beneath it, and both arms seamed clear of the chest
  accent: the hat's amber lamp and the light it throws under the brim
  pose: squared up and heavy, the drill held at his right side
  flavor: he dug SpaceZ's tunnels at Site T on the far side, and quit the month the crates coming up started breathing
