name: dust_eddy_1
family: moon
size: [12, 14]
description: >
  A pale eddy of regolith curling off the ground where nothing is moving —
  second beat: the curl leans the other way, the cold-blue heart higher in
  the column.
subject:
  kind: critter — spectral dust eddy
  build: a thin reversed S-curl of lifted dust, wider at the base, tapering as it rises
  features: half-transparent pale grey, a faint cold-blue glow higher in the core
  accent: the cold-blue heart
  flavor: dust that moves with no wind to move it
palette:
  a: "#d6dce4c8" # pale lifted dust
  u: "#a9adb5b4" # dust shadow
  x: "#c5e6ebe1" # cold-blue heart
