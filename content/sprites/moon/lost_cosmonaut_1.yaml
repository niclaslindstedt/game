name: lost_cosmonaut_1
family: moon
size: [16, 16]
description: >
  LOST COSMONAUT, the drift frame: the same suited ghost with its arms trailed
  lower, the drift curling off true and the antenna swayed a pixel over.
subject:
  kind: rare minion
  name: LOST COSMONAUT
  build: a suited cosmonaut ghost — a hard helmet on soft shoulders over a torso that narrows away below the waist into a drift; no legs and no feet
  attire: a warm rust-toned Soviet pressure suit, lit along the helmet crown and shaded down its right side
  features: a dark porthole visor with nothing behind it, and a whip antenna swayed off true
  accent: a red star on the chest and the antenna's red tip
  pose: mid-drift, arms trailing, the drift curling to one side
  flavor: it does not walk, so its second frame is a drift rather than a stride
palette:
  O: "#1a1c2c" # dark outline
  P: "#a86a5ce6" # suit shadow
  R: "#e0453c" # red star and antenna tip
  W: "#f7d5c4e6" # lit helmet crown
  n: "#b9c2cc" # antenna metal
  p: "#d9a08ce6" # rust-toned spectral suit
  v: "#101c2a" # dark porthole visor
