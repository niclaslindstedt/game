family: moon
size: [18, 18]
description: >
  THE THIRTEENTH MAN, the unique keeping his own grave: an Apollo moonwalker's
  ghost in a chalk-white suit and gold visor, the name tape on his chest
  scratched blank.
subject:
  kind: unique minion
  name: THE THIRTEENTH MAN
  build: an Apollo moonwalker in a hard-shelled white suit, drawn a size over the rank and file, the suit narrowing away below the waist into a drift; no legs and no feet
  attire: a chalk-white A7L pressure suit, lit down its left side and shaded down its right
  features: a gold visor with nothing behind it, and a dark chest control unit
  accent: the name tape across the chest, scratched blank
  pose: floating square on, arms at his sides, waiting to be counted
  flavor: twelve men are recorded as having walked on the moon, and the manifests for the thirteenth were shredded the week the mission came home
