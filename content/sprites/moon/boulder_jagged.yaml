name: boulder_jagged
family: moon
size: [20, 28]
description: >
  A tall splintered spire, notched on one flank, standing taller than it is wide — hard-faceted grey regolith in desaturated lunar grey with hard vacuum shadow. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: a tall splintered spire, notched on one flank, standing taller than it is wide, solid grey regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: desaturated lunar grey with hard vacuum shadow
  flavor: a ridge stone that walls the way across the surface — the living stop at it
palette:
  T: "#c0c5cf" # vacuum-lit rim
  F: "#a2a4ad" # light stone face
  f: "#888a96" # base regolith grey
  e: "#4e4f56" # deep stone shadow
  b: "#3f4553" # pit shadow
  O: "#1a1c2c" # dark outline
