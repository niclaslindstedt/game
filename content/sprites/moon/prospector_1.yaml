name: prospector_1
family: moon
size: [24, 23]
description: >
  THE PROSPECTOR, the drift frame: the same digger with his arms trailed a row
  lower and the dust drift beneath him hanging further.
subject:
  kind: elite minion
  name: THE PROSPECTOR
  build: a broad-shouldered digger, heavy across the chest, the suit narrowing away below the waist into a dust drift; no legs and no feet
  attire: a dust-caked slate working suit with a tool belt, drawn well clear of the regolith's own grey so it cannot be lost against the floor
  features: a domed gold hard hat with a short brim, a dark face beneath it, and arms trailing lower than the settled frame
  accent: the hat's amber lamp and the light it throws under the brim
  pose: mid-drift, arms trailing, the drill still held at his right side
  flavor: it does not walk, so its second frame is a drift rather than a stride
palette:
