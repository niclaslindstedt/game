  T: "#c0c5cf" # steel highlight
  Y: "#ffe3b6" # lamp glare
  d: "#6b7486e0" # dust-caked suit
  k: "#4a5262e0" # suit shadow
  o: "#d6a842" # gold hard hat
  v: "#161e2a" # the dark under the hat
  y: "#ffb02e" # amber lamplight
