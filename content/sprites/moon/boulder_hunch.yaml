name: boulder_hunch
family: moon
size: [24, 22]
description: >
  A hunched boulder with a heavy overhanging brow — hard-faceted grey regolith in desaturated lunar grey with hard vacuum shadow. One of the stones a rubble ridge is chained out of, so its silhouette is deliberately unlike its neighbours'.
subject:
  kind: prop
  build: a hunched boulder with a heavy overhanging brow, solid grey regolith rock
  features: hard flat facets, a lit crown rim, dark micrometeorite pits
  accent: desaturated lunar grey with hard vacuum shadow
  flavor: a ridge stone that walls the way across the surface — the living stop at it
palette:
  T: "#c0c5cf" # vacuum-lit rim
  F: "#a2a4ad" # light stone face
  f: "#888a96" # base regolith grey
  d: "#676972" # mid stone shadow
  e: "#4e4f56" # deep stone shadow
  b: "#3f4553" # pit shadow
  O: "#1a1c2c" # dark outline
