name: the_flagbearer_kneel
family: moon
size: [48, 48]
description: >
  THE FLAGBEARER beaten: the same translucent pale-green colossus, no longer
  hovering level — it has settled onto its own hem with its legs gone from
  under it, the helmet sunk into its shoulders and the whole mass listing.
subject:
  kind: boss
  name: THE FLAGBEARER
  build: a giant translucent astronaut colossus, broad round body on stubby limbs, looming over the field
  attire: a pale mint-green pressure suit
  features: two large dark hollow eyes in a domed helmet
  accent: a gold-and-red control panel on his chest
  pose: sagging, losing height, the helmet tipped and the stubby arms hanging
  flavor: "the colossus buckling: it has stopped hovering level and is settling toward the regolith, listing to one side"
palette:
  N: "#73a087f0" # deep-green suit shadow
  O: "#1a1c2c" # dark outline and hollow eyes
