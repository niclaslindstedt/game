name: the_planted_flag_0
family: moon
size: [24, 32]
description: >
  THE FLAGBEARER's Apollo flag driven back into the regolith as a marker: the
  red-and-white banner held stiff on its wire crossbar, the tall grey pole
  sunk into a low mound, and a pale cyan grave-light welling up around its
  foot where the dead are coming through.
subject:
  kind: structure
  name: THE PLANTED FLAG
  build: a tall grey pole sunk into a low mound, a stiff rectangular banner across its top
  attire: a red-and-white striped banner with a blue star canton, held rigid on a wire crossbar
  features: a pale cyan grave-light pooling out of the ground around the pole's foot
  accent: the blue star canton
  pose: driven upright into the ground, dead still, the banner rigid in the vacuum
  flavor: the flag he planted on a grave, put back in to make the grave answer
palette:
  A: "#8d9196" # grey flagpole
  O: "#1a1c2c" # dark outline
  W: "#f4f4f4" # white stripes and stars
  c: "#8ccdd7e1" # pale grave-light welling from the ground
  j: "#4054bc" # blue canton
  r: "#d83a3a" # red stripes
  x: "#c5e6ebe1" # brighter grave-light at the pool's heart
