name: ghost_1
family: moon
size: [16, 16]
description: >
  MOON GHOST, the drift frame: the same hollow-eyed corpse with its arms trailed
  a little lower and the drift below it curling off true.
subject:
  kind: minion
  name: MOON GHOST
  build: a bare drifting corpse — a head and hunched shoulders over a torso that narrows away below the waist into a spectral drift; no legs and no feet
  attire: none, it died with no suit on
  features: a black hollow where the face was, thin arms trailing lower than the settled frame, a shaded jaw under the sockets
  accent: cold cyan spectral light, brightest along the top-left of the crown
  pose: mid-drift, arms trailing, the tail curling to one side
  flavor: it does not walk, so its second frame is a drift rather than a stride
palette:
  C: "#4a7b86e1" # deep spectral shade
  O: "#1a1c2c" # dark outline
  c: "#8ccdd7e1" # translucent cyan body
  v: "#102730" # black hollow of the face
  x: "#d5f2f7e1" # pale cyan crown highlight
