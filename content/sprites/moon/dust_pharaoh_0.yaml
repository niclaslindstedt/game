description: >
  DUST PHARAOH, a hellborn horror: a broad-shouldered mummified king in a gold
  lunar death mask with a deep lapis nemes headdress, its wrapped body fading to
  streaming grey regolith at the legs, arms crossed over a cracked gold pectoral.
subject:
  kind: hellborn elite-sized minion
  name: DUST PHARAOH
  build: a broad-shouldered wrapped royal corpse, wide at the head, tapering to dust
  attire: grey grave-linen wrappings dissolving into streaming lunar regolith below the waist
  features: a gold death mask with black hollow eyes under a deep lapis-blue striped headdress
  accent: a cracked gold pectoral collar across the chest, arms folded over it
  pose: standing straight and regal, arms crossed, lower body trailing away as dust
  flavor: interred under the Sea of Tranquility before Earth had continents
