# Part of the CAR assembly (engine/game/vehicles.ts): all car_* parts share one
# 48x26 canvas, so the renderer stacks them at a single anchor. This layer
# only draws while the engine is RUNNING (a driver is seated): the head and
# tail lamps burning over whatever damage rungs the panels wear.
name: car_lights
family: goodco
size: [48, 26]
description: >
  The hatchback's lamps lit: the headlight bar burning warm white-gold at the nose, the twin taillights burning red at the tail. Drawn over the body stack only while the engine runs.
subject:
  kind: "vehicle part"
  build: "a compact five-door hatchback's lit lamps: headlight bar at the nose, twin taillights at the tail"
  features: "lamps burning, engine running"
  accent: "warm white-gold headlights, red taillights"
  flavor: "the hero's hatchback, key turned"
palette:
  H: "#fff6c8" # headlight hot core
  Y: "#ffdf6e" # headlight gold
  R: "#ff4a3a" # taillight red
  r: "#ff8d6e" # taillight glow
