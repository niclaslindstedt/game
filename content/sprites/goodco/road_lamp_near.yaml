# THE SAME MAST, SEEN FROM BEHIND — the row standing on the NEAR pavement, which
# the camera looks at from the wrong side.
#
# WHY IT IS A SECOND SPRITE AND NOT A MIRROR. The difference between the two
# rows is not left and right, it is which way the head is FACING: the far row
# throws its light toward the eye, so you look up into a burning lens; the near
# row throws it away from the eye, so what you get is the back of the cowl with
# the glow escaping round its bottom edge. A mirrored `road_lamp` would show a
# lens on a lamp that is pointing away, which is the one thing a night scene
# reads instantly as wrong.
#
# THE COLUMN AND THE FOOT ARE IDENTICAL to `road_lamp`, deliberately: it is the
# same mast, and a row of posts whose columns did not match would read as two
# different streets.
name: road_lamp_near
family: goodco
space: outside
size: [10, 52]
description: >
  A tall galvanized street-lighting mast seen from behind — the same slim column
  and wide flat hood as its opposite number, but with the cowl's dark back
  turned to the viewer and no lit lens showing at all.
subject:
  kind: "standing street-lighting mast prop, seen from behind"
  build: "a tall slim column under a wide flat hood, the hood several times the column's width"
  features: "a plain tapered column on a flared foot, the unlit back of a flat hood, no lens showing at all"
  accent: "cold galvanized grey — the light is all on the other side of it"
  flavor: "still lit for a street whose whole block lost its jobs"
palette:
  O: "#1a1c2c" # outline
  T: "#dde1ea" # hood highlight
  V: "#c0c5cf" # hood face
  v: "#9095a5" # hood shade
  s: "#818690" # post metal
  b: "#5a616f" # post shadow side
