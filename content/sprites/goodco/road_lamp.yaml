# THE STREET LIGHTING on the road out to GOODCO — the tall masts that actually
# light the tarmac, as opposed to `lamp_post`, which is the little yard light on
# the back lawn and only lights the grass around itself.
#
# IT IS A POST-TOP, NOT A COBRA HEAD, and that is a projection decision rather
# than a styling one. The camera looks DOWN at this road, so a lamp's arm
# reaching out over the carriageway would reach toward or away from the eye —
# which a billboard, drawn upright at full size, has no way to show. An arm
# drawn out to one side instead reads as a lamp lighting the pavement it is
# standing on. So the head sits square on top of the column and the LIGHT does
# the reaching (`drive-screen/render.ts` throws its cone out over the lanes).
#
# TALLER THAN THE TOWN, deliberately: at anything under about forty px the masts
# came out shorter than the frontages behind them and read as a second row of
# garden lamps rather than as street lighting.
name: road_lamp
family: goodco
space: outside
size: [10, 52]
description: >
  A tall galvanized street-lighting mast — a slim column carrying a wide flat
  hood, with a lens burning white-hot under it.
subject:
  kind: "standing street-lighting mast prop"
  build: "a tall slim column under a wide flat hood, the hood several times the column's width"
  features: "a plain tapered column on a flared foot, a flat hood, a burning lens on the hood's underside"
  accent: "cold galvanized grey against a white-hot lens"
  flavor: "still lit for a street whose whole block lost its jobs"
palette:
  O: "#1a1c2c" # outline
  T: "#dde1ea" # hood highlight
  V: "#c0c5cf" # hood face
  v: "#9095a5" # hood shade
  s: "#818690" # post metal
  b: "#5a616f" # post shadow side
  w: "#fff4cf" # hot lens core
  y: "#ffcf6e" # warm lens
