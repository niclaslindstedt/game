name: door_entrance_open
family: goodco
size: [16, 16]
description: >
  The GOODCO front entrance standing OPEN — one glazed leaf slid back into its
  jamb and seen edge on, a narrow strip of glass with its status light and push
  rail still reading. Drawn in the jambs once somebody has badged the doors
  apart, so an entrance that has been used keeps its doors.
subject:
  kind: open-door scenery prop
  build: a glazed lobby door leaf slid flat into its jamb, seen edge on
  features: the same red header light and chrome push rail, now only a slab wide
  accent: pale-blue tinted glass over chrome, with one red light above it
  flavor: the way in, standing open behind somebody who has already gone through
palette:
  O: "#1a1c2c" # outline and frame
  T: "#c0c5cf" # chrome rail highlight
  V: "#9095a5" # brushed-metal kick panel
  b: "#3f4553" # push-rail shadow
  c: "#6f9cb8" # tinted glass edge
  r: "#d83a3a" # red header status light
  x: "#a8d8e6" # pale-blue glazing
