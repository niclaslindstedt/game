name: wall
family: goodco
# THE WALL STANDS. Its art is a plan view of a partition, not paint on the
# ground: drawn flat it read as a slightly darker paving slab, and with the
# camera turned a lab's rooms stopped being rooms. `plane: wall` keeps the same
# footprint and extrudes it (render/plane.ts).
plane: wall
size: [16, 16]
description: >
  A section of solid dark-grey lab wall panel with a beveled metal edge; blocks
  movement and carves the floor into rooms.
subject:
  kind: solid obstacle prop
  build: a full square wall panel, a bright bevel down two edges, dark shadow on the others
  features: two small bolt studs set into the panel face
  accent: beveled brushed-metal edge
  flavor: the partition walls dividing the GOODCO lobby, labs and cleanroom
palette:
  O: "#1a1c2c" # outline
  V: "#9095a5" # bright bevel highlight
  b: "#3f4553" # dark shadow edge
  f: "#888a96" # grey bolt studs
  v: "#60687e" # slate panel face
