  a: "#d6dce4" # white hull
  b: "#3f4553" # black interstage, engine skirt and pad
  e: "#8ccdd7" # cyan instrument panel
  f: "#888a96" # pad decking
  i: "#772020" # shaded red
  k: "#342c26" # sooted bell throats
  n: "#b9e6cd" # pale glint on the panel
  r: "#d83a3a" # red nose cone and fins
  x: "#c5e6ebe1" # cyan porthole glass
