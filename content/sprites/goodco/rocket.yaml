name: rocket
family: goodco
size: [32, 48]
description: >
  The prototype rocket landmark — a full-height two-stage launch vehicle
  standing on its hold-down pad: red nose cone, lit crew and instrument
  windows, a black interstage, swept red fins and three engine bells under the
  skirt. PAYLOAD-1 boots up in the shadow beneath it.
subject:
  kind: landmark prop
  build: a tall two-stage launch vehicle standing upright on a hold-down pad, tapering to a nose cone
  features: a red nose cone and swept red fins, cyan-lit window bands on both stages, a black interstage and three engine bells under the skirt
  accent: red nose and fins on a white hull
  flavor: the GOODCO prototype on its pad; PAYLOAD-1 boots up in the shadow beneath it
