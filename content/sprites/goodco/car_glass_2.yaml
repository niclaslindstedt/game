# Part of the CAR assembly (engine/game/vehicles.ts): all car_* parts share one
# 48x26 canvas, so the renderer stacks them at a single anchor. Preview any
# damage mix with `node scripts/car-viewer.mjs`.
name: car_glass_2
family: goodco
size: [48, 26]
description: >
  The hero's hatchback: every pane: rear glass, door windows and the windshield - a spreading web. Its own panel so a crash can break the glazing alone; behind it the body panels carry the cabin void, so a shattered pane opens on the car's own dark interior, never the floor behind it.
subject:
  kind: "vehicle part"
  build: "the hatchback's full glazing, one layer"
  features: "a spreading web"
  accent: "white body, black roof and trim, dark glass"
  flavor: "the hero's hatchback, one piece of it"
palette:
  L: "#8ccdd7" # glass glint
  c: "#22262e" # cabin glass
