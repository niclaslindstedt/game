  OTVVVVVVVVVVVVTO
  OvvvvvvvvvvvvvvO
  ObbbbbbbbbbbbbbO
  OyybbyybbyybbyyO
  OyybbyybbyybbyyO
  OOOOOOOOOOOOOOOO
