# Drawn SIDE ON, on the same 48x26 canvas the hub's car assembly uses (`car_*`
# — see src/game/vehicles.ts), with wheels stamped from the same 11x11 pattern
# `car_wheel_0` uses. A car in the GOODCO lot and the car in the garage are the
# same kind of object at the same scale, and both stand on wheels you can see.
name: parked_car
family: goodco
space: outside
size: [48, 26]
description: >
  A staff car left in a bay overnight, seen side on — a drab silver saloon on
  two visible wheels, dark raked glass with the light streaking off it, a red
  tail lamp aft and a pale headlamp forward.
subject:
  kind: solid obstacle prop
  build: a small saloon seen side on, nose to the right, both wheels proud of the body
  features: raked cabin glass with a centre pillar, a door shut line and handles, a red tail lamp
  accent: dull silver paint against black glass
  flavor: somebody's car, still in the lot, three shifts later
palette:
  O: "#1a1c2c" # outline ink
  W: "#b9bec8" # silver body paint
  s: "#d8dce4" # body highlight
  d: "#7d838f" # sill shadow
  b: "#3f4553" # dark trim, tyre tread, shut lines
  k: "#0a0910" # cabin glass and tyre
  c: "#7fd0d8" # light streaking off the glass
  r: "#d84a3a" # tail lamp
  y: "#e8d9a8" # headlamp
  T: "#c0c5cf" # hubcap steel
