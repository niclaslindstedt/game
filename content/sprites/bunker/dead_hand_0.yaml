name: dead_hand_0
family: bunker
size: [24, 24]
description: >
  THE DEAD HAND, a hellborn horror: an enormous severed steel hand walking
  upended on its four fingers, a broad riveted palm with a glowing red launch key
  set into it, a thumb hooked out to one side, and a cut-off wrist stump at the
  top ringed in hazard yellow.
subject:
  kind: hellborn elite-sized minion
  name: THE DEAD HAND
  build: a huge severed hand the size of a man, upended and walking on its four fingers
  attire: riveted brushed-steel plating over exposed black cable tendons
  features: a cut-off wrist stump at the top ringed in hazard-yellow paint, a thumb hooked out to one side
  accent: a glowing red launch key set into the middle of the broad palm
  pose: reared up on four splayed finger-legs, thumb cocked, wrist stump raised
  flavor: the doomsday system was named after it, never the other way round
