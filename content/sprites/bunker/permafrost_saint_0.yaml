family: bunker
size: [24, 24]
description: >
  THE PERMAFROST SAINT, a hellborn horror: a robed figure entombed upright in a
  slab of blue glacier ice — a pale face and dark folded arms clearly visible
  through it — with a ring of frost hanging as a halo and a cyan glow burning
  where its heart is.
subject:
  kind: hellborn elite-sized minion
  name: THE PERMAFROST SAINT
  build: a tall robed figure suspended upright inside a rough slab of ice
  attire: heavy dark-grey frozen vestments with a hood, seen through pale blue ice
  features: a still white face inside the hood, eyes shut, arms folded across the chest
  accent: a floating ring of frost as a halo, and a cyan glow burning at the heart
  pose: upright and motionless inside the ice, arms folded on the chest
  flavor: what the ice held since before there was ice, poured over in concrete in 1949
