name: quests
ground: lab_0
style: >
  The people on the field who are not trying to kill anyone — the ones left
  behind by whatever happened here, still doing a job nobody is paying them
  for. Ordinary working silhouettes at the hero's own scale, each read at a
  glance by ONE prop they refuse to put down (a clipboard, a headset, a seed
  tray, a lantern, a towel, a tray), warm working-clothes tones against the
  cold of the venue they are stranded in. Never armoured, never posed for a
  fight: shoulders down, hands full.
# No family palette: every one of these people is a different trade in a
# different venue, so the shared look is the SILHOUETTE and the one prop, not a
# colour set. Each sprite carries its own.
