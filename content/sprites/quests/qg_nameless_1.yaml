name: qg_nameless_1
family: quests
size: [16, 16]
description: >
  The nameless man again, the smear of his face shifted — as though it had tried to settle into features and failed.
subject:
  kind: quest giver — the man with no name
  name: "NOBODY IN PARTICULAR"
  build: an ordinary tradesman's frame, standing very still
  attire: a heavy work apron over rolled shirtsleeves, sleeve guards at the wrist
  features: the pale smear shifted a pixel, briefly almost a face
  accent: the apron, unchanged and entirely solid
  pose: idle, one hand half-lifted as if to point at himself
  flavor: fourteen thousand attempts at remembering, all of them nearly
