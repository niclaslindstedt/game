  E: "#5d4028" # shaded stave / timber brace
  N: "#3a3644" # roof shingle
  O: "#1a1c2c" # outline
  S: "#b39378" # sunlit stave
  b: "#3f4553" # eave shadow
  f: "#888a96" # spout mouth
  v: "#60687e" # shingle course / iron hoop
  x: "#c5e6ebe1" # water drip
