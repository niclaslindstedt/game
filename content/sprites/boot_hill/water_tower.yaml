name: water_tower
family: boot_hill
size: [32, 40]
description: >
  The town water tower - a round staved tank bound with iron hoops under a
  shingled conical roof, raised on tall splayed timber legs with cross
  bracing, a downspout running down one leg and water dripping beneath.
subject:
  kind: "landmark - water tower"
  build: "a round planked tank raised high on four splayed, cross-braced timber legs"
  features: "a shingled conical roof with a tin vent cap, vertical plank staves, two iron hoops, a downspout"
  accent: "the tank lit down its left side and falling into shadow round its right, with pale water drips beneath"
  flavor: "a tall landmark over main street and The Leak's sightline"
