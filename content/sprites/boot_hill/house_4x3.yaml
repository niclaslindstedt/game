family: boot_hill
plane: floor
size: [64, 48]
description: >
  A two-storey frontier house, top-down - shuttered windows along the
  upper floor, lamp-lit windows and a doorway with a plank stoop below,
  under a shingled roof and a painted eave band.
subject:
  kind: "building obstacle"
  build: "a two-storey timber house seen top-down, taller than it is wide"
  features: "a diagonally shingled roof, a painted eave band, three closed shutters across the upper floor, two four-pane windows and a framed doorway on the ground floor, a plank stoop"
  accent: "the ground floor lit warm amber while the upstairs is shut for the night"
  flavor: "a family's house on the street, half of it already asleep"
