name: glued_slumped
family: earth
size: [16, 16]
description: >
  A demonstrator sitting hunched in a grey hood with their head down and their
  hands flat on the road either side.
subject:
  kind: demonstrator glued to the road
  build: a person seated and hunched forward, shoulders up around a lowered head, the hood up and swallowing most of the face
  attire: a grey hooded top over dark trousers
  features: the hood up with only a band of face inside it, both hands flat on the tarmac
  accent: nothing bright at all — the one of them the headlights find last
  flavor: hour six of a road occupation looks like this, and the joke only works if at least one of them is plainly bored
  pose: seated, hunched, head down
