name: lawn_tree_ashen
family: earth
plane: floor
size: [26, 28]
description: >
  What is left of the garden tree once everything burnable has gone off it — a
  bare dead skeleton of trunk and thick boughs seen from above, with the ground
  showing between every limb.
subject:
  kind: solid obstacle prop
  build: a stout trunk with five thick boughs radiating from it, and open ground between them where the crown used to be
  features: the boughs tapering from the trunk outward and stopping short, with two forks so the shape is not a starburst
  accent: pale dead wood on the top of each limb against near-black underneath
  flavor: the third fire took the rest of it
palette:
  O: "#1a1c2c" # outline
  X: "#403a33" # dead wood
  x: "#2a2622" # dead wood, the shaded underside
