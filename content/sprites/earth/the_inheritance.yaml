name: the_inheritance
family: earth
size: [20, 17]
description: >
  THE CACHE, rung five and the last — the gilded one, and the biggest thing in
  the bay. A crowned dome banded in gold, filigree across the front panel, and
  a red stone set in the lockplate. There is nothing further back in the house.
  This is the whole inheritance.
