# A TWO-WHEELER on the drive to GOODCO, drawn SIDE ON with nose to the RIGHT and
# with NOBODY ON IT. The rider is a sprite of their own (rider_*), seated on this
# one by the renderer — because a person baked into the machine cannot be thrown
# off it, and being thrown off it is the whole point of these.
name: traffic_motorcycle
family: earth
space: outside
size: [48, 26]
description: >
  A naked motorcycle seen side on with nobody on it — a deep red tank over a finned engine, forks raked out to a big front wheel.
subject:
  kind: traffic vehicle prop, riderless
  build: a naked road motorcycle, tank high over an exposed engine, the forks raked out ahead of it
  features: raked forks under a round headlamp, a low engine, a slash-cut pipe and a tank-seat-tail line slung between two cast wheels
  accent: deep red tank
  flavor: drawn with nobody on it, because the person is thrown off it
palette:
  O: "#1a1c2c" # outline ink
  k: "#0a0910" # tyre
  b: "#3f4553" # dark metal, seat, engine cases
  A: "#8d9196" # bare chrome and alloy
  T: "#c0c5cf" # wheel rim
  y: "#e8d9a8" # headlamp
  r: "#d84a3a" # tail lamp
  B: "#b8302c" # tank red
  s: "#e8635a" # bodywork highlight
  d: "#6f1a18" # bodywork shadow
