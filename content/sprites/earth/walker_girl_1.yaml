# THE CROWD — one of the people out on the road to GOODCO, the ones the welfare
# did not reach. Walk-cycle frame 1.
#
# Built from one of six shared SILHOUETTE templates (adult, reaching, stooped,
# child, skirt, pusher, plus the two seated ones), so every body in the roster
# stands on the same ground line and reads at the same scale — a crowd whose
# members do not share a ground line reads as a bug rather than as a crowd.
name: walker_girl_1
family: earth
size: [16, 16]
description: >
  A girl in a green dress with her hair in two pigtails. Walk-cycle frame 1.
subject:
  kind: pedestrian on the road out
  build: a child, small, moving quicker than the adults
  attire: a green dress
  features: dark hair in two pigtails
  accent: the green dress
  flavor: she is following somebody who is already across
  pose: mid-stride, the legs passing
palette:
  O: "#1a1c2c" # outline
  A: "#4a8a5c" # sleeve
  B: "#2a2733" # shoes
  C: "#4a8a5c" # green dress
  H: "#3f2a1e" # dark hair in pigtails
  K: "#f0cbaa" # hand
  P: "#f0cbaa" # skin
  S: "#6dab7c" # dress panel
  T: "#3d7049" # dress hem
