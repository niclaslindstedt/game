  .....OHHHHHO....
  .....OPPPPO.....
  ......OPPO......
  ...OCCCWWLO.....
  ..OCCCCCLCCOKO..
  ..OCCCCLCCCOKO..
  ..OCCCLCCCCO....
  ..OTTTTTTTTO....
  ..OTTTTTTTTTO...
  ..OTTO..OTTTO...
  ..OTTO...OTTO...
  ..OBBO..OBBBO...
