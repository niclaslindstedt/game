# THE CROWD — one of the people out on the road to GOODCO, the ones the welfare
# did not reach. Walk-cycle frame 0.
#
# Built from one of six shared SILHOUETTE templates (adult, reaching, stooped,
# child, skirt, pusher, plus the two seated ones), so every body in the roster
# stands on the same ground line and reads at the same scale — a crowd whose
# members do not share a ground line reads as a bug rather than as a crowd.
name: walker_headphones_0
family: earth
size: [16, 16]
description: >
  A young woman with purple hair and headphones on, hearing none of it. Walk-cycle frame 0.
subject:
  kind: pedestrian on the road out
  build: a young woman walking in her own world
  attire: a purple bomber jacket over black leggings
  features: dyed purple hair under a headphone band
  accent: the purple bomber
  flavor: she never hears the horn
  pose: mid-stride, the legs apart
