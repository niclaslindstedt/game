name: earth
ground: grass_0
style: >
  Suburban Earth at ground level — warm domestic greens and browns, everyday
  lived-in objects, soft natural daylight.
palette:
  D: "#685438"
  Q: "#723c8f"
animations:
  slime_bounce: { frames: [slime_0, slime_1], delayMs: 280 }
contrastExempt: [grass_0, grass_1]
# Sprites whose isolated pixels are AUTHORED, not accidental — the orphan-pixel
# check skips them (see scripts/generate-assets.mjs).
speckleExempt:
  - grass_0
  - grass_1
