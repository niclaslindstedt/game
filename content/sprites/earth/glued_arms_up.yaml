name: glued_arms_up
family: earth
size: [16, 16]
description: >
  A demonstrator sitting in the road with both arms raised straight up, the one
  silhouette in the blockade that reads from a screen away.
subject:
  kind: demonstrator glued to the road
  build: a person seated square to the camera with both arms held straight up above the head, making a tall narrow shape out of a low wide one
  attire: a hi-vis orange jacket over dark trousers
  features: both arms up, hands open
  accent: the two raised arms, which are what makes the formation readable as PEOPLE from a distance rather than as a stripe across the road
  flavor: whether the arms are a cheer or a plea depends entirely on how far away the car still is
  pose: seated, both arms raised
palette:
  O: "#1a1c2c" # outline
  P: "#f0cbaa" # skin
  J: "#d98a3a" # hi-vis orange jacket
  T: "#3a3444" # dark trousers
