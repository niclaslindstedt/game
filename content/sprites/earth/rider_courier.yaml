# A RIDER — the person on one of the road's two-wheelers, drawn SEATED and on a
# canvas of their own so the machine can lose them. Seated rather than standing
# because that is how they are seen for the whole of their life on this road;
# what happens after they leave the saddle is the gore system's business, and it
# cuts THIS art up to do it (slicedPiece).
name: rider_courier
family: earth
space: outside
size: [16, 16]
description: >
  A delivery courier up off the saddle and hunched over the bars — a hi-vis jacket, a peaked helmet, bare calves over dark shorts.
subject:
  kind: rider on the road out
  build: an adult up off the saddle and standing on the pedals, hunched low
  features: a peaked helmet, one leg down and one folded up on the pedal
  accent: the hi-vis jacket
  flavor: paid by the drop, so the lights are a suggestion
palette:
  O: "#1a1c2c" # outline ink
  H: "#2e2a24" # shirt highlight
  P: "#b07a55" # helmet plum
  K: "#b07a55" # hand
  C: "#c6e83e" # jacket / top
  S: "#e8f79a" # top panel
  T: "#2d2b36" # trousers
  B: "#1f1d28" # shoes
