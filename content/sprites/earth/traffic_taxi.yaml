# TRAFFIC — one of the vehicles sharing the road on the drive to GOODCO, and
# the same table that dresses the GOODCO car park. Drawn SIDE ON, nose to the
# RIGHT, on the 48x26 canvas the whole fleet shares — but NOTHING else is
# shared: this model carries its own wheelbase, wheel size, ride height,
# overhangs and roofline, because a saloon and a box van that agree about any
# of those read as one silhouette with different paint.
name: traffic_taxi
family: earth
space: outside
size: [48, 26]
description: >
  A high-roofed taxi seen side on — amber yellow with a chequer band along the doors and a lit sign on the roof.
subject:
  kind: traffic vehicle prop
  build: a tall upright taxi with a long cabin and a short bonnet, built for a back seat rather than for its driver
  features: a roof sign, a chequer band along the doors, a partition line behind the driver
  accent: amber yellow with a black chequer
  flavor: meter running, going nowhere
palette:
  O: "#1a1c2c" # outline ink
  b: "#3f4553" # dark trim, tyre shadow, shut lines
  k: "#0a0910" # tyre
  c: "#7fd0d8" # light streaking off the glass
  r: "#d84a3a" # tail lamp
  y: "#e8d9a8" # headlamp
  T: "#c0c5cf" # wheel rim
  G: "#171d2b" # cabin glass
  H: "#25304a" # sky caught in the top of the glass
  B: "#e0a92c" # taxi amber body paint
  s: "#f7d071" # body highlight
  d: "#8f681a" # sill shadow
