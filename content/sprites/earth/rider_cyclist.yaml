# A RIDER — the person on one of the road's two-wheelers, drawn SEATED and on a
# canvas of their own so the machine can lose them. Seated rather than standing
# because that is how they are seen for the whole of their life on this road;
# what happens after they leave the saddle is the gore system's business, and it
# cuts THIS art up to do it (slicedPiece).
name: rider_cyclist
family: earth
space: outside
size: [16, 16]
description: >
  A cyclist sitting up and pedalling — a red windbreaker, a white helmet, bare legs on the pedals.
subject:
  kind: rider on the road out
  build: a seated adult sitting fairly upright with arms reaching down to the bars
  features: a vented white helmet, one knee up mid-pedal
  accent: the red windbreaker
  flavor: in the gutter, in the dark, in the way
palette:
  O: "#1a1c2c" # outline ink
  W: "#e8ecf2" # helmet white
  P: "#b07a55" # helmet plum
  K: "#b07a55" # hand
  C: "#c8342e" # jacket / top
  S: "#e0605a" # top panel
  T: "#2d2b36" # trousers
  B: "#1f1d28" # shoes
