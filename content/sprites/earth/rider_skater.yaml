# A RIDER — the person on one of the road's two-wheelers, drawn SEATED and on a
# canvas of their own so the machine can lose them. Seated rather than standing
# because that is how they are seen for the whole of their life on this road;
# what happens after they leave the saddle is the gore system's business, and it
# cuts THIS art up to do it (slicedPiece).
name: rider_skater
family: earth
space: outside
size: [16, 16]
description: >
  A skateboarder riding the board — knees bent, both arms out for balance, a beanie and a loose mustard shirt.
subject:
  kind: rider on the road out
  build: an adult standing side-on with knees bent and both arms out level for balance
  features: a beanie, one arm forward and one back, weight low over the board
  accent: the mustard shirt
  flavor: nowhere to be, straight through the traffic to get there
palette:
  O: "#1a1c2c" # outline ink
  H: "#4a5570" # shirt highlight
  P: "#b07a55" # helmet plum
  K: "#b07a55" # hand
  C: "#d9a52e" # jacket / top
  S: "#f2cd72" # top panel
  T: "#4d5468" # trousers
  B: "#1f1d28" # shoes
