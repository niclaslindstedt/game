# THE TOWN — one of the buildings lining the road on the drive to GOODCO.
# AUTHORED ALREADY CROPPED: the camera is low and the road fills the middle of
# the frame, so a house is only ever seen from its doorstep to about its first
# floor. The grid starts partway up the building and the top row is a flat cut —
# drawing roofs would spend half of every sprite off the top of the screen.
name: town_apartment_block
family: earth
space: outside
size: [40, 30]
description: >
  The bottom of a walk-up apartment block, cut off mid-storey — grey render, a grid of windows, a recessed entrance.
subject:
  kind: town backdrop building
  build: the lower storeys of a walk-up block, cropped mid-storey
  features: a regular grid of small windows, a recessed doorway, a render skirt
  accent: a scatter of lit and dark windows
  flavor: forty doors, and the lights are on behind nine of them
palette:
  O: "#1a1c2c" # outline ink
  t: "#4a4235" # sill and trim
  p: "#6a6a63" # pavement
  L: "#f2d98a" # a window still lit
  K: "#232838" # a dark window
  P: "#7a6a52" # boarded up
  A: "#6d707a" # render wall
  a: "#878b96" # render wall, lit edge
  n: "#55575f" # render course line
