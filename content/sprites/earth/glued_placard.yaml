# ONE OF THE GLUED — see glued_cross_legged.yaml for the naming rule. The board
# carries MARKS rather than letters: at sixteen pixels a legible slogan is four
# grey smudges, and what they are actually saying is said in the bubble over
# their head instead (pwa/src/game/drive-screen/placards.ts).
name: glued_placard
family: earth
size: [16, 16]
description: >
  A demonstrator sitting in the road holding a hand-lettered board up on a
  stick.
subject:
  kind: demonstrator glued to the road
  build: a person seated in the lower right of the frame with one arm raised holding a stick, and a pale rectangular board filling the upper left
  attire: a green jacket over dark trousers
  features: a cardboard board on a stick, hand-lettered in a dark marker that reads as writing without being any
  accent: the pale board, which is the brightest thing on this road at night
  flavor: the board is doing the work the hero is not reading, which is the entire scene in one prop
  pose: seated, one arm up holding the board
palette:
  O: "#1a1c2c" # outline
  P: "#f0cbaa" # skin
  G: "#4f8f4a" # green jacket
  T: "#3a3444" # dark trousers
  W: "#e0dccb" # cardboard board
  K: "#2c2536" # marker pen
  S: "#8a7358" # the stick
grid: |
