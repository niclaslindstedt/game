  .OWWWWWWWO......
  .OWKKKKWWO......
  .OWWKKKKWO......
  .OWKKKWWWO......
  .OOOOOOOOO......
  ....OSO.........
  ....OSO.OOOO....
  ....OSO.OPPO....
  ...OPPO.OPPO....
  ...OPO.OOGGGO...
  ...OPOOOGGGGO...
  ...OOGGGGGGGO...
