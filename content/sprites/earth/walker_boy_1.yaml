# THE CROWD — one of the people out on the road to GOODCO, the ones the welfare
# did not reach. Walk-cycle frame 1.
#
# Built from one of six shared SILHOUETTE templates (adult, reaching, stooped,
# child, skirt, pusher, plus the two seated ones), so every body in the roster
# stands on the same ground line and reads at the same scale — a crowd whose
# members do not share a ground line reads as a bug rather than as a crowd.
name: walker_boy_1
family: earth
size: [16, 16]
description: >
  A boy in a yellow shirt and blue shorts, far too small for this road. Walk-cycle frame 1.
subject:
  kind: pedestrian on the road out
  build: a child, a head and a half shorter than the adults
  attire: a yellow shirt and blue shorts
  features: a mop of untidy brown hair
  accent: the yellow shirt
  flavor: nobody is holding his hand
  pose: mid-stride, the legs passing
palette:
  O: "#1a1c2c" # outline
  A: "#d8b84a" # sleeve
  B: "#2a2733" # trainers
  C: "#d8b84a" # yellow shirt
  H: "#6b4a2e" # untidy brown hair
  K: "#deaa86" # hand
  P: "#deaa86" # skin
  S: "#efd882" # shirt panel
  T: "#4a6b8a" # blue shorts
