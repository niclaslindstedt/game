# A TWO-WHEELER on the drive to GOODCO, drawn SIDE ON with nose to the RIGHT and
# with NOBODY ON IT. The rider is a sprite of their own (rider_*), seated on this
# one by the renderer — because a person baked into the machine cannot be thrown
# off it, and being thrown off it is the whole point of these.
name: traffic_scooter
family: earth
space: outside
size: [48, 26]
description: >
  A step-through scooter seen side on with nobody on it — a mint bodywork panel over small wheels, a legshield and a flat floorpan.
subject:
  kind: traffic vehicle prop, riderless
  build: a small step-through scooter, one continuous bodywork panel from the legshield back over the rear wheel, with a low flat floorpan between
  features: a tall legshield with a mirror stalk, a flat floorpan you can see between the wheels, small wheels, a rear body pod carrying the engine
  accent: mint green bodywork
  flavor: drawn with nobody on it, because the person is thrown off it
palette:
  O: "#1a1c2c" # outline ink
  k: "#0a0910" # tyre
  b: "#3f4553" # dark metal, seat, engine cases
  A: "#8d9196" # bare chrome and alloy
  v: "#6b7185" # saddle highlight
  T: "#c0c5cf" # wheel rim
  y: "#e8d9a8" # headlamp
  r: "#d84a3a" # tail lamp
  B: "#4fbfa0" # mint bodywork
  s: "#8fe3cb" # bodywork highlight
  d: "#2a7566" # bodywork shadow
