  O: "#1a1c2c" # outline ink
  t: "#4a4235" # sill and trim
  p: "#6a6a63" # pavement
  L: "#f2d98a" # a window still lit
  K: "#232838" # a dark window
  P: "#7a6a52" # boarded up
  A: "#8a4a3c" # brick wall
  a: "#a55f4c" # brick wall, lit edge
  n: "#6b392e" # brick course line
