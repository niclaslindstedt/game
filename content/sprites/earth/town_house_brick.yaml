# THE TOWN — one of the buildings lining the road on the drive to GOODCO.
# AUTHORED ALREADY CROPPED: the camera is low and the road fills the middle of
# the frame, so a house is only ever seen from its doorstep to about its first
# floor. The grid starts partway up the building and the top row is a flat cut —
# drawing roofs would spend half of every sprite off the top of the screen.
name: town_house_brick
family: earth
space: outside
size: [40, 30]
description: >
  A squat brick house on the road out, cut off above the first floor — dark red brick, a boarded window and a heavy door.
subject:
  kind: town backdrop building
  build: a squat brick house front, cropped just above the first floor
  features: coursed brickwork, one boarded window, a heavy panelled door, a stone step
  accent: pale boards nailed over one window
  flavor: this one stopped answering the door months ago
