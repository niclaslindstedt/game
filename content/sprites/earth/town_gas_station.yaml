# THE TOWN — one of the buildings lining the road on the drive to GOODCO.
# AUTHORED ALREADY CROPPED: the camera is low and the road fills the middle of
# the frame, so a house is only ever seen from its doorstep to about its first
# floor. The grid starts partway up the building and the top row is a flat cut —
# drawing roofs would spend half of every sprite off the top of the screen.
name: town_gas_station
family: earth
space: outside
size: [40, 30]
description: >
  A closed filling station on the road out — a canopy edge overhead, two pumps under it and a dark kiosk window.
subject:
  kind: town backdrop building
  build: a small filling station kiosk with a canopy edge overhead, cropped at the canopy
  features: a canopy fascia band, two fuel pumps, a dark kiosk window, an empty price board
  accent: the washed-out red canopy band
  flavor: the price board still says what petrol cost when the plant was open
palette:
  O: "#1a1c2c" # outline ink
  t: "#4a4235" # sill and trim
  p: "#6a6a63" # pavement
  L: "#f2d98a" # a window still lit
  K: "#232838" # a dark window
  P: "#7a6a52" # boarded up
  A: "#8d8f96" # kiosk panel wall
  a: "#a7a9b0" # kiosk panel wall, lit edge
  n: "#6d6f75" # kiosk panel course line
  F: "#b8483f" # canopy fascia
  U: "#42474f" # pump body
