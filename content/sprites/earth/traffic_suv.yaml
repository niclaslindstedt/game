# TRAFFIC — one of the cars sharing the road on the drive to GOODCO, and the
# same table that dresses the GOODCO car park. Drawn SIDE ON on the 48x26 canvas
# the hero's own car assembly uses (`car_*` — src/game/vehicles.ts), with the
# sills and wheels stamped from the shared chassis so nothing drifts between
# variants; what tells these apart is the silhouette ABOVE the sills.
name: traffic_suv
family: earth
space: outside
size: [48, 26]
description: >
  A tall boxy SUV seen side on — dark green, a high upright glasshouse over slab sides and a roof rack.
subject:
  kind: traffic vehicle prop
  build: a tall, boxy sport-utility seen side on, upright glasshouse over slab sides
  features: a roof rail, three side windows, a high beltline, chunky wheel arches
  accent: dark forest green
  flavor: school run, four wheel drive, never once off the tarmac
palette:
  O: "#1a1c2c" # outline ink
  b: "#3f4553" # dark trim, tyre tread, shut lines
  k: "#0a0910" # cabin glass and tyre
  c: "#7fd0d8" # light streaking off the glass
  r: "#d84a3a" # tail lamp
  y: "#e8d9a8" # headlamp
  T: "#c0c5cf" # hubcap steel
  G: "#171d2b" # cabin glass
  H: "#25304a" # sky caught in the top of the glass
  B: "#3c6b46" # forest green body paint
  s: "#589a66" # body highlight
  d: "#254a2e" # sill shadow
