# THE CROWD — one of the people out on the road to GOODCO, the ones the welfare
# did not reach. Walk-cycle frame 1.
#
# Built from one of six shared SILHOUETTE templates (adult, reaching, stooped,
# child, skirt, pusher, plus the two seated ones), so every body in the roster
# stands on the same ground line and reads at the same scale — a crowd whose
# members do not share a ground line reads as a bug rather than as a crowd.
name: walker_crutches_1
family: earth
size: [16, 16]
description: >
  A woman in a mustard coat swinging along on a crutch. Walk-cycle frame 1.
subject:
  kind: pedestrian on the road out
  build: a woman putting her weight through a crutch
  attire: a mustard coat over dark trousers
  features: a crutch under the far arm, one leg held short
  accent: the pale crutch
  flavor: halfway across when the lights changed
  pose: mid-stride, the legs passing
palette:
  O: "#1a1c2c" # outline
  A: "#c9963f" # sleeve
  B: "#241f2c" # shoes
  C: "#c9963f" # mustard coat
