# A RIDER — the person on one of the road's two-wheelers, drawn SEATED and on a
# canvas of their own so the machine can lose them. Seated rather than standing
# because that is how they are seen for the whole of their life on this road;
# what happens after they leave the saddle is the gore system's business, and it
# cuts THIS art up to do it (slicedPiece).
name: rider_delivery
family: earth
space: outside
size: [16, 16]
description: >
  A food-delivery rider leaning forward with one hand up to the phone — an amber jacket under a plum helmet, a strap running back to the hot-box.
subject:
  kind: rider on the road out
  build: a seated adult leaning forward over the bars, knees tight in behind the legshield
  features: an open-face helmet, one arm up to a phone on a stalk, a strap running back
  accent: the amber jacket
  flavor: eleven minutes left on the drop and this is the fastest way through
