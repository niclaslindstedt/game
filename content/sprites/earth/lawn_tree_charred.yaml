name: lawn_tree_charred
family: earth
plane: floor
size: [26, 28]
description: >
  The same garden tree after a rocket has been lit beside it — the crown still
  the same shape, its leaves scorched dry brown and burnt through in three
  places where the ground shows past it.
subject:
  kind: solid obstacle prop
  build: the same round scalloped crown as the green tree, with three holes eaten through the canopy well inside the rim
  features: dry curled brown foliage darkening to burnt black on the shaded side, the trunk still standing at the south gap
  accent: scorched straw brown on the lit side against burnt black opposite
  flavor: it kept its shape; nothing on it is alive
palette:
  B: "#4a3520" # trunk, scorched
  E: "#241a12" # trunk char
  F: "#42381f" # scorched leaf
  L: "#5c4c30" # scorched leaf, sun side
  O: "#1a1c2c" # outline
  d: "#1a150e" # burnt through
  f: "#2c2418" # burnt leaf
