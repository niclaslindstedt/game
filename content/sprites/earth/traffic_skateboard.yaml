# A TWO-WHEELER on the drive to GOODCO, drawn SIDE ON with nose to the RIGHT and
# with NOBODY ON IT. The rider is a sprite of their own (rider_*), seated on this
# one by the renderer — because a person baked into the machine cannot be thrown
# off it, and being thrown off it is the whole point of these.
name: traffic_skateboard
family: earth
space: outside
size: [48, 26]
description: >
  A skateboard seen side on with nobody on it — a concave maple deck with a kicked tail, on four small hard wheels.
subject:
  kind: traffic vehicle prop, riderless
  build: a skateboard lying flat on its wheels, the deck kicked up at both ends
  features: a deck with a kicked nose and tail, two trucks, four small hard wheels, grip tape on top
  accent: maple deck with a red underside
  flavor: three kilos of wood, and the only thing between somebody and the tarmac
palette:
  O: "#1a1c2c" # outline ink
  k: "#0a0910" # tyre
  b: "#3f4553" # dark metal, seat, engine cases
  B: "#c04a3c" # deck underside red
  d: "#7a2a22" # bodywork shadow
  E: "#3a3630" # grip tape
  A: "#8d9196" # truck alloy
  T: "#c0c5cf" # wheel
