# TRAFFIC — one of the vehicles sharing the road on the drive to GOODCO, and
# the same table that dresses the GOODCO car park. Drawn SIDE ON, nose to the
# RIGHT, on the 48x26 canvas the whole fleet shares — but NOTHING else is
# shared: this model carries its own wheelbase, wheel size, ride height,
# overhangs and roofline, because a saloon and a box van that agree about any
# of those read as one silhouette with different paint.
name: traffic_electric
family: earth
space: outside
size: [48, 26]
description: >
  A smooth electric hatchback seen side on — pearl white, a closed blank nose, wheels pushed right out to the corners.
subject:
  kind: traffic vehicle prop
  build: a smooth one-box electric car with almost no overhang at either end and the wheels pushed out to the corners
  features: a blank closed-off nose with no grille, a flush glasshouse, an aero wheel cover rather than an open rim
  accent: pearl white with a black roof
  flavor: silent, which is the problem
palette:
  O: "#1a1c2c" # outline ink
  b: "#3f4553" # dark trim, tyre shadow, shut lines
  k: "#0a0910" # tyre
  c: "#7fd0d8" # light streaking off the glass
  r: "#d84a3a" # tail lamp
  y: "#e8d9a8" # headlamp
  T: "#c0c5cf" # wheel rim
  G: "#171d2b" # cabin glass
  H: "#25304a" # sky caught in the top of the glass
  B: "#e6e9ee" # pearl white body paint
  s: "#ffffff" # body highlight
  d: "#8f939c" # sill shadow
  v: "#2b2f3d" # black roof panel
