# TRAFFIC — one of the vehicles sharing the road on the drive to GOODCO, and
# the same table that dresses the GOODCO car park. Drawn SIDE ON, nose to the
# RIGHT, on the 48x26 canvas the whole fleet shares — but NOTHING else is
# shared: this model carries its own wheelbase, wheel size, ride height,
# overhangs and roofline, because a saloon and a box van that agree about any
# of those read as one silhouette with different paint.
name: traffic_police
family: earth
space: outside
size: [48, 26]
description: >
  A police cruiser seen side on — white over midnight blue, a light bar across the roof and a reflective flash along the doors.
subject:
  kind: traffic vehicle prop
  build: a big long-wheelbase patrol saloon, upright and plain, sitting slightly low on its springs
  features: a roof light bar in red and blue, a reflective flash along the doors, a spotlight at the windscreen pillar
  accent: white over midnight blue
  flavor: not coming for you, not today
palette:
  O: "#1a1c2c" # outline ink
  b: "#3f4553" # dark trim, tyre shadow, shut lines
  k: "#0a0910" # tyre
  c: "#7fd0d8" # light streaking off the glass
  r: "#d84a3a" # tail lamp
  y: "#e8d9a8" # headlamp
  T: "#c0c5cf" # wheel rim
  G: "#171d2b" # cabin glass
  H: "#25304a" # sky caught in the top of the glass
  B: "#e8ecf2" # patrol white body paint
  s: "#ffffff" # body highlight
  d: "#8e939e" # sill shadow
  J: "#22337a" # midnight blue lower body
  R: "#e04040" # red beacon
  j: "#3a63d8" # blue beacon
