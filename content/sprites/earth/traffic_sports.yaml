# TRAFFIC — one of the vehicles sharing the road on the drive to GOODCO, and
# the same table that dresses the GOODCO car park. Drawn SIDE ON, nose to the
# RIGHT, on the 48x26 canvas the whole fleet shares — but NOTHING else is
# shared: this model carries its own wheelbase, wheel size, ride height,
# overhangs and roofline, because a saloon and a box van that agree about any
# of those read as one silhouette with different paint.
name: traffic_sports
family: earth
space: outside
size: [48, 26]
description: >
  A low two-seat sports car seen side on — pillar-box red, a shallow cabin set far back over a very long bonnet, a deep front splitter.
subject:
  kind: traffic vehicle prop
  build: a very low, wide two-seater, the shallow cabin set right back over a long flat bonnet
  features: a hard-raked windscreen, a shallow side window, a deep front splitter and a ducktail
  accent: pillar-box red
  flavor: the one car on this road that is not going to work
palette:
  O: "#1a1c2c" # outline ink
  b: "#3f4553" # dark trim, tyre shadow, shut lines
  k: "#0a0910" # tyre
  c: "#7fd0d8" # light streaking off the glass
  r: "#d84a3a" # tail lamp
  y: "#e8d9a8" # headlamp
  T: "#c0c5cf" # wheel rim
  G: "#171d2b" # cabin glass
  H: "#25304a" # sky caught in the top of the glass
  B: "#c8342e" # pillar-box red body paint
  s: "#ec6f62" # body highlight
  d: "#7d1c1a" # sill shadow
