# THE CROWD — one of the people out on the road to GOODCO, the ones the welfare
# did not reach. Walk-cycle frame 1.
#
# Built from one of six shared SILHOUETTE templates (adult, reaching, stooped,
# child, skirt, pusher, plus the two seated ones), so every body in the roster
# stands on the same ground line and reads at the same scale — a crowd whose
# members do not share a ground line reads as a bug rather than as a crowd.
name: walker_trolley_1
family: earth
size: [16, 16]
description: >
  Someone leaning into a supermarket trolley with everything they own in it. Walk-cycle frame 1.
subject:
  kind: pedestrian on the road out
  build: a stooped figure pushing a loaded trolley
  attire: a layered brown coat
  features: both hands on the trolley handle, the basket piled high
  accent: the trolley's pale steel
  flavor: the whole estate in one basket
  pose: mid-stride, the legs passing
palette:
  O: "#1a1c2c" # outline
  A: "#5c4a38" # sleeve
  B: "#241f2c" # boots
  C: "#5c4a38" # layered brown coat
  G: "#9aa0aa" # the trolley
  H: "#7a6a58" # grey-brown hair
  K: "#7a4f36" # hand
  P: "#7a4f36" # skin
  S: "#74604a" # coat lining
  T: "#3f3a33" # trousers
