# A TWO-WHEELER on the drive to GOODCO, drawn SIDE ON with nose to the RIGHT and
# with NOBODY ON IT. The rider is a sprite of their own (rider_*), seated on this
# one by the renderer — because a person baked into the machine cannot be thrown
# off it, and being thrown off it is the whole point of these.
name: traffic_bicycle
family: earth
space: outside
size: [48, 26]
description: >
  A plain pedal bicycle seen side on with nobody on it — a slim steel diamond frame, thin spoked wheels, a saddle and dropped bars.
subject:
  kind: traffic vehicle prop, riderless
  build: an ordinary pedal bicycle, a slim diamond frame of thin tubes over two large thin wheels
  features: thin spoked wheels you can see the road through, a diamond frame, a saddle, dropped bars, a chain run
  accent: powder blue steel
  flavor: fourteen kilos, and about to meet sixteen hundred
palette:
  O: "#1a1c2c" # outline ink
  k: "#0a0910" # tyre
  b: "#3f4553" # dark metal, seat, engine cases
  A: "#8d9196" # bare chrome and alloy
  B: "#5f8fc4" # powder blue frame
  d: "#2a4a6b" # frame shadow
  s: "#8fb6e0" # frame highlight
  y: "#e8d9a8" # lamp
  r: "#d84a3a" # rear reflector
  T: "#c0c5cf" # wheel rim
