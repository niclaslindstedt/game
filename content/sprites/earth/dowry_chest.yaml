name: dowry_chest
family: earth
size: [18, 16]
description: >
  THE CACHE, rung four — a dowry chest older than the house it came out of. A
  high domed lid, two iron bands set well in off the corners, a diamond carved
  into the front panel and worn smooth by two centuries of hands, and a
  lockplate the size of a fist. It was packed for a wedding nobody alive
  attended and has been packed for somebody ever since.
subject:
  kind: "solid prop"
  build: "a large domed dowry chest standing on iron feet"
  features: "two heavy inset iron bands, brass caps at every corner, a diamond carved into the front panel, a fist-sized brass lockplate with a keyhole"
  accent: "warm old oak with pale grey ironwork and old brass"
  flavor: "packed for a wedding nobody alive attended, and packed for somebody ever since"
palette:
