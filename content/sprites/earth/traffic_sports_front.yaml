# CRASH ART — the same vehicle after somebody hit it at THIS end, and one of the
# three pictures every car on the road to GOODCO now has.
#
# WHY IT IS AUTHORED RATHER THAN DERIVED. A vehicle already earns a three-rung
# ladder of dented, de-glazed and folded art from its clean grid at build time
# (`scripts/asset-tools/wreck.mjs`), and that ladder is a TEXTURE: paint damage
# scattered over a silhouette that has not moved. There is a class of collision
# no amount of it can say — an end folded far enough that the body is BENT.
# That is this file.
#
# WHAT THE DEFORMATION IS, and it is the same one on every model in the fleet:
# the overhang outboard of the struck axle is gone, concertina'd into three px
# of folded steel so its shut lines and its lamp bunch into a crease; the whole
# body is sheared, so the roofline no longer runs parallel with the sill; the
# screen at that end is a hole; the lamp is a dark socket; and the WHEEL IS
# MISSING, because the sim throws it on the same blow (`shedEndWheel`,
# engine/game/drive/wheels.ts) — what is left is an open arch with a bare hub
# sitting in the bottom of it, on the road, so the car keeps its stance while
# plainly having lost the wheel.
#
# THE CABIN IS UNTOUCHED, which is what keeps it the same car. The renderer
# swaps the WHOLE body to this grid once the sim latches that end as stove in,
# and the turning-wheel and blood-on-the-glass overlays are derived from THIS
# picture rather than from the clean one — the fold has moved the surviving
# wheel and the windows, and an overlay struck from the clean grid would spin a
# disc in mid air where the torn-off wheel used to be.
name: traffic_sports_front
family: earth
space: outside
size: [48, 26]
description: >
  A very low, wide two-seater, the shallow cabin set right back over a long flat bonnet, written off at the front — the bonnet folded into a stub, the headlamp a dark socket, the windscreen gone, and the nose wheel torn off leaving an open arch with a bare hub on the road.
subject:
  kind: crashed traffic vehicle prop
  build: a very low, wide two-seater, the shallow cabin set right back over a long flat bonnet, with its front overhang folded away and that axle's wheel missing
  features: a shortened creased bonnet, a dark socket where the headlamp was, the windscreen blown out, a sheared roofline, an open wheel arch with a compact bare hub sitting on the road
  accent: pillar-box red, gone matt where the panel folded
  flavor: what is left of it after somebody met the nose of it
