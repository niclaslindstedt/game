  c: "#7fd0d8" # light streaking off the glass
  r: "#d84a3a" # tail lamp
  y: "#e8d9a8" # headlamp
  T: "#c0c5cf" # wheel rim
  G: "#171d2b" # cabin glass
  H: "#25304a" # sky caught in the top of the glass
  B: "#c8342e" # pillar-box red body paint
  s: "#ec6f62" # body highlight
  d: "#7d1c1a" # sill shadow
