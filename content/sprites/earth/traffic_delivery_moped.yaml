# A TWO-WHEELER on the drive to GOODCO, drawn SIDE ON with nose to the RIGHT and
# with NOBODY ON IT. The rider is a sprite of their own (rider_*), seated on this
# one by the renderer — because a person baked into the machine cannot be thrown
# off it, and being thrown off it is the whole point of these.
name: traffic_delivery_moped
family: earth
space: outside
size: [48, 26]
description: >
  A food-delivery moped seen side on with nobody on it — a slab insulated hot-box towering over the back of a small purple step-through.
subject:
  kind: traffic vehicle prop, riderless
  build: a small step-through moped almost hidden under an enormous cube-shaped insulated hot-box carried over its back wheel
  features: a cube hot-box standing a head above the saddle, a phone cradle on the bars, a legshield, tiny wheels
  accent: amber hot-box on a plum step-through
  flavor: on the pavement, on the wrong side, on your bumper
palette:
  O: "#1a1c2c" # outline ink
  k: "#0a0910" # tyre
  b: "#3f4553" # dark metal, seat, engine cases
  A: "#8d9196" # bare alloy — a wheel hub
  T: "#c0c5cf" # wheel rim
  y: "#e8d9a8" # headlamp
  r: "#d84a3a" # tail lamp
  B: "#6b3a8f" # plum bodywork
  s: "#9d68c2" # bodywork highlight
  d: "#42215c" # bodywork shadow
  o: "#e8952c" # insulated hot-box amber
  L: "#f7c377" # hot-box highlight
  g: "#8f5a1a" # hot-box shadow
