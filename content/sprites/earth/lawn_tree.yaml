name: lawn_tree
family: earth
plane: floor
size: [26, 28]
description: >
  A suburban garden tree seen from above — a broad scalloped crown lit on its
  top-left and falling to deep shade opposite, with the trunk showing where the
  canopy parts to the south.
subject:
  kind: solid obstacle prop
  build: a round scalloped crown seen from above, dense in the middle and broken into leaf masses at the rim
  features: the trunk showing through a gap at the south edge, and the crown coming apart into clumps rather than reading as one dome
  accent: sunlit leaf on the top-left against deep shade on the lower-right
  flavor: the tree that was on the lot before the ship was, and before anything had been lit next to it
palette:
  B: "#7c5433" # trunk
  E: "#4a3120" # trunk shadow
  F: "#3c6b33" # mid canopy
  L: "#6d9a4e" # sunlit leaf
  O: "#1a1c2c" # outline
  d: "#1f3a1d" # deep shade under the crown
  f: "#2c5027" # canopy shade
