# A TWO-WHEELER on the drive to GOODCO, drawn SIDE ON with nose to the RIGHT and
# with NOBODY ON IT. The rider is a sprite of their own (rider_*), seated on this
# one by the renderer — because a person baked into the machine cannot be thrown
# off it, and being thrown off it is the whole point of these.
name: traffic_ebike
family: earth
space: outside
size: [48, 26]
description: >
  An electric delivery bike seen side on with nobody on it — a black diamond frame with a battery down the tube, a crate over the rear wheel.
subject:
  kind: traffic vehicle prop, riderless
  build: a spindly electric bicycle, a diamond frame of thin tubes with a slab battery along the down tube and a delivery crate over the back wheel
  features: thin spoked wheels, a battery on the down tube, straight bars, a hub motor, and a rear rack carrying a square crate as tall again as the bike
  accent: a lime crate on a black frame
  flavor: drawn with nobody on it, because the person is thrown off it
palette:
  O: "#1a1c2c" # outline ink
  k: "#0a0910" # tyre
  b: "#3f4553" # dark metal, seat, engine cases
  A: "#8d9196" # bare chrome and alloy
  y: "#e8d9a8" # headlamp
  B: "#5f6880" # graphite frame
  d: "#33384a" # bodywork shadow
  l: "#9ad83e" # delivery crate lime
  L: "#c6f177" # crate highlight
  s: "#6f7688" # saddle highlight
  T: "#c0c5cf" # wheel rim
