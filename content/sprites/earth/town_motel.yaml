# THE TOWN — one of the buildings lining the road on the drive to GOODCO.
# AUTHORED ALREADY CROPPED: the camera is low and the road fills the middle of
# the frame, so a house is only ever seen from its doorstep to about its first
# floor. The grid starts partway up the building and the top row is a flat cut —
# drawing roofs would spend half of every sprite off the top of the screen.
name: town_motel
family: earth
space: outside
size: [40, 30]
description: >
  A roadside motel strip, cut off above the walkway — a run of numbered doors under a concrete balcony and a dead neon sign.
subject:
  kind: town backdrop building
  build: a low motel strip seen front on, a run of doors under a walkway, cropped above it
  features: a concrete walkway slab, a run of identical doors, a dead neon sign bracket
  accent: the unlit neon bracket
  flavor: weekly rates, and everybody here is on one
