# THE TOWN — one of the buildings lining the road on the drive to GOODCO.
# AUTHORED ALREADY CROPPED: the camera is low and the road fills the middle of
# the frame, so a house is only ever seen from its doorstep to about its first
# floor. The grid starts partway up the building and the top row is a flat cut —
# drawing roofs would spend half of every sprite off the top of the screen.
name: town_row_house
family: earth
space: outside
size: [40, 30]
description: >
  A narrow row house wedged between its neighbours, cut off above the door — peeling green paint and a single dark window.
subject:
  kind: town backdrop building
  build: a narrow terraced house front squeezed between neighbours, cropped above the door
  features: peeling painted render, one narrow window, a shared party wall each side
  accent: peeling sage green
  flavor: one of nine identical doors on this stretch
