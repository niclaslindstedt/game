# THE TOWN — one of the buildings lining the road on the drive to GOODCO.
# AUTHORED ALREADY CROPPED: the camera is low and the road fills the middle of
# the frame, so a house is only ever seen from its doorstep to about its first
# floor. The grid starts partway up the building and the top row is a flat cut —
# drawing roofs would spend half of every sprite off the top of the screen.
name: town_house_clapboard
family: earth
space: outside
size: [40, 30]
description: >
  A two-storey clapboard house on the road out, cut off above the upper windows — pale boards, two lit windows upstairs, a screen door at street level.
subject:
  kind: town backdrop building
  build: a narrow two-storey house front, cropped above the upper windows
  features: horizontal board siding, two upper windows, a screen door and a porch step
  accent: one warm lit window upstairs
  flavor: somebody in there still got their welfare
