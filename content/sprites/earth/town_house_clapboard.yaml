  O: "#1a1c2c" # outline ink
  t: "#4a4235" # sill and trim
  p: "#6a6a63" # pavement
  L: "#f2d98a" # a window still lit
  K: "#232838" # a dark window
  P: "#7a6a52" # boarded up
  A: "#b9a887" # clapboard wall
  a: "#d4c5a6" # clapboard wall, lit edge
  n: "#908369" # clapboard course line
