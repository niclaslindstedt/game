# A RIDER — the person on one of the road's two-wheelers, drawn SEATED and on a
# canvas of their own so the machine can lose them. Seated rather than standing
# because that is how they are seen for the whole of their life on this road;
# what happens after they leave the saddle is the gore system's business, and it
# cuts THIS art up to do it (slicedPiece).
name: rider_biker
family: earth
space: outside
size: [16, 16]
description: >
  A motorcyclist seated and hunched forward onto the bars — black leathers with a red shoulder flash, a white full-face helmet.
subject:
  kind: rider on the road out
  build: a seated adult hunched forward, hips back and knees folded up in front
  features: a full-face helmet with a dark visor, one arm reaching down to the bars
  accent: the white helmet
  flavor: the only one out here wearing anything protective
palette:
  O: "#1a1c2c" # outline ink
  W: "#e8ecf2" # helmet white
  G: "#171d2b" # dark visor
  C: "#33384a" # jacket / top
  S: "#d84a3a" # top panel
  T: "#2a2e3c" # trousers
  B: "#1f1d28" # shoes
  A: "#262a3a" # sleeve, a stop under the jacket so the arm reads off the body
  K: "#b07a55" # hand
