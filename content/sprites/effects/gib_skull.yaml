name: gib_skull
family: effects
size: [8, 8]
description: >
  A bare skull, stripped by the blow that took it.
subject:
  kind: gore piece
  build: a pale domed cranium with two black sockets, a row of teeth below them and a wet red ring where the neck tore away
  flavor: what a cut through the neck spills that the fleshy heads cannot — the piece that says the blade reached BONE. It BOUNCES; it is bone
