name: flame_smoke_1
family: effects
size: [14, 14]
description: >
  The second smoke off a flamethrower's gout — the puff has climbed and rolled
  out to half again its size, its rim gone soft and pale where it is dragging
  on the air.
subject:
  kind: effect
  build: a billowed puff of smoke half again the first one's size, rolling as it climbs
  features: a near-black core, a grey shoulder and a pale ragged rim, solid through the middle — smoke covers what is behind it
  accent: the pale dragging rim
  pose: mid-air, climbing off the spent flame
  flavor: the shape a gout leaves hanging over ground it has already crossed
palette:
  k: "#3a3a44" # dense smoke core
  g: "#5a5a66" # grey shoulder
  h: "#9aa0b0" # pale dragging rim, catching the fire under it
