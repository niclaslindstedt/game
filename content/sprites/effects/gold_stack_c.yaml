name: gold_stack_c
family: effects
size: [13, 9]
description: >
  A low heap of coins with a single coin standing on its edge beside it — one rung of the gold
  pile ladder (config GOLD.pileTiers), which is how a player reads what a pile
  is worth from across the room.
subject:
  kind: pickup
  build: a low heap of coins with a single coin standing on its edge beside it
  accent: warm gold lit from the upper left, shading to old brass underneath
  flavor: a short stack that stayed standing, with strays around it
palette:
  O: "#1a1c2c" # dark rim
  q: "#96762e" # old brass, the shadowed underside
  o: "#d6a842" # mid gold
  h: "#e2c640" # gold face
  y: "#ffb02e" # warm inner gold
  Y: "#ffe3b6" # pale highlight
grid: |
  ..........OO.
  .........OYyO
  ...OO....OhyO
  ..OYYhyO.OqqO
  .OOhyyhOO.OO.
  .OYhqooqhyOO.
  OYhyoooooqhyO
  OqqqqqqqqqqqO
  .OOOOOOOOOOO.
