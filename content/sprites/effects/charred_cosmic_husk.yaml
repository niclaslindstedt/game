name: charred_cosmic_husk
family: effects
size: [16, 16]
description: >
  A rift-thing has nothing in it for a fire to burn, so what is left is the
  dark it was wrapped around — a collapsed husk of void inside a cracked violet
  shell, shedding ash that is already going out.
subject:
  kind: aftermath effect
  build: a broken ring of violet shell parted at the crown, holding a hollow of pure void, with a fine drift of ash falling out of the underside of it
  accent: two last white sparks caught inside the dark
  flavor: it leaves nothing, because light goes out where a body would have lain there
palette:
  O: "#1a1c2c" # void — the dark it was wrapped around
  m: "#6a3a8c" # dimmed violet shell
  P: "#b05cdc" # deep violet
  W: "#f4f4f4" # a last white spark
  a: "#574f80" # ash already going out
