name: gold_heap_a
family: effects
size: [16, 11]
description: >
  A tall rounded heap of coins filling the frame, its slopes banded with the rims of individual coins — one rung of the gold
  pile ladder (config GOLD.pileTiers), which is how a player reads what a pile
  is worth from across the room.
subject:
  kind: pickup
  build: a tall rounded heap of coins filling the frame, its slopes banded with the rims of individual coins
  accent: warm gold lit from the upper left, shading to old brass underneath
  flavor: an elite's takings, all of it on the floor at once
