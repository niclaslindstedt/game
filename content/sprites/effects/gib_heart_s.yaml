name: gib_heart_s
family: effects
size: [4, 4]
description: >
  A heart, whole and still wet. Drawn small, for the
  16-20 px bodies.
subject:
  kind: gore piece
  build: a dark plum-red muscle, rounded and heavy, with two pale vessels cut off at the top and a bright wet highlight beside them
  flavor: darker than every other gib on purpose — it is the piece that reads as something that was WORKING a moment ago, and it BOUNCES, because a heart is muscle rather than pudding
palette:
  d: "#a82c2c" # blood midtone
  i: "#772020" # clotted blood
  y: "#e8c49a" # fat
grid: |
  .di.
  diyd
  diid
  .dd.
