name: gold_heap_b
family: effects
size: [16, 11]
description: >
  A heap of coins piled steeply on one side and sloping away to a long low tail on the other — one rung of the gold
  pile ladder (config GOLD.pileTiers), which is how a player reads what a pile
  is worth from across the room.
subject:
  kind: pickup
  build: a heap of coins piled steeply on one side and sloping away to a long low tail on the other
  accent: warm gold lit from the upper left, shading to old brass underneath
  flavor: a heap that came down in two, and neither half is small
palette:
  O: "#1a1c2c" # dark rim
  q: "#96762e" # old brass, the shadowed underside
  o: "#d6a842" # mid gold
  h: "#e2c640" # gold face
  y: "#ffb02e" # warm inner gold
  Y: "#ffe3b6" # pale highlight
grid: |
