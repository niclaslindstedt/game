name: effects
ground: moon_0
style: >
  Transient combat VFX — bright saturated flashes, sparks, and bursts with no
  fixed material, reading as pure light against the action.
palette:
  Q: "#60f0d0"
  e: "#5ab4ff"
  s: "#d6f0ff"
animations:
  angel_fly: { frames: [angel_0, angel_1], delayMs: 200 }
# Sprites whose isolated pixels are AUTHORED, not accidental — the orphan-pixel
# check skips them (see scripts/generate-assets.mjs).
# Sprites whose isolated pixels are AUTHORED, not accidental — the orphan-pixel
# check skips them (see scripts/generate-assets.mjs). Deliberately NOT the
# `blood_hit_*` ring: that one is compact, so a stray pixel in it is a slip.
# The ELITE TIER's conjured light is drawn to DISSOLVE at its edges — it is not
# an object with an outline, it is something a mob called up, and every solid
# thing in this game is built on a near-black rim precisely so that light can be
# told apart from matter by not having one. The edge-contrast check exists to
# catch a sprite whose outline vanishes into the ground, which is the opposite
# problem; and neither of these is ever drawn alone in the first place — both
# ride a baked glow and are re-hued onto their caster's own kit
# (render/elite-fx.ts), so the neutral grey the check measures is not a colour
# any player ever sees.
# A gout's SMOKE is the same case one step further: it is not an object either,
# it is a translucent volume drawn OVER a cone of fire at a third alpha, and it
# is the one part of a gout deliberately painted with plain alpha rather than
# additively (smoke covers, fire adds). Forcing it to out-contrast grey regolith
# would make it a solid grey blob, which is the opposite of smoke — and it is
# never on screen without the flames under it lighting it from beneath, which is
# exactly what its pale rim is drawn for.
contrastExempt:
  [
    elite_mote,
    elite_bolt,
    elite_snare_0,
    elite_snare_1,
    flame_smoke_0,
    flame_smoke_1,
    flame_smoke_2,
  ]
speckleExempt:
  # The SNARE's weave is a lattice with gaps in it — an open mesh whose loose
  # threads are the drawing. Its last frame is mostly loose threads by design:
  # a snare lets go by coming apart.
  - elite_snare_0
  - elite_snare_1
  # The soak ladder's first rungs and the trail's drying prints ARE freckles —
  # a scatter of unjoined marks is exactly what "it has only just started" and
  # "the boot is running out" look like.
  - blood_coat_chest_0
  - blood_coat_offhand_0
  - blood_coat_offhand_1
  - blood_coat_offhand_2
  - blood_coat_weapon_0
  - blood_coat_weapon_1
  - blood_coat_weapon_2
  - blood_coat_chest_1
  - blood_coat_feet_0
  - blood_coat_feet_1
  - blood_coat_head_0
  - blood_coat_head_1
  - blood_coat_head_2
  - blood_coat_legs_0
  - blood_coat_legs_1
  - blood_coat_legs_2
  - blood_coat_chest_2
  - blood_coat_feet_2
  - blood_print_h1
  - blood_print_v1
  - blood_burst_0
  - blood_burst_1
  - blood_burst_2
  # THE ROAD'S OWN MARKS. Every one of these is a mess laid down flat on tarmac
  # by something travelling at speed, and the loose pixels are the drops FLUNG
  # CLEAR of it — a smear whose every pixel touched its neighbour would be a
  # painted stripe, which is what a decal looks like and not what a body being
  # dragged looks like. Same authored-speckle case as the burst above.
  - gib_road_smear_1
  - gib_road_smear_2
  - gib_road_splat_0
  - gib_road_splat_1
  - gib_road_paste_0
  - gib_road_paste_1
  - blood_fringe_h
  - blood_fringe_v
  - blood_tile_0a
  - blood_tile_0b
  - blood_tile_1a
  - blood_tile_1b
  - blood_tile_2a
  - blood_tile_2b
  - blood_tile_3a
  - blood_tile_3b
