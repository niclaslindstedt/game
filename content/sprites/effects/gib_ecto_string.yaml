name: gib_ecto_string
family: effects
size: [5, 8]
description: >-
  A trailing string of ectoplasm.
subject:
  kind: gore piece
  build: >-
    a thin kinked rope of goo hanging down its own length, brighter where
    it catches the light and dark in each bend
  flavor: >-
    what a haunting has instead of intestines, and it falls like them
palette:
  C: "#5b858c" # ecto shadow
  c: "#8cd7a0" # ecto goo
  n: "#b9e6cd" # ecto highlight
grid: |
  ..nc.
  ..cc.
  .ncc.
  .cCc.
  cCc..
  cCc..
  .cc..
  ..c..
