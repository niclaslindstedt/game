name: laser_bloom
family: effects
size: [16, 16]
description: >
  The bloom where a spectral beam leaves its source: a white-hot lens with a
  pale halo and four cyan spikes running out along the axes, brightest at the
  centre and thinning to points.
subject:
  kind: effect
  build: a round white core inside a pale halo, with four straight spikes on the axes
  features: a white-hot lens fading outward through pale blue to cyan spike tips
  accent: the cyan spikes
  pose: centred on the point the beam is fired from
  flavor: the flare on a dead man's visor the instant he looks at you
palette:
  Q: "#60f0d0" # cyan spike
  W: "#f4f4f4" # white-hot lens
  s: "#d6f0ff" # pale halo
