name: gib_ecto_shard
family: effects
size: [5, 7]
description: >-
  A splinter of ectoplasm gone hard.
subject:
  kind: gore piece
  build: >-
    a long straight sliver frozen out of the goo, white-blue along one
    edge and green-dark along the other
  flavor: >-
    a ghost's answer to a bone shard — it BOUNCES where the goo sticks,
    which is what tells the two apart
palette:
  C: "#5b858c" # ecto shadow
  c: "#8cd7a0" # ecto goo
  n: "#b9e6cd" # ecto highlight
  x: "#c5e6eb" # cold light
grid: |
  ..xn.
  .xnc.
  .xnc.
  xncC.
  xncC.
  .ncC.
  ..cC.
