name: blood_coat_offhand_2
family: effects
size: [16, 16]
description: >
  The hero's off arm drenched — the shield face and the arm behind it
  sheeted over, running off the bottom rim in clotted rivulets.
subject:
  kind: >-
    body-soak overlay, off-hand zone
  build: >-
    near-total coverage of the LEFT edge rows, wet and bright across the top
    of the shield face, darkening through a midtone band to clotted along its
    lower rim, with two uneven rivulets hanging below it and a ragged rather
    than straight lower edge
  flavor: >-
    the top rung of the second arm's soak ladder — he has been holding it up
    all map and it shows
palette:
