name: charred_ecto_mask
family: effects
size: [16, 16]
description: >
  A haunting burned down to the face it was wearing — the hollow mask lying in
  a spreading puddle of its own cooling goo.
subject:
  kind: aftermath effect
  build: a hollow face shell of scorched goo, dark sockets and an open mouth, sitting in a wide flat puddle of drained green goo that has run out around it
  accent: two pale cold sparks still alive down in the puddle
  flavor: the only piece of a haunting that was ever recognisably somebody, and now it is lying in the rest of it
palette:
  O: "#111d1a" # scorched char outline
  g: "#3f6b55" # drained ecto, gone dull
  c: "#6fae86" # ecto goo, what is left of it
  C: "#2c4f45" # the hollow behind the face
  n: "#a8f0bc" # a cold spark still guttering
