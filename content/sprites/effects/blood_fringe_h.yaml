name: blood_fringe_h
family: effects
size: [24, 24]
description: >
  The edge of a soaked patch of floor meeting cleaner ground, fading toward the RIGHT.
subject:
  kind: ground tile overlay
  build: a transparent interior, then a scalloped wandering lip of solid clotted blood, then droplets thinning away to nothing across the right side
  flavor: what a pool's RIM looks like; drawn on any cell that is much bloodier than the neighbour it faces, so a soaked area frays into the clean floor instead of stopping on the cell edge
