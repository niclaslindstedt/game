name: flame_smoke_2
family: effects
size: [16, 16]
description: >
  The last smoke off a flamethrower's gout — blown hollow: the middle has thinned
  out to nothing and what is left is a pale ragged ring on its way to being air
  again.
subject:
  kind: effect
  build: a wide hollow ring of thinning smoke, its middle blown clean through
  features: a pale grey ring with the last dark clinging to its inner face, open in the middle — the ground shows through it
  accent: the hole in the middle
  pose: mid-air, at the top of its climb, thinning out
  flavor: the last thing there is to see that a fire was here
palette:
  k: "#3a3a44" # the last dark, on the ring's inner face
  g: "#5a5a66" # grey ring
  h: "#9aa0b0" # pale outer rim, catching the fire under it
