name: gold_pile_c
family: effects
size: [14, 9]
description: >
  A rounded pile of coins with one larger coin resting flat on its crown — one rung of the gold
  pile ladder (config GOLD.pileTiers), which is how a player reads what a pile
  is worth from across the room.
subject:
  kind: pickup
  build: a rounded pile of coins with one larger coin resting flat on its crown
  accent: warm gold lit from the upper left, shading to old brass underneath
  flavor: a pile with a good coin sitting on top of it
palette:
  O: "#1a1c2c" # dark rim
  q: "#96762e" # old brass, the shadowed underside
  o: "#d6a842" # mid gold
  h: "#e2c640" # gold face
  y: "#ffb02e" # warm inner gold
  Y: "#ffe3b6" # pale highlight
grid: |
  ...OOOOOO.....
  ..OYYhhyoO....
  ..OqhoooqO....
  ...OOOOOO.....
  ..OOhyyhOO....
  .OYhqooqhyOO..
  OYhyoooooqhyO.
  OqqqqqqqqqqqO.
  .OOOOOOOOOOO..
