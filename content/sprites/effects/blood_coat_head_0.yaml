name: blood_coat_head_0
family: effects
size: [16, 16]
description: >
  The first blood to reach the hero's head — a handful of flecks thrown back
  across his helmet and visor, masked to his own silhouette at draw time.
subject:
  kind: body-soak overlay, head zone
  build: five or six small marks of MIXED size — a lone pixel, two-pixel beads, one three-pixel streak — scattered across the helmet rows only, none of them touching, each wet at its top and clotting at its foot
  flavor: the first rung of the head's soak ladder; it must read as spray that LANDED on him, not as a wound of his own
palette:
  r: "#d83a3a" # wet blood
  d: "#a82c2c" # blood midtone
  i: "#772020" # clotted blood
