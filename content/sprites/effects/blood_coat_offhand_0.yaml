name: blood_coat_offhand_0
family: effects
size: [16, 16]
description: >
  The first blood on the hero's off arm — a few flecks over whatever he is
  carrying there and the forearm behind it, masked to his own silhouette at
  draw time.
subject:
  kind: >-
    body-soak overlay, off-hand zone
  build: >-
    five or six small marks of MIXED size scattered down the LEFT edge rows,
    over the face of a shield or the flap of a bag held there, none of them
    touching, each wet at its top and clotting at its foot
  flavor: >-
    the first rung of the second arm's soak ladder; what came back off the
    first thing he put between himself and them
palette:
  r: "#d83a3a" # wet blood
  d: "#a82c2c" # blood midtone
  i: "#772020" # clotted blood
