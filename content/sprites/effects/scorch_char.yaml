name: scorch_char
family: effects
size: [24, 20]
description: >
  A patch of floor a spectral beam burned through: mottled charred ground that
  breaks up into flecks at its edge rather than ending at a rim, cracked open in
  a few points of cold cyan light still burning underneath. Deliberately has NO
  outline — an outline would make it read as an object lying on the floor
  instead of as the floor itself being burnt.
subject:
  kind: ground scar
  build: a mottled soot patch, wider than it is tall, dissolving into speckle at its edge with no rim of its own
  features: a cooked-black core breaking up into dark slate flecks, cracked in a few points of cold light
  accent: the cyan cracks still burning under the char
  pose: lying flat on the ground
  flavor: what is left where a dead man's stare crossed the regolith
palette:
  Q: "#60f0d0" # cold cyan crack still burning
  b: "#3f4553" # scorched slate at the blot's rim
  k: "#342c26" # cooked-black core
