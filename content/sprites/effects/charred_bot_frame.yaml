name: charred_bot_frame
family: effects
size: [16, 16]
description: >
  A machine burned down to its armature — the plating gone, the bare frame
  still standing on its own struts with one optic somehow still lit.
subject:
  kind: aftermath effect
  build: a bare skeletal chassis standing upright — a head stalk on a neck strut, a shoulder bar, two hanging arm struts either side of a spine, and two leg struts on stub feet
  accent: one amber optic still burning in the empty head
  flavor: everything that made it look like anything burned off; the thing that was underneath is still on its feet
palette:
  O: "#15100f" # scorched char outline
  A: "#6e7278" # bare strut
  T: "#a9aeb6" # bright steel highlight
  y: "#ffb02e" # an optic still lit
