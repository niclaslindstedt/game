name: ammo_bullets
family: effects
size: [12, 12]
description: >
  The BULLETS pickup — cartridges lying loose on the ground, the near one whole
  and side-on: a brass case rounded by the light off its top, an extractor
  groove cut across its head, and a bullet drawn out to a point off the far end.
  Every firearm in the game eats these.
subject:
  kind: pickup
  build: two cartridges lying flat and side-on, the near one whole and the far
    one half hidden under it, each a straight brass case with a groove cut
    across its head at one end and a long pointed bullet drawn out of the other
  accent: warm brass throughout, lit along the top of each case
  flavor: somebody dropped a handful and did not stop to pick them up
palette:
  O: "#1a1c2c" # dark outline
  y: "#ffd27a" # lit brass and the bullet
  Y: "#c98b2a" # brass case
  q: "#96762e" # shaded brass underside
