name: elite_fissure_0
family: effects
plane: floor
size: [16, 16]
description: >
  A crack torn open in the ground by an elite's QUAKE LINE, just opened: a
  ragged split running corner to corner with the dark of the gap showing
  through and the ground broken back from both lips. Drawn in NEUTRAL GREYS so
  the renderer can re-hue it onto the caster's own kit, and on the FLOOR plane
  because a hole in the ground lies down.
subject:
  kind: effect
  build: a jagged split across a square of ground, wider at its middle
  features: a black gap, lips of broken ground either side, loose grit at the ends
  accent: the hot line down the centre of the gap
  pose: freshly opened, the ground still settling
  flavor: the mob did not move an inch; the floor did the walking
palette:
  O: "#0b0d14" # the dark of the gap
  W: "#f4f4f4" # the hot line in the throat
  d: "#4a5060" # broken lip, shadowed
  m: "#8a92a4" # broken lip, lit
