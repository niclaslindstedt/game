name: blood_tile_1a
family: effects
size: [16, 16]
description: >
  A patchily bloodied floor tile — several splats, some of them running off its
  edges.
subject:
  kind: ground tile overlay
  build: four or five splats ranging from a two-pixel bead to a six-pixel blot, wet red on their upper-left and clotted below, two of them broken by the tile edge so they can join a neighbour
  flavor: the second rung; this is where a bloodied patch starts to read as continuous ground rather than as separate marks
palette:
  r: "#d83a3a" # wet blood
  d: "#a82c2c" # blood midtone
  i: "#772020" # clotted blood
grid: |
  ...rd.......rd..
  ..rrdd.....rddi.
  ..rddi.....ddi..
  ...ii.......i...
  ................
  .....rrd........
  ....rddddi......
  ....rddii.......
  .....dii........
  ......i.........
  ..........rd....
  .........rrddi..
  rd.......rddi...
  di........ii....
  i.........d.....
  .......rd.......
