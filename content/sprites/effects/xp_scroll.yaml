  .OttttttttO.
  .OOOOOOOOOO.
  ..OEEEwwwO..
  ..OwwwwwwO..
  ..OEEEEwwO..
  ..OwwwwwwO..
  .OOOOOOOOOO.
  .OttttttttO.
  .OOOOOOOOOO.
  ............
