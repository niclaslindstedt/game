name: charred_bot_slag
family: effects
size: [16, 16]
description: >
  A machine that went all the way down — a wide pool of cooling slag with one
  piston still standing up out of it, unmelted.
subject:
  kind: aftermath effect
  build: a broad flat pool of oil-black slag with a grey crust across it, a single steel piston rod jutting straight up out of the middle
  accent: two amber coals still burning down in the pool
  flavor: the piston was the hardest thing in it, so the piston is the only thing left standing
palette:
  O: "#15100f" # scorched char outline
  A: "#6e7278" # crusted metal
  T: "#a9aeb6" # bright steel
  k: "#342c26" # cooling slag
  y: "#ffb02e" # coals down in the slag
