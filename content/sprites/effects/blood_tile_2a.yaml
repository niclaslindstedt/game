name: blood_tile_2a
family: effects
size: [24, 24]
description: >
  A heavily bloodied patch of floor, wider than the cell it belongs to.
subject:
  kind: ground tile overlay
  build: a lopsided blob of blood WIDER THAN THE TILE IT BELONGS TO, dense midtone with a clotted dark core, torn through by a few bare holes and thinning to a scattered, feathered rim
  flavor: the third rung of the saturation ladder, and the first drawn OVERSIZED so it hangs past its cell — neighbouring cells then overlap and the tile grid stops being the outline of the mess
palette:
  r: "#d83a3a" # wet blood
  d: "#a82c2c" # blood midtone
  i: "#772020" # clotted blood
