  o: "#d6a842" # mid gold
  h: "#e2c640" # gold face
  y: "#ffb02e" # warm inner gold
  Y: "#ffe3b6" # pale highlight
  r: "#d83a3a" # ruby
  j: "#4054bc" # sapphire
  l: "#678f5d" # emerald
  W: "#f4f4f4" # the one white glint
