name: gold_hoard_a
family: effects
size: [18, 14]
description: >
  A great mound of coins with three short towers of stacked coins standing on its crown and loose gems catching the light in its slopes — one rung of the gold
  pile ladder (config GOLD.pileTiers), which is how a player reads what a pile
  is worth from across the room.
subject:
  kind: pickup
  build: a great mound of coins with three short towers of stacked coins standing on its crown and loose gems catching the light in its slopes
  accent: warm gold lit from the upper left, shading to old brass underneath
  flavor: what a boss was sitting on, out on the floor where anyone can take it
