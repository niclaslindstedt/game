  build: >-
    a broken run of blood down the upper-right diagonal, wet along its top edge and clotting below, thickest at the far end and petering out toward the grip
  flavor: >-
    the middle rung of the weapon's soak ladder; it has been used; it is masked to the weapon's own silhouette at draw time, so it must
    read along the DIAGONAL a held icon lies on rather than filling the cell
