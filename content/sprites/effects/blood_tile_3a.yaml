name: blood_tile_3a
family: effects
size: [24, 24]
description: >
  A patch of floor soaked through, spilling well past the cell it belongs to.
subject:
  kind: ground tile overlay
  build: an oversized blob almost entirely clotted dark blood, a thin midtone skirt, and a scattered feathered rim; hangs well past its cell on every side
  flavor: the top rung, laid only where a cell is surrounded on all EIGHT sides — the rim cells of a mess draw the holed rung below, so the eye never meets a straight edge
palette:
  d: "#a82c2c" # blood midtone
  i: "#772020" # clotted blood
