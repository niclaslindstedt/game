name: elite_fissure_1
family: effects
plane: floor
size: [16, 16]
description: >
  A crack torn open in the ground by an elite's QUAKE LINE, settling: the gap
  has closed to a thinner seam, its hot line gone out, and the broken ground
  either side has slumped back. The second half of the pair — a fissure fades
  by CLOSING rather than by going transparent, so the ground reads as ground
  again rather than as a hole somebody turned the opacity down on.
subject:
  kind: effect
  build: a narrower jagged seam across a square of ground
  features: a dark seam with slumped lips either side and scattered grit
  accent: none — the heat has gone out of it
  pose: settling, a few seconds after it opened
  flavor: it will still turn an ankle
palette:
  O: "#0b0d14" # the dark of the seam
  d: "#4a5060" # slumped lip, shadowed
  m: "#8a92a4" # slumped lip, lit
