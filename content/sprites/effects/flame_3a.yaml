name: flame_3a
family: effects
size: [14, 14]
description: >
  THE COOL — the fourth stage of a flamethrower's gout: the white is gone, the
  ball is at its biggest and its dullest, and the first deep-ember dark is
  creeping in along the underside.
subject:
  kind: effect
  build: the largest ball of the four, its heat spent outward into its own size
  features: a small yellow remnant in a red-orange body, deep ember dark gathering below, no outline — it is light, not matter
  accent: the red-orange body going dark at its foot
  pose: mid-air, at the far end of the cone
  flavor: still hot enough to hurt, and visibly on its way out
palette:
  Y: "#ffe08a" # the last yellow
  o: "#ff9a3c" # orange remnant
  r: "#e0451f" # red-orange body
  d: "#8a2412" # deep ember dark
