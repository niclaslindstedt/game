name: blood_coat_weapon_0
family: effects
size: [12, 12]
description: >
  The first blood on the blade — one rung of the coat masked onto whatever the hero is
  holding, so a blade that has been through a crowd looks like it.
subject:
  kind: held-weapon soak overlay
  build: >-
    three or four small marks of MIXED size along the upper-right diagonal where the business end of a held weapon lies, none of them touching, each wet at its top and clotting at its foot
  flavor: >-
    the first rung of the weapon's soak ladder; what one body leaves on an edge; it is masked to the weapon's own silhouette at draw time, so it must
    read along the DIAGONAL a held icon lies on rather than filling the cell
palette:
  r: "#d83a3a" # wet blood
  d: "#a82c2c" # blood midtone
  i: "#772020" # clotted blood
