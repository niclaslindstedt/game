name: gold_coins_a
family: effects
size: [12, 6]
description: >
  Two small round coins lying flat on the ground, well apart, one above and left of the other — one rung of the gold
  pile ladder (config GOLD.pileTiers), which is how a player reads what a pile
  is worth from across the room.
subject:
  kind: pickup
  build: two small round coins lying flat on the ground, well apart, one above and left of the other
  accent: warm gold lit from the upper left, shading to old brass underneath
  flavor: two coins, thrown clear of a body and left where they fell
palette:
  O: "#1a1c2c" # dark rim
  q: "#96762e" # old brass, the shadowed underside
  o: "#d6a842" # mid gold
  h: "#e2c640" # gold face
  y: "#ffb02e" # warm inner gold
  Y: "#ffe3b6" # pale highlight
  W: "#f4f4f4" # the glint off a milled edge
grid: |
  .OOOO.......
  OYWhyO.OOOO.
  OhyyhOOYWhyO
  OqqqqOOhyyhO
  .OOOO.OqqqqO
  .......OOOO.
