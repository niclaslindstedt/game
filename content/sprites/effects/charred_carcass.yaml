name: charred_carcass
family: effects
size: [16, 16]
description: >
  What a burned BEAST leaves — a long low carcass seen from the side: horned
  skull at one end, an arched spine, ribs hanging under it and four leg bones
  planted where it dropped.
subject:
  kind: aftermath effect
  build: a scorched four-legged carcass in side view — a long snouted skull with a single horn, an arched spine running back from it, a row of hanging ribs, and four stubby leg bones
  accent: one ember-orange eye socket still glowing in the skull
  flavor: a cranium full of human teeth was never in a thing that walked on four legs
palette:
  O: "#15100f" # scorched char outline
  b: "#b8b0a0" # dirty bone
  w: "#e7e0d0" # bone highlight
  e: "#ff6a1e" # ember glow
