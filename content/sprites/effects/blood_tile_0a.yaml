name: blood_tile_0a
family: effects
size: [16, 16]
description: >
  The lightest tread of blood over one floor tile — a few scattered specks well
  inside its edges.
subject:
  kind: ground tile overlay
  build: six or seven tiny marks of MIXED size — a lone pixel, two-pixel beads, one four-pixel blob — spread thinly across an otherwise empty cell, each lit at its upper-left and clotting below, none of them touching an edge
  flavor: the first rung of the saturation ladder; a tile the spray only just reached, so it must read as an island rather than joining its neighbours
palette:
  r: "#d83a3a" # wet blood
  d: "#a82c2c" # blood midtone
  i: "#772020" # clotted blood
