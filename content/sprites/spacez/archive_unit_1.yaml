name: archive_unit_1
family: spacez
size: [16, 16]
description: >
  The records terminal with its readout scrolled a line and the stamp arm lifted a pixel — the second frame of its idle.
subject:
  kind: neutral machine — the floor's records terminal
  name: "ARCHIVE UNIT"
  build: a boxy cabinet the height of a man, riding low on rubber treads
  attire: SpaceZ facility grey with a black service stripe
  features: the readout scrolled on a line, the same instruction again
  accent: the stamp arm lifted a fraction, ready and never used
  pose: idle, treads shifted a pixel on the spot
  flavor: eleven years of standing by an instruction nobody withdrew
