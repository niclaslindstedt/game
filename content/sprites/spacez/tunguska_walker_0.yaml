description: >
  TUNGUSKA WALKER, a hellborn horror: a tall striding figure made of flattened
  charred forest — a trunk-like body of black scorched wood, splayed branch arms,
  a crown of snapped timber, and a hollow chest that glows blast-orange.
subject:
  kind: hellborn elite-sized minion
  name: TUNGUSKA WALKER
  build: a tall striding column of flattened charred treetrunks
