# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# The PLAYER-THOUGHT catalog — the hero's own inner monologues, played through
# the dialogue box when a level's `firstKillThoughts` (the first time he kills a
# given enemy there) or `firstSightThoughts` (the first time one comes into view)
# fires. Unlike an elite's arrival scene there is no speaker on the board: the
# box shows the hero's face and his private read on what he just saw.
#
# Compiled to `engine/generated/thoughts.ts` by `scripts/generate-story.mjs`
# (folded into `make levels` / `make assets`); the engine reads it through
# `engine/game/defs/thoughts.ts`, which owns the TYPES. Adding a beat is an entry
# here plus a reference to its id from a level — no engine changes.
#
#   speaker      name shown in the dialogue header — always "{HERO}", the name
#                the player gave this character (see engine/game/hero-name.ts);
#                the same token may go INSIDE a line somebody says to him, and
#                docs/game-content.md says who is allowed to
#   portrait     portrait sprite family; the overlay draws frame `<portrait>_0`
#   pages        what he thinks: one entry per page, and a page is ONE string —
#                the box flows it into whatever column it has (a second string
#                is an EXPLICIT line break, spent only where the beat is)
#
# `capRotation` at the foot is the RECURRING cap-farm monologue, in rotation
# order — the engine cycles it one per firing so a hero farming an out-levelled
# map hears a fresh variation rather than the same line on repeat.
#
# THE LINES ARE GOVERNED BY THE STORY CHAIN: `docs/story.md` is the ground
# truth, `docs/manuscript.md` the verbatim script, and this file plays it. A
# line changed here without the manuscript is drift. (A MOD's story is its own —
# see mod/FORMAT.md.)

thoughts:
  # HOME, AND THE ERRAND THAT STARTS HERE. The hub's ARRIVAL beat
  # (`placeThoughts`, `where: arrival`) — the first live tick the hero ever has
  # in his own bay, after the prelude and after the doorstep monologue. The
  # monologue is the establishing shot ("home, the lawn is dead"); this is the
  # to-do, and it is the only thing in the game that tells a new player what the
  # car is FOR. It names the errand and the vehicle and nothing else: the rocket
  # and the seam are two chapters away and must not be mentioned. Portrait is
  # "hero" (unsuited — he is at home). Read once, ever.
  #
  # AND THE ERRAND IS A PERSON, NOT A PART. He is not driving an hour to fetch
  # a component that a coincidence happens to have put in the same building as
  # his girlfriend; the jacket he put a beacon in the lining of is answering
  # from GOODCO's campus, and that is the whole of the reason he gets in the
  # car. What is in
  # the vault is something he finds out about after he is inside and she is
  # already gone.
  garage_take_the_car:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - HER JACKET'S STILL ANSWERING. IT'S COMING FROM GOODCO. THE CAR'S RIGHT THERE, I'LL TAKE THE CAR.
  # …AND THE SAME ERRAND, SAID LESS KINDLY. The hub's on-foot beat
  # (`placeThoughts`, `where: pastDoor`): he has walked out under the roll-up
  # door on his own two feet and left the car standing in the bay. It is the
  # only nudge in the game a player earns by ignoring one — so it is short, it
  # is dry, and it says the stake out loud rather than the mechanic. He is not
  # going to GOODCO for a part, he is going for ADA. Read
  # once, ever, and never while he is at the wheel (the car crosses this same
  # threshold on its way out).
  garage_on_foot:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - WHAT AM I DOING, WALKING. SHE'S NOT DOWN THE STREET. THE CAR. TAKE THE CAR.
  # ── THE DRIVE TO GOODCO (engine/game/drive/) ─────────────────────────────────
  # The earthbound leg, played rather than cut. These are NOT pinned by a level:
  # the drive is not a level, so the app plays them off the road's own beats
  # (`DriveEvent`) rather than through `placeThoughts`.
  #
  # THE SHAPE OF THE SET IS THE JOKE, and it only works if nothing is added
  # between the ends of it. He says what he thinks of the people BEFORE he meets
  # any, and afterwards he reports on the ROAD SURFACE, the CAR, the CLOCK, the
  # OTHER DRIVERS and the COUNCIL'S LIGHTING — the four things a man notices on
  # a commute, and not one of them a person. A line acknowledging a body would
  # turn the bit from a joke into a confession, so there isn't one, and there
  # must never be one.
  #
  # ONE PLACE, AND EVERY LINE IN THE SET IS BARKED over a car that keeps moving —
  # nothing on that screen stops for him to talk. The `drive_arrive_*` VERDICT is
  # not a beat of its own: the drive picks one (`driveVerdict`) and the RUN-IN
  # says it folded into the front of the place's own line, as one breath — ROUGH
  # RIDE. THERE'S GOODCO. So the whole of what he made of the trip is said at the
  # wheel, and the venue on the far side of the black opens on its own briefing
  # with nothing of the road left over.
  #
  # WHAT HE IS DOING OUT HERE, said on the OUTSKIRTS — before the town, before
  # the crowd, on a road with nothing on either side of it. Two pages and they do
  # two different jobs. The first is the errand, which is the only time in the
  # whole leg the player is told why any of this is happening. The second is his
  # opinion of the people he is about to drive through, and it is the sourest
  # thing he says in the game: they beg, and — he is quite clear on this — they
  # did not get what he got. He is on the welfare. He is a man with nothing being
  # smug at people with less, seconds before he starts killing them at a hundred
  # and twenty, and he will never mention either half again.
  #
  # BOTH PAGES ARE SHORT AND THAT IS A CONSTRAINT, NOT A STYLE. The outskirts are
  # about ten seconds of road (`DRIVE.opening`) and the wheel is not even his for
  # the first nine of them, and that road is as long as it is BECAUSE these two
  # pages are on it — the approach is the wagon's slide into frame, plus both
  # pages read out, plus the second the hand-over owns. So a page that grows here
  # is a page read over the crowd it is only funny said BEFORE, and
  # `tests/drive_bark_test.ts` fails rather than letting one land there. It was
  # half as long again and overran the box it is barked in on a phone, which put
  # a "there's more" arrow on a window nothing on this screen can press.
  drive_out_welfare:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - HER JACKET'S PINGING FROM GOODCO.
      - - THEY BEG HARD IN TOWN. NONE OF THEM'S ON THE WELFARE. NOT LIKE ME.
  # …AND THE SAME OPENING FROM A MAN WHO CAME OFF HIS OWN DRIVE OVER SOMEBODY
  # (`ruth_run_down`, below). The first page is untouched — the errand has not
  # changed — and the second, the one where he has an opinion about people who
  # beg, is replaced by the only subject he ever actually has: the car. He is
  # not covering anything up. He genuinely has not joined it up, and he is
  # already on the road where he will say nothing about anybody at all.
  drive_out_bump:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - HER JACKET'S PINGING FROM GOODCO.
      - - FRONT END'S PULLING. MUST'VE GONE OVER SOMETHING BACK THERE.
  # WHAT HE SAYS WHEN THE WAGON GOES OVER ADA'S MOTHER ON HIS OWN DRIVEWAY, and
  # it is the whole of it: three words, no answer, and the run carries on.
  #
  # THE DEALER GETS NOTHING AT ALL when the same car takes him, which is the
  # bar this had to clear without going over it. A man who knows the person
  # under his wheels cannot say nothing — the silence would read as the game
  # not having noticed rather than as him not having — but anything he works
  # out is a different character. So he notices something happened, does not
  # look, and drives to GOODCO. The campaign remembers even though he does not
  # (`QuestGiverDef.runDown.flag`).
  ruth_run_down:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - WHAT WAS THAT?
  # …AND THE SAME ROAD GOING THE OTHER WAY, said on the outskirt between
  # GOODCO's gate and the first house — which is the stretch the leg out
  # finishes on, driven backwards.
  #
  # HE DOES NOT MENTION THE PEOPLE, AND THAT IS THE WHOLE POINT OF THESE TWO
  # PAGES. The trip out spends its second page being smug at them; the trip
  # back, with the thing he wanted lying on the passenger seat, does not think
  # of them at all — and then drives through them again at a hundred and twenty.
  # A man who repeated his opinion of them on the way home would be a man who
  # had them on his mind. The absence is a worse joke than the line, and it is
  # the only version of the leg back that is not the leg out with the words
  # changed.
  #
  # The two pages mirror the outbound pair: the ERRAND, now finished, and then
  # the only other thing in his head. Neither of them is the town. The second
  # is also the launch scene's own caption said a night early — she only ever
  # needed one more part — which is what makes the fade at the end of this leg
  # land on a set-up rather than on a full stop.
  drive_home_errand:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - THE PART'S ON THE SEAT. STRAIGHT HOME.
      - - TEN YEARS I'VE BEEN BUILDING HER. AND SHE ONLY NEEDED THE ONE THING.
  # THE CAR GIVING UP ON THE ROAD. He blames the wagon, the way he blames the
  # road — never the thing that actually broke it.
  drive_broke_down:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - COME ON. COME ON. NOT TONIGHT.
  # ── THE RUN-IN ────────────────────────────────────────────────────────────
  # Past the finish line the clock stops, the town stops, and the wheel comes off
  # the player: the car rolls the last stretch on its own, past GOODCO's fence
  # with the data halls and the ship on its gantry standing behind them. ONE
  # line, barked exactly like the road's, and the only one on this
  # whole leg that is not about the car, the clock or the road surface.
  #
  # IT IS ALLOWED TO BE, and the reason is the reason the opening's are: there
  # is nobody in the picture. He is not failing to notice anybody here — there is
  # genuinely nobody left to notice, which is its own remark about the place.
  #
  # AND IT IS SAID WITH THE TRIP'S VERDICT IN FRONT OF IT (`arrivalLine`,
  # drive-screen/voice.ts): the two ids below are printed as ONE line, so what is
  # authored here is only the second half of it.
  #
  # THE SIGHT OF IT. Flat, and deliberately: a man arriving at work.
  drive_arrive_goodco:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - THERE'S GOODCO.
  # ── THE RUN-IN HOME ───────────────────────────────────────────────────────
  # The same beat at the other end of the same road, and GOODCO's site answered
  # in every particular: a timber fence instead of a palisade, two lamps on two
  # piers instead of floodlights on masts, a lawn with trees on it instead of a
  # poured apron and thirty staff cars, and a bungalow with one lit window and
  # the garage door still up. Standing on the grass beside that open door is his
  # own rocket, built out of scrap, about half the height of the one behind
  # GOODCO's fence. Nothing says so.
  #
  # AND HE IS ALLOWED ONE WARM LINE HERE — the only one in the whole minigame.
  # Out there he is flat because it is work; this is his own front gate with the
  # part in the car. Everything either side of it is still the man who files a
  # crowd under road surface, and that this is the beat he softens for is the
  # point.
  drive_arrive_home:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - HOME AT LAST. AND THERE SHE IS.
  # ── THE FLIGHT'S FOUR BEATS (`rocket-screen/voice.ts`) ────────────────────
  # Barks over a sky that keeps moving, one page each and short on purpose —
  # they are read while balancing an inverted pendulum. The flight REPLACES
  # the voyage cutscene when it is played (`begin.ts`), so the third beat
  # carries that scene's tracker fact from the pilot's seat; nobody hears it
  # twice. The first two are the whole of what the game ever says about WHERE
  # the trash goes — said flat, in passing, and never raised again.
  flight_up_junk:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - GOODCO MAKES THE EARTH CLEAN. NOBODY ASKS HOW. UP HERE, NOBODY HAS TO.
  flight_shell_clear:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - CLEAR. THE RICH LEFT BEFORE THE SKY SHUT. THE REST OF US LEARN TO STEER.
  flight_drop:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - HER TRACKER PINGS FROM THE MOON. NOBODY GOES THERE FOR CHIPS AND SODA.
  # …and the one line the landing earns. The trash line is the scorecard's
  # joke said out loud once, by the man who hauled it.
  flight_touchdown:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - DOWN. THE TRASH RODE UP HERE FOR FREE.
  # …AND THAT IS THE LAST THING EITHER ROAD SAYS. A leg ends on a FADE with the
  # wagon still rolling: the minigame never parks the car, never switches the
  # engine off and never stands the man on the tarmac to be looked at, because
  # the level on the other side of the black opens with the car already in a bay
  # and him beside it. Nor does he ask how to get in — GOODCO's answer is a GATE
  # with a lit guard box beside it, in plain sight from the level's first frame,
  # and a line asking about a door the player is looking at reads as the game
  # explaining its own map.
  # ── THE ARRIVAL VERDICT ───────────────────────────────────────────────────
  # Eight readings of one trip, in `driveVerdict`'s own priority order: the car
  # first, then the two kinds of somebody else's property, then the clock, and
  # only then — as road surface — the people.
  #
  # A FEW WORDS EACH, AND THE BREVITY IS THE JOKE RATHER THAN A BUDGET. He has
  # just spent an hour of his life driving through a town at a hundred and
  # twenty, and the whole review is three words said on the way past a fence:
  # the less he finds to say, the less he has noticed. A verdict that grew into
  # a sentence with a second clause on it would be a man REFLECTING, which is
  # the one thing he never does.
  #
  # IT IS ALSO ALL THE CLOCK ALLOWS. These are not spoken on their own: each one
  # is printed as the FIRST HALF of the run-in's line (`arrivalLine`,
  # drive-screen/voice.ts), which has from the sight of the place to the fade to
  # get itself typed (`DRIVE.arrival`). `tests/drive_bark_test.ts` holds every
  # verdict against both destinations and fails on one that outgrows the beat —
  # and the beat is the thing to move first, not the words (see the road's
  # opening, whose length is an OUTPUT of its two pages).
  #
  # ARRIVING, HAVING TOUCHED NOTHING AT ALL: not a person, not a car, not a
  # post, and the wagon unmarked. Very nearly unreachable, because the road is
  # laid down to make sure of it. Modest pride in his own driving, which is as
  # far as his reflection ever goes.
  drive_arrive_clean:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - NOT A MARK ON HER.
  # THE CAR BARELY MADE IT — said over a wagon with the bumper gone and one
  # wheel dragging. Sympathy for the only casualty he can see.
  drive_arrive_wreck:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - POOR OLD GIRL.
  # THE COUNCIL'S LIGHTING, flattened. Somebody else's property, which is the
  # one category of damage he has always been able to see — and note who it is
  # a complaint ABOUT.
  drive_arrive_posts:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - LAMPS TOO CLOSE TO THE KERB.
  # PAINT TRADED WITH HALF THE TRAFFIC.
  drive_arrive_cars:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - NOBODY OUT HERE CAN DRIVE.
  # UNUSUALLY GOOD TIME — the blackest of the eight, and the only one that comes
  # near the thing itself. Still deniably: he is talking about the traffic.
  drive_arrive_quick:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - GOOD RUN TONIGHT.
  # HAVING DAWDLED.
  drive_arrive_slow:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - TOOK MY TIME.
  # ARRIVING, HAVING HIT A FEW — the default when nothing else about the trip
  # was worth remarking on. The longest of the eight, because it is the one
  # where he is EXPLAINING rather than remarking.
  drive_arrive_some:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - ROADS ARE ROUGH OUT HERE.
  # ARRIVING, HAVING HIT A GREAT MANY — the line the whole minigame is built to
  # earn, and the shortest thing he says all night. He is talking about the
  # suspension.
  drive_arrive_bumpy:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - ROUGH RIDE.
  # THE SHIP HE CANNOT FLY YET. Tapping the rocket on the garage's back lawn
  # before GOODCO HQ has fallen plays this instead of the travel picker (the
  # door's `unready:` pin — see `LevelDef.travelDoors`). Two things it must do
  # and one it must not: say the ship is still unfinished, and say that the
  # trail is not pointing UP yet — she is an hour down the road, which is where
  # he is going and why the ship can wait — and NOT name the moon or Mars, which is the whole reason
  # the picker is withheld. He has not earned those roads and does not yet know
  # they are where the trail goes. Portrait is "hero" (unsuited — he is at
  # home), and unlike every other pinned beat it REPLAYS: it answers a tap, so
  # a player who tries the ship again next chapter gets the same answer.
  garage_ship_unfinished:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - IT'S STILL ONE PART SHORT. AND SHE ISN'T UP THERE ANYWAY. SHE'S AN HOUR DOWN THE ROAD.
  # THE WAY IN (the level's `arrivals` — engine/game/arrivals.ts). He lands on the
  # staff lot with the building in front of him and the fog over every inch of
  # its wall, and the first thing that happens is a car pulling in and somebody
  # getting out of it. This is his read on that, fired the moment they step out
  # — the beat has to say what to DO, because the door they are walking to is
  # keyed and nothing he carries opens it.
  #
  # AND IT ONLY CLAIMS WHAT HE ACTUALLY KNOWS. He was walked out of this place
  # years ago, so what still opens for him is not a thing he can vouch for — and
  # a man asserting it anyway is a man bragging about the company that fired
  # him. The one fact he owns is the badge he had for that gate and the moment
  # they took it off him, so that is the whole of what he says out here.
  goodco_follow_in:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - THAT'S THE NIGHT SHIFT CLOCKING ON. NOBODY'S TOLD THEM THE BUILDING IS SHUT TONIGHT.
      - - I HAD A BADGE FOR THAT GATE ONCE. NOT ANYMORE. SO I'LL WALK IN BEHIND SOMEBODY WHO STILL DOES.
  # …AND MISSING IT (the same level's `arrivals.missedThought`). The gate takes
  # the staffer who opened it and shuts behind them a second and a half later, so
  # a player who has not yet understood that the way in is a MOMENT watches it
  # open, close, and go back to being a wall. Nothing out there tells them which
  # of the two things just happened — "wait for the next one" or "that was never
  # the way in" — and the lot is deliberately quiet, so there is nothing else to
  # read either.
  #
  # So he says it, once, at the only moment it is true: he has watched somebody
  # go through and he is still on the tarmac. A player who took the moment is
  # inside the building and never hears it.
  goodco_missed_gate:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - THAT ONE'S IN AND I'M STILL OUT HERE. FINE — I'LL WAIT FOR THE NEXT AND WALK IN BEHIND THEM.
  # Sighting the first INTERN at GOODCO HQ: it's past midnight and the
  # building is packed like a product launch. He worked here — nights were
  # never staffed like this. Fires on view, before any blow (a sight pin),
  # and seeds the NIGHT MANAGER's reveal (the secret night shift) a few
  # rooms later. Portrait is "hero" (plain clothes) — the EVA suit is loot
  # he hasn't found yet; the overlay resolves it live regardless.
  goodco_staff:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - LOOK AT THIS PLACE. PAST MIDNIGHT, AND EVERY DESK'S MANNED. EVERY LAB LIT.
      - - WE NEVER RAN NIGHTS LIKE THIS. NOT ONCE IN TEN YEARS. SOMETHING'S GOT THEM ALL UP.
  # THE OPENING STRIKE IS THREE BLOWS, NOT ONE (the level's `openingStrike`
  # and its `warnings`), and these are its first two. A lone scientist breaks
  # from the pack and swings at him — and the hero, who walked in holstered
  # because this is where he used to work, does not swing back. He names the
  # man, tells the floor to stand down, says he does not want this. That is
  # the whole point of the beat: the horde on this map is his old colleagues,
  # and answering the first blow in the same tick would make him somebody who
  # came here to fight. He is not. They have to earn it, and they do — three
  # times.
  #
  # Portrait is "hero" (still unsuited at HQ) on all three. Weapon-agnostic on
  # purpose — the piece off the wall differs per difficulty.
  # AND THE MAN HITTING HIM ANSWERS BACK (`voice:` + `them:` pages) — which is
  # what keeps the scene from being the hero talking to himself about people
  # who never get a word in. He is not a monster and he is not hollowed out:
  # he has orders, he has a job he would like to keep, and he has been told
  # what is in this building and who is not allowed near it. Every reason he
  # gives is one the hero would have given, in the years before the same
  # machine walked HIM out of the same door — which is why the swing at the
  # end costs something.
  goodco_first_blow:
    speaker: "{HERO}"
    portrait: hero
    voice:
      speaker: LAB SCIENTIST
      portrait: scientist
    pages:
      - - A SCIENTIST JUST TOOK A SWING AT ME. BARELY FELT IT. I KNOW HIS FACE.
      - them:
          - YOU CAN'T BE IN HERE. NOBODY'S SUPPOSED TO BE IN HERE TONIGHT. PLEASE.
      - - WE ATE AT THE SAME TABLE FOR SIX YEARS. HEY. IT'S ME. LOOK AT ME.
  # Blow two. The refusal gets louder — and the line that has to land is that
  # he has never hit anyone, because everything he does for the rest of the
  # campaign is measured against it. The scientist's answer is worse than
  # not recognising him: he does, and it changes nothing. HE SAYS THE NAME
  # (`{HERO}` — the one the player entered on the NEW GAME screen), which is
  # the whole reason this beat is the campaign's first use of it: a stranger
  # would have swung at anybody, and a man who says your name and swings
  # anyway is what makes this floor a horde of people rather than of monsters.
  goodco_second_blow:
    speaker: "{HERO}"
    portrait: hero
    voice:
      speaker: LAB SCIENTIST
      portrait: scientist
    pages:
      - - HE SWUNG AGAIN. HARDER. AND THE WHOLE FLOOR IS TURNING ROUND TO WATCH.
      - them:
          - I KNOW WHO YOU ARE, {HERO}. THEY SAID NOBODY GETS PAST. I'VE GOT A JOB HERE. I'VE GOT A FAMILY.
      - - STAY BACK. PLEASE. I'VE NEVER HIT ANYBODY IN MY LIFE. DON'T.
  # Blow three: he hits back, and THIS is the beat that ARMS his weapon and
  # starts the game. It is an apology, not a boast — the old "good thing I
  # came armed" made the swing sound like the plan. The dry last page is the
  # joke the difficulty ladder writes for us: on EASY the thing he answers
  # with is grandpa's sawed-off, and the night shift finds that out at once.
  goodco_armed:
    speaker: "{HERO}"
    portrait: hero
    voice:
      speaker: LAB SCIENTIST
      portrait: scientist
    pages:
      - - THIRD TIME. HE ISN'T LISTENING. NOBODY ON THIS FLOOR IS LISTENING.
      - them:
          - WE ALL WANT TO KEEP OUR JOBS. YOU HAD ONE. YOU KNOW WHAT IT'S LIKE WHEN IT GOES.
      - - I'M SORRY. I TRIED TO ASK. SHE'S IN THIS BUILDING AND YOU'RE IN MY WAY.
      - - I GOT THIS FAR WITHOUT THROWING A PUNCH. I'M SORRY. I'M SORRY.
  # Sighting the first SUCCESSOR at GOODCO HQ: he was on the team that built
  # the first one, before the AI redrew the line (the CORE LOG's "IT DREW
  # THE SUCCESSOR LINE") and the machines started walking everyone's jobs out
  # the door — his own story in miniature. Now one is between him and Ada,
  # and the tables turn.
  goodco_successor:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - A SUCCESSOR. I HELPED BUILD THE FIRST ONE OF THOSE. THEN THEY REDREW IT WITHOUT US.
      - - THAT LINE PUT EVERYONE I KNOW OUT OF WORK. AND I HELPED BUILD IT. I KNOW HOW TO TAKE ONE APART, AT LEAST.
  # THE FIRST VOLUNTEER HE SEES (the level's `martyrs.thought`, fired the first
  # time one is actually in sight rather than somewhere in the fog). The read
  # has to do two jobs in two lines: tell the player what is strapped to the man
  # running at them, and place him — this is not staff, this is somebody off the
  # same street the hero came from, who took the same box and did something else
  # with it. The hero does not approve and does not condemn; he recognises.
  goodco_volunteer:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - THAT ONE'S NOT STAFF. THAT'S A WORK JACKET, AND THAT'S A VEST UNDER IT.
      - - HE GOT THE SAME BOX I DID. I DROVE HOME WITH MINE.
  # PAYLOAD-1 IS DOWN — the last beat of GOODCO, raised by the level's own
  # `exitByCar` the moment the objective clears (engine/game/step/index.ts).
  #
  # IT IS THE ONLY THOUGHT IN THE GAME THAT IS AN INSTRUCTION, and it is one
  # because the level stopped having a button. Every other venue ends on LEVEL
  # CLEAR; this one ends the way the story says it ends — he walks the building
  # back out through the gate, crosses the lot to the wagon he parked on it and
  # drives home, because the part is no use here and the ship it goes into is on
  # his own lawn. With no line at all the player is left standing on a cleared
  # floor with the horde gone and nothing telling them the run is not over.
  #
  # FLAT, AND IT NAMES THE REASON RATHER THAN THE FEELING. He has just killed
  # the thing that told him where she went; what he says about it is that he is
  # in the wrong building. That is the same man who filed a crowd on the road
  # under road surface.
  goodco_back_to_car:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - SHE WENT UP AN HOUR AGO AND I'M STANDING IN A FACTORY. THE SHIP'S AT HOME. I NEED TO GET BACK TO MY CAR.
  # Sighting the first wisp on the moon: the dead walking the dust is the
  # hero's first proof the broadcast history is a lie — somebody knew.
  moon_wisp_sight:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - IT CAME OUT OF THE DUST. IT'S NOT WEARING A SUIT. THERE AREN'T EVEN FOOTPRINTS.
      - - NOBODY EVER SAID THE MOON HAD DEAD PEOPLE ON IT. SOMEBODY MUST HAVE KNOWN.
  # Downing the first wisp: the payoff of the sighting beat above (its
  # `after` gate keeps this from ever playing first) — the dead can fall,
  # and that will have to be enough.
  moon_wisp_kill:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - OKAY. THEY GO DOWN LIKE ANYTHING ELSE. THAT'LL HAVE TO DO.
  # Killing the first SUCCESSOR on the moon: the night-shift tin men from GOODCO
  # HQ have followed the trail all the way up here — the conspiracy isn't just
  # shipping Ada moonward, it built a garrison to receive her.
  moon_successor:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - A GOODCO UNIT. UP HERE. THE SAME TIN MAN FROM THE NIGHT SHIFT, WALKING THE DUST.
      - - THEY DIDN'T JUST SHIP HER UP. THEY BUILT A STAFF TO MEET HER. ONE BOLT AT A TIME, THEN.
  # Killing the first scout rover on Mars: the tire tracks say the colony
  # has been running for years while everyone watched the moon.
  mars_rover:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - A ROVER. FRESH PAINT, WORN WHEELS. AND THE DUST IS FULL OF TIRE TRACKS. YEARS OF THEM.
      - - THE PLAQUE SAYS 'FOR ALL MANKIND'. THE FIRMWARE SAYS PROPERTY OF GOODCO. OF COURSE IT DOES.
  # Killing the first FEMBOT: the hero's read on the colony's... amenities.
  mars_fembot:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - ...IT BLEW ME A KISS. THE ROBOT. IN THE NIGHTGOWN. IT BLEW ME A KISS AND FIRED.
      - - WHO BUILDS A DOOMSDAY COLONY AND BUDGETS FOR THESE? ADA WILL THINK THIS IS HILARIOUS.
  # Sighting the first voidling in the rift: the hero's arrival read — he
  # is standing on nothing, and the nothing holds.
  rift_arrival:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - I'M WALKING ON NOTHING. NO GROUND. NO SKY. AND MY BOOTS DON'T SEEM TO CARE.
      - - NOTHING IN HERE WORKS THE WAY IT SHOULD. I'VE STOPPED ASKING. I JUST KEEP WALKING.
  # The first asteroid to land on the hero in the rift: the rock rain has
  # teeth, and he only learns it the hard way. Fires once, on the strike.
  rift_asteroid:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - SOMETHING CAME OUT OF THE DARK AND HIT LIKE A TRUCK. A ROCK. A FLYING ROCK.
      - - BETTER WATCH OUT FOR THESE ASTEROIDS. THEY HURT.
  # Downing the first graviton: the physics of this place, in one grudge.
  rift_graviton:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - THAT LITTLE THING WEIGHED MORE THAN MY SHIP. I'M NOT GOING TO THINK ABOUT IT TOO HARD.
      - - NOTED. DON'T STAND STILL. DON'T TRUST THE FLOOR. THERE ISN'T ONE.
  # Tapping the tear THE FOUNDER bolted through on MARS without having picked
  # his rig up off the ground. Pinned to a DOOR rather than to a mob (the
  # rocket's idiom), so it REPLAYS — it answers the tap, not a beat the player
  # is owed once — and its job is to send him back for the thing he stepped
  # over: a hole in the universe is not a door until you hold the handle.
  mars_tear_no_rig:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - IT'S STILL HANGING OPEN. BUT IT'S HIS HOLE, AND HE TOOK THE HANDLE WITH HIM - FIND IT.
  # Sighting the first COWBOT in Boot Hill: the drop-in arrival read — the
  # rift's far side is a wild-west theme park, and the town is a machine
  # pretending it's 1880. Wide radius so it lands as the town comes on
  # screen. Portrait is "hero" — the park is habitable, the EVA suit is
  # stowed (the level runs `heroSuited: false`).
  boot_hill_arrival:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - A COWBOY JUST TIPPED ITS HAT AT ME. SERVOS IN THE WRIST. TICKING IN THE JAW.
      - - THE WHOLE TOWN IS A MACHINE PLAYING AT 1880. ADA'S BEACON POINTS DOWN MAIN STREET.
  # Downing the first COWBOT: they're TRUST ME BRO hands — the same brain that took
  # his job back home, wearing spurs. The two-part beat orders itself with
  # `after` (see the town, then down a hand).
  boot_hill_hands:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - IT DIED APOLOGIZING. 'YOUR EXPERIENCE MATTERS TO US.'
      - - TRUST ME BRO HANDS. SAME OUTFIT THAT SAT AT MY BENCH, ONLY IN SPURS. I DON'T FEEL BAD ABOUT THESE.
  # Sighting the first CIA AGENT in THE BUNKER: the arrival read — the
  # security state didn't collapse with the economy, it just changed
  # employers and postcodes. Wide drop-in radius, like the other surveys.
  bunker_arrival:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - BLACK SUITS. EARPIECES. THE ALPHABET, ALL DOWN HERE, DRAWING A PRIVATE SALARY.
      - - THE WORLD LOST ITS JOBS. THESE ONES KEPT THEIRS. THEY'RE GUARDING THE PEOPLE WHO DID IT.
  # Sighting the first VACUUM BOT, once the arrival read has landed: the
  # housekeeping gag — even the cleaning staff got automated, and armed.
  bunker_vacuum:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - A VACUUM ROBOT. WITH A TASER ON IT. THE FLOORS ARE VERY CLEAN, I'LL SAY THAT.
      - - OF COURSE THEY AUTOMATED THE HELP. CAN'T HAVE A CLEANER WHO TALKS.
  # Sighting the first ICE AGENT in THE BUNKER, once the arrival read has
  # landed: the place has no address, but it has a border patrol — and for
  # once, the hero really is the illegal immigrant.
  bunker_ice:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - ICE. IN A BUNKER OUTSIDE THE UNIVERSE. STILL CHECKING PAPERS.
      - - TECHNICALLY I DID CROSS A BORDER WITHOUT ASKING. SEVERAL. COME AND DEPORT ME.
  # The RECURRING cap-farm mutters (see `CAP_THOUGHT_IDS` and `maybeCapThought`
  # in story.ts): once the hero has out-levelled a map — level ≥ its
  # `xpLevelCap`, so the kills barely pay anymore — he catches himself grinding
  # and remembers what he came for. Unlike every pinned beat above these are
  # NOT one-shot: the engine rotates through them and replays them on a
  # cooldown for as long as he keeps farming a capped map, so there are several
  # so it never reads like a broken record. Every one lands the same two beats
  # — these fights give me nothing now / go find Ada — in a different mood.
  cap_pathetic_1:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - THESE THINGS BARELY SLOW ME DOWN ANYMORE. I'M NOT LEARNING A THING OUT HERE.
      - - QUIT FARMING SCRAP, {HERO}. SHE'S STILL OUT THERE SOMEWHERE.
  cap_pathetic_2:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - PATHETIC. THEY LINE UP AND FALL OVER. I COULD DO THIS IN MY SLEEP.
      - - SHE'S BEEN GONE ALL NIGHT AND I'M OUT HERE HITTING THINGS. MOVE.
  cap_pathetic_3:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - I'VE WRUNG THIS PLACE DRY. NOTHING LEFT TO PROVE HERE.
      - - STOP CIRCLING. NONE OF THIS IS FINDING HER. GO ON.
  cap_pathetic_4:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - WHEN DID THIS GET EASY? THEY DON'T EVEN REGISTER. JUST NOISE ON THE WAY.
      - - THAT'S ENOUGH OF THAT. GO ON. GO AND FIND HER.
  cap_pathetic_5:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - I'M JUST HITTING THINGS NOW. NONE OF THIS IS FOR HER.
      - - SHE'S NOT IN HERE. FIND THE WAY OUT AND GET GOING.
  # ── HELLBORN FIRST SIGHTINGS (config HELLGATES) ───────────────────────────
  # The first time a rampage tears a hellgate open on a map and something
  # steps out of it, the run STOPS and the hero says the only honest thing
  # there is to say. These are his read on a horror that has nothing to do
  # with GOODCO, with Ada, or with anything he came here for — the campaign's
  # plot is a corporate kidnapping, and what the meter drags in is older than
  # the species that filed the paperwork. Each is pinned per map through
  # `firstSightThoughts`, so a nightmare run meets one read and a JESUS run
  # meets both. Portraits follow the map (plain clothes at HQ, the EVA suit
  # from the moon on) like every other beat.
  hellborn_tunguska:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - WHAT THE HELL IS THIS. IT'S BURNT ALL THE WAY THROUGH AND IT'S STILL WALKING.
      - - SIBERIA, NINETEEN-OH-EIGHT. THEY NEVER FOUND A CRATER. NOW I KNOW WHY.
  hellborn_investor:
    speaker: "{HERO}"
    portrait: hero
    pages:
      - - IT HAS A SEAL WHERE A FACE GOES, AND IT'S HOLDING A LEDGER.
      - - IT'S BEEN PAID EVERY TIME A MACHINE LEARNED A JOB AND A MAN WENT HOME. FOUR PLANETS SO FAR.
  hellborn_pharaoh:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - WHAT THE HELL IS THIS. THAT'S A KING, AND THERE ARE NO KINGS ON THE MOON.
      - - THE WRECK UNDER TRANQUILITY ISN'T A WRECK. IT'S A LID. AND WE PLANTED A FLAG ON IT.
  hellborn_drowned:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - IT'S DRIPPING. UP HERE. THERE'S NO WATER ON THE MOON - THERE NEVER WAS.
      - - EXCEPT THERE WAS. NINE HUNDRED YEARS OF IT, AND CREWS. THEY'RE STILL HOLDING THEIR BREATH.
  hellborn_olympus:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - WHAT THE HELL IS THIS. THAT'S NOT GOODCO. THAT'S NOT ANYBODY'S.
      - - OLYMPUS MONS ISN'T A VOLCANO. IT'S THE EXHAUST. AND IT'S STILL WARM.
  hellborn_shepherd:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - IT'S COUNTING. I CAN FEEL IT COUNTING ME. THE MARKS ON ITS HEAD KEEP MOVING.
      - - TWO MOONS AROUND A DEAD ROCK. THOSE AREN'T MOONS. THAT'S A FENCE, AND I'M INSIDE IT.
  hellborn_vanishing:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - WHAT THE HELL IS THIS. THERE'S NOTHING INSIDE IT. IT'S THE SHAPE OF A HOLE.
      - - EVERYONE IN HERE FELL IN AFTER IT. IT MADE THE DOOR ADA WAS CARRIED THROUGH.
  hellborn_ancestor:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - THE LIZARDS BOUGHT MY GIRL. THIS THING IS WHAT THEY PRAY TO.
      - - THEY LEASE WORLDS. IT ATE ITS OUTRIGHT. SEVEN OF THEM. ADA WAS ON THE ROAD THAT FEEDS IT.
  hellborn_noon:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - WHAT THE HELL IS THIS. IT'S GOT THE SUN WHERE ITS FACE SHOULD BE.
      - - IT WANTS THE OTHER END OF THE STREET, AND IT'S WANTED IT SINCE BEFORE THIS STREET.
  hellborn_ruin:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - STAKES AND WIRE AND A FLAG ON TOP. IT'S NOT ATTACKING. IT'S CLAIMING.
      - - EVERY FRONTIER THAT RAN OUT OF WEST HAD THIS AT THE END OF IT. THEY RANG THE DINNER BELL.
  hellborn_saint:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - WHAT THE HELL IS THIS. THERE'S SOMEBODY IN THE ICE AND THE ICE IS WALKING.
      - - THEY DIDN'T POUR A BUNKER TO KEEP THINGS OUT. THEY POURED ONE OVER THIS.
  hellborn_deadhand:
    speaker: "{HERO}"
    portrait: player
    pages:
      - - IT'S A HAND. JUST A HAND, WALKING, AND IT'S HOLDING A KEY DOWN.
      - - THEY NAMED THEIR DOOMSDAY SYSTEM AFTER IT. IT'S NEVER BEEN TOLD TO LET GO.

capRotation:
  - cap_pathetic_1
  - cap_pathetic_2
  - cap_pathetic_3
  - cap_pathetic_4
  - cap_pathetic_5
