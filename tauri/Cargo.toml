# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# The Tauri desktop shell — TWO crates, and the split is the whole design.
#
#   shell/      every DECISION the shell makes. No Tauri, no GUI, no window.
#   src-tauri/  every EFFECT: the window, the scheme, the IPC, the lifecycle.
#
# `cargo test -p adastrail-shell` therefore runs the entire decision layer on a
# machine with a Rust toolchain and nothing else installed — no WebKitGTK, no
# WebView2, no Xcode. That is what makes this tree's logic coverable on an
# ordinary CI runner, and it is the Rust-shaped version of the discipline the
# Electron shell keeps by hand (its window-state.ts takes the displays as an
# argument precisely so it needs no Electron).
#
# See ../README.md for the tree, and ../../docs/desktop-shells.md for how the
# two desktop wrappers are held against each other.

[workspace]
members = ["shell", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Niclas Lindstedt <niclas@agilator.se>"]
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A shipped game is built with optimizations and without the panic machinery a
# player can do nothing with: a panic in the shell is a bug report, not
# something to unwind through.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
