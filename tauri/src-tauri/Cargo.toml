# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# THE EFFECTS. Everything in this crate opens, draws or talks to something; the
# decisions behind all of it live in `adastrail-shell`, which knows nothing
# about Tauri. See ../Cargo.toml.

[package]
name = "adastrail-tauri"
description = "The Tauri desktop shell around the Ada's Trail website — one window, the bundled game, and the bridges the page speaks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# `adastrail` rather than the package name, so the executable, the user-data
# folder and the docs all say the same word.
[[bin]]
name = "adastrail"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adastrail-shell = { path = "../shell" }
serde = { workspace = true }
serde_json = { workspace = true }
# `image-png` is what lets a screenshot reach the CLIPBOARD: the clipboard takes
# an RGBA `tauri::image::Image`, and the page hands the shell a PNG. Without the
# feature `Image::from_bytes` does not exist, and SHARE would be a button that
# reveals a file and sends nothing.
tauri = { version = "2", features = ["image-png"] }
# The fatal-error box, and the one way a credit link reaches the player's own
# browser instead of replacing the game. Both are called from RUST only — they
# are deliberately absent from `capabilities/default.json`, so the page cannot
# reach either. `opener` also reveals a screenshot in the file manager.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# A SECOND COPY OF THE GAME would fight the first over the same save files and
# the same Steam session — and, worse, would swallow the `+connect_lobby` Steam
# hands a friend's "accept". Electron has `requestSingleInstanceLock` built in;
# this is its peer, and its callback is where an invite reaches a running game.
tauri-plugin-single-instance = "2"
# SHARE's other half: the picture on the clipboard, which is the part that
# actually sends it somewhere. Rust-only, like the two above.
tauri-plugin-clipboard-manager = "2"
# STEAM. The peer of `steamworks.js` on the Electron side, and a materially
# richer one: it binds ISteamScreenshots and the whole leaderboard surface,
# neither of which the Node binding has — see `shell/src/screenshots_provider.rs`
# and `shell/src/leaderboards_provider.rs` for what each of those changed.
#
# It vendors Valve's redistributable SDK, so `cargo build` needs no
# STEAM_SDK_LOCATION and no separate download — which is what keeps a checkout
# buildable with a Rust toolchain and the platform's webview libraries alone.
steamworks = "0.13"

# THE MICROPHONE GATE's Linux half. WebKitGTK raises `permission-request` on the
# webview and Tauri hands the handle out through `PlatformWebview::inner()`, so
# this is the one of the three desktops where the refusal is the OPERATING
# SYSTEM's rather than the page's — see `src/media.rs` for what covers the other
# two. The version tracks whatever `wry` links; Tauri says as much in its own
# docs for `with_webview`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_8"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
