# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# THE DECISION LAYER. Nothing in here may depend on `tauri`, on a GUI toolkit,
# or on a window existing — see ../Cargo.toml for why that is structural rather
# than a preference. A `tauri` dependency added here is the review comment.

[package]
name = "adastrail-shell"
description = "The Tauri desktop shell's decision layer — every choice it makes, with no GUI behind any of them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The page hands the shell a screenshot as base64 down a JSON pipe, and the
# bytes become a FILE. A pure-Rust decoder with no build script and no system
# library keeps this crate buildable on a machine with nothing installed, which
# is the property the whole two-crate split exists to protect.
base64 = "0.22"
# A MOD SOMEBODY WAS SENT ARRIVES AS A `.zip`, and the one compression method
# inside a real one is deflate. `rust_backend` is what keeps this crate free of
# a system library and a build script — the property the whole two-crate split
# exists to protect, so that `cargo test -p adastrail-shell` runs on a machine
# with nothing installed. See `mod_archive` for why the reader itself is ours.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
