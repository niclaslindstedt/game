# SPDX-License-Identifier: CC0-1.0
description: |-
  THE GREENHOUSE — a SpaceZ orbital seed vault, still running on a timer nobody
  reset. THE READ: one long hall down the middle with planting beds either side,
  so the fight is always a corridor with cover you can duck behind and never a
  field you get surrounded in. The hero lands at the airlock end and walks the
  length of it. THE POINT of this file, though, is to be the shortest level a
  mod can ship that still reads as a real venue — copy it and grow it.
campaign: true
id: greenhouse
index: 21
name: THE GREENHOUSE
foes: THE OVERGROWTH
# The scene this venue opens on, before the intro box — one of yours
# (cutscenes/greenhouse_arrival.yaml) or one of the game's. A list plays in
# order, which is how the campaign chains a departure and a flight.
prelude: greenhouse_arrival
width: 1800
height: 900
gravity: 340
biome: moon
# Either one of the game's track ids or one of your own — this mod ships its
# own score (music/greenhouse_hymn.yaml), and naming it here is all it takes.
music: greenhouse_hymn
tiles:
  ground:
    common: moon_0
    rare: moon_1
    rareEvery: 19
intro:
  - - THE VAULT IS STILL WARM.
    - SOMETHING IN HERE IS STILL
    - BEING FED.
  - - ADA'S BEACON CLIPPED THIS
    - ORBIT. SO I WALK IT.
playerSpawn:
  x: 180
  y: 450
objective:
  type: clearAll
# The planting beds: two rows of low walls down the hall, offset so the lane
# between them never runs straight for long.
obstacles:
  # `kind` names the SPRITE the prop is drawn as. A sized rock (`rockSizes`)
  # picks a footprint per placement and draws `<kind>_<w>x<h>` — which is why
  # the sizes are not optional decoration: without them this would ask the
  # atlas for a sprite called "moonrock", nothing would answer, and the map
  # would have eighteen invisible walls in it. `node scripts/level-render.mjs
  # <id> --mod <dir>` is what shows you that (see mod/AGENTS.md).
  - kind: moonrock
    count: 18
    radius: 8
    jumpable: false
    rockSizes:
      - [1, 1]
      - [1, 2]
      - [2, 2]
decor:
  - kind: rocks
    count: 12
decorClearance: 70
spawners:
  - id: airlock
    at: { x: 520, y: 450 }
    maxAlive: 8
    ramp: meek
    triggerRadius: 480
    lingering: 5
    members:
      - enemy: greenhouse_creeper
        count: 22
  - id: beds
    at: { x: 1050, y: 380 }
    maxAlive: 9
    ramp: bold
    triggerRadius: 460
    lingering: 5
    members:
      - enemy: greenhouse_creeper
        count: 26
      - enemy: wisp
        count: 10
  - id: vault
    at: { x: 1520, y: 470 }
    maxAlive: 10
    ramp: fierce
    triggerRadius: 460
    lingering: 4
    members:
      - enemy: greenhouse_creeper
        count: 24
      - enemy: ghost
        count: 12
spawns: []
# The hero's own read on the place, fired the first time a creeper comes into
# view (thoughts.yaml). `firstKillThoughts` is the same thing pinned to the kill.
firstSightThoughts:
  - enemy: greenhouse_creeper
    thought: greenhouse_creeper_sight
# A plot piece lying on the floor of the far bed: picking it up plays its lore
# (story-items.yaml). An elite can drop one instead, via `loot.storyItems`.
items:
  - kind: story
    defId: greenhouse_seed_log
    at: { x: 1560, y: 300 }
# The loot a venue pays out is a POOL of ids the base game already ships. A mod
# may name any of them — `mod/catalog.json` is the full list.
loot:
  # The pool a venue pays out has to FIT the band this map is priced at in
  # ladder.yaml (mob 12-19 here): a weapon far below it never gets retired by
  # the drop window and dominates every roll, which is what
  # `node scripts/weapon-stats.mjs --mod <dir>` warns about.
  weaponPool:
    - geology_hammer
    - plasma_blade
    - gladius
    - railgun
    - longbow
    - pulsar_rod
    - arc_projector
  gearPool:
    - mission_cap
    - flight_jacket
    - thermal_leggings
    - moon_boots
    - bag
  # The venue's WORLD RELIC table: what a `world: true` unique may drop from,
  # per difficulty rung. This is where this mod's own relic lives — a named
  # unique wired to nothing at all can never drop, which
  # `node scripts/unique-check.mjs --mod <dir>` is the check for.
  worldUniques:
    easy:
      - greenhouse_first_cutting
    medium:
      - greenhouse_first_cutting
    hard:
      - greenhouse_first_cutting
    nightmare:
      - greenhouse_first_cutting
    jesus:
      - greenhouse_first_cutting
  abilityPool:
    - fire_orbs
    - storm_cell
    - item_magnet
    # This mod's OWN power — a level may pool the game's powers and its own,
    # the same base ∪ mod rule every other cross-reference follows.
    - greenhouse_spore_bloom
