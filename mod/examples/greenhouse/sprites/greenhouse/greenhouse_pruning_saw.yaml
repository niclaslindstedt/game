# An ITEM ICON — one sprite, not a two-frame family. An item is drawn on its
# card, in the bag and lying on the ground, and never walks, so it needs no
# `_0`/`_1` pair the way a monster does.
name: greenhouse_pruning_saw
family: greenhouse
size: [16, 16]
description: >
  A curved pruning saw with a stained steel blade and a worn wooden grip, laid
  diagonally as an inventory icon.
subject:
  kind: item icon
  build: a curved saw blade on a short handle, lying corner to corner
  features: coarse teeth along the inner curve, a bound grip, a dull sheen
  accent: grey steel over dark wood
  flavor: garden tooling that has stopped being used on plants
palette:
  w: "#5a4028" # wood grip
  W: "#7a5836" # grip highlight
  s: "#8d939b" # steel blade
  S: "#c3cad2" # blade sheen
  t: "#6a7078" # tooth shadow
grid: |
