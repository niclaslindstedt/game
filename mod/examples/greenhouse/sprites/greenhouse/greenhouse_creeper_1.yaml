# Frame 1 — the other half of the walk. The body is identical; only the legs
# move, which is how every two-frame walker in this game is drawn. Keeping the
# torso pixel-identical between frames is what stops the sprite from appearing
# to wobble as it walks.
name: greenhouse_creeper_1
family: greenhouse
size: [16, 16]
description: >
  The creeper mid-stride: the same vine bundle with its legs swapped, one
  planted and one lifted.
subject:
  kind: monster
  build: a squat bundle of vine with two stumpy legs, mid-stride
  features: two glowing seed-pod eyes, curling tendrils off the shoulders
  accent: sickly luminous green over dark stem
  flavor: what the seed vault grew once nobody was left to prune it
palette:
  s: "#2f4a2a" # dark stem
  v: "#4d7a3c" # vine body
  l: "#6fa84f" # lit vine highlight
  e: "#c8f27a" # seed-pod eye glow
