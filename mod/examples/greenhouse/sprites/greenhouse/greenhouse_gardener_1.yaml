# Frame 1 — the same figure with the legs swapped and the secateurs dropped a
# row. Two frames is the whole of a walk cycle; the renderer alternates them by
# GROUND COVERED rather than on a timer, so she creeps when she creeps and runs
# when she runs without either frame knowing how fast she is meant to be going.
name: greenhouse_gardener_1
family: greenhouse
size: [16, 16]
description: >
  The gardener mid-stride, secateurs swinging low, her weight over the other
  foot.
subject:
  kind: character
  build: a thin stooped figure in a work coverall
  features: a respirator hood, secateurs swung low, vine over one arm
  accent: faded orange coverall against sickly vine green
  flavor: the last gardener, still on her rounds long after her shift ended
palette:
  s: "#2f4a2a" # dark stem
  v: "#4d7a3c" # vine overgrowth
  c: "#b5622c" # coverall orange
  d: "#7d3f1b" # coverall shadow
  h: "#d8cbb4" # hood / respirator
  m: "#4a4a52" # steel secateurs
grid: |
  ................
  ......hhh.......
  .....hhhhh......
  .....hmmmh......
  ......hhh.......
  ...vvcccc.......
  ..vvcccccc......
  ..vdcccccc.m....
  ...vcccccc.mm...
  ....cccccc..m...
  ....dccccd......
  ....dc..cd......
  ....dd..dd......
  ...ddd...dd.....
  ..ddd.....ddd...
  ................
