# Frame 0 of the gardener's two-frame walk. ONE family serves two defs here: the
# elite `greenhouse_gardener` fights in it, and the companion of the same name
# walks beside you in it after you spare her — which is how the shipped roster
# works too (a companion is usually the enemy twin it was spared from, wearing
# the same sprite).
name: greenhouse_gardener_0
family: greenhouse
size: [16, 16]
description: >
  A stooped woman in a seed-vault coverall, secateurs in one hand, half grown
  over with the vine she spent her life pruning.
subject:
  kind: character
  build: a thin stooped figure in a work coverall
  features: a respirator hood, secateurs in the right hand, vine over one arm
  accent: faded orange coverall against sickly vine green
  flavor: the last gardener, still on her rounds long after her shift ended
palette:
  s: "#2f4a2a" # dark stem
  v: "#4d7a3c" # vine overgrowth
  c: "#b5622c" # coverall orange
  d: "#7d3f1b" # coverall shadow
  h: "#d8cbb4" # hood / respirator
  m: "#4a4a52" # steel secateurs
