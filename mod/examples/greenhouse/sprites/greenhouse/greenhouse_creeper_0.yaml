# SPDX-License-Identifier: CC0-1.0
# A sprite. The file stem IS the `name`, and the name is what an enemy def or a
# level references. This is frame 0 of the creeper's two-frame walk; frame 1 is
# the same file with the legs swapped, which is the whole of a walk cycle here.
#
# `palette` maps one character to one colour; `.` is reserved for transparent
# and may not be redefined. The grid is a literal block scalar and every row
# must be exactly `size[0]` characters — the compiler checks it, so a ragged
# grid is a build error rather than a smeared sprite.
name: greenhouse_creeper_0
family: greenhouse
size: [16, 16]
description: >
  A knee-high tangle of pale vine grown into a walking shape, with two lit seed
  pods where eyes would be.
subject:
  kind: monster
  build: a squat bundle of vine with two stumpy legs
  features: two glowing seed-pod eyes, curling tendrils off the shoulders
  accent: sickly luminous green over dark stem
  flavor: what the seed vault grew once nobody was left to prune it
palette:
  s: "#2f4a2a" # dark stem
  v: "#4d7a3c" # vine body
  l: "#6fa84f" # lit vine highlight
  e: "#c8f27a" # seed-pod eye glow
grid: |
  ................
  ......ss........
  .....svvs..s....
  ....svvvvs.s....
  ....svlvvs.s....
  ...svvvvvvss....
  ...svevvevs.....
  ...svvvvvvs.....
  ...slvvvvls.....
  ...svvvvvvs.....
  ....svvvvs......
  ....s.vv.s......
  ....s.vv.s......
  ....s.ss.s......
  ....ss...ss.....
  ................
