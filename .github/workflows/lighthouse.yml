name: lighthouse

# §11.3.10 — scheduled measured Lighthouse audit against the built app, with
# thresholds enforced via `.github/lighthouse/lighthouserc.json`. The measured
# signals are advisory because shared-runner variance makes them unsuitable as
# PR gates; deterministic SEO and bundle-budget failures remain in `seo.yml`.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

env:
  GITHUB_PAT: ${{ secrets.GITHUB_PAT || github.token }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace pwa
      - run: npm install --global @lhci/cli@0.14.x
      - run: lhci autorun --config=./.github/lighthouse/lighthouserc.json
