# Desktop (Electron/Steam) shell — checks on every relevant push, and
# dispatch-only packaging of the Steam depot directories.
#
# Three jobs, deliberately split by what they cost:
#
#   check    Cheap and automatic. `electron/` is not an npm workspace member, so
#            the root `make lint` / `make test` stop at its edge and NOTHING
#            else in CI would notice it breaking. Runs on ubuntu with the
#            Electron binary download skipped (the types ship in the package, so
#            typechecking and the unit tests need no browser).
#
#   windows  Builds the real website and copies it into the shell on every
#            relevant change. This catches Windows-only command-shim and ESM
#            path handling that an Ubuntu check cannot exercise.
#
#   package  Expensive and manual. Real Windows/macOS runners, a full website
#            build, and electron-builder. Dispatch-only for the same reason the
#            native EAS build is: it only runs when a human is actually
#            shipping something.
name: Desktop App (Electron)

on:
  push:
    paths:
      - "electron/**"
      - "scripts/**"
      - "package*.json"
      - "pwa/package*.json"
      # The shell answers these protocols; a change to the web half can break
      # the desktop build without touching electron/ at all.
      - "pwa/src/app/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "electron/**"
      - "scripts/**"
      - "package*.json"
      - "pwa/package*.json"
      - "pwa/src/app/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        default: all
        options: [all, windows, macos, linux]
      profile:
        description: Website build profile (production strips the developer menu)
        type: choice
        default: preview
        options: [preview, production]

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The prebuilt Electron binary is a ~100 MB download that neither the
  # typecheck nor the unit tests need — the TypeScript definitions ship in the
  # npm package itself.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci --ignore-scripts
      # The mods bridge compiles a mod through the toolchain in `mod/tools/`,
      # which lives at the REPO ROOT and resolves its packages from the root
      # tree — this job installs only `electron/`, so nothing else provides
      # them, and the shell's tests could not compile a mod at all.
      #
      # Installed into a scratch prefix and copied in, rather than by running
      # `npm install` at the root: the root is an npm WORKSPACE, so an install
      # there resolves `pwa`'s whole tree (238 packages, ~30s, and a private
      # registry that needs auth) to deliver one YAML parser. A prefixed
      # install is workspace-free, needs no credentials, and takes half a
      # second.
      #
      # The LIST comes from `mod/package.json` rather than being written out
      # here: repeating it is exactly what broke the first time, and
      # `tests/content/mod_toolchain_deps_test.ts` holds that manifest to what
      # the toolchain actually imports.
      - name: mod toolchain dependencies
        working-directory: .
        run: |
          # An ARRAY, so the package names arrive as separate arguments while
          # staying quoted — `npm install … $deps` would rely on word splitting,
          # which is right here and indistinguishable from the bug shellcheck is
          # looking for (SC2086).
          read -ra deps <<< "$(node -p "Object.keys(require('./mod/package.json').dependencies ?? {}).join(' ')")"
          npm install --no-save --ignore-scripts \
            --prefix "$RUNNER_TEMP/modtools" "${deps[@]}"
          mkdir -p node_modules
          cp -R "$RUNNER_TEMP/modtools/node_modules/." node_modules/
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test

  windows-bundle:
    name: Windows site + shell bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Exercise both Windows-sensitive seams: TypeScript modules loaded by the
      # content generators and npm's .cmd shim launched by the shell bundler.
      - run: npm run electron:bundle
      # AND THE THIRD ONE, which nothing else on Windows reaches: the session
      # server's ship target shells out to `tsc` — a `.cmd` shim here — and
      # only the packaging job ever ran it, so it broke there instead of in a
      # check. It needs no `electron/` install: the compiler is found in the
      # root tree first.
      - run: node scripts/build-server.mjs

  package:
    name: package (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            script: dist:win
            artifact: win-unpacked
          - os: macos-latest
            target: macos
            script: dist:mac
            artifact: mac
          - os: ubuntu-latest
            target: linux
            script: dist
            artifact: linux-unpacked
    runs-on: ${{ matrix.os }}
    env:
      # The real binary must never be built against Valve's shared test app.
      GIS_STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
      GIS_BUILD_PROFILE: ${{ inputs.profile }}
      # A depot build is the full product: sessions, the Workshop, and the
      # router mapping the HOST screen's ROUTER row reports on.
      GIS_STAMP_CAPABILITIES: "1"
      GIS_ENABLE_MULTIPLAYER: "1"
      GIS_ENABLE_MODS: "1"
      GIS_ENABLE_UPNP: "1"
      GIS_ENABLE_LICENSED: "1"
      # macOS signing, exactly as release.yml passes it: absent secrets mean an
      # ad-hoc signature, which is the minimum an arm64 app needs to run at
      # all. A depot build wants the real one — Gatekeeper blocks an
      # un-notarized app even when Steam is the one launching it.
      GIS_MAC_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Skip unselected platform
        if: inputs.platform != 'all' && inputs.platform != matrix.target
        run: echo "not selected" && exit 0

      - uses: actions/checkout@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.target
      - uses: actions/setup-node@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.target
        with:
          node-version: 24
          cache: npm

      # The website build lives in the root workspace; the shell only copies
      # its output.
      - name: Install the workspace
        if: inputs.platform == 'all' || inputs.platform == matrix.target
        run: npm ci
      - name: Install the shell
        if: inputs.platform == 'all' || inputs.platform == matrix.target
        run: npm ci
        working-directory: electron
        env:
          # Packaging DOES need the real binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "0"

      - name: Build the site and package
        if: inputs.platform == 'all' || inputs.platform == matrix.target
        run: npm run ${{ matrix.script }}
        working-directory: electron

      - name: Warn if the app id is still Valve's test app
        if: inputs.platform == 'all' || inputs.platform == matrix.target
        shell: bash
        run: |
          if [ -z "${GIS_STEAM_APP_ID}" ] || [ "${GIS_STEAM_APP_ID}" = "480" ]; then
            echo "::warning::Built against Spacewar (480). Set the STEAM_APP_ID repository variable before shipping this to a depot."
          fi

      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'all' || inputs.platform == matrix.target
        with:
          name: desktop-${{ matrix.artifact }}
          path: electron/release/${{ matrix.artifact }}
          retention-days: 7
