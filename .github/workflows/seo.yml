name: seo

# §11.3.10 — structural SEO assertions. Runs `check-seo.mjs` against the
# built app so the discoverability failure modes the spec calls out (empty
# SPA shell, missing canonical, JSON-LD drift from og:image, sitemap gaps,
# llms.txt missing, critical-path JS budget breach) cannot ship silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITHUB_PAT: ${{ secrets.GITHUB_PAT || github.token }}

jobs:
  check-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # THE LIBRARY PHOTOGRAPHS THE IN-GAME ITEM CARD (pwa/scripts/library/
      # card-shot.mjs) rather than redrawing it, so any job that BUILDS needs a
      # browser — not just the deploy. Keep this beside every `npm ci` that is
      # followed by a build; a new build job without it fails at `npm run
      # library` with a launch error, not an obvious missing-dependency one.
      - name: Install Chromium for the library's card renderer
        run: npx playwright install --with-deps chromium
      - run: npm run build --workspace pwa
      - run: npm run check:seo --workspace pwa
