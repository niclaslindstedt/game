name: release

# Manual-only. The maintainer dispatches this and the workflow derives
# the semver bump from the changeset fragments in .changes/unreleased/
# (their front-matter carries the Added/Changed/Fixed/... type and an
# optional `breaking: true` — see scripts/release/compute-bump.mjs),
# then consumes those fragments into a new CHANGELOG section, updates
# every shipped version string via scripts/update-versions.sh, tags
# vX.Y.Z, pushes, creates a GitHub Release, then chains into pages.yml
# so the new tag is served at `/` (and the same code at `/preview/`
# because main now matches the tag) without waiting for the next push.
#
# `bump` defaults to `auto` — the fragment-derived bump above. Set it to
# an explicit patch/minor/major only to override that derivation.
#
# Because the release commit, tag, GitHub Release, and Pages deploy all
# happen inside this one dispatched run (the deploy is a workflow_call
# chain, not a cross-workflow trigger), the default GITHUB_TOKEN is
# sufficient — no RELEASE_TOKEN PAT is needed.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump. 'auto' derives it from the .changes/unreleased/ fragments (breaking → major, Added/Changed/Removed/Deprecated → minor, Fixed/Security → patch). Pick patch/minor/major to override."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      enable_multiplayer:
        description: "Package the desktop downloads with sessions enabled."
        required: false
        type: boolean
        default: false
      enable_mods:
        description: "Package the desktop downloads with mod loading enabled."
        required: false
        type: boolean
        default: false
      enable_upnp:
        description: "Let the desktop downloads ask the router to forward a port."
        required: false
        type: boolean
        default: false
      enable_licensed:
        description: "Package the desktop downloads as licensed to admit players."
        required: false
        type: boolean
        default: false

# Default to no permissions; every job declares its own least-privilege
# `permissions:` block (see OSS_SPEC §10.3).
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # contents: write — this job pushes the release commit and the tag.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Verify clean working tree
        run: |
          if ! git diff --quiet || ! git diff --quiet --cached; then
            echo "::error::working tree is not clean — refusing to release"
            git status
            exit 1
          fi

      # Resolve the effective bump. `auto` (the default) derives it from
      # the changeset fragments' front-matter so the release needs no
      # human judgement; an explicit patch/minor/major from the dispatch
      # form overrides that derivation.
      - name: Resolve bump
        id: resolve
        run: |
          if [ "${{ inputs.bump }}" = "auto" ] || [ -z "${{ inputs.bump }}" ]; then
            BUMP=$(node scripts/release/compute-bump.mjs)
            echo "Auto-derived bump from fragments: $BUMP"
          else
            BUMP="${{ inputs.bump }}"
            echo "Using requested bump override: $BUMP"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      # Compute the next version from the highest released tag (not from
      # package.json, which could lag), then rewrite every shipped
      # version string — root + workspace package.json, the lockfile,
      # and src/version.ts — via the script that owns them.
      - name: Bump version
        id: bump
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          CURRENT="${LATEST_TAG#v}"
          CURRENT="${CURRENT:-0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "${{ steps.resolve.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "::error::unknown bump '${{ steps.resolve.outputs.bump }}'"; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          ./scripts/update-versions.sh "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped from ${LATEST_TAG:-nothing} to v${VERSION}"

      - name: Collate changelog
        run: node scripts/release/collate-changelog.mjs "${{ steps.bump.outputs.version }}"

      # The notes are the changelog section, plus a standing footer about the
      # downloads. The macOS half of that footer is not decoration: the
      # archives are signed but not notarized (see electron/RELEASING.md), so
      # Gatekeeper asks about them once, and a player with no answer to that
      # prompt has no game.
      - name: Extract release-notes body
        run: |
          node scripts/release/extract-section.mjs "${{ steps.bump.outputs.version }}" > .release-notes.md
          cat >> .release-notes.md <<'NOTES'

          ---

          ### Downloads

          Pick the archive for your machine — `mac-arm64` for Apple Silicon
          (M1 and later), `mac-x64` for an Intel Mac.

          **macOS:** the app is signed but not notarized, so the first launch
          is refused. Open **System Settings → Privacy & Security**, scroll to
          the message about Ada's Trail and choose **Open Anyway**. macOS
          remembers after that.
          NOTES

      - name: make build
        run: make build
      - name: make test
        run: make test

      - name: Commit + tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json pwa/package.json src/version.ts CHANGELOG.md .changes/unreleased
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      # A DRAFT, and the `publish` job at the bottom is what makes it
      # public — once every platform's archive is attached to it.
      #
      # Published here instead, the release is visible the moment the tag
      # exists, which is minutes before the four desktop archives finish
      # uploading and regardless of whether they succeed at all: a
      # Windows packaging failure (`fail-fast: false`, so the other three
      # carry on) leaves a public release whose Windows download simply
      # is not there, and the people who find it are the ones who came to
      # download the game. A draft is invisible to everyone but the
      # maintainer, accepts asset uploads exactly the same way, and needs
      # one flag flipped at the end.
      #
      # Idempotent on purpose: the tag is already pushed by the step
      # above, so a bare `gh release create` that fails (or a re-run
      # after one did) would leave a tagged version with no release at
      # all. Creating-or-updating makes the recovery a re-dispatch rather
      # than a manual `gh release create` — and the edit deliberately
      # does NOT pass `--draft`, so re-running against a release that is
      # already public refreshes its notes instead of retracting it.
      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --title "$TAG" --notes-file .release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file .release-notes.md
          fi

  # The downloadable desktop builds, attached to the release the job above
  # created. One runner per platform, because each one packages the Electron
  # binary for its own OS and the archive has to be built where the app was.
  # macOS builds BOTH slices — Intel and Apple Silicon — as separate artifacts
  # rather than one universal binary, so neither download carries a copy of
  # Chromium the machine will never run.
  #
  # Four archives come out: two macOS zips, a Windows zip, a Linux tar.gz.
  # Archives rather than installers — see electron-builder.config.cjs for why
  # an unsigned installer is a promise this project cannot keep.
  desktop:
    needs: release
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            script: release:win
          - os: macos-latest
            target: macos
            script: release:mac
          - os: ubuntu-latest
            target: linux
            script: release:linux
    runs-on: ${{ matrix.os }}
    # contents: write — the artifacts are uploaded onto the GitHub Release.
    permissions:
      contents: write
    env:
      # The release commit is on the tag, so the build is made from exactly
      # what was tagged rather than from whatever main looks like by now.
      TAG: ${{ needs.release.outputs.tag }}
      GIS_PACKAGE_PROFILE: standalone
      GIS_STAMP_CAPABILITIES: "1"
      GIS_ENABLE_MULTIPLAYER: ${{ inputs.enable_multiplayer && '1' || '0' }}
      GIS_ENABLE_MODS: ${{ inputs.enable_mods && '1' || '0' }}
      GIS_ENABLE_UPNP: ${{ inputs.enable_upnp && '1' || '0' }}
      GIS_ENABLE_LICENSED: ${{ inputs.enable_licensed && '1' || '0' }}
      # macOS SIGNING — optional here, but the build is never unsigned.
      #
      # Apple Silicon refuses to execute unsigned arm64 code, and reports that
      # to the player as "the app is damaged", so an unsigned arm64 download is
      # not a download at all. electron-builder therefore signs the app AD HOC
      # when none of these secrets are set (see electron-builder.config.cjs) —
      # the app runs natively, the player answers one Gatekeeper prompt.
      #
      # Set the secrets and the same job signs and notarizes for real, and the
      # prompt goes away too. Every one of them is empty until somebody adds
      # it, and empty means "not provided" to electron-builder, so a repo with
      # no Apple account behaves exactly as it did before.
      GIS_MAC_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The website build lives in the root workspace; the shell copies its
      # output and packages around it.
      - run: npm ci
      - run: npm ci
        working-directory: electron

      - name: Package
        shell: bash
        run: npm --prefix electron run ${{ matrix.script }}

      # Whatever this platform's packager produced, by extension — a job that
      # listed filenames would silently upload nothing the day a target
      # changed its suffix.
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          assets=(electron/release/*.zip electron/release/*.tar.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::${{ matrix.target }} produced no distributable files"
            ls -R electron/release || true
            exit 1
          fi
          printf 'uploading %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber

  # THE RELEASE BECOMES VISIBLE HERE, and nowhere else: `needs: desktop`
  # means every platform in the matrix has packaged AND uploaded before
  # anybody can see the release page. If one target fails, the draft stays
  # a draft — a release that is missing a download is a bug report from
  # every player on that platform, and the fix (re-dispatch, or upload the
  # archive by hand) is much cheaper while nobody has seen it yet.
  publish:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    # contents: write — this is the flag flip on the release itself.
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "published asset: \(.name)"'

  # Chain straight into pages.yml so the new tag is served at `/`
  # immediately — without this, deployment would wait for the next
  # push to main (§11.5.2).
  #
  # Deliberately `needs: release` and not `needs: publish`: the website IS
  # the game (§11.4), it is built from the tag that already exists, and
  # holding the web deploy hostage to a desktop packaging failure would
  # take the free-to-play version down over a download nobody has yet.
  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}
    permissions:
      # pages.yml declares `contents: write` at the top level because its
      # build job force-pushes the /branch/ slot to the `branch-deploy`
      # orphan branch. A reusable workflow can't be granted fewer
      # permissions than it requests, so these must match or the whole
      # release run fails at startup before any job runs.
      contents: write
      pages: write
      id-token: write
    secrets: inherit
