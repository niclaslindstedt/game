name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Include `labeled` / `unlabeled` so the `no-changelog` escape
    # hatch re-runs the changeset job when the label is toggled after
    # the PR opened. The default activity types (`opened`,
    # `synchronize`, `reopened`) would otherwise leave the check stuck
    # red until the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# The four checks used to be four steps of one job, which made CI as long as
# their SUM — and every one of them opened by rebuilding the same generated
# content the previous step had just built. They are independent of each other,
# so they are four jobs and CI is as long as the SLOWEST. The suite is split
# again across shards, because on its own it is longer than the other three
# together. A job costs ~15s of checkout + install to start, which every one of
# these earns back many times over. Lighthouse is a scheduled/manual advisory
# audit rather than a PR gate; its former runner now buys a third test shard.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: make build
        run: make build

  test:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # A shard that fails should not cancel the other — knowing whether a
      # break is in one half or both is most of the diagnosis.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Through `make test`, NOT a bare `npx vitest run`: the target rebuilds
      # the generated catalogs and the sprite atlas first, and several committed
      # artifacts are drift-tested against that fresh build (see AGENTS.md).
      # Vitest's own `--shard` splits the file list deterministically, so the
      # three jobs between them run every file exactly once.
      - name: make test
        run: make test ARGS="--shard=${{ matrix.shard }}/3"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: make lint
        run: make lint
      # The named-relic invariants: every unique's base resolves, its ilvl
      # matches the model, the per-slot armor ladder holds, and every relic has
      # exactly ONE home in the drop tables. Deliberately a step of THIS job
      # rather than one of its own: the checker reads the compiled catalogs, and
      # `make lint` has just built them — a separate job would recompile the
      # whole content tree to run a script that takes a second.
      - name: make unique-check
        run: make unique-check

  # No content build: every generated tree is in .prettierignore, so formatting
  # has nothing to say about them and this job only needs the checkout.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: make fmt-check
        run: make fmt-check

  changeset:
    # Enforces that every PR touching user-visible code drops a
    # changelog fragment under .changes/unreleased/, or opts out via
    # the `no-changelog` label. Pure refactors, CI/build tweaks, and
    # docs-only edits pass via the skip-list inside the script.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changeset fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/release/check-changeset.mjs

  # §7.1 — every tool-specific agent-guidance file must be a symlink to
  # AGENTS.md, and tool skill aliases must resolve to .agents/skills. A commit that
  # dereferences one into a regular file breaks the single source of truth.
  symlinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify agent-guidance symlinks
        run: |
          fail=0
          for link in CLAUDE.md .cursorrules .windsurfrules GEMINI.md .aider.conf.md .github/copilot-instructions.md; do
            if [ ! -L "$link" ]; then
              echo "::error file=$link::$link must be a symlink to AGENTS.md"
              fail=1
            elif [ "$(basename "$(readlink "$link")")" != "AGENTS.md" ]; then
              echo "::error file=$link::$link resolves to $(readlink "$link"), not AGENTS.md"
              fail=1
            fi
          done
          for link in .claude/skills .gemini/skills; do
            if [ ! -L "$link" ]; then
              echo "::error file=$link::$link must be a symlink to ../.agents/skills"
              fail=1
            elif [ "$(readlink "$link")" != "../.agents/skills" ]; then
              echo "::error file=$link::$link resolves to $(readlink "$link"), not ../.agents/skills"
              fail=1
            fi
          done
          exit $fail

  # Lint workflow YAML with actionlint and shell scripts with shellcheck
  # (OSS_GAME_SPEC §16.1). shellcheck is preinstalled on ubuntu-latest; actionlint
  # is fetched via its official installer.
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "${PWD}" >> "$GITHUB_PATH"
      - name: make actionlint
        run: make actionlint
      - name: make shellcheck
        run: make shellcheck
